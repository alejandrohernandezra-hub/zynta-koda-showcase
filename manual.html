licence (non-commercial or source-available terms), an unreviewed package with none, or model weights whose terms are denied. no secrets in the repository. the full history was scanned once and none found; credentials go into the hosting platform's settings, never into files, commits or logs. what where the rules security.md data handling, end to end docs/security/data-handling.md public demo and private mode engine/workspace.py ( zk_mode ) the explainer and its consent engine/explain.py , workspace.json licence check tools/licences.py , docs/licences.md history scan docs/security/secret-scan.md tests that guard it. the public demo refuses to list, open or plan on a private workspace; a workspace past its delete-by date will not open; the explainer stays off on a private workspace without a recorded opt-in; the master-data editor never imports the explainer; no ai-facing tool can reach a write path; the licence check fails on a planted restricted package. "},{"part":"Operating and trust","number":"29","slug":"evidence","title":"Evidence: tests and benchmarks","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Every claim in this manual is either computed by the engine or checked by a test. Here is what checks what, and how the numbers were measured.<\/p>\n<div class=\"diagram\" data-diagram=\"tests\"><\/div>\n<ul>\n<li><strong>Fast tests<\/strong> (513) run on every change: rules, readers, reports, the pages and this manual.<\/li>\n<li><strong>Slow tests<\/strong> (72) solve real models: a full year, a design, a re-plan. They run on every push, the whole suite in a quarter of an hour.<\/li>\n<li><strong>Published numbers are regenerated, not typed.<\/strong> The showcase, the README's front page and this manual are built from the plans and the code, and a test fails when any of them goes stale.<\/li>\n<\/ul>"},{"name":"How it works","html":"<h3>What the tests hold<\/h3>\n<table>\n<thead>\n<tr>\n<th>Claim<\/th>\n<th>How it is held<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The plan keeps every rule<\/td>\n<td>tests that break each rule on purpose and expect the plan to refuse or price it<\/td>\n<\/tr>\n<tr>\n<td>A number on a page is the engine's<\/td>\n<td>the page, the README block and this manual are rebuilt and compared with what is published<\/td>\n<\/tr>\n<tr>\n<td>A plan is what the engine makes<\/td>\n<td>the stories' data has a fingerprint; a plan made from other tables fails<\/td>\n<\/tr>\n<tr>\n<td>Committed plans survive a restart<\/td>\n<td>real Postgres in CI, read back from a separate process; a skipped test fails the run<\/td>\n<\/tr>\n<tr>\n<td>Nothing writes through the AI<\/td>\n<td>every AI-facing tool is called with every write path rigged to fail<\/td>\n<\/tr>\n<tr>\n<td>Every licence is permissive<\/td>\n<td>the licence check runs on every change and fails on a planted bad licence<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Counterfactuals: a test must be able to fail<\/h3>\n<p>A test that passes on the broken code proves nothing. Fixes in this project come with a test that fails before the fix and passes after it: the redistribution report's \"spare\" stock (shipped out three days later), a closed DC that lost its customers, a design start CBC threw away. The R&amp;D log records each, including the claims that turned out wrong.<\/p>\n<h3>Benchmarks, dated<\/h3>\n<p>Solve times are measured on the engine's own models and its real flow, two CPUs, and kept with their date and settings in <code>docs/benchmarks/<\/code>: the solver comparison, planning in layers, scaling to 150 products, the forecasting backtest. A number that was measured once on a cold start and not again in the real flow is reported as such, or withdrawn.<\/p>\n<h3>Forecasting, scored honestly<\/h3>\n<p>Every model is backtested on weeks it never saw, rolling forward, and scored on its whole forecast range. The chosen one beat the engine's own model clearly, 0.0695 against 0.0843; its lead over the next best is not established. The history is synthetic: this proves the pipeline and the scoring, not accuracy on real data, which remains untested (chapter 8).<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The suite<\/td>\n<td><code>test_engine.py<\/code> (<code>pytest -m \"not slow\"<\/code> for the fast tier)<\/td>\n<\/tr>\n<tr>\n<td>CI<\/td>\n<td><code>.github/workflows/ci.yml<\/code><\/td>\n<\/tr>\n<tr>\n<td>Benchmarks<\/td>\n<td><code>docs/benchmarks/<\/code>, <code>tools/bench_solvers.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>The log of what was measured and refuted<\/td>\n<td><code>docs/rnd-log/<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}],"search":" every claim in this manual is either computed by the engine or checked by a test. here is what checks what, and how the numbers were measured. fast tests (513) run on every change: rules, readers, reports, the pages and this manual. slow tests (72) solve real models: a full year, a design, a re-plan. they run on every push, the whole suite in a quarter of an hour. published numbers are regenerated, not typed. the showcase, the readme's front page and this manual are built from the plans and the code, and a test fails when any of them goes stale. what the tests hold claim how it is held the plan keeps every rule tests that break each rule on purpose and expect the plan to refuse or price it a number on a page is the engine's the page, the readme block and this manual are rebuilt and compared with what is published a plan is what the engine makes the stories' data has a fingerprint; a plan made from other tables fails committed plans survive a restart real postgres in ci, read back from a separate process; a skipped test fails the run nothing writes through the ai every ai-facing tool is called with every write path rigged to fail every licence is permissive the licence check runs on every change and fails on a planted bad licence counterfactuals: a test must be able to fail a test that passes on the broken code proves nothing. fixes in this project come with a test that fails before the fix and passes after it: the redistribution report's \"spare\" stock (shipped out three days later), a closed dc that lost its customers, a design start cbc threw away. the r&d log records each, including the claims that turned out wrong. benchmarks, dated solve times are measured on the engine's own models and its real flow, two cpus, and kept with their date and settings in docs/benchmarks/ : the solver comparison, planning in layers, scaling to 150 products, the forecasting backtest. a number that was measured once on a cold start and not again in the real flow is reported as such, or withdrawn. forecasting, scored honestly every model is backtested on weeks it never saw, rolling forward, and scored on its whole forecast range. the chosen one beat the engine's own model clearly, 0.0695 against 0.0843; its lead over the next best is not established. the history is synthetic: this proves the pipeline and the scoring, not accuracy on real data, which remains untested (chapter 8). what where the suite test_engine.py ( pytest -m \"not slow\" for the fast tier) ci .github/workflows/ci.yml benchmarks docs/benchmarks/ , tools/bench_solvers.py the log of what was measured and refuted docs/rnd-log/ "},{"part":"Operating and trust","number":"30","slug":"limits","title":"Limitations and roadmap","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>What Zynta-Koda does not do yet, measured where it can be, and what is being worked on. A planning tool that hides its limits gets trusted for the wrong things.<\/p>\n<div class=\"diagram\" data-diagram=\"limits\"><\/div>\n<p><strong>Where it stops today:<\/strong> a full year for 150 products, planned in layers, takes 221 seconds, proven on two processors; the budget for a year's plan is 180 s. Above that size it still answers, more slowly, and says how close to the best it is.<\/p>"},{"name":"How it works","html":"<h3>What it does not do yet<\/h3>\n<ul>\n<li><strong>Real forecasting accuracy is not proven.<\/strong> The forecasting pipeline and its scoring are; the history it was scored on is synthetic.<\/li>\n<li><strong>Fictional companies only, in public.<\/strong> Both demo companies, their data and their disruptions are invented. Its accuracy on real data remains untested.<\/li>\n<li><strong>No live ERP connection.<\/strong> Data comes in as an extract and goes out as a plan and a report; nothing is written back to an ERP.<\/li>\n<li><strong>One horizon stands for the year<\/strong> in network design: a seasonal business needs a horizon long enough to hold its season.<\/li>\n<li><strong>A closure priced with new sites also free to open<\/strong> takes about half an hour on the demo (each combination of up to three candidates designed in turn), and its answer can stop short of the gap asked: on Lindewaard within 5.7% of the best network, against 1% asked (37 minutes, 21 Oct) (chapter 11). More than three candidates are left to one free design, which stopped 55% from its bound on two.<\/li>\n<li><strong>The last leg is a full truck.<\/strong> A delivery to a customer is priced as a full truck on the rate card divided by what it holds; a customer taking part loads costs more per unit. Network design does not split a customer's temperature ranges between sites, and the US demo does not price deliveries yet.<\/li>\n<li><strong>The AI explains and never decides.<\/strong> That is a design choice, not a gap: the rules decide, the gate decides, the planner decides.<\/li>\n<li><strong>One person built it, as personal R&amp;D.<\/strong> It has no login of its own and is not run as a service for anyone.<\/li>\n<\/ul>\n<h3>The Control Tower, checked setting by setting<\/h3>\n<p>Writing chapters 21 to 24 meant moving every input and measuring what it did. What that found, and what became of it:<\/p>\n<ul>\n<li><strong>Kept on purpose: on the public demo, a saved master-data edit is seen by every visitor<\/strong> until the hosted service restarts. The demo is a work in progress and says so; a private workspace keeps its edits to itself.<\/li>\n<li><strong>Fixed 20 Oct:<\/strong> the scenario branches named WHATIF-PORT-STRIKE, WHATIF-CARBON-SHOCK and WHATIF-COPACKER-OUTAGE planned the same data as BASELINE (the sandbox is now called SANDBOX); the carbon price slider started at a typed 0.085 and said \"$85\" on a euro workspace (it now starts at the workspace's own price, in its currency); the carbon budget started at 16,500 kg, a quarter of what Lindewaard emits in four weeks, so ticking it cut service to 75% (it now starts empty, beside what your last run emitted); Impact tracing ignored the sidebar's prices and named a depot action at Brookvale on every company (it now carries the sidebar's prices and names the workspace's own expected events); with the engine still waking, picking an engine section showed Network design instead; and likelihoods (the lanes table) and the futures' probabilities (Design across futures), stored as fractions, showed as \"0%\".<\/li>\n<li><strong>Design across futures<\/strong> failed on Lindewaard at its defaults until 20 Oct: measured as refused before the fix.<\/li>\n<li><strong>Design across futures away from its defaults takes about 40 minutes on the hosted engine<\/strong> (39 minutes at a 350 km reach, measured 21 Oct). Until each future started from its neighbour's plan, it was refused there after 580 s. At the defaults it opens solved in advance.<\/li>\n<\/ul>\n<h3>Roadmap<\/h3>\n<div class=\"diagram\" data-diagram=\"roadmap\"><\/div>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Solver measurements<\/td>\n<td><code>docs/benchmarks/solvers-2026-10-18.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>Scaling measurements<\/td>\n<td><code>docs/benchmarks/<\/code><\/td>\n<\/tr>\n<tr>\n<td>The roadmap the showcase shows<\/td>\n<td><code>frontpage.py<\/code> (<code>ROADMAP<\/code>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The table above and the roadmap are read from the same source as the public page, so the two cannot tell different stories.<\/p>"}],"search":" what zynta-koda does not do yet, measured where it can be, and what is being worked on. a planning tool that hides its limits gets trusted for the wrong things. where it stops today: a full year for 150 products, planned in layers, takes 221 seconds, proven on two processors; the budget for a year's plan is 180 s. above that size it still answers, more slowly, and says how close to the best it is. what it does not do yet real forecasting accuracy is not proven. the forecasting pipeline and its scoring are; the history it was scored on is synthetic. fictional companies only, in public. both demo companies, their data and their disruptions are invented. its accuracy on real data remains untested. no live erp connection. data comes in as an extract and goes out as a plan and a report; nothing is written back to an erp. one horizon stands for the year in network design: a seasonal business needs a horizon long enough to hold its season. a closure priced with new sites also free to open takes about half an hour on the demo (each combination of up to three candidates designed in turn), and its answer can stop short of the gap asked: on lindewaard within 5.7% of the best network, against 1% asked (37 minutes, 21 oct) (chapter 11). more than three candidates are left to one free design, which stopped 55% from its bound on two. the last leg is a full truck. a delivery to a customer is priced as a full truck on the rate card divided by what it holds; a customer taking part loads costs more per unit. network design does not split a customer's temperature ranges between sites, and the us demo does not price deliveries yet. the ai explains and never decides. that is a design choice, not a gap: the rules decide, the gate decides, the planner decides. one person built it, as personal r&d. it has no login of its own and is not run as a service for anyone. the control tower, checked setting by setting writing chapters 21 to 24 meant moving every input and measuring what it did. what that found, and what became of it: kept on purpose: on the public demo, a saved master-data edit is seen by every visitor until the hosted service restarts. the demo is a work in progress and says so; a private workspace keeps its edits to itself. fixed 20 oct: the scenario branches named whatif-port-strike, whatif-carbon-shock and whatif-copacker-outage planned the same data as baseline (the sandbox is now called sandbox); the carbon price slider started at a typed 0.085 and said \"$85\" on a euro workspace (it now starts at the workspace's own price, in its currency); the carbon budget started at 16,500 kg, a quarter of what lindewaard emits in four weeks, so ticking it cut service to 75% (it now starts empty, beside what your last run emitted); impact tracing ignored the sidebar's prices and named a depot action at brookvale on every company (it now carries the sidebar's prices and names the workspace's own expected events); with the engine still waking, picking an engine section showed network design instead; and likelihoods (the lanes table) and the futures' probabilities (design across futures), stored as fractions, showed as \"0%\". design across futures failed on lindewaard at its defaults until 20 oct: measured as refused before the fix. design across futures away from its defaults takes about 40 minutes on the hosted engine (39 minutes at a 350 km reach, measured 21 oct). until each future started from its neighbour's plan, it was refused there after 580 s. at the defaults it opens solved in advance. roadmap what where solver measurements docs/benchmarks/solvers-2026-10-18.md scaling measurements docs/benchmarks/ the roadmap the showcase shows frontpage.py ( roadmap ) the table above and the roadmap are read from the same source as the public page, so the two cannot tell different stories. "},{"part":"Appendices","number":"A","slug":"glossary","title":"Glossary","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>The words this manual and the Control Tower use, in plain terms. The ones the public page explains come from the same list the page shows; the rest are the manual's own, each with the chapter that explains it.<\/p>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>Meaning<\/th>\n<th>Chapter<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>A week's notice<\/strong><\/td>\n<td>The event is known only a week before it hits: the baseline is kept until then and re-planned with Zynta-Koda from that day. Closer to how most businesses hear about a disruption.<\/td>\n<td>the public page<\/td>\n<\/tr>\n<tr>\n<td><strong>Acted ahead<\/strong><\/td>\n<td>The event is known and planned for with Zynta-Koda before it happens: stock built early, production moved, co-packers called in.<\/td>\n<td>the public page<\/td>\n<\/tr>\n<tr>\n<td><strong>Available to promise<\/strong><\/td>\n<td>What a site can still promise a new order from the plan's supply, after the orders customers have already confirmed. Stock that a confirmed order needs later cannot be promised now, even if it is on the shelf today. The forecast is not reserved: the plan itself provides for it.<\/td>\n<td>the public page<\/td>\n<\/tr>\n<tr>\n<td><strong>Average stock carried<\/strong><\/td>\n<td>The average value of goods sitting in plants and warehouses over the year: money tied up, or working capital.<\/td>\n<td>the public page<\/td>\n<\/tr>\n<tr>\n<td><strong>Baseline (as is)<\/strong><\/td>\n<td>Also called the plan of record: the plan the business is working to before anything goes wrong. Every story is compared with it.<\/td>\n<td>the public page<\/td>\n<\/tr>\n<tr>\n<td><strong>Bias<\/strong><\/td>\n<td>Whether a forecast leans too high (+) or too low (−) on average.<\/td>\n<td>the public page<\/td>\n<\/tr>\n<tr>\n<td><strong>Boomerang rule<\/strong><\/td>\n<td>A co-packer's output goes back to its parent plant for quality release before it ships on.<\/td>\n<td><a href=\"#network-rules\">10<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>Brownfield, greenfield<\/strong><\/td>\n<td>Network design that may open new sites (greenfield), or may also close existing ones (brownfield).<\/td>\n<td><a href=\"#network-optimisation\">11<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>CBC<\/strong><\/td>\n<td>The free solver the engine uses (COIN-OR Branch and Cut); its development build plans in layers above 8 products.<\/td>\n<td><a href=\"#optimiser\">9<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>Closing target<\/strong><\/td>\n<td>The stock the near weeks of a plan in layers must end with, which the year plan needs after them.<\/td>\n<td><a href=\"#optimiser\">9<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>Co-packer<\/strong><\/td>\n<td>An outside manufacturer that makes product for the company. What it makes goes back to the company's own plant for a quality check before it can be sold.<\/td>\n<td>the public page<\/td>\n<\/tr>\n<tr>\n<td><strong>CO₂e<\/strong><\/td>\n<td>Carbon dioxide equivalent: all greenhouse gases from transport, counted as if they were CO₂, by the ISO 14083 method.<\/td>\n<td>the public page<\/td>\n<\/tr>\n<tr>\n<td><strong>DDMRP<\/strong><\/td>\n<td>Demand Driven MRP: stock buffers with red, yellow and green zones, sized from usage and lead time.<\/td>\n<td><a href=\"#buffers\">12<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>Disputed forecast<\/strong><\/td>\n<td>A forecast that differs from the engine's own baseline by more than the set threshold, with no promotion to explain it: damped, and the plan held for a planner.<\/td>\n<td><a href=\"#demand\">8<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>Error vs same week last year<\/strong><\/td>\n<td>How far the forecast misses, compared with simply repeating last year. Below 1 beats last year; above 1 does worse. (Technically: MASE.)<\/td>\n<td>the public page<\/td>\n<\/tr>\n<tr>\n<td><strong>First plan<\/strong><\/td>\n<td>A quick plan built when the solver finds none in time: labelled, its distance from the best stated, held at the S&amp;OP gate.<\/td>\n<td><a href=\"#optimiser\">9<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>Force close<\/strong><\/td>\n<td>Network design told to close a site and price it against today's network.<\/td>\n<td><a href=\"#network-optimisation\">11<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>Forecast loss<\/strong><\/td>\n<td>One score for how good a forecast is: how far its middle estimate misses, plus whether its high estimate really covers bad weeks. Lower is better. (Technically: weighted quantile loss, WQL.)<\/td>\n<td>the public page<\/td>\n<\/tr>\n<tr>\n<td><strong>Frozen window<\/strong><\/td>\n<td>The first days of a plan already committed, which a re-plan keeps.<\/td>\n<td><a href=\"#planning-flow\">6<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>Hired trucks<\/strong><\/td>\n<td>Trips bought from outside carriers when the company's own fleet is not enough. They cost more per trip.<\/td>\n<td>the public page<\/td>\n<\/tr>\n<tr>\n<td><strong>ISO 14083<\/strong><\/td>\n<td>The standard for counting transport emissions, well to wheel.<\/td>\n<td><a href=\"#sustainability\">18<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>MCP<\/strong><\/td>\n<td>Model Context Protocol: lets an AI assistant call the engine's read-only tools.<\/td>\n<td><a href=\"#api\">26<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>MILP<\/strong><\/td>\n<td>Mixed-integer linear programme: the model the optimiser solves, with linear costs and rules and some decisions in whole numbers.<\/td>\n<td><a href=\"#optimiser\">9<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>No early action<\/strong><\/td>\n<td>The event is known, but the business keeps the baseline plan until the day it happens and then handles it as an emergency. Here that emergency re-plan is the best one possible, so a real one would likely do worse.<\/td>\n<td>the public page<\/td>\n<\/tr>\n<tr>\n<td><strong>Noise floor<\/strong><\/td>\n<td>A saving smaller than the gap both design solves really reached is not a finding.<\/td>\n<td><a href=\"#network-optimisation\">11<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>Plan in layers<\/strong><\/td>\n<td>The year per product family, then each product for the first four weeks; automatic above 8 products.<\/td>\n<td><a href=\"#optimiser\">9<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>Planning family<\/strong><\/td>\n<td>The packs of one liquid: planned together in the year layer, one setup per run.<\/td>\n<td><a href=\"#optimiser\">9<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>Profit before overheads<\/strong><\/td>\n<td>Revenue less what it costs to buy, make, store and move the product, carbon price included. Offices, salaries and other overheads are not modelled, so this is not net profit.<\/td>\n<td>the public page<\/td>\n<\/tr>\n<tr>\n<td><strong>Proven<\/strong><\/td>\n<td>The solver showed the plan is within the gap asked for of the best possible; a plan stopped by the clock is not proven.<\/td>\n<td><a href=\"#optimiser\">9<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>Redistribution<\/strong><\/td>\n<td>Moving idle stock to a shortage it can still reach and sell.<\/td>\n<td><a href=\"#network-optimisation\">11<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>Rough cut<\/strong><\/td>\n<td>In a plan in layers, whole-number runs, pallets and trucks only in the first 7 days; averages after.<\/td>\n<td><a href=\"#optimiser\">9<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>S&amp;OP gate<\/strong><\/td>\n<td>Sales and Operations Planning (S&amp;OP) is the meeting where sales, supply and finance agree one plan. The gate is the checks every plan passes first: service, margin at risk, how close the plan is proven to the best, and more. A plan that fails any check is held for that meeting instead of being released automatically.<\/td>\n<td>the public page<\/td>\n<\/tr>\n<tr>\n<td><strong>Scenario branch<\/strong><\/td>\n<td>The sandbox a run reads from and writes to; only LIVE reaches the live schedule.<\/td>\n<td><a href=\"#api\">26<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>Service level<\/strong><\/td>\n<td>The share of what customers ordered that the plan serves, by value at list price, so litres and kilograms are never added. Served within its planning period; not an on-time-in-full measure.<\/td>\n<td>the public page<\/td>\n<\/tr>\n<tr>\n<td><strong>Shelf-life terms<\/strong><\/td>\n<td>The minimum remaining life a customer accepts; stock older than its pool's strictest customer allows is written off.<\/td>\n<td><a href=\"#network-rules\">10<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>Shortfall penalty<\/strong><\/td>\n<td>What an unserved order costs in the plan: its lost margin plus a penalty for the broken promise, so serving beats short-shipping.<\/td>\n<td><a href=\"#optimiser\">9<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>Solver tolerance<\/strong><\/td>\n<td>Plans this size are solved to within 0.5% of the best plan possible, and the solver proves it. Cost differences smaller than that are not reported as findings.<\/td>\n<td>the public page<\/td>\n<\/tr>\n<tr>\n<td><strong>Truck trips<\/strong><\/td>\n<td>Each time a truck leaves a site loaded. Not the number of trucks owned: one truck makes many trips. Some trips are by the company's own fleet, the rest by hired carriers.<\/td>\n<td>the public page<\/td>\n<\/tr>\n<tr>\n<td><strong>Workspace<\/strong><\/td>\n<td>One company's tables in their own folder: demo workspaces are public, any with real data private.<\/td>\n<td><a href=\"#master-data\">7<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The terms the public page explains<\/td>\n<td><code>tools/build_site.py<\/code> (<code>GLOSSARY<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>The manual's own terms<\/td>\n<td><code>tools/build_manual.py<\/code> (<code>MANUAL_TERMS<\/code>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Both lists are read when the manual is built, so a term changed on the public page changes here too.<\/p>"}],"search":" the words this manual and the control tower use, in plain terms. the ones the public page explains come from the same list the page shows; the rest are the manual's own, each with the chapter that explains it. term meaning chapter a week's notice the event is known only a week before it hits: the baseline is kept until then and re-planned with zynta-koda from that day. closer to how most businesses hear about a disruption. the public page acted ahead the event is known and planned for with zynta-koda before it happens: stock built early, production moved, co-packers called in. the public page available to promise what a site can still promise a new order from the plan's supply, after the orders customers have already confirmed. stock that a confirmed order needs later cannot be promised now, even if it is on the shelf today. the forecast is not reserved: the plan itself provides for it. the public page average stock carried the average value of goods sitting in plants and warehouses over the year: money tied up, or working capital. the public page baseline (as is) also called the plan of record: the plan the business is working to before anything goes wrong. every story is compared with it. the public page bias whether a forecast leans too high (+) or too low (−) on average. the public page boomerang rule a co-packer's output goes back to its parent plant for quality release before it ships on. 10 brownfield, greenfield network design that may open new sites (greenfield), or may also close existing ones (brownfield). 11 cbc the free solver the engine uses (coin-or branch and cut); its development build plans in layers above 8 products. 9 closing target the stock the near weeks of a plan in layers must end with, which the year plan needs after them. 9 co-packer an outside manufacturer that makes product for the company. what i ot a finding. 11 plan in layers the year per product family, then each product for the first four weeks; automatic above 8 products. 9 planning family the packs of one liquid: planned together in the year layer, one setup per run. 9 profit before overheads revenue less what it costs to buy, make, store and move the product, carbon price included. offices, salaries and other overheads are not modelled, so this is not net profit. the public page proven the solver showed the plan is within the gap asked for of the best possible; a plan stopped by the clock is not proven. 9 redistribution moving idle stock to a shortage it can still reach and sell. 11 rough cut in a plan in layers, whole-number runs, pallets and trucks only in the first 7 days; averages after. 9 s&op gate sales and operations planning (s&op) is the meeting where sales, supply and finance agree one plan. the gate is the checks every plan passes first: service, margin at risk, how close the plan is proven to the best, and more. a plan that fails any check is held for that meeting instead of being released automatically. the public page scenario branch the sandbox a run reads from and writes to; only live reaches the live schedule. 26 service level the share of what customers ordered that the plan serves, by value at list price, so litres and kilograms are never added. served within its planning period; not an on-time-in-full measure. the public page shelf-life terms the minimum remaining life a customer accepts; stock older than its pool's strictest customer allows is written off. 10 shortfall penalty what an unserved order costs in the plan: its lost margin plus a penalty for the broken promise, so serving beats short-shipping. 9 solver tolerance plans this size are solved to within 0.5% of the best plan possible, and the solver proves it. cost differences smaller than that are not reported as findings. the public page truck trips each time a truck leaves a site loaded. not the number of trucks owned: one truck makes many trips. some trips are by the company's own fleet, the rest by hired carriers. the public page workspace one company's tables in their own folder: demo workspaces are public, any with real data private. 7 what where the terms the public page explains tools/build_site.py ( glossary ) the manual's own terms tools/build_manual.py ( manual_terms ) both lists are read when the manual is built, so a term changed on the public page changes here too. "},{"part":"Appendices","number":"B","slug":"kpi-reference","title":"KPI reference","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Every KPI the Control Tower and the public page show, alphabetical: the field it is reported under in the API and the plan files, where it appears, and how it is calculated. Chapter 16 explains how to read them; both are read from the same definitions, so they cannot differ.<\/p>\n<table>\n<thead>\n<tr>\n<th>KPI and its field<\/th>\n<th>Shown on<\/th>\n<th>How it is calculated<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Customer fill rate<\/strong> <code>fill_rate_value_pct<\/code><\/td>\n<td>Control Tower<\/td>\n<td>The same as service level, for one customer: what they were served at list price over what they ordered at list price. Beside it, the fill rate by volume within each unit (litres, kilograms), where a ratio does not depend on the unit.<\/td>\n<\/tr>\n<tr>\n<td><strong>Delivery to customers<\/strong> <code>delivery_cost<\/code><\/td>\n<td>Control Tower<\/td>\n<td>The last leg, where the workspace prices it: for every unit served, a full truck from the site it is served from to the customer on the rate card, divided by what a truck holds of that product. Inside freight (and its carbon inside transport carbon); said apart so the last leg can be read on its own. A customer taking part loads would cost more per unit; that is not modelled.<\/td>\n<\/tr>\n<tr>\n<td><strong>Divergence alerts<\/strong> <code>divergence_alerts<\/code><\/td>\n<td>Control Tower<\/td>\n<td>Products where the supplied forecast and the statistical baseline disagree by more than the tolerance. A dispute is one no known promotion explains; a planner decides which signal to trust. In the demo the supplied forecast is synthetic.<\/td>\n<\/tr>\n<tr>\n<td><strong>Gross margin<\/strong> <code>gross_margin<\/code><\/td>\n<td>Control Tower<\/td>\n<td>Revenue minus the cost of goods sold, taken at standard cost on what was sold. As a percentage, over revenue.<\/td>\n<\/tr>\n<tr>\n<td><strong>Margin at risk<\/strong> <code>margin_at_risk<\/code><\/td>\n<td>Control Tower, public page<\/td>\n<td>For every unit ordered and not served: its gross margin plus the shortage penalty per unit. The penalty is a planning weight, not money, so this is larger than the margin actually lost. The S&amp;OP gate holds a plan whose margin at risk exceeds 2% of the margin achievable.<\/td>\n<\/tr>\n<tr>\n<td><strong>Profit before overheads<\/strong> <code>profit<\/code><\/td>\n<td>public page<\/td>\n<td>Revenue minus total cost. Where two plans end the year on different stock, the difference in year-end stock value is added, because stock carried is value kept, not cost spent.<\/td>\n<\/tr>\n<tr>\n<td><strong>Proven within<\/strong> <code>achieved_gap<\/code><\/td>\n<td>Control Tower, public page<\/td>\n<td>How far the plan could be from the best possible one: the plan's cost minus the solver's proven lower bound, over the plan's cost. A plan the solver did not prove within its target is labelled as such.<\/td>\n<\/tr>\n<tr>\n<td><strong>Purchase carbon<\/strong> <code>purchase_carbon_cost<\/code><\/td>\n<td>Control Tower<\/td>\n<td>The emissions of everything bought (each purchasing record's CO2e per unit, times what is bought, orders already in flight included), and those at the carbon price. A price the plan steers by when it chooses a supplier, not money paid: not in total cost or profit.<\/td>\n<\/tr>\n<tr>\n<td><strong>Revenue<\/strong> <code>revenue<\/code><\/td>\n<td>Control Tower, public page<\/td>\n<td>Units sold times list price.<\/td>\n<\/tr>\n<tr>\n<td><strong>Service level<\/strong> <code>service_level_pct<\/code><\/td>\n<td>Control Tower, public page<\/td>\n<td>Demand served, by value: every unit sold at its list price, over every unit ordered at its list price, across the whole horizon. By value so that litres and kilograms are never added together: by volume, the unit a product happens to be counted in would decide how much it weighs. The volume figure is kept beside it (service_level_volume_pct). It counts demand served within its planning bucket; it is not an on-time-in-full (OTIF) measure. The S&amp;OP gate holds a plan below 97%.<\/td>\n<\/tr>\n<tr>\n<td><strong>Share of the hit won back<\/strong> <code>won_back_pct<\/code><\/td>\n<td>public page<\/td>\n<td>For a disruption: the profit it costs with no early action, minus what it costs acting ahead, over the profit it costs with no early action. Each hit is the baseline plan's profit minus the disrupted plan's.<\/td>\n<\/tr>\n<tr>\n<td><strong>Stock value<\/strong> <code>closing_inventory_value<\/code><\/td>\n<td>Control Tower, public page<\/td>\n<td>Units held times standard cost, finished goods and components. The average is weighted by how long each planning bucket lasts; the closing value is the end of the last bucket.<\/td>\n<\/tr>\n<tr>\n<td><strong>Total (landed) cost<\/strong> <code>total_cost<\/code><\/td>\n<td>Control Tower, public page<\/td>\n<td>Everything the plan spends: production, purchases, freight (road tolls and spot haulage included, and the delivery to each customer where the workspace prices it), empty return trips where charged, holding stock (warehousing plus the cost of capital on its value), and carbon at the carbon price on production and transport. The shortage penalty is not in it, and nor is the carbon in what is bought: the plan prices it when it chooses a supplier, but nobody invoices it, so it is reported beside total cost (purchase carbon), not in it.<\/td>\n<\/tr>\n<tr>\n<td><strong>Transport CO2e<\/strong> <code>transport_carbon_kg<\/code><\/td>\n<td>public page<\/td>\n<td>On the public page: the ISO 14083 report's total, tonne-kilometres of every trip times a published emission factor for the vehicle; a plan without that report uses the engine's own factor, trucks times each lane's CO2e per truck, and is labelled so. The engine's own figure is the one the carbon price is charged on.<\/td>\n<\/tr>\n<tr>\n<td><strong>Truck trips<\/strong> <code>trucks_dispatched<\/code><\/td>\n<td>Control Tower, public page<\/td>\n<td>Departures: every truck that leaves, full or part-full, counts once.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The definitions<\/td>\n<td><code>engine/kpis.py<\/code> (<code>DEFINITIONS<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Where each is shown<\/td>\n<td><code>engine/kpis.py<\/code> (<code>shown_on<\/code>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The Control Tower and the public page take their KPI explanations from the same definitions.<\/p>"}],"search":" every kpi the control tower and the public page show, alphabetical: the field it is reported under in the api and the plan files, where it appears, and how it is calculated. chapter 16 explains how to read them; both are read from the same definitions, so they cannot differ. kpi and its field shown on how it is calculated customer fill rate fill_rate_value_pct control tower the same as service level, for one customer: what they were served at list price over what they ordered at list price. beside it, the fill rate by volume within each unit (litres, kilograms), where a ratio does not depend on the unit. delivery to customers delivery_cost control tower the last leg, where the workspace prices it: for every unit served, a full truck from the site it is served from to the customer on the rate card, divided by what a truck holds of that product. inside freight (and its carbon inside transport carbon); said apart so the last leg can be read on its own. a customer taking part loads would cost more per unit; that is not modelled. divergence alerts divergence_alerts control tower products where the supplied forecast and the statistical baseline disagree by more than the tolerance. a dispute is one no known promotion explains; a planner decides which signal to trust. in the demo the supplied forecast is synthetic. gross margin gross_margin control tower revenue minus the cost of goods sold, taken at standard cost on what was sold. as a percentage, over revenue. margin at risk margin_at_risk control tower, public page for every unit ordered and not served: its gross margin plus the shortage penalty per unit. the penalty is a planning weight, not money, so this is larger than the margin actually lost. the s&op gate holds a plan whose margin at risk exceeds 2% of the margin achievable. profit before overheads profit public page revenue minus total cost. where two plans end the year on different stock, the difference in year-end stock value is added, because stock carried is value kept, not cost spent. proven within achieved_gap control tower, public page how far the plan could be from the best possible one: the plan's cost minus the solver's proven lower bound, over the plan's cost. a plan the solver did not prove within its target is labelled as such. purchase carbon purchase_carbon_cost control tower the emissions of everything bought (each purchasing record's co2e per unit, times what is bought, orders already in flight included), and those at the carbon price. a price the plan steers by when it chooses a supplier, not money paid: not in total cost or profit. revenue revenue control tower, public page units sold times list price. service level service_level_pct control tower, public page demand served, by value: every unit sold at its list price, over every unit ordered at its list price, across the whole horizon. by value so that litres and kilograms are never added together: by volume, the unit a product happens to be counted in would decide how much it weighs. the volume figure is kept beside it (service_level_volume_pct). it counts demand served within its planning bucket; it is not an on-time-in-full (otif) measure. the s&op gate holds a plan below 97%. share of the hit won back won_back_pct public page for a disruption: the profit it costs with no early action, minus what it costs acting ahead, over the profit it costs with no early action. each hit is the baseline plan's profit minus the disrupted plan's. stock value closing_inventory_value control tower, public page units held times standard cost, finished goods and components. the average is weighted by how long each planning bucket lasts; the closing value is the end of the last bucket. total (landed) cost total_cost control tower, public page everything the plan spends: production, purchases, freight (road tolls and spot haulage included, and the delivery to each customer where the workspace prices it), empty return trips where charged, holding stock (warehousing plus the cost of capital on its value), and carbon at the carbon price on production and transport. the shortage penalty is not in it, and nor is the carbon in what is bought: the plan prices it when it chooses a supplier, but nobody invoices it, so it is reported beside total cost (purchase carbon), not in it. transport co2e transport_carbon_kg public page on the public page: the iso 14083 report's total, tonne-kilometres of every trip times a published emission factor for the vehicle; a plan without that report uses the engine's own factor, trucks times each lane's co2e per truck, and is labelled so. the engine's own figure is the one the carbon price is charged on. truck trips trucks_dispatched control tower, public page departures: every truck that leaves, full or part-full, counts once. what where the definitions engine/kpis.py ( definitions ) where each is shown engine/kpis.py ( shown_on ) the control tower and the public page take their kpi explanations from the same definitions. "},{"part":"Appendices","number":"C","slug":"decisions","title":"Design decisions (ADR index)","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>The architecture decisions the engine is built on, one line each: what was decided, its status, and when it last changed. The decision log holds the reasons and the measurements behind each; this index is read from it when the manual is built.<\/p>\n<table>\n<thead>\n<tr>\n<th>ADR<\/th>\n<th>Decision<\/th>\n<th>Status, last changed<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>The Disambiguation Gate (Neural vs. Traditional)<\/td>\n<td>Original log; partly superseded by ADR 7<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Deterministic MILP over ML-Heuristics for Supply Execution<\/td>\n<td>Original log<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Serverless Cloud Run vs. Persistent VMs<\/td>\n<td>Amended, 5 Oct 2026<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Streamlit for Operational Control Tower (Phase 1)<\/td>\n<td>Original log<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Every plan reports how the solver actually stopped<\/td>\n<td>Accepted, 5 Oct 2026<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>CBC stays the default and PuLP stays pinned (2.9.x; 3.3.2 since 18 Oct)<\/td>\n<td>Accepted, 18 Oct 2026<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Forecasting is an offline job, admitted by backtest<\/td>\n<td>Accepted, 8 Oct 2026<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>No graph database<\/td>\n<td>Accepted, 5 Oct 2026<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>AI drafts, humans approve, deterministic services write<\/td>\n<td>Accepted, 5 Oct 2026<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Currency, tolls and emission factors are workspace data<\/td>\n<td>Accepted, 5 Oct 2026<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>Real data stays in isolated workspaces outside git<\/td>\n<td>Accepted, 5 Oct 2026<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>\"Original log\" marks the first four decisions, written before decisions carried a status; \"Amended\" marks one changed since.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The decision log<\/td>\n<td><code>docs/zynta-koda-adr.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>The measurements it cites<\/td>\n<td><code>docs/benchmarks/<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}],"search":" the architecture decisions the engine is built on, one line each: what was decided, its status, and when it last changed. the decision log holds the reasons and the measurements behind each; this index is read from it when the manual is built. adr decision status, last changed 1 the disambiguation gate (neural vs. traditional) original log; partly superseded by adr 7 2 deterministic milp over ml-heuristics for supply execution original log 3 serverless cloud run vs. persistent vms amended, 5 oct 2026 4 streamlit for operational control tower (phase 1) original log 5 every plan reports how the solver actually stopped accepted, 5 oct 2026 6 cbc stays the default and pulp stays pinned (2.9.x; 3.3.2 since 18 oct) accepted, 18 oct 2026 7 forecasting is an offline job, admitted by backtest accepted, 8 oct 2026 8 no graph database accepted, 5 oct 2026 9 ai drafts, humans approve, deterministic services write accepted, 5 oct 2026 10 currency, tolls and emission factors are workspace data accepted, 5 oct 2026 11 real data stays in isolated workspaces outside git accepted, 5 oct 2026 \"original log\" marks the first four decisions, written before decisions carried a status; \"amended\" marks one changed since. what where the decision log docs/zynta-koda-adr.md the measurements it cites docs/benchmarks/ "},{"part":"Appendices","number":"D","slug":"master-data-dictionary","title":"Master data dictionary","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Every column of every master-data table, what it is counted in and what it means to the plan: 215 columns in 23 tables. Edit them in the Control Tower (chapter 23) or load them from an extract (chapter 7).<\/p>\n<p>Units: a <em>base unit<\/em> is the material's own (L, kg or EA); money is in the workspace's currency; a <em>bucket<\/em> is one planning period. The note column says which columns make up the key, which the engine recalculates on every build, what a blank cell means, and, for the tables an SAP extract fills, which SAP field the column comes from.<\/p>"},{"name":"How it works","html":"<h3>Material master<\/h3>\n<p><code>materials.csv<\/code> · key: material_id · 17 rows on Lindewaard<\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>material_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>The product, component or packaging item. Every other table names it by this.<br><span class=\"dd-note\">key; SAP <code>MARA.MATNR<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>description<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>What people call it.<br><span class=\"dd-note\">SAP <code>MAKT.MAKTX<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>base_uom<\/code><br><span class=\"dd-note\">unit<\/span><\/td>\n<td>The unit everything about it is counted in: L, kg or EA. Stock, demand, recipes and prices all use it.<br><span class=\"dd-note\">SAP <code>MARA.MEINS<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>material_type<\/code><br><span class=\"dd-note\">FERT, HALB, ROH, VERP<\/span><\/td>\n<td>Finished good (FERT, sold to customers), semi-finished (HALB), raw material (ROH) or packaging. Only finished goods carry demand.<br><span class=\"dd-note\">SAP <code>MARA.MTART<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>standard_cost<\/code><br><span class=\"dd-note\">money per base unit<\/span><\/td>\n<td>What one unit costs to make, rolled up from the recipe and routing at the cheapest producing site; for a bought item, its purchase price.<br><span class=\"dd-note\">recalculated on every build; SAP <code>MBEW.STPRS<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>sales_price<\/code><br><span class=\"dd-note\">money per base unit<\/span><\/td>\n<td>List price. With a target margin, it is set from the standard cost; without one, it is the price as typed.<br><span class=\"dd-note\">recalculated on every build<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>target_gross_margin_pct<\/code><br><span class=\"dd-note\">%<\/span><\/td>\n<td>Price is set so this share of it is margin: cost / (1 − margin). Blank keeps the price as typed.<br><span class=\"dd-note\">blank means (price as typed)<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>shortage_penalty_per_unit<\/code><br><span class=\"dd-note\">money per base unit<\/span><\/td>\n<td>What failing to supply one unit costs on top of the lost margin: a penalty clause or service credit. A planning weight, not money paid.<\/td>\n<\/tr>\n<tr>\n<td><code>units_per_pallet<\/code><br><span class=\"dd-note\">base units<\/span><\/td>\n<td>How many units one pallet holds. Drives storage, truck slots and handling.<br><span class=\"dd-note\">SAP <code>MARM.UMREZ<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>kg_per_unit<\/code><br><span class=\"dd-note\">kg<\/span><\/td>\n<td>Mass of one unit. A truck runs out of payload or pallet slots, whichever comes first.<br><span class=\"dd-note\">SAP <code>MARA.BRGEW<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>temperature_zone<\/code><br><span class=\"dd-note\">AMBIENT, REFRIGERATED<\/span><\/td>\n<td>Which storage and which trailers it needs.<br><span class=\"dd-note\">SAP <code>MARA.TEMPB<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>hazard_class<\/code><br><span class=\"dd-note\">ADR class<\/span><\/td>\n<td>Dangerous-goods class (3, 4.1, 5.1, 6.1, 8, 9). It then needs a licensed store, an ADR-certified lane and its own vehicle.<br><span class=\"dd-note\">blank means (not hazardous)<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>un_number<\/code><br><span class=\"dd-note\">four digits<\/span><\/td>\n<td>UN number for the transport document. Required with a hazard class.<\/td>\n<\/tr>\n<tr>\n<td><code>packing_group<\/code><br><span class=\"dd-note\">I, II, III<\/span><\/td>\n<td>Packing group for the transport document. Required with a hazard class.<\/td>\n<\/tr>\n<tr>\n<td><code>shelf_life_days<\/code><br><span class=\"dd-note\">days<\/span><\/td>\n<td>Total life from production. Blank means it does not perish.<br><span class=\"dd-note\">blank means (does not expire); SAP <code>MARA.MHDHB<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>production_co2_kg_per_unit<\/code><br><span class=\"dd-note\">kg CO₂e per base unit<\/span><\/td>\n<td>Emissions of making one unit, beyond the line's own; priced at the carbon price.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Bill of material<\/h3>\n<p><code>boms.csv<\/code> · key: parent_material_id + component_material_id + plant_id + valid_from · 29 rows on Lindewaard<\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>parent_material_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>What is made.<br><span class=\"dd-note\">key; SAP <code>MAST.MATNR<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>component_material_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>What goes into it.<br><span class=\"dd-note\">key; SAP <code>STPO.IDNRK<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>plant_id<\/code><br><span class=\"dd-note\">site code<\/span><\/td>\n<td>Where this recipe line applies. Blank applies at every plant.<br><span class=\"dd-note\">key; blank means (all plants); SAP <code>MAST.WERKS<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>quantity_per<\/code><br><span class=\"dd-note\">component base units per parent unit<\/span><\/td>\n<td>How much of the component one unit of the parent takes, before scrap.<br><span class=\"dd-note\">SAP <code>STPO.MENGE<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>scrap_pct<\/code><br><span class=\"dd-note\">fraction (0.02 = 2%)<\/span><\/td>\n<td>Extra component lost in making. Doubled at a co-packer. Despite the name, written as a fraction.<br><span class=\"dd-note\">SAP <code>STPO.AUSCH<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>valid_from<\/code><br><span class=\"dd-note\">date<\/span><\/td>\n<td>First day this line applies. Blank: always has.<br><span class=\"dd-note\">key; blank means (no start date)<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>valid_to<\/code><br><span class=\"dd-note\">date<\/span><\/td>\n<td>Last day it applies. Blank: no end.<br><span class=\"dd-note\">blank means (no end date)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Routing<\/h3>\n<p><code>routings.csv<\/code> · key: material_id + plant_id + work_center + valid_from · 14 rows on Lindewaard<\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>material_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>What the line makes.<br><span class=\"dd-note\">key; SAP <code>MAPL.MATNR<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>plant_id<\/code><br><span class=\"dd-note\">site code<\/span><\/td>\n<td>Where.<br><span class=\"dd-note\">key; SAP <code>MAPL.WERKS<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>work_center<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>The line. Its hours are shared by everything routed through it.<br><span class=\"dd-note\">key; SAP <code>CRHD.ARBPL<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>setup_hours<\/code><br><span class=\"dd-note\">hours<\/span><\/td>\n<td>Hours lost to a changeover before a run.<br><span class=\"dd-note\">SAP <code>PLPO.VGW01<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>run_hours_per_unit<\/code><br><span class=\"dd-note\">hours per base unit<\/span><\/td>\n<td>Line time per unit: 1 / the line rate.<br><span class=\"dd-note\">SAP <code>PLPO.VGW02<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>variable_cost_per_unit<\/code><br><span class=\"dd-note\">money per base unit<\/span><\/td>\n<td>Conversion cost per unit made: labour, energy, consumables.<\/td>\n<\/tr>\n<tr>\n<td><code>setup_cost<\/code><br><span class=\"dd-note\">money per changeover<\/span><\/td>\n<td>What a changeover costs, on top of the hours it takes.<\/td>\n<\/tr>\n<tr>\n<td><code>min_lot_size<\/code><br><span class=\"dd-note\">base units<\/span><\/td>\n<td>Smallest run worth starting.<br><span class=\"dd-note\">SAP <code>MARC.BSTMI<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>max_lot_size<\/code><br><span class=\"dd-note\">base units<\/span><\/td>\n<td>Largest run in one bucket. Blank: no limit.<br><span class=\"dd-note\">blank means (no limit); SAP <code>MARC.BSTMA<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>maintenance_cost_per_hour<\/code><br><span class=\"dd-note\">money per hour<\/span><\/td>\n<td>Wear and tear charged for every hour the line runs.<\/td>\n<\/tr>\n<tr>\n<td><code>oee_reliability<\/code><br><span class=\"dd-note\">fraction, 0 to 1<\/span><\/td>\n<td>Overall equipment effectiveness: the share of nameplate hours that can be planned.<\/td>\n<\/tr>\n<tr>\n<td><code>co2_kg_per_unit<\/code><br><span class=\"dd-note\">kg CO₂e per base unit<\/span><\/td>\n<td>Emissions of running the line, per unit made.<\/td>\n<\/tr>\n<tr>\n<td><code>valid_from<\/code><br><span class=\"dd-note\">date<\/span><\/td>\n<td>First day this routing applies. Blank: always has.<br><span class=\"dd-note\">key; blank means (no start date)<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>valid_to<\/code><br><span class=\"dd-note\">date<\/span><\/td>\n<td>Last day it applies. Blank: no end.<br><span class=\"dd-note\">blank means (no end date)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Purchasing info record<\/h3>\n<p><code>purchasing.csv<\/code> · key: material_id + plant_id + vendor_id + valid_from · 20 rows on Lindewaard<\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>material_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>What is bought.<br><span class=\"dd-note\">key; SAP <code>EINA.MATNR<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>plant_id<\/code><br><span class=\"dd-note\">site code<\/span><\/td>\n<td>Which plant it is delivered to.<br><span class=\"dd-note\">key; SAP <code>EINE.WERKS<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>vendor_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>Who sells it.<br><span class=\"dd-note\">key; SAP <code>EINA.LIFNR<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>unit_cost<\/code><br><span class=\"dd-note\">money per base unit<\/span><\/td>\n<td>Price per unit.<br><span class=\"dd-note\">SAP <code>EINE.NETPR<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>lead_time_days<\/code><br><span class=\"dd-note\">days<\/span><\/td>\n<td>From order to delivery. Supply inside the longest lead time is already committed when something goes wrong.<br><span class=\"dd-note\">SAP <code>EINE.APLFZ<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>minimum_order_quantity<\/code><br><span class=\"dd-note\">base units<\/span><\/td>\n<td>Smallest order the vendor accepts.<br><span class=\"dd-note\">SAP <code>EINE.MINBM<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>max_per_period<\/code><br><span class=\"dd-note\">base units per bucket<\/span><\/td>\n<td>Most the vendor can deliver in one bucket. Blank: no limit.<br><span class=\"dd-note\">blank means (no limit)<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>co2_kg_per_unit<\/code><br><span class=\"dd-note\">kg CO₂e per base unit<\/span><\/td>\n<td>Emissions of making and delivering what is bought. Priced in the plan's choices; not part of the carbon budget.<\/td>\n<\/tr>\n<tr>\n<td><code>valid_from<\/code><br><span class=\"dd-note\">date<\/span><\/td>\n<td>First day this record applies. Blank: always has.<br><span class=\"dd-note\">key; blank means (no start date)<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>valid_to<\/code><br><span class=\"dd-note\">date<\/span><\/td>\n<td>Last day it applies. Blank: no end.<br><span class=\"dd-note\">blank means (no end date)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Customer master<\/h3>\n<p><code>customers.csv<\/code> · key: customer_id · 12 rows on Lindewaard<\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>customer_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>The customer.<br><span class=\"dd-note\">key; SAP <code>KNA1.KUNNR<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>name<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>What they are called.<br><span class=\"dd-note\">SAP <code>KNA1.NAME1<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>channel<\/code><br><span class=\"dd-note\">GROCERY_RETAIL, DISCOUNT, WHOLESALE, FOODSERVICE<\/span><\/td>\n<td>How they buy. Reported beside the plan and the shelf-life limits it sets; not priced.<br><span class=\"dd-note\">SAP <code>KNVV.VTWEG<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>served_from<\/code><br><span class=\"dd-note\">site code<\/span><\/td>\n<td>The distribution centre that delivers to them.<br><span class=\"dd-note\">SAP <code>KNVV.VWERK<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>outbound_transit_days<\/code><br><span class=\"dd-note\">days<\/span><\/td>\n<td>From that centre to them. Spends shelf life before delivery.<\/td>\n<\/tr>\n<tr>\n<td><code>priority<\/code><br><span class=\"dd-note\">0 to 100, 50 neutral<\/span><\/td>\n<td>Who is served first when there is not enough. Higher goes first; it moves a shortage onto someone else, it does not make it smaller.<br><span class=\"dd-note\">SAP <code>KNVV.LPRIO<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>notes<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Free text.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Remaining shelf-life agreement<\/h3>\n<p><code>shelf_life_agreements.csv<\/code> · key: customer_id + material_id · 47 rows on Lindewaard<\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>customer_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>The customer.<br><span class=\"dd-note\">key<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>material_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>The product.<br><span class=\"dd-note\">key<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>min_remaining_days<\/code><br><span class=\"dd-note\">days<\/span><\/td>\n<td>Life that must remain on delivery, in days. With a percentage too, the stricter applies.<\/td>\n<\/tr>\n<tr>\n<td><code>min_remaining_pct<\/code><br><span class=\"dd-note\">%, between 0 and 100<\/span><\/td>\n<td>Life that must remain on delivery, as a share of total shelf life (66.7 is the grocery two-thirds rule).<\/td>\n<\/tr>\n<tr>\n<td><code>note<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Free text.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Buffer profile<\/h3>\n<p><code>buffer_profiles.csv<\/code> · key: material_id + plant_id · 7 rows on Lindewaard<\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>material_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>The buffered part.<br><span class=\"dd-note\">key<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>plant_id<\/code><br><span class=\"dd-note\">site code<\/span><\/td>\n<td>Where its buffer sits.<br><span class=\"dd-note\">key<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>decoupled_lead_time_days<\/code><br><span class=\"dd-note\">days<\/span><\/td>\n<td>The longest lead time to this buffer from the buffers or sources before it.<\/td>\n<\/tr>\n<tr>\n<td><code>lead_time_factor<\/code><br><span class=\"dd-note\">fraction<\/span><\/td>\n<td>DDMRP lead-time factor: about 0.2 for long lead times, 0.5 medium, 0.7 short. Sizes the red zone.<\/td>\n<\/tr>\n<tr>\n<td><code>order_cycle_days<\/code><br><span class=\"dd-note\">days<\/span><\/td>\n<td>How often it is ordered. Sizes the green zone.<\/td>\n<\/tr>\n<tr>\n<td><code>minimum_order_quantity<\/code><br><span class=\"dd-note\">base units<\/span><\/td>\n<td>Smallest replenishment. Also a floor on the green zone.<\/td>\n<\/tr>\n<tr>\n<td><code>rounding_value<\/code><br><span class=\"dd-note\">base units<\/span><\/td>\n<td>Orders are rounded up to a multiple of this.<\/td>\n<\/tr>\n<tr>\n<td><code>sourced_from_copacker<\/code><br><span class=\"dd-note\">TRUE or FALSE<\/span><\/td>\n<td>Replenished from a co-packer, so the return trip for quality release adds to the lead time.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Site master<\/h3>\n<p><code>sites.csv<\/code> · key: site_id · 9 rows on Lindewaard<\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>site_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>The site.<br><span class=\"dd-note\">key; SAP <code>T001W.WERKS<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>name<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>What it is called.<br><span class=\"dd-note\">SAP <code>T001W.NAME1<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>site_type<\/code><br><span class=\"dd-note\">PLANT, DC, COPACKER, VENDOR<\/span><\/td>\n<td>What it does. A co-packer makes for a parent plant and never ships to customers.<\/td>\n<\/tr>\n<tr>\n<td><code>status<\/code><br><span class=\"dd-note\">ACTIVE, CANDIDATE, CLOSED<\/span><\/td>\n<td>ACTIVE is planned; CANDIDATE only exists for network design; CLOSED is history.<\/td>\n<\/tr>\n<tr>\n<td><code>city<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Where it is, in words.<br><span class=\"dd-note\">SAP <code>T001W.ORT01<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>region<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Province, state or region.<br><span class=\"dd-note\">SAP <code>T001W.REGIO<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>latitude<\/code><br><span class=\"dd-note\">degrees<\/span><\/td>\n<td>Where it is. Lane distances, transit days and costs are derived from it.<\/td>\n<\/tr>\n<tr>\n<td><code>longitude<\/code><br><span class=\"dd-note\">degrees<\/span><\/td>\n<td>Where it is.<\/td>\n<\/tr>\n<tr>\n<td><code>serves_customers<\/code><br><span class=\"dd-note\">TRUE or FALSE<\/span><\/td>\n<td>Whether customers can be delivered from here.<\/td>\n<\/tr>\n<tr>\n<td><code>parent_site_id<\/code><br><span class=\"dd-note\">site code<\/span><\/td>\n<td>For a co-packer: the plant its output goes back to for quality release.<\/td>\n<\/tr>\n<tr>\n<td><code>ambient_pallet_capacity<\/code><br><span class=\"dd-note\">pallets<\/span><\/td>\n<td>Ambient storage positions. Blank: none modelled.<\/td>\n<\/tr>\n<tr>\n<td><code>chilled_pallet_capacity<\/code><br><span class=\"dd-note\">pallets<\/span><\/td>\n<td>Refrigerated storage positions. Blank: none modelled.<\/td>\n<\/tr>\n<tr>\n<td><code>ambient_holding_cost_per_pallet_week<\/code><br><span class=\"dd-note\">money per pallet per week<\/span><\/td>\n<td>What an ambient pallet costs to store, scaled to each bucket's length.<\/td>\n<\/tr>\n<tr>\n<td><code>chilled_holding_cost_per_pallet_week<\/code><br><span class=\"dd-note\">money per pallet per week<\/span><\/td>\n<td>Same, refrigerated.<\/td>\n<\/tr>\n<tr>\n<td><code>hazmat_pallet_capacity<\/code><br><span class=\"dd-note\">pallets<\/span><\/td>\n<td>Licensed positions for dangerous goods. Blank: not licensed.<\/td>\n<\/tr>\n<tr>\n<td><code>hazmat_holding_cost_per_pallet_week<\/code><br><span class=\"dd-note\">money per pallet per week<\/span><\/td>\n<td>What a licensed dangerous-goods position costs.<\/td>\n<\/tr>\n<tr>\n<td><code>max_volume_per_period<\/code><br><span class=\"dd-note\">base units per bucket<\/span><\/td>\n<td>For a co-packer: the most it will make in one bucket.<\/td>\n<\/tr>\n<tr>\n<td><code>annual_fixed_cost<\/code><br><span class=\"dd-note\">money per year<\/span><\/td>\n<td>What keeping the site open costs whatever flows through it. Used by network design and the financial view.<\/td>\n<\/tr>\n<tr>\n<td><code>opening_capex<\/code><br><span class=\"dd-note\">money<\/span><\/td>\n<td>What opening a candidate costs, spread over the amortisation years in network design.<\/td>\n<\/tr>\n<tr>\n<td><code>closing_cost<\/code><br><span class=\"dd-note\">money<\/span><\/td>\n<td>What closing an existing site costs.<\/td>\n<\/tr>\n<tr>\n<td><code>routing_template_site_id<\/code><br><span class=\"dd-note\">site code<\/span><\/td>\n<td>For a candidate plant: the site whose lines it would copy.<\/td>\n<\/tr>\n<tr>\n<td><code>notes<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Free text.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Lane master<\/h3>\n<p><code>lanes.csv<\/code> · key: lane_id · 9 rows on Lindewaard<\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>lane_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>The lane. Disruptions and tolls name it.<br><span class=\"dd-note\">key<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>origin_site_id<\/code><br><span class=\"dd-note\">site code<\/span><\/td>\n<td>Where trucks leave.<\/td>\n<\/tr>\n<tr>\n<td><code>destination_site_id<\/code><br><span class=\"dd-note\">site code<\/span><\/td>\n<td>Where they arrive.<\/td>\n<\/tr>\n<tr>\n<td><code>status<\/code><br><span class=\"dd-note\">ACTIVE, SUSPENDED, PLANNED<\/span><\/td>\n<td>Only ACTIVE lanes carry anything this cycle.<\/td>\n<\/tr>\n<tr>\n<td><code>straight_line_km<\/code><br><span class=\"dd-note\">km<\/span><\/td>\n<td>Great-circle distance between the two sites.<br><span class=\"dd-note\">recalculated on every build<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>circuity_factor<\/code><br><span class=\"dd-note\">road km per straight km<\/span><\/td>\n<td>How much longer the road is than the straight line. Blank takes the rate card's default.<\/td>\n<\/tr>\n<tr>\n<td><code>suggested_road_km<\/code><br><span class=\"dd-note\">km<\/span><\/td>\n<td>Straight line times circuity.<br><span class=\"dd-note\">recalculated on every build<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>road_km_override<\/code><br><span class=\"dd-note\">km<\/span><\/td>\n<td>The real road distance, when known. Beats the suggestion.<\/td>\n<\/tr>\n<tr>\n<td><code>suggested_transit_days<\/code><br><span class=\"dd-note\">days<\/span><\/td>\n<td>Lead time derived from the road distance.<br><span class=\"dd-note\">recalculated on every build<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>otif<\/code><br><span class=\"dd-note\">fraction, 0 to 1<\/span><\/td>\n<td>The carrier's on-time-in-full record. A poorer record stretches the lead time the DDMRP buffers it feeds are sized on, so they hold more.<\/td>\n<\/tr>\n<tr>\n<td><code>trucks_per_period<\/code><br><span class=\"dd-note\">trucks per bucket<\/span><\/td>\n<td>Most departures available. Blank: no limit.<\/td>\n<\/tr>\n<tr>\n<td><code>allow_groupage<\/code><br><span class=\"dd-note\">TRUE or FALSE<\/span><\/td>\n<td>Whether a few pallets may go on a shared truck, paid per pallet, instead of a whole truck.<\/td>\n<\/tr>\n<tr>\n<td><code>adr_certified<\/code><br><span class=\"dd-note\">TRUE or FALSE<\/span><\/td>\n<td>Whether the carrier may move dangerous goods. Without it a hazardous load cannot use the lane.<\/td>\n<\/tr>\n<tr>\n<td><code>adr_surcharge_pct<\/code><br><span class=\"dd-note\">fraction (0.15 = 15%)<\/span><\/td>\n<td>What ADR licensing adds to the rate.<\/td>\n<\/tr>\n<tr>\n<td><code>notes<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Free text.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Lane disruption<\/h3>\n<p><code>lane_disruptions.csv<\/code> · key: disruption_id · 5 rows on Lindewaard<\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>disruption_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>The disruption.<br><span class=\"dd-note\">key<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>lane_id<\/code><br><span class=\"dd-note\">lane code<\/span><\/td>\n<td>Which lane.<\/td>\n<\/tr>\n<tr>\n<td><code>from_period<\/code><br><span class=\"dd-note\">bucket<\/span><\/td>\n<td>First bucket it covers.<\/td>\n<\/tr>\n<tr>\n<td><code>to_period<\/code><br><span class=\"dd-note\">bucket<\/span><\/td>\n<td>Last bucket.<\/td>\n<\/tr>\n<tr>\n<td><code>disruption_type<\/code><br><span class=\"dd-note\">CLOSURE, CAPACITY_CUT, TRANSIT_DELAY, COST_SURCHARGE, OTIF_DEGRADATION<\/span><\/td>\n<td>What it does to the lane.<\/td>\n<\/tr>\n<tr>\n<td><code>value<\/code><br><span class=\"dd-note\">depends on the type<\/span><\/td>\n<td>Trucks still available per bucket (capacity cut), extra days (delay), fraction added to freight (surcharge), or the reliability actually seen (OTIF). Not needed for a closure.<\/td>\n<\/tr>\n<tr>\n<td><code>status<\/code><br><span class=\"dd-note\">CONFIRMED, EXPECTED, RESOLVED<\/span><\/td>\n<td>CONFIRMED is planned around; EXPECTED is carried as a risk for Impact tracing; RESOLVED is over.<\/td>\n<\/tr>\n<tr>\n<td><code>likelihood<\/code><br><span class=\"dd-note\">fraction, 0 to 1<\/span><\/td>\n<td>How likely an expected one is. Weights the money in a trace, never the plan.<\/td>\n<\/tr>\n<tr>\n<td><code>source<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Who said so.<\/td>\n<\/tr>\n<tr>\n<td><code>notes<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Free text; the Control Tower shows it as the event's name.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Demand scenario<\/h3>\n<p><code>demand_scenarios.csv<\/code> · key: scenario_id · 5 rows on Lindewaard<\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>scenario_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>The future.<br><span class=\"dd-note\">key<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>name<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>What it is called.<\/td>\n<\/tr>\n<tr>\n<td><code>probability<\/code><br><span class=\"dd-note\">fraction<\/span><\/td>\n<td>How likely. The futures must add up to 1.<\/td>\n<\/tr>\n<tr>\n<td><code>demand_multiplier<\/code><br><span class=\"dd-note\">multiple<\/span><\/td>\n<td>All demand scaled by this in this future.<\/td>\n<\/tr>\n<tr>\n<td><code>ambient_multiplier<\/code><br><span class=\"dd-note\">multiple<\/span><\/td>\n<td>Replaces the demand multiplier for ambient products. Blank: the demand multiplier.<\/td>\n<\/tr>\n<tr>\n<td><code>chilled_multiplier<\/code><br><span class=\"dd-note\">multiple<\/span><\/td>\n<td>Replaces it for refrigerated products. Blank: the demand multiplier.<\/td>\n<\/tr>\n<tr>\n<td><code>notes<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Why this future; shown as \"Why\" in Design across futures.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Stock position<\/h3>\n<p><code>inventory_positions.csv<\/code> · key: material_id + plant_id · 38 rows on Lindewaard<\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>material_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>The item.<br><span class=\"dd-note\">key; SAP <code>MARD.MATNR<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>plant_id<\/code><br><span class=\"dd-note\">site code<\/span><\/td>\n<td>Where it sits.<br><span class=\"dd-note\">key; SAP <code>MARD.WERKS<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>on_hand<\/code><br><span class=\"dd-note\">base units<\/span><\/td>\n<td>Stock there now.<br><span class=\"dd-note\">SAP <code>MARD.LABST<\/code><\/span><\/td>\n<\/tr>\n<tr>\n<td><code>on_order<\/code><br><span class=\"dd-note\">base units<\/span><\/td>\n<td>Open supply due in, summed from the open orders.<br><span class=\"dd-note\">recalculated on every build<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>qualified_demand<\/code><br><span class=\"dd-note\">base units<\/span><\/td>\n<td>Order spikes inside the buffer's horizon that DDMRP counts against the net flow position.<\/td>\n<\/tr>\n<tr>\n<td><code>as_of_date<\/code><br><span class=\"dd-note\">date<\/span><\/td>\n<td>When it was counted.<\/td>\n<\/tr>\n<tr>\n<td><code>notes<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Free text.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Open order<\/h3>\n<p><code>open_supply.csv<\/code> · key: order_id · 25 rows on Lindewaard<\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>order_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>The order.<br><span class=\"dd-note\">key<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>order_type<\/code><br><span class=\"dd-note\">PURCHASE_ORDER, TRANSFER_ORDER<\/span><\/td>\n<td>Bought from a vendor, or moved between own sites.<\/td>\n<\/tr>\n<tr>\n<td><code>material_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>What arrives.<\/td>\n<\/tr>\n<tr>\n<td><code>plant_id<\/code><br><span class=\"dd-note\">site code<\/span><\/td>\n<td>Where.<\/td>\n<\/tr>\n<tr>\n<td><code>quantity<\/code><br><span class=\"dd-note\">base units<\/span><\/td>\n<td>How much.<\/td>\n<\/tr>\n<tr>\n<td><code>due_in_days<\/code><br><span class=\"dd-note\">days from the plan&#x27;s start<\/span><\/td>\n<td>When it arrives.<\/td>\n<\/tr>\n<tr>\n<td><code>vendor_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>Who from, for a purchase order.<\/td>\n<\/tr>\n<tr>\n<td><code>status<\/code><br><span class=\"dd-note\">OPEN<\/span><\/td>\n<td>Still to arrive.<\/td>\n<\/tr>\n<tr>\n<td><code>notes<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Free text.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Sales order<\/h3>\n<p><code>sales_orders.csv<\/code> · key: order_id · 44 rows on Lindewaard<\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>order_id<\/code><br><span class=\"dd-note\">code
