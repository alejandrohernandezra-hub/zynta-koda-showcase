pan class=\"dd-note\">text<\/span><\/td>\n<td>Which group it belongs to.<\/td>\n<\/tr>\n<tr>\n<td><code>notes<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>What it means and where it came from.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Supply disruption<\/h3>\n<p><code>supply_disruptions.csv<\/code> · key: disruption_id · 5 rows on Lindewaard<\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>disruption_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>The disruption.<br><span class=\"dd-note\">key<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>vendor_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>Which vendor.<\/td>\n<\/tr>\n<tr>\n<td><code>material_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>Which material. Blank: everything this vendor supplies.<br><span class=\"dd-note\">blank means (all materials)<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>plant_id<\/code><br><span class=\"dd-note\">site code<\/span><\/td>\n<td>Which plant's deliveries. Blank: all of them.<br><span class=\"dd-note\">blank means (all plants)<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>from_period<\/code><br><span class=\"dd-note\">bucket<\/span><\/td>\n<td>First bucket it covers.<\/td>\n<\/tr>\n<tr>\n<td><code>to_period<\/code><br><span class=\"dd-note\">bucket<\/span><\/td>\n<td>Last bucket.<\/td>\n<\/tr>\n<tr>\n<td><code>disruption_type<\/code><br><span class=\"dd-note\">OUTAGE, CAPACITY_CUT, LEAD_TIME_EXTENSION, PRICE_SURCHARGE<\/span><\/td>\n<td>What it does to supply.<\/td>\n<\/tr>\n<tr>\n<td><code>value<\/code><br><span class=\"dd-note\">depends on the type<\/span><\/td>\n<td>Units still available per bucket (capacity cut), extra days (lead time), or fraction added to the price (surcharge). Not needed for an outage.<br><span class=\"dd-note\">blank means (not needed)<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>status<\/code><br><span class=\"dd-note\">CONFIRMED, EXPECTED, RESOLVED<\/span><\/td>\n<td>As for lane disruptions.<\/td>\n<\/tr>\n<tr>\n<td><code>likelihood<\/code><br><span class=\"dd-note\">fraction, 0 to 1<\/span><\/td>\n<td>How likely an expected one is.<\/td>\n<\/tr>\n<tr>\n<td><code>source<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Who said so.<\/td>\n<\/tr>\n<tr>\n<td><code>notes<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Free text.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Road toll rate<\/h3>\n<p><code>road_toll_rates.csv<\/code> · key: rate_id · 132 rows on Lindewaard<\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>rate_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>The rate.<br><span class=\"dd-note\">key<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>regime<\/code><br><span class=\"dd-note\">code (NL)<\/span><\/td>\n<td>Which toll scheme.<\/td>\n<\/tr>\n<tr>\n<td><code>currency<\/code><br><span class=\"dd-note\">ISO code<\/span><\/td>\n<td>Must be the workspace's: there is no conversion.<\/td>\n<\/tr>\n<tr>\n<td><code>min_weight_kg<\/code><br><span class=\"dd-note\">kg<\/span><\/td>\n<td>Lightest vehicle it applies to (technical maximum mass).<\/td>\n<\/tr>\n<tr>\n<td><code>max_weight_kg<\/code><br><span class=\"dd-note\">kg<\/span><\/td>\n<td>Heaviest.<\/td>\n<\/tr>\n<tr>\n<td><code>euro_class<\/code><br><span class=\"dd-note\">0 to 6, or *<\/span><\/td>\n<td>Engine emission class it applies to; * for any.<\/td>\n<\/tr>\n<tr>\n<td><code>co2_class<\/code><br><span class=\"dd-note\">1 to 5<\/span><\/td>\n<td>CO₂ emission class it applies to.<\/td>\n<\/tr>\n<tr>\n<td><code>rate_per_km<\/code><br><span class=\"dd-note\">money per km<\/span><\/td>\n<td>Toll per tolled kilometre.<\/td>\n<\/tr>\n<tr>\n<td><code>valid_from<\/code><br><span class=\"dd-note\">date<\/span><\/td>\n<td>First day it applies.<\/td>\n<\/tr>\n<tr>\n<td><code>valid_to<\/code><br><span class=\"dd-note\">date<\/span><\/td>\n<td>Last day.<\/td>\n<\/tr>\n<tr>\n<td><code>source_url<\/code><br><span class=\"dd-note\">URL<\/span><\/td>\n<td>Where the rate is published.<\/td>\n<\/tr>\n<tr>\n<td><code>source_date<\/code><br><span class=\"dd-note\">date<\/span><\/td>\n<td>When it was read there.<\/td>\n<\/tr>\n<tr>\n<td><code>verified<\/code><br><span class=\"dd-note\">TRUE or FALSE<\/span><\/td>\n<td>Whether someone checked it against the source. Unchecked rates are labelled.<\/td>\n<\/tr>\n<tr>\n<td><code>notes<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Free text.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Tolled distance<\/h3>\n<p><code>lane_road_use.csv<\/code> · key: lane_id + regime · 9 rows on Lindewaard<\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>lane_id<\/code><br><span class=\"dd-note\">lane code<\/span><\/td>\n<td>The lane.<br><span class=\"dd-note\">key<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>regime<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>Which toll scheme.<br><span class=\"dd-note\">key<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>tolled_km<\/code><br><span class=\"dd-note\">km<\/span><\/td>\n<td>Kilometres of the lane on tolled road.<\/td>\n<\/tr>\n<tr>\n<td><code>notes<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Free text.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Fleet profile<\/h3>\n<p><code>fleet_profiles.csv<\/code> · key: profile_id · 3 rows on Lindewaard<\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>profile_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>The vehicle type.<br><span class=\"dd-note\">key<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>description<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>What it is.<\/td>\n<\/tr>\n<tr>\n<td><code>default_for_modes<\/code><br><span class=\"dd-note\">INTERNAL_FLEET, CONTRACTED_3PL, SPOT_3PL<\/span><\/td>\n<td>Which modes use it unless a lane says otherwise.<\/td>\n<\/tr>\n<tr>\n<td><code>gross_weight_kg<\/code><br><span class=\"dd-note\">kg<\/span><\/td>\n<td>Technical maximum mass: picks the toll band.<\/td>\n<\/tr>\n<tr>\n<td><code>euro_class<\/code><br><span class=\"dd-note\">0 to 6<\/span><\/td>\n<td>Engine emission class: picks the toll rate.<\/td>\n<\/tr>\n<tr>\n<td><code>co2_class<\/code><br><span class=\"dd-note\">1 to 5<\/span><\/td>\n<td>CO₂ class: picks the toll rate.<\/td>\n<\/tr>\n<tr>\n<td><code>fuel<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>What it runs on.<\/td>\n<\/tr>\n<tr>\n<td><code>emission_factor_id<\/code><br><span class=\"dd-note\">factor code<\/span><\/td>\n<td>Its emission factor, for the ISO 14083 report.<\/td>\n<\/tr>\n<tr>\n<td><code>reefer_emission_factor_id<\/code><br><span class=\"dd-note\">factor code<\/span><\/td>\n<td>Its factor when refrigerated. Blank: the same one.<\/td>\n<\/tr>\n<tr>\n<td><code>toll_pass_through<\/code><br><span class=\"dd-note\">fraction, 0 to 1<\/span><\/td>\n<td>Share of the toll a hired carrier passes on. The own fleet pays it all.<\/td>\n<\/tr>\n<tr>\n<td><code>notes<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Free text.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Lane fleet assignment<\/h3>\n<p><code>lane_fleet.csv<\/code> · key: lane_id + mode · 0 rows on Lindewaard<\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>lane_id<\/code><br><span class=\"dd-note\">lane code<\/span><\/td>\n<td>The lane.<br><span class=\"dd-note\">key<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>mode<\/code><br><span class=\"dd-note\">INTERNAL_FLEET, CONTRACTED_3PL, SPOT_3PL<\/span><\/td>\n<td>Which carrier option on it.<br><span class=\"dd-note\">key<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>profile_id<\/code><br><span class=\"dd-note\">profile code<\/span><\/td>\n<td>The vehicle that option runs, instead of the mode's default.<\/td>\n<\/tr>\n<tr>\n<td><code>notes<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Free text.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Emission factor<\/h3>\n<p><code>emission_factors.csv<\/code> · key: factor_id · 3 rows on Lindewaard<\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>factor_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>The factor.<br><span class=\"dd-note\">key<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>description<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>What vehicle and load it describes.<\/td>\n<\/tr>\n<tr>\n<td><code>basis<\/code><br><span class=\"dd-note\">WTW, TTW<\/span><\/td>\n<td>Well-to-wheel (fuel production included, as ISO 14083 reports) or tank-to-wheel.<\/td>\n<\/tr>\n<tr>\n<td><code>value<\/code><br><span class=\"dd-note\">number<\/span><\/td>\n<td>The factor.<\/td>\n<\/tr>\n<tr>\n<td><code>unit<\/code><br><span class=\"dd-note\">kg CO₂e/tkm<\/span><\/td>\n<td>Per tonne-kilometre.<\/td>\n<\/tr>\n<tr>\n<td><code>region<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Where it applies.<\/td>\n<\/tr>\n<tr>\n<td><code>source<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Where it comes from (GLEC, a national list).<\/td>\n<\/tr>\n<tr>\n<td><code>source_version<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Which edition.<\/td>\n<\/tr>\n<tr>\n<td><code>verified<\/code><br><span class=\"dd-note\">TRUE or FALSE<\/span><\/td>\n<td>Whether someone checked it against the source.<\/td>\n<\/tr>\n<tr>\n<td><code>notes<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Free text.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Customer location<\/h3>\n<p><code>customer_locations.csv<\/code> · key: customer_id · 12 rows on Lindewaard<\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>customer_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>The customer.<br><span class=\"dd-note\">key<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>place<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Where they take delivery, in words.<\/td>\n<\/tr>\n<tr>\n<td><code>latitude<\/code><br><span class=\"dd-note\">degrees<\/span><\/td>\n<td>Where. Prices the delivery to them, and lets network design serve them from another site.<\/td>\n<\/tr>\n<tr>\n<td><code>longitude<\/code><br><span class=\"dd-note\">degrees<\/span><\/td>\n<td>Where.<\/td>\n<\/tr>\n<tr>\n<td><code>notes<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Free text.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Customer sourcing<\/h3>\n<p><code>customer_sourcing.csv<\/code> · key: customer_id + temperature_zone · 22 rows on Lindewaard<\/p>\n<table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>customer_id<\/code><br><span class=\"dd-note\">code<\/span><\/td>\n<td>The customer.<br><span class=\"dd-note\">key<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>temperature_zone<\/code><br><span class=\"dd-note\">AMBIENT or REFRIGERATED<\/span><\/td>\n<td>Which range: dry goods, or chilled.<br><span class=\"dd-note\">key<\/span><\/td>\n<\/tr>\n<tr>\n<td><code>served_from<\/code><br><span class=\"dd-note\">site code<\/span><\/td>\n<td>The site that delivers that range to them. One per customer and range.<\/td>\n<\/tr>\n<tr>\n<td><code>share<\/code><br><span class=\"dd-note\">fraction, 0 to 1<\/span><\/td>\n<td>Their part of that site's demand in that range. The customers a site serves in a range add up to 1.<\/td>\n<\/tr>\n<tr>\n<td><code>notes<\/code><br><span class=\"dd-note\">text<\/span><\/td>\n<td>Free text.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The tables, their keys and columns<\/td>\n<td><code>engine/masterstore.py<\/code> (<code>TABLES<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>What each column means<\/td>\n<td><code>tools/manual_columns.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>What a blank means<\/td>\n<td><code>app.py<\/code> (<code>BLANK_MEANS<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Where SAP keeps it<\/td>\n<td><code>docs/onboarding/mappings/sap-ecc.toml<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Tests that guard it.<\/strong> Every column of every table is explained here, and nothing that is no longer a column: a table that gains a column fails the build until it is.<\/p>"}],"search":" every column of every master-data table, what it is counted in and what it means to the plan: 215 columns in 23 tables. edit them in the control tower (chapter 23) or load them from an extract (chapter 7). units: a base unit is the material's own (l, kg or ea); money is in the workspace's currency; a bucket is one planning period. the note column says which columns make up the key, which the engine recalculates on every build, what a blank cell means, and, for the tables an sap extract fills, which sap field the column comes from. material master materials.csv · key: material_id · 17 rows on lindewaard column meaning material_id code the product, component or packaging item. every other table names it by this. key; sap mara.matnr description text what people call it. sap makt.maktx base_uom unit the unit everything about it is counted in: l, kg or ea. stock, demand, recipes and prices all use it. sap mara.meins material_type fert, halb, roh, verp finished good (fert, sold to customers), semi-finished (halb), raw material (roh) or packaging. only finished goods carry demand. sap mara.mtart standard_cost money per base unit what one unit costs to make, rolled up from the recipe and routing at the cheapest producing site; for a bought item, its purchase price. recalculated on every build; sap mbew.stprs sales_price money per base unit list price. with a target margin, it is set from the standard cost; without one, it is the price as typed. recalculated on every build target_gross_margin_pct % price is set so this share of it is margin: cost / (1 − margin). blank keeps the price as typed. blank means (price as typed) shortage_penalty_per_unit money per base unit what failing to supply one unit costs on top of the lost margin: a penalty clause or service credit. a planning weight, not money paid. units_per_pallet base units how many units one pallet holds. drives storage, truck slots and handling. sap marm.umrez kg_per_unit kg mass of one unit. a truck runs out of payload or pallet slots, whichever comes first. sap mara.brgew temperature_zone ambient, refrigerated which storage and which trailers it needs. sap mara.tempb hazard_class adr class dangerous-goods class (3, 4.1, 5.1, 6.1, 8, 9). it then needs a licensed store, an adr-certified lane and its own vehicle. blank means (not hazardous) un_number four digits un number for the transport document. required with a hazard class. packing_group i, ii, iii packing group for the transport document. required with a hazard class. shelf_life_days days total life from production. blank means it does not perish. blank means (does not expire); sap mara.mhdhb production_co2_kg_per_unit kg co₂e per base unit emissions of making one unit, beyond the line's own; priced at the carbon price. bill of material boms.csv · key: parent_material_id + component_material_id + plant_id + valid_from · 29 rows on lindewaard column meaning parent_material_id code what is made. key; sap mast.matnr component_material_id code what goes into it. key; sap stpo.idnrk plant_id site code where this recipe line applies. blank applies at every plant. key; blank means (all plants); sap mast.werks quantity_per component base units per parent unit how much of the component one unit of the parent takes, before scrap. sap stpo.menge scrap_pct fraction (0.02 = 2%) extra component lost in making. doubled at a co-packer. despite the name, written as a fraction. sap stpo.ausch valid_from date first day this line applies. blank: always has. key; blank means (no start date) valid_to date last day it applies. blank: no end. blank means (no end date) routing routings.csv · key: material_id + plant_id + work_center + valid_from · 14 rows on lindewaard column meaning material_id code what the line makes. key; sap mapl.matnr plant_id site code where. key; sap mapl.werks work_center code the line. its hours are shared by everything routed through it. key; sap crhd.arbpl setup_hours hours hours lost to a changeover before a run. sap plpo.vgw01 run_hours_per_unit hours per base unit line time per unit: 1 / the line rate. sap plpo.vgw02 variable_cost_per_unit money per base unit conversion cost per unit made: labour, energy, consumables. setup_cost money per changeover what a changeover costs, on top of the hours it takes. min_lot_size base units smallest run worth starting. sap marc.bstmi max_lot_size base units largest run in one bucket. blank: no limit. blank means (no limit); sap marc.bstma maintenance_cost_per_hour money per hour wear and tear charged for every hour the line runs. oee_reliability fraction, 0 to 1 overall equipment effectiveness: the share of nameplate hours that can be planned. co2_kg_per_unit kg co₂e per base unit emissions of running the line, per unit made. valid_from date first day this routing applies. blank: always has. key; blank means (no start date) valid_to date last day it applies. blank: no end. blank means (no end date) purchasing info record purchasing.csv · key: material_id + plant_id + vendor_id + valid_from · 20 rows on lindewaard column meaning material_id code what is bought. key; sap eina.matnr plant_id site code which plant it is delivered to. key; sap eine.werks vendor_id code who sells it. key; sap eina.lifnr unit_cost money per base unit price per unit. sap eine.netpr lead_time_days days from order to delivery. supply inside the longest lead time is already committed when something goes wrong. sap eine.aplfz minimum_order_quantity base units smallest order the vendor accepts. sap eine.minbm max_per_period base units per bucket most the vendor can deliv   current = c;
  const q = $("q").value.trim().toLowerCase();
  let open = null;
  if (q && c.written) {
    const deep = c.layers.find((l) => l.name !== "Overview" && l.html.toLowerCase().includes(q)
      && !c.layers[0].html.toLowerCase().includes(q));
    if (deep) open = deep.name;
  }
  const i = DATA.chapters.indexOf(c);
  const prev = DATA.chapters.slice(0, i).reverse().find((x) => x.written);
  const next = DATA.chapters.slice(i + 1).find((x) => x.written);
  let body;
  if (!c.written) {
    body = `<p class="planned-note">This chapter is planned and not written yet. It will follow the same pattern: a short story with a picture, then how it works, the maths and what is under the hood.</p>`;
  } else {
    const over = c.layers[0], deep = c.layers.slice(1);
    body = `<section class="prose overview">${over.html}</section>`;
    if (deep.length) {
      body += `<section class="deeper"><div class="deeper-head">Go deeper</div><div class="tabs" role="group" aria-label="Go deeper">${

function storyTick() {
  const line = innerWidth <= 900 ? innerHeight * 0.74 : innerHeight * 0.5;
  $("main").querySelectorAll(".story").forEach((story) => {
    const steps = [...story.querySelectorAll(".step")];
    if (!steps.length) return;
    let best = steps[0], dist = Infinity;
    steps.forEach((s) => {
      const r = s.getBoundingClientRect(), d = Math.abs(r.top + r.height / 2 - line);
      if (r.top + r.height / 2 <= line + innerHeight * 0.25 && d < dist) { dist = d; best = s; }
    });
    if (story._on === best) return;
    story._on = best;
    steps.forEach((s) => s.classList.toggle("on", s === best));
    const host = story.querySelector(".diagram");
    host._state = best.dataset.state;
    if (host._fig && host._fig.set) host._fig.set(best.dataset.state);
  });
}

    const e2 = edge(s, n ? `M${P.cop[0] + P.w + 2},${P.cop[1] + 28} C190,148 190,92 ${P.dc[0] - 2},92` : `M222,160 C380,160 380,102 518,102`, "", {at: n ? [178, 146] : [372, 152]});
    const shortT = el("text", {x: n ? P.dc[0] : P.dc[0], y: P.dc[1] + P.h + 24, "font-size": 13, "font-weight": 700, style: "fill: var(--bad)"}, s, "");

      const d = T.demand[+$("toy-d").value], c = T.capacity[+$("toy-c").value];

      cop.querySelector(".sub").textContent = `${fmt(cell.made_copacker)} made`;
      dc.querySelector(".sub").textContent = `${fmt(cell.ordered)} ordered`;

      e1.querySelector("path").style.strokeWidth = 1.2 + 6 * cell.made_own / 11000;
      e2.querySelector("path").style.strokeWidth = 1.2 + 6 * cell.made_copacker / 11000;
      shortT.textContent = cell.unmet > 0 ? `${fmt(cell.unmet)} short` : "none short";
      shortT.style.fill = cell.unmet > 0 ? "var(--bad)" : "var(--good)";
      while (bar.firstChild) bar.removeChild(bar.firstChild);
      const parts = [["own line", cell.made_own, "var(--signal)"], ["co-packer", cell.made_copacker, "var(--event)"], ["from stock", Math.max(0, cell.ordered - cell.made_own - cell.made_copacker - cell.unmet), "var(--base-line)"], ["short", cell.unmet, "var(--bad)"]];
      let x = 0;
      el("text", {x: 0, y: barY - 8, "font-size": 12, style: "fill: var(--muted)"}, bar, "How the orders are met, over four weeks");
      parts.forEach(([label, v, color]) => {

        x += w;

        .map(([a, b]) => `<div class="stat"><b>${b}</b><span>${a}</span></div>`).join("");
      cap.textContent = cell.proven ? "Solved by the engine to proven optimality (gap 0) for exactly this combination. 'From stock' is what the orders take from stock on hand and what is left at the end." : "Not proven for this combination.";

  gap(host) {
    const n = narrowOf(host), G = DATA.diagrams.gap, W = n ? 360 : 780, s = svg(W, n ? 210 : 190, "Bound, best plan and the plan found");
    const lo = G.bound - (G.objective - G.bound) * 0.6, hi = G.objective + (G.objective - G.bound) * 0.6;
    const X = (v) => 20 + (v - lo) / (hi - lo) * (W - 40);
    el("line", {x1: 20, x2: W - 20, y1: 96, y2: 96, stroke: "var(--border)", "stroke-width": 2}, s);

    el("rect", {x: X(G.objective * (1 - G.requested)), y: 76, width: X(G.objective) - X(G.objective * (1 - G.requested)), height: 40, rx: 6, fill: "none", stroke: "var(--event)", "stroke-dasharray": "5 4"}, s);
    const mark = (v, label, sub, color, up) => {
      el("line", {x1: X(v), x2: X(v), y1: 68, y2: 124, stroke: color, "stroke-width": 3}, s);
      const anchor = n ? (up ? "start" : "end") : "middle", tx = n ? X(v) + (up ? -6 : 6) : X(v);

  flow(host) {

    const N = {}, E = [];
    st.forEach(([k, t, ico], i) => {
      const [x, y, w, h] = n ? [(i % 2) * 186 + 2, Math.floor(i / 2) * 106 + 4, 170, 70] : [i * 137, 50, 118, 92];
      N[k] = node(s, x, y, w, h, t, {icon: ico, vertical: !n, size: 13.5, tone: k === "gate" ? "warn" : ""});
      if (i < st.length - 1) {
        if (n) E.push(i % 2 === 0 ? edge(s, `M${x + w + 2},${y + 35} L${x + w + 14},${y + 35}`, null)
                                  : edge(s, `M${x + 85},${y + h + 2} C${x + 85},${y + h + 20} 87,${y + h + 14} 87,${y + 104}`, null));
        else E.push(edge(s, `M${x + w + 2},${y + h / 2} L${x + 135},${y + h / 2}`, null));
      }

    const loop = n ? edge(s, "M180,322 C100,330 20,320 20,290", "next cycle", {at: [100, 322]}) : edge(s, "M745,146 C745,190 70,190 59,146", "next cycle: the frozen bucket stays", {at: [400, 178]});

      E.forEach((e, i) => { e.classList.toggle("on", i === k - 1); e.classList.toggle("dim", i >= k); });

  /* Chapter 12: the real buffer, its zones, the plan's stock and the cap. */
  buffer(host) {
    const n = narrowOf(host), B = DATA.diagrams.buffer, W = n ? 360 : 760, H = n ? 320 : 280;
    const s = svg(W, H, "A DDMRP buffer from Lindewaard's plan");
    if (!B) { host.textContent = "No buffer in the published plan."; return null; }
    const top = B.top_of_green * 1.06, L = n ? 52 : 70, Y = (v) => H - 34 - (v / top) * (H - (n ? 82 : 64));
    const zw = W - L - 10;
    const zone = (lo, hi, color, label, low) => {
      el("rect", {x: L, y: Y(hi), width: zw, height: Y(lo) - Y(hi), fill: color}, s);
      // Red is labelled at its foot: its top is where the plan's lines run.
      el("text", {x: L + 8, y: low ? Y(lo) - 8 : Y(hi) + 16, "font-size": 12.5, "font-weight": 700}, s, label);
      el("text", {x: L - 6, y: Y(hi) + 4, "text-anchor": "end", "font-size": 11, style: "fill: var(--muted)"}, s, `${fmt(hi / 1000)}k`);
    };
    zone(0, B.red_zone, "var(--bad-soft)", "Red: safety", true);
    zone(B.red_zone, B.top_of_yellow, "var(--event-soft)", "Yellow: cover for the lead time");
    zone(B.top_of_yellow, B.top_of_green, "var(--good-soft)", "Green: order size");
    const use = `${fmt(B.average_daily_usage)} a day, ${fmt(B.dilated_lead_time_days, 1)}-day lead time`;
    if (n) {
      el("text", {x: 10, y: 16, "font-size": 13, "font-weight": 700}, s, DATA.diagrams.buffer_label);
      el("text", {x: 10, y: 33, "font-size": 12, style: "fill: var(--muted)"}, s, use);
    } else {
      el("text", {x: L, y: 18, "font-size": 13, "font-weight": 700}, s, `${DATA.diagrams.buffer_label} (${use})`);
    }
    const onHand = el("g", {class: "fade hidden-el"}, s);
    el("line", {x1: L, x2: L + zw, y1: Y(B.average_on_hand), y2: Y(B.average_on_hand), stroke: "var(--signal)", "stroke-width": 3}, onHand);
    el("text", {x: L + zw - 6, y: Y(B.average_on_hand) - 6, "text-anchor": "end", "font-size": 12.5, "font-weight": 700, style: "fill: var(--signal)"}, onHand, `average stock ${fmt(B.average_on_hand / 1000)}k`);
    const cap = el("g", {class: "fade hidden-el"}, s);
    el("line", {x1: L, x2: L + zw, y1: Y(B.holdable_red_zone), y2: Y(B.holdable_red_zone), stroke: "var(--bad)", "stroke-width": 2, "stroke-dasharray": "6 4"}, cap);
    el("text", {x: L + 8, y: Y(B.holdable_red_zone) + 16, "font-size": 12, "font-weight": 700, style: "fill: var(--bad)"}, cap, `shelf-life cap ${fmt(B.holdable_red_zone / 1000)}k`);
    const verdict = el("g", {class: "fade hidden-el"}, s);
    el("text", {x: L, y: H - 8, "font-size": 12.5, "font-weight": 700}, verdict, `${B.buckets_below_red} buckets below red, priced at ${money(B.breach_cost)}`);
    host.appendChild(s);
    return {set(state) {
      const k = ["zones", "plan", "shelf", "verdict"].indexOf(state);
      onHand.classList.toggle("hidden-el", k < 1); cap.classList.toggle("hidden-el", k < 2); verdict.classList.toggle("hidden-el", k < 3);
    }};
  },

  /* Chapter 13: three ways on one timeline. */
  "three-ways"(host) {

    const X = (d) => 10 + d / 365 * (W - 20), hit = 168, rows = [["Acting ahead", 0, "var(--signal)"], ["A week's notice", hit - 7, "var(--event)"], ["No early action", hit, "var(--bad)"]];
    el("rect", {x: X(hit), y: 6, width: X(hit + 28) - X(hit), height: n ? 160 : 140, fill: "var(--bad-soft)"}, s);

    rows.forEach(([t, d, c], i) => {

      el("line", {x1: X(0), x2: X(365), y1: y + 6, y2: y + 6, stroke: "var(--rule)", "stroke-width": 6, "stroke-linecap": "round"}, s);

  /* Chapter 13: every story, what acting ahead wins. */
  stories(host) {
    const n = narrowOf(host), S = DATA.diagrams.stories, W = n ? 360 : 760;
    const rowH = n ? 58 : 40, s = svg(W, 30 + S.length * rowH, "Every disruption: profit against the baseline, three ways");
    const vals = S.flatMap((r) => [r.late, r.ahead, r.notice ?? 0]), lo = Math.min(...vals, 0), hi = Math.max(...vals, 0);
    const L = n ? 10 : 250, R = 12, X = (v) => L + (v - lo) / (hi - lo) * (W - L - R);
    el("line", {x1: X(0), x2: X(0), y1: 18, y2: 22 + S.length * rowH, stroke: "var(--border)"}, s);
    el("text", {x: X(0), y: 12, "text-anchor": "middle", "font-size": 11, style: "fill: var(--muted)"}, s, "baseline");
    S.forEach((r, i) => {
      const y = 26 + i * rowH;
      el("text", {x: 10, y: n ? y + 10 : y + 18, "font-size": 12.5, "font-weight": 700}, s, r.title);
      const by = n ? y + 18 : y + 6;
      [[r.late, "var(--bad)"], [r.notice, "var(--event)"], [r.ahead, "var(--signal)"]].forEach(([v, c], j) => {

      });

    caption(host, "Profit against the baseline plan: red no early action, amber a week's notice, teal acting ahead. Differences inside the solver's tolerance are not findings.");
  },

  /* Chapter 14: the gate, live. */
  gate(host) {
    const G = DATA.diagrams.gate;
    const label = {solver_status: "Proven by the solver", service_level: "Service, %", margin_at_risk_pct: "Margin at risk, % of achievable", financial_yield: "Margin captured, %", spot_3pl_exposure: "Spot haulier share, %", methodology_disputes: "Forecast disputes"};
    const higher = {service_level: true, financial_yield: true};
    const rows = G.filter((g) => g.name !== "solver_status");
    const wrap = document.createElement("div");
    wrap.innerHTML = rows.map((g, i) => {
      const max = higher[g.name] ? 100 : Math.max(5, g.observed * 3, g.threshold * 2);
      return `<div class="slider"><label for="gate-${i}">${esc(label[g.name] || g.name)}</label><input id="gate-${i}" type="range" min="0" max="${max}" step="${max > 20 ? 0.5 : 0.1}" value="${g.threshold}"><output id="gate-${i}-o"></output></div>`;
    }).join("");
    host.appendChild(wrap);
    const out = document.createElement("div"); out.className = "stats"; host.appendChild(out);
    const cap = caption(host, "");
    const draw = () => {
      const res = rows.map((g, i) => {
        const t = +$(`gate-${i}`).value; $(`gate-${i}-o`).textContent = t;
        const pass = higher[g.name] ? g.observed >= t : g.observed <= t;
        return [g, t, pass];
      });
      const proven = G.find((g) => g.name === "solver_status");
      const held = res.filter((r) => !r[2]);
      out.innerHTML = res.map(([g, t, pass]) => `<div class="stat" style="${pass ? "" : "background: var(--bad-soft)"}"><b>${fmt(g.observed, g.observed % 1 ? 2 : 0)}</b><span>${esc(label[g.name] || g.name)} ${higher[g.name] ? "≥" : "≤"} ${t} ${pass ? "✓" : "✕"}</span></div>`).join("")
        + `<div class="stat" style="background: ${held.length ? "var(--event-soft)" : "var(--good-soft)"}"><b>${held.length ? "HOLD" : "RELEASE"}</b><span>${held.length ? `for a person: ${held.map((r) => (label[r[0].name] || r[0].name).split(",")[0].toLowerCase()).join(", ")}` : (proven && proven.passed ? "all checks pass, proven" : "")}</span></div>`;
      cap.textContent = "Observed values are Lindewaard's plan of record; the sliders are the thresholds, preset to the engine's defaults.";
    };
    rows.forEach((_, i) => $(`gate-${i}`).oninput = draw); draw();
  },

  /* Chapter 15: promise an order, on the published plan's data. */
  atp(host) {
    const A = DATA.diagrams.atp, keys = Object.keys(A.rows);
    const pick = keys.find((k) => k.startsWith("FG-1001|DC_") ) || keys[0];
    const wrap = document.createElement("div");
    wrap.innerHTML = `<div class="slider"><label for="atp-q">Order, cases</label><input id="atp-q" type="range" min="1000" max="120000" step="1000" value="60000"><output id="atp-qo"></output></div>
      <div class="slider"><label for="atp-d">Wanted by</label><input id="atp-d" type="range" min="0" max="${A.periods.length - 1}" step="1" value="2"><output id="atp-do"></output></div>`;
    host.appendChild(wrap);
    const n = narrowOf(host), W = n ? 360 : 760, H = 190, s = svg(W, H, "Available to promise by bucket"); host.appendChild(s);
    const out = document.createElement("div"); out.className = "detail"; host.appendChild(out);
    const row = A.rows[pick], k = Math.min(row.atp.length, n ? 14 : 25), max = Math.max(...row.atp.slice(0, k), 1);
    const draw = () => {
      const q = +$("atp-q").value, d = +$("atp-d").value;
      $("atp-qo").textContent = fmt(q); $("atp-do").textContent = A.periods[d];
      while (s.firstChild) s.removeChild(s.firstChild);
      const bw = (W - 20) / k;
      const where = `${A.products[pick.split("|")[0]]} at ${A.sites[pick.split("|")[1]]}`;
      if (n) {
        el("text", {x: 10, y: 14, "font-size": 12.5, "font-weight": 700}, s, where);
        el("text", {x: 10, y: 29, "font-size": 11.5, style: "fill: var(--muted)"}, s, "promisable by bucket, cases");
      } else {
        el("text", {x: 10, y: 14, "font-size": 12.5, "font-weight": 700}, s, `${where}: promisable by bucket, cases`);
      }
      for (let i = 0; i < k; i++) {
        const v = row.atp[i], h = (H - 60) * v / Math.max(max, q);
        el("rect", {x: 10 + i * bw + 1, y: H - 24 - h, width: bw - 3, height: h, rx: 2, fill: v >= q ? "var(--signal)" : "var(--base-line)", opacity: i < d ? 0.4 : 1}, s);
        if (i % (n ? 3 : 2) === 0) el("text", {x: 10 + i * bw + bw / 2, y: H - 8, "text-anchor": "middle", "font-size": 10.5, style: "fill: var(--muted)"}, s, A.periods[i]);
      }
      const qy = H - 24 - (H - 60) * q / Math.max(max, q);
      el("line", {x1: 10, x2: W - 10, y1: qy, y2: qy, stroke: "var(--event)", "stroke-width": 2, "stroke-dasharray": "5 4"}, s);
      el("text", {x: W - 12, y: qy - 5, "text-anchor": "end", "font-size": 11.5, "font-weight": 700, style: "fill: var(--event)"}, s, `order ${fmt(q)}`);
      const first = row.atp.findIndex((v, i) => i >= d && v >= q);
      const onTime = Math.min(q, row.atp[d] || 0);
      out.innerHTML = first === d ? `<b>Promised for ${A.periods[d]}</b>: all ${fmt(q)} cases.`
        : first > d ? `<b>${fmt(onTime)} by ${A.periods[d]}</b>, the full ${fmt(q)} by ${A.periods[first]} (day ${A.spans[first][0]}).`
        : `<b>${fmt(onTime)} by ${A.periods[d]}</b>; the full order cannot be promised inside the plan's horizon.`;
    };
    $("atp-q").oninput = draw; $("atp-d").oninput = draw; draw();
  },

  /* Chapter 16: how the headline numbers relate. */
  "kpi-tree"(host) {

      put(100, 240, 160, "Proven within", "plan vs bound");

      put(60, 150 + 6, 200, "Service", "served ÷ ordered, by value"); put(290, 156, 200, "Margin at risk", "unserved margin + penalty", "bad"); put(520, 156, 200, "Proven within", "plan vs solver's bound");
      edge(s, "M160,98 L330,64", "+", {at: [245, 81]}); edge(s, "M390,98 L390,64", "−", {at: [400, 81]});

  /* Chapter 17: each lever moved alone, as a sensitivity analysis (Alejandro,
     20 Oct). A tornado of profit, each lever moved both ways; then a table,
     largest effect first, of what each lever did to every P&L line or to five
     financial KPIs, in % or €, shaded by what it did to profit (green raised
     it, red lowered it, deeper is more money). */
  levers(host) {
    const D = DATA.diagrams.levers, n = narrowOf(host);
    let unit = "pct", view = "pnl";
    const eur = (v) => Math.abs(v) < 1000 ? (Math.abs(v) < 0.5 ? "0" : "<€1k") : (v > 0 ? "+" : "−") + money(Math.abs(v));
    const pct = (d, base) => {
      if (Math.abs(d) < 0.5 || !base) return "0";
      const x = 100 * d / Math.abs(base);
      return Math.abs(x) < 0.05 ? (x > 0 ? "+<0.1%" : "−<0.1%") : (x > 0 ? "+" : "−") + fmt(Math.abs(x), Math.abs(x) < 10 ? 1 : 0) + "%";
    };
    // Shading follows money, not percent: 10% of carbon is less than 1% of materials.
    const top = Math.max(1, ...D.rows.flatMap((r) => [r.within ? 0 : r.profit, ...D.lines.map((c) => r.effect[c.key])]).map(Math.abs));
    const shade = (v, flat) => {
      if (flat || Math.abs(v) < 1000) return "";
      const a = Math.round(10 + 45 * Math.sqrt(Math.min(1, Math.abs(v) / top)));
      return ` style="background: color-mix(in oklab, ${v > 0 ? "var(--good)" : "var(--bad)"} ${a}%, var(--surface))"`;
    };
    // Tornado order: the largest profit effect either way first, changes inside the tolerance last.
    const reach = (r) => Math.max(r.within ? 0 : Math.abs(r.profit), r.down && !r.down.within ? Math.abs(r.down.profit) : 0);
    const order = D.rows.map((r, i) => i).sort((a, b) => reach(D.rows[b]) - reach(D.rows[a]));

    /* The tornado: profit against the baseline, each lever moved up and down. */
    const W = n ? 360 : 820, rowH = n ? 46 : 30, L = n ? 10 : 250, R = n ? 10 : 70;
    const H = 34 + order.length * rowH, s = svg(W, H, "Profit against the baseline, each lever moved both ways");
    const vals = D.rows.flatMap((r) => [r.profit, r.down ? r.down.profit : 0]);
    const lim = Math.max(...vals.map(Math.abs)) * (n ? 1.05 : 1.3), X = (v) => L + (v + lim) / (2 * lim) * (W - L - R);
    el("line", {x1: X(0), x2: X(0), y1: 18, y2: H - 6, stroke: "var(--border)"}, s);
    el("text", {x: X(0), y: 12, "text-anchor": "middle", "font-size": 11, style: "fill: var(--muted)"}, s, `baseline ${money(D.base.profit)}`);
    const tol = X(D.tolerance) - X(0);
    el("rect", {x: X(0) - tol, y: 18, width: 2 * tol, height: H - 24, fill: "var(--surface-alt)"}, s);
    order.forEach((i, j) => {
      const r = D.rows[i], y = 24 + j * rowH;
      const name = el("text", {x: n ? 10 : L - 10, y: n ? y + 9 : y + 15, "text-anchor": n ? "start" : "end", "font-size": 12.5, "font-weight": 700}, s, r.name);
      const by = n ? y + 16 : y + 4, bh = n ? 22 : 20;
      [[r.profit, r.within, r.step], r.down ? [r.down.profit, r.down.within, r.down.step] : null].forEach((side) => {
        if (!side) return;
        const [v, within, step] = side;
        const fill = within ? "var(--base-line)" : v > 0 ? "var(--good)" : "var(--bad)";
        const x0 = Math.min(X(0), X(v)), w = Math.max(2, Math.abs(X(v) - X(0)));
        el("rect", {x: x0, y: by, width: w, height: bh, rx: 3, fill, opacity: within ? 0.45 : 0.85}, s)
          .appendChild(Object.assign(document.createElementNS("http://www.w3.org/2000/svg", "title"), {textContent: `${r.name}, ${step}: profit ${eur(v)}${within ? ", inside the tolerance" : ""}`}));
        // Short step ("+10%", "€85 → €170"), inside a long bar in white, else beside it.
        const short = step.split(",")[0].replace(/ a (tonne|year)/, "").replace(/ \(.*\)/, "");
        const label = `${short}  ${eur(v)}`, inside = w > label.length * 6.2 + 12;
        if (inside) el("text", {x: v >= 0 ? X(v) - 6 : X(v) + 6, y: by + bh / 2 + 4, "text-anchor": v >= 0 ? "end" : "start", "font-size": 10.5, "font-weight": 700, style: "fill: #fff"}, s, label);
        else if (!n || w > 2) el("text", {x: v >= 0 ? X(v) + 4 : X(v) - 4, y: by + bh / 2 + 4, "text-anchor": v >= 0 ? "start" : "end", "font-size": 10.5, style: "fill: var(--muted)"}, s, label);
      });
    });
    host.appendChild(s);
    caption(host, `Profit before overheads against the baseline when each lever is moved one way and the other, on its own; the grey band is the ±${money(D.tolerance)} the plans are solved to. Switches (the toll, the buffers) have one side.`);

    const bar = document.createElement("div"); bar.className = "seg";
    bar.innerHTML = `<span>Show</span><button type="button" data-v="pnl" aria-pressed="true">P&amp;L lines</button><button type="button" data-v="fin" aria-pressed="false">Financial KPIs</button><span style="margin-left:0.8rem">as</span><button type="button" data-u="pct" aria-pressed="true">% change</button><button type="button" data-u="eur" aria-pressed="false">€</button>`;
    host.appendChild(bar);
    const t = document.createElement("div"); t.className = "table-wrap"; host.appendChild(t);
    const cap = caption(host, "");
    const out = document.createElement("div"); out.className = "detail"; host.appendChild(out);
    const asm = document.createElement("div"); host.appendChild(asm);
    let on = order[0];

    const pnlCell = (r, c) => {
      const d = r.pnl[c.key] - D.base[c.key], e = r.effect[c.key];
      const tip = `${c.label}: ${eur(d)} (${pct(d, D.base[c.key])}) against the baseline`;
      return `<td class="num${c.key === r.line ? " own" : ""}"${shade(e)} title="${esc(tip)}">${unit === "pct" ? pct(d, D.base[c.key]) : eur(d)}</td>`;
    };
    const finCell = (r, c) => {
      const b = D.fin_base[c.key], d = r.fin[c.key] - b, e = c.higher ? d : -d;
      // A money result inside the solver's tolerance is not a finding; working capital is a balance.
      const flat = c.key !== "working_capital" && c.key !== "revenue" && Math.abs(d) <= D.tolerance;
      const extra = c.key === "gross_margin" ? `; margin ${fmt(D.fin_base.gross_margin_pct, 1)}% → ${fmt(r.fin.gross_margin_pct, 1)}%` : "";
      const tip = `${c.label}: ${eur(d)} (${pct(d, b)}) against the baseline${extra}${flat ? "; inside the tolerance" : ""}`;
      // A percent of a result near or below zero means nothing: economic profit is always in €.
      const asPct = unit === "pct" && b > 0 && c.key !== "economic_profit";
      return `<td class="num${flat ? " flat" : ""}"${shade(e, flat)} title="${esc(tip)}">${asPct ? pct(d, b) : eur(d)}</td>`;
    };
    const profitCell = (r) => {
      const tip = r.within ? `Profit ${eur(r.profit)}: inside the ±${money(D.tolerance)} the plans are solved to` : `Profit ${eur(r.profit)} (${pct(r.profit, D.base.profit)})`;
      const txt = r.within ? "within" : unit === "pct" ? pct(r.profit, D.base.profit) : eur(r.profit);
      return `<td class="num own${r.within ? " flat" : ""}"${shade(r.profit, r.within)} title="${esc(tip)}">${txt}</td>`;
    };
    const draw = () => {
      let head, cells;
      if (view === "pnl") {
        const cols = n ? [] : D.lines;
        head = `<th class="num">Profit</th>${cols.map((c) => `<th class="num">${esc(c.short)}</th>`).join("")}`;
        cells = (r) => profitCell(r) + cols.map((c) => pnlCell(r, c)).join("");
        cap.textContent = `Each lever moved alone on Lindewaard's year (baseline profit before overheads ${money(D.base.profit)}); largest effect first. Green raised profit, red lowered it, deeper is more money; a cost line falling shows green. "within": a profit change inside ±${money(D.tolerance)}, not a finding. Bold is the line the lever is priced in. Hover a cell for both numbers; tap a row for its whole P&L.`;
      } else {
        const cols = n ? D.fin_columns.filter((c) => c.key === "ebitda" || c.key === "economic_profit") : D.fin_columns;
        head = cols.map((c) => `<th class="num">${esc(c.short)}${c.key === "economic_profit" ? ", €" : ""}</th>`).join("");
        cells = (r) => cols.map((c) => finCell(r, c)).join("");
        cap.textContent = `The same plans read as a finance review would: baseline revenue ${money(D.fin_base.revenue)}, gross margin ${fmt(D.fin_base.gross_margin_pct, 1)}%, EBITDA ${money(D.fin_base.ebitda)}, working capital ${money(D.fin_base.working_capital)}, economic profit ${money(D.fin_base.economic_profit)} (ROCE ${fmt(D.fin_base.roce_pct, 1)}%). Green is better for the business: working capital falling shows green. Grey: inside the tolerance. The assumptions are below the table.`;
      }
      t.innerHTML = `<table class="levers grid"><thead><tr><th>Lever, moved alone</th>${head}</tr></thead><tbody>${
        order.map((i) => { const r = D.rows[i]; return `<tr data-i="${i}" class="${i === on ? "on" : ""}"><td>${esc(r.name)}<span class="step">${esc(r.step)}</span></td>${cells(r)}</tr>`; }).join("")}</tbody></table>`;
      t.querySelectorAll("tbody tr").forEach((tr) => tr.onclick = () => { on = +tr.dataset.i; draw(); show(on); });
      asm.innerHTML = view === "fin" ? `<div class="table-wrap"><table class="levers"><thead><tr><th>Assumption</th><th>Value</th><th>Source</th></tr></thead><tbody>${
        D.assumptions.map(([a, v, src]) => `<tr><td>${esc(a)}</td><td>${esc(v)}</td><td class="flat">${esc(src)}</td></tr>`).join("")}</tbody></table></div>` : "";
    };
    bar.querySelectorAll("button").forEach((b) => b.onclick = () => {
      if (b.dataset.v) view = b.dataset.v; else unit = b.dataset.u;
      bar.querySelectorAll(b.dataset.v ? "[data-v]" : "[data-u]").forEach((x) => x.setAttribute("aria-pressed", x === b));
      draw(); show(on);
    });
    const show = (i) => {
      const r = D.rows[i];
      const both = (a, b) => n ? "" : `<td class="num">${a}</td><td class="num">${b}</td>`;
      const line = (label, a, b, better) => { const d = b - a; return `<tr><td>${esc(label)}</td>${both(money(a), money(b))}<td class="num"${shade(better ? d : -d)}>${eur(d)}</td><td class="num">${pct(d, a)}</td></tr>`; };
      const heads = (first) => `<tr><th>${first}</th>${n ? "" : '<th class="num">Baseline</th><th class="num">Lever moved</th>'}<th class="num">Change</th><th class="num">%</th></tr>`;
      const profit = r.within ? `within ±${money(D.tolerance)}` : eur(r.profit);
      let body;
      if (view === "fin") {
        const F = r.fin, B = D.fin_base;

  /* The Benelux network on its map: today, the moves, the candidates, the customers, the verdict. */
  network(host) {
    const D = DATA.diagrams.design, n = narrowOf(host);
    const lon0 = n ? 3.9 : 3.3, lon1 = n ? 6.35 : 6.8, lat0 = n ? 50.85 : 50.95, lat1 = n ? 52.8 : 52.6;
    const cos = Math.cos(51.75 * Math.PI / 180), W = n ? 360 : 760;
    const k = W / ((lon1 - lon0) * cos), H = Math.round((lat1 - lat0) * k);
    const X = (lon) => (lon - lon0) * cos * k, Y = (lat) => (lat1 - lat) * k;
    const s = svg(W, H, "Lindewaard's network on the map of the Benelux");
    s.style.overflow = "hidden";
    const clip = `clip${++markerSeq}`;
    el("rect", {x: 0, y: 0, width: W, height: H}, el("clipPath", {id: clip}, el("defs", {}, s)));
    const land = el("g", {"clip-path": `url(#${clip})`}, s);
    el("rect", {x: 0, y: 0, width: W, height: H, rx: 14, fill: "var(--surface-alt)"}, land);
    D.map.rings.forEach((country) => country.rings.forEach((ring) => {
      el("path", {d: "M" + ring.map(([lo, la]) => `${X(lo).toFixed(1)},${Y(la).toFixed(1)}`).join("L") + "Z",
        fill: "var(--surface)", stroke: "var(--rule)", "stroke-width": 1}, land);
    }));
    const at = {}; D.sites.forEach((x) => { at[x.id] = [X(x.lon), Y(x.lat)]; });
    const short = (x) => x.type === "DC" ? x.name.replace(/ \(proposed\)/, "") : x.city + (x.type === "COPACKER" && !n ? " (co-pack)" : "");
    // Lanes, then customers' links, then the sites on top.
    const lanes = el("g", {}, s);
    D.lanes.forEach((l) => { if (at[l.from] && at[l.to]) {
      el("line", {x1: at[l.from][0], y1: at[l.from][1], x2: at[l.to][0], y2: at[l.to][1], class: "lane", stroke: "var(--base-line)", "stroke-width": 1.6, opacity: 0.7}, lanes); } });
    const serving = D.sites.filter((x) => x.type !== "COPACKER");
    const alts = el("g", {class: "fade hidden-el"}, s), links = el("g", {}, s);
    D.customers.forEach((c) => {
      const p = [X(c.lon), Y(c.lat)];
      serving.forEach((x) => { if (x.id !== c.served_from) el("line", {x1: p[0], y1: p[1], x2: at[x.id][0], y2: at[x.id][1], stroke: "var(--signal)", "stroke-width": 1, "stroke-dasharray": "2 4", opacity: 0.55}, alts); });
      const h = at[c.served_from];
      el("line", {x1: p[0], y1: p[1], x2: h[0], y2: h[1], stroke: "var(--signal)", "stroke-width": 2, "stroke-dasharray": "5 4"}, links);
    });
    const marks = el("g", {}, s), cands = el("g", {class: "fade hidden-el"}, s), closable = el("g", {class: "fade hidden-el"}, s);
    const fs = n ? 10.5 : 12.5;
    D.sites.forEach((x) => {

      const cand = x.status === "CANDIDATE", g = cand ? cands : marks;
      const color = x.type === "PLANT" ? "var(--signal)" : x.type === "COPACKER" ? "var(--event)" : "var(--ink)";
      el("circle", {cx: px, cy: py, r: n ? 5 : 6.5, fill: cand ? "var(--surface)" : color, stroke: color, "stroke-width": cand ? 2.4 : 2, "stroke-dasharray": cand ? "3 2" : null}, g);
      // Left of the mark where the right would run off the map or into a neighbour.
      const crowded = px + 9 + short(x).length * fs * 0.6 > W - 4 || D.sites.some((o) => o !== x && at[o.id][0] - px > 0
        && at[o.id][0] - px < (n ? 55 : 40) && Math.abs(at[o.id][1] - py) < 14);
      el("text", {x: crowded ? px - 9 : px + 9, y: py + 4, "text-anchor": crowded ? "end" : "start", "font-size": fs, "font-weight": 700}, g, short(x));
      if (!cand && x.type !== "COPACKER") el("circle", {cx: px, cy: py, r: n ? 9 : 11, fill: "none", stroke: "var(--bad)", "stroke-width": 1.8, "stroke-dasharray": "3 3"}, closable);
    });
    const crosses = el("g", {class: "fade hidden-el"}, s);
    D.sites.filter((x) => x.status === "CANDIDATE").forEach((x) => {
      const [px, py] = at[x.id];
      el("text", {x: px, y: py + 5, "text-anchor": "middle", "font-size": 15, "font-weight": 900, style: "fill: var(--bad)"}, crosses, "✕");
    });
    const cust = el("g", {}, s);
    D.customers.forEach((c) => {
      const [px, py] = [X(c.lon), Y(c.lat)];
      el("rect", {x: px - 4.5, y: py - 4.5, width: 9, height: 9, transform: `rotate(45 ${px} ${py})`, fill: "var(--signal-soft)", stroke: "var(--signal)", "stroke-width": 1.8}, cust);
      // Under the mark, or beside it where a site sits just below.
      const below = D.sites.some((o) => Math.abs(at[o.id][0] - px) < 45 && at[o.id][1] - py > -6 && at[o.id][1] - py < 24);
      if (!n) el("text", below ? {x: px - 9, y: py + 4, "text-anchor": "end", "font-size": 11.5, style: "fill: var(--muted)"}
                               : {x: px, y: py + 19, "text-anchor": "middle", "font-size": 11.5, style: "fill: var(--muted)"}, cust, c.place);
    });
    // One short line at the top saying what this step shows.
    const badge = el("g", {}, s), bw = W - 24;

    const say = el("text", {x: 24, y: n ? 28 : 34, "font-size": n ? 11.5 : 13.5, "font-weight": 700}, badge, "");
    const say2 = el("text", {x: 24, y: 44, "font-size": 11.5, style: "fill: var(--muted)"}, badge, "");
    host.appendChild(s);
    const legend = document.createElement("div"); legend.className = "cap";
    legend.innerHTML = `<b style="color:var(--signal)">●</b> plant &nbsp; <b>●</b> distribution centre &nbsp; <b style="color:var(--event)">●</b> co-packer &nbsp; <b style="color:var(--event)">◌</b> candidate &nbsp; <b style="color:var(--signal)">◆</b> customer${n ? " (" + D.customers.map((c) => c.place).join(", ") + ")" : ""}`;
    host.appendChild(legend);
    const G = D.modes.GREENFIELD, B = D.modes.BROWNFIELD;
    const lines = {
      today: ["Today: 3 plants, 2 co-packers, 2 DCs, 4 customers", `${money(B.annual_cost_today)} a year, everything included`],
      rebalance: ["Stock: every move that pays is already in the plan", "the rebalancing check finds nothing left to move"],
      candidates: ["Greenfield: may open Venlo or Moerdijk", "each must earn back its fixed cost and its capex"],
      customers: ["A customer may be served from any site in reach", "a closed DC's customers move; they are not lost"],
      brownfield: ["Brownfield: any own site may also close", "co-packers stay: leaving one is a contract decision"],
      verdict: ["Keep today's network: proven", `no change saves more than ${money(B.solver_noise_floor)} a year`],
    };
    return {set(state) {
      const [a, b] = lines[state] || lines.today;
      say.textContent = a; say2.textContent = n ? b : "";
      if (!n) say.textContent = `${a}: ${b}`;
      lanes.querySelectorAll("line").forEach((l) => { l.setAttribute("stroke", state === "rebalance" ? "var(--signal)" : "var(--base-line)"); l.setAttribute("stroke-width", state === "rebalance" ? 3 : 1.6); });
      cands.classList.toggle("hidden-el", !["candidates", "brownfield", "verdict"].includes(state));
      crosses.classList.toggle("hidden-el", state !== "verdict");
      cands.style.opacity = state === "verdict" ? 0.45 : 1;
      alts.classList.toggle("hidden-el", state !== "customers");
      closable.classList.toggle("hidden-el", state !== "brownfield");
    }};
  },

  /* One rate card prices every lane: distance in, cost, time and carbon out. */
  "lane-cost"(host) {
    const R = DATA.diagrams.rates, n = narrowOf(host);
    const wrap = document.createElement("div");
    wrap.innerHTML = `<div class="slider"><label for="lc-km">Straight line</label><input id="lc-km" type="range" min="20" max="320" step="5" value="90"><output id="lc-kmo"></output></div>`;
    host.appendChild(wrap);
    const W = n ? 360 : 760, H = 220, L = n ? 46 : 60, s = svg(W, H, "Cost per kilometre against distance"); host.appendChild(s);
    const out = document.createElement("div"); out.className = "detail"; host.appendChild(out);
    const maxKm = 320 * R.circuity, X = (km) => L + (km / maxKm) * (W - L - 14);
    const perKm = (km, reefer) => ((reefer ? R.reefer_fixed : R.fixed) + (reefer ? R.reefer_per_km : R.per_km) * km) / km;
    const top = perKm(20, true), Y = (v) => H - 30 - (v / top) * (H - 64);
    const draw = () => {
      const straight = +$("lc-km").value, road = straight * R.circuity;
      $("lc-kmo").textContent = `${straight} km`;
      while (s.firstChild) s.removeChild(s.firstChild);
      el("text", {x: 10, y: 16, "font-size": 13, "font-weight": 700}, s, "Cost per road kilometre, a full truck");
      [0, top / 2, top].forEach((v) => {
        el("line", {x1: L, x2: W - 14, y1: Y(v), y2: Y(v), stroke: "var(--rule)"}, s);
        el("text", {x: L - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 11, style: "fill: var(--muted)"}, s, `€${fmt(v, 1)}`);
      });
      [["ambient", false, "var(--signal)"], ["chilled", true, "var(--event)"]].forEach(([name, reefer, color]) => {
        const pts = []; for (let km = 20; km <= maxKm; km += 8) pts.push(`${X(km).toFixed(1)},${Y(perKm(km, reefer)).toFixed(1)}`);
        el("polyline", {points: pts.join(" "), fill: "none", stroke: color, "stroke-width": 2.5}, s);
        el("text", {x: W - 16, y: Y(perKm(maxKm, reefer)) + (reefer ? -8 : 16), "text-anchor": "end", "font-size": 11.5, "font-weight": 700, style: `fill: ${color}`}, s, name);
        el("circle", {cx: X(road), cy: Y(perKm(road, reefer)), r: 5, fill: color}, s);
      });
      el("line", {x1: X(road), x2: X(road), y1: 26, y2: H - 30, stroke: "var(--ink)", "stroke-dasharray": "3 3"}, s);
      el("text", {x: L, y: H - 10, "font-size": 11, style: "fill: var(--muted)"}, s, "0 km");
      el("text", {x: W - 14, y: H - 10, "text-anchor": "end", "font-size": 11, style: "fill: var(--muted)"}, s, `${fmt(maxKm)} km by road`);
      const amb = R.fixed + R.per_km * road, ree = R.reefer_fixed + R.reefer_per_km * road;
      const days = Math.ceil(road / (R.speed * R.hours) + R.handling), co2 = R.co2_km * road;
      out.innerHTML = `<b>${fmt(road)} km by road</b> (${straight} km × ${R.circuity}): <b>€${fmt(amb)}</b> a truck ambient, <b>€${fmt(ree)}</b> chilled; ${days} day${days > 1 ? "s" : ""} door to door; ${fmt(co2)} kg CO₂e on the owned fleet (€${fmt(co2 * R.carbon_price)} at the carbon price).`;
    };

    caption(host, "The fixed charge per trip is why long hauls cost less per kilometre. Every lane, candidate and customer delivery is priced off this one card.");
  },

      box("run", 6, 142, W - 12, 52, "▶ Run optimization", "the plan, then the S&OP gate's verdict");
      box("read", 6, 204, W - 12, 64, "What needs a decision", "exceptions, worst first; promise an order");
      box("reviews", 6, 278, W - 12, 84, "Reviews at three altitudes", "functional · pre-S&OP · executive");
      box("tools", 6, 372, W - 12, 52, "Tools", "master data · impact · design · costs");
      box("learn", 6, 434, W - 12, 30, "📚 Learn", "");
    } else {
      box("sandbox", 6, 6, 200, H - 12, "Sidebar", "the scenario sandbox");
      T.sidebar.forEach((g, i) => el("text", {x: 22, y: 78 + i * 46, "font-size": 12.5, style: "fill: var(--muted)"}, part.sandbox, `• ${g}`));
      box("pick", 220, 6, 534, 56, "Workspace and story", "Lindewaard (NL) or Ashford (US), then the disruption to look at");
      box("run", 220, 72, 260, 56, "▶ Run optimization", "the plan, then the gate's verdict");
      box("read", 494, 72, 260, 56, "What needs a decision", "exceptions worst first; promise an order");
      box("reviews", 220, 140, 534, 150, `Review: ${T.sections.length} sections`, "");
      T.sections.forEach((sec, i) => {
        const col = i % 2, row = Math.floor(i / 2);
        el("text", {x: 236 + col * 262, y: 196 + row * 18, "font-size": 12, style: "fill: var(--muted)"}, part.reviews, `${i + 1}. ${sec.name.replace("📚 ", "")}`);
      });
      box("tools", 220, 302, 534, 56, "Tools on the same screen", "edit master data, trace an impact, redesign the network, standard costs");
      box("learn", 220, 370, 534, 44, "📚 Learn", "short lessons beside the features they explain");
    }
    host.appendChild(s);
    return {set(state) {
      Object.entries(part).forEach(([k, g]) => g.classList.toggle("on", k === state));
    }};
  },

  /* Chapter 20: the review bar's sections, in the Control Tower's own words. */
  "tower-sections"(host) {
    const T = DATA.diagrams.tower;
    const t = document.createElement("div"); t.className = "table-wrap";
    t.innerHTML = `<table><thead><tr><th>Section</th><th>What it shows</th></tr></thead><tbody>${
      T.sections.map((r) => `<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.says)}</td></tr>`).join("")}</tbody></table>`;
    host.appendChild(t);
  },

  /* Chapter 25: which part of the system each common task uses. */
  "task-map"(host) {
    const n = narrowOf(host);
    const tasks = [
      ["Plan the year", [1, 1, 0, 0]], ["Test a disruption", [1, 1, 0, 1]], ["Promise an order", [1, 0, 0, 0]],
      ["Fix master data", [1, 1, 0, 0]], ["Onboard a company", [0, 0, 1, 0]], ["Redesign the network", [1, 1, 1, 0]],
      ["Ask an AI assistant", [0, 0, 0, 1]],
    ];
    const cols = ["Control Tower", "API", "Command line", "AI (MCP)"];
    const W = n ? 360 : 760, rowH = 34, L = n ? 132 : 230, H = 46 + tasks.length * rowH;
    const s = svg(W, H, "Which part of the system each task uses");
    const cw = (W - L - 6) / cols.length;
    cols.forEach((c, j) => el("text", {x: L + j * cw + cw / 2, y: 22, "text-anchor": "middle", "font-size": n ? 10 : 12.5, "font-weight": 700}, s, n ? c.replace("Control Tower", "Tower").replace("Command line", "CLI") : c));
    tasks.forEach(([name, uses], i) => {
      const y = 40 + i * rowH;
      el("rect", {x: 0, y, width: W, height: rowH - 4, rx: 8, fill: i % 2 ? "var(--surface)" : "var(--surface-alt)"}, s);
      el("text", {x: 10, y: y + 20, "font-size": n ? 11.5 : 13.5, "font-weight": 600}, s, name);
      uses.forEach((u, j) => { if (u) el("circle", {cx: L + j * cw + cw / 2, cy: y + 15, r: 7, fill: "var(--signal)"}, s); });
    });
    host.appendChild(s);
    caption(host, "Each task below is written as the steps in the Control Tower, then the same thing through the API where there is one.");
  },

  /* Chapter 26: every endpoint, from the planning service itself. */
  api(host) {
    const A = DATA.diagrams.api, n = narrowOf(host);
    const groups = [...new Set(A.map((r) => r.group))];
    const wrap = document.createElement("div"); wrap.className = "api-list";
    const tone = {GET: "var(--signal)", POST: "var(--event)", PATCH: "var(--event)", DELETE: "var(--bad)"};
    wrap.innerHTML = groups.map((g) => `<div class="api-group"><div class="api-head">${esc(g)}</div>${
      A.filter((r) => r.group === g).map((r, i) => `<button class="api-row" data-i="${A.indexOf(r)}"><b style="color:${tone[r.method] || "var(--ink)"}">${r.method}</b> <code>${esc(r.path)}</code></button>`).join("")}</div>`).join("");
    host.appendChild(wrap);
    const out = document.createElement("div"); out.className = "detail"; out.setAttribute("aria-live", "polite"); host.appendChild(out);
    const example = {
      "/api/v1/optimize": '{"scenario_id": "Q1-PLAN", "workspace": "demo-benelux", "profile": "TACTICAL"}',
      "/api/v1/impact": '{"scenario_id": "WHAT-IF", "workspace": "demo-benelux", "events": [{"event_id": "E1", "kind": "SUPPLIER", "targets": ["V-FLAVOUR-01"], "periods": ["W01", "W02"]}]}',
      "/api/v1/design": '{"scenario_id": "DESIGN", "mode": "BROWNFIELD"}',
      "/api/v1/design/robust": '{"scenario_id": "ROBUST", "mode": "GREENFIELD"}',
    };
    const pick = (i) => {
      const r = A[i];
      wrap.querySelectorAll(".api-row").forEach((b) => b.classList.toggle("on", +b.dataset.i === i));
      const body = example[r.path];
      const call = `curl -X ${r.method} $ZK/${r.path.replace(/^\//, "")}` + (body ? ` \\\n  -H "Content-Type: application/json" -d '${body}'` : "");
      out.innerHTML = `<b>${r.method} ${esc(r.path)}</b><br>${esc(r.says || "")}<button type="button" class="api-copy">Copy</button><pre class="api-call">${esc(call)}</pre>`;
      const copy = out.querySelector(".api-copy");
      copy.onclick = () => (navigator.clipboard ? navigator.clipboard.writeText(call) : Promise.reject())
        .then(() => { copy.textContent = "Copied"; }, () => { copy.textContent = "Select and copy"; })
        .finally(() => setTimeout(() => { copy.textContent = "Copy"; }, 1600));
    };
    wrap.querySelectorAll(".api-row").forEach((b) => b.onclick = () => pick(+b.dataset.i));
    pick(A.findIndex((r) => r.path === "/api/v1/optimize"));
    caption(host, "Read from the running service's own routes. $ZK is the service's address; the interactive docs are at /docs.");
  },

  /* Chapter 26: the read-only MCP tools, from the server module itself. */
  mcp(host) {
    const M = DATA.diagrams.mcp;
    const t = document.createElement("div"); t.className = "table-wrap";
    t.innerHTML = `<table><thead><tr><th>Tool</th><th>What it answers</th></tr></thead><tbody>${
      M.map((r) => `<tr><td><code>${esc(r.name)}(${esc(r.args)})</code></td><td>${esc(r.says)}</td></tr>`).join("")}</tbody></table>`;
    host.appendChild(t);
  },

  /* Chapter 27: where each part runs, from a commit to the page. */
  deploy(host) {
    const n = narrowOf(host), W = n ? 360 : 760, H = n ? 470 : 300;
    const s = svg(W, H, "Where each part of Zynta-Koda runs");
    // [x, y, w] per part; one height.
    const at = n ? {
      code: [96, 6, 168], ci: [96, 92, 168], render: [4, 190, 172], streamlit: [184, 190, 172],
      pages: [184, 286, 172], db: [4, 286, 172], local: [96, 392, 168],
    } : {
      code: [4, 118, 164], ci: [200, 118, 150], render: [376, 26, 194], streamlit: [376, 118, 194],
      pages: [376, 210, 194], db: [588, 26, 168], local: [588, 210, 168],
    };
    const h = 64;
    const info = {
      code: ["Code", "one private repository", "code"], ci: ["CI", "tests on every push", "check"],
      render: ["Planning service", "Render, Frankfurt", "chip"], streamlit: ["Control Tower", "Streamlit Cloud", "screen"],
      pages: ["Showcase, manual", "GitHub Pages", "book"], db: ["Committed plans", "Postgres, optional", "data"],
      local: ["Real data", "its own machine only", "lock"],
    };
    const nodes = {};
    Object.entries(at).forEach(([k, [x, y, w]]) => { nodes[k] = node(s, x, y, w, h, info[k][0], {icon: info[k][2], sub: info[k][1], size: 13, subSize: 11.5}); });
    const side = (k, where) => { const [x, y, w] = at[k]; return {r: [x + w, y + h / 2], l: [x, y + h / 2], b: [x + w / 2, y + h], t: [x + w / 2, y]}[where]; };
    const line = (p, q, label, lab, dashed) => edge(s, `M${p[0]},${p[1]} L${q[0]},${q[1]}`, label, {at: lab || [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2 - 8], dashed});
    const E = n ? {
      push: line(side("code", "b"), side("ci", "t"), "push"),
      api: line(side("ci", "b"), side("render", "t"), "redeploy", [70, 172]),
      ui: line(side("ci", "b"), side("streamlit", "t"), ""),
      calls: line(side("streamlit", "l"), side("render", "r"), ""),
      keep: line(side("render", "b"), side("db", "t"), "commits", [90, 276]),
    } : {
      push: line(side("code", "r"), side("ci", "l"), "push"),
      api: line(side("ci", "r"), side("render", "l"), "redeploy", [336, 66]),
      ui: line(side("ci", "r"), side("streamlit", "l"), ""),
      calls: line(side("streamlit", "t"), side("render", "b"), "calls", [510, 108]),
      site: line(side("ci", "r"), side("pages", "l"), "published", [336, 232], true),
      keep: line(side("render", "r"), side("db", "l"), "", null),
    };
    host.appendChild(s);
    const lit = {
      code: [["code"], ["push"]], test: [["ci"], ["push"]], serve: [["render", "streamlit"], ["api", "ui", "calls"]],
      show: [["pages"], ["site"]], keep: [["db"], ["keep"]], private: [["local"], []],
    };
    return {set(state) {
      const [ns, es] = lit[state] || lit.code;
      Object.entries(nodes).forEach(([k, g]) => g.classList.toggle("on", ns.includes(k)));
      Object.entries(E).forEach(([k, g]) => g.classList.toggle("on", es.includes(k)));
    }};
  },

  /* ---------- Part IV ---------- */

  /* Chapter 28: what stays on the machine, what may leave, and what never writes. */
  boundary(host) {
    const n = narrowOf(host), W = n ? 360 : 760, H = n ? 476 : 290;
    const s = svg(W, H, "What stays on the machine and what may leave it");
    const A = n ? [4, 4, W - 8, 214] : [4, 4, 372, H - 8], B = n ? [4, 230, W - 8, 242] : [392, 4, W - 396, H - 8];
    el("rect", {x: A[0], y: A[1], width: A[2], height: A[3], rx: 14, fill: "var(--good-soft)", stroke: "var(--good)"}, s);
    el("rect", {x: B[0], y: B[1], width: B[2], height: B[3], rx: 14, fill: "var(--surface-alt)", stroke: "var(--rule)"}, s);
    el("text", {x: A[0] + 14, y: A[1] + 22, "font-size": 13, "font-weight": 800, style: "fill: var(--good)"}, s, "The owner's machine, encrypted");
    el("text", {x: B[0] + 14, y: B[1] + 22, "font-size": 13, "font-weight": 800}, s, "Outside: demo companies only");
    const w = n ? 160 : 160, h = 58, o = {size: 13, subSize: 11.5};
    const P = n ? {ws: [14, 40], eng: [186, 40], ex: [186, 140], git: [14, 262], demo: [14, 330], site: [14, 398], ai: [186, 330]}
                : {ws: [16, 44], eng: [204, 44], ex: [204, 190], git: [404, 44], demo: [584, 44], site: [404, 120], ai: [584, 190]};
    node(s, P.ws[0], P.ws[1], w, h, "Workspace", Object.assign({icon: "lock", sub: "private tables"}, o));
    node(s, P.eng[0], P.eng[1], w, h, "Engine", Object.assign({icon: "chip", sub: "private mode"}, o));
    node(s, P.ex[0], P.ex[1], w, h, "Explainer", Object.assign({icon: "spark", sub: "answers only"}, o));
    node(s, P.git[0], P.git[1], w, h, "GitHub, CI", Object.assign({icon: "code", sub: "demo data"}, o));
    node(s, P.demo[0], P.demo[1], w, h, "Hosted demo", Object.assign({icon: "screen", sub: "demo data"}, o));
    node(s, P.site[0], P.site[1], w, h, "Showcase", Object.assign({icon: "book", sub: "demo data"}, o));
    node(s, P.ai[0], P.ai[1], n ? 160 : 166, h, "AI model", Object.assign({icon: "chat", sub: "outside, if allowed"}, o));
    edge(s, `M${P.ws[0] + w},${P.ws[1] + h / 2} L${P.eng[0]},${P.eng[1] + h / 2}`, "", {}).classList.add("on");
    const optin = n ? `M${P.ex[0] + w / 2},${P.ex[1] + h} L${P.ai[0] + 80},${P.ai[1]}` : `M${P.ex[0] + w},${P.ex[1] + h / 2} L${P.ai[0]},${P.ai[1] + h / 2}`;
    edge(s, optin, "recorded opt-in only", {at: n ? [P.ex[0] + 80, P.ex[1] + h + 18] : [(P.ex[0] + w + P.ai[0]) / 2, P.ex[1] + h / 2 - 12], dashed: true}).classList.add("on");
    // The explainer and the tables: no line, by design.
    const nx = n ? P.ws[0] + 80 : P.ws[0] + 80, ny = n ? P.ex[1] + 28 : P.ex[1] + 30;
    el("text", {x: nx, y: ny, "text-anchor": "middle", "font-size": 12, "font-weight": 800, style: "fill: var(--bad)"}, s, "✕ never writes");
    el("text", {x: nx, y: ny + 16, "text-anchor": "middle", "font-size": 11, style: "fill: var(--bad)"}, s, "to the tables");
    host.appendChild(s);
    caption(host, "Real data lives in private workspaces git ignores and builds exclude; the public demo refuses to open one. The explainer is the only feature that calls an outside model.");
  },

  /* Chapter 29: the test suite, by how long a test may take. */
  tests(host) {
    const T = DATA.diagrams.tests, n = narrowOf(host), W = n ? 360 : 760, H = 120;
    const s = svg(W, H, "The test suite, fast and slow");
    const total = T.fast + T.slow, bw = W - 20, fw = bw * T.fast / total;
    el("text", {x: 10, y: 18, "font-size": 13, "font-weight": 700}, s, `${total} tests in one suite`);
    el("rect", {x: 10, y: 32, width: fw, height: 34, rx: 8, fill: "var(--signal)"}, s);
    el("rect", {x: 10 + fw + 2, y: 32, width: bw - fw - 2, height: 34, rx: 8, fill: "var(--event)"}, s);
    el("text", {x: 22, y: 54, "font-size": 13, "font-weight": 800, style: "fill: var(--signal-ink)"}, s, `${T.fast} fast`);
    el("text", {x: W - 18, y: 54, "text-anchor": "end", "font-size": 13, "font-weight": 800, style: "fill: var(--signal-ink)"}, s, `${T.slow} slow`);
    el("text", {x: 10, y: 88, "font-size": 12, style: "fill: var(--muted)"}, s, n ? "fast: every change, minutes" : "fast: run on every change, a few minutes in all");
    el("text", {x: W - 10, y: 108, "text-anchor": "end", "font-size": 12, style: "fill: var(--muted)"}, s, n ? "slow: real solves, every push" : "slow: real solves of real models, on every push to the repository");
    host.appendChild(s);
  },

  /* Chapter 30: the roadmap the public page shows, from the same source. */
  roadmap(host) {
    const R = DATA.diagrams.roadmap;
    const wrap = document.createElement("div"); wrap.className = "road";
    wrap.innerHTML = R.items.map((r) => `<div class="road-card"><span class="road-st">${esc(r.status)}</span><b>${esc(r.head)}</b><p>${esc(r.body)}</p></div>`).join("");
    host.appendChild(wrap);
  },

  /* Chapter 30: where planning stops, measured, beside the solver used. */
  limits(host) {
    const R = DATA.diagrams.roadmap, n = narrowOf(host);
    const t = document.createElement("div"); t.className = "table-wrap";
    t.innerHTML = `<table><thead><tr><th>Plan</th><th>CBC 2.10.3</th><th>CBC development build</th></tr></thead><tbody>${
      R.solvers.map((r) => `<tr><td>${esc(r.plan)}</td><td${r.used === "old" ? ' class="used"' : ""}>${esc(r.old)}</td><td${r.used === "new" ? ' class="used"' : ""}>${esc(r.new)}</td></tr>`).join("")}</tbody></table>`;
    host.appendChild(t);
    caption(host, "Engine-flow seconds on 2 CPUs; the highlighted solver is the one the engine uses for that plan. The budget for an answer is 180 s.");
  },
};

function drawDiagrams(root) {
  root.querySelectorAll(".diagram").forEach((host) => {
    if (host.closest("[hidden]")) return;
    const narrow = String(narrowOf(host));
    if (host.dataset.drawn === narrow) return;
    const f = DIAGRAMS[host.dataset.diagram];
    if (!f) { host.textContent = `Missing diagram: ${host.dataset.diagram}`; return; }
    host.innerHTML = ""; host.dataset.drawn = narrow;
    host._fig = f(host) || null;
    if (host._state && host._fig && host._fig.set) host._fig.set(host._state);
  });
}
let resizing;
window.addEventListener("resize", () => { clearTimeout(resizing); resizing = setTimeout(() => drawDiagrams($("main")), 150); });
route();
</script>
