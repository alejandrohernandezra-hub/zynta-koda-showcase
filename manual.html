o-packer c with parent plant p may ship on no lane except c → p : s ℓ m t = 0 for every lane  ℓ  out of  c  with destination ≠ p rule where trucks, pallets, payload, groupage, fleet pool engine/optimizer.py ( truckload_ , payload_ , groupage_cap_ , fleet_pool_ constraints) lane cost from distance and rate card engine/geography.py tolls and emission factors, dated engine/roadcost.py , docs/road-cost.md co-packer rules engine/optimizer.py ( boomerang_ constraints), engine/costing.py shelf life and write-off engine/optimizer.py ( shelflife_ , aged_ constraints) "},{"part":"Planning","number":"11","slug":"network-optimisation","title":"Network optimisation","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Above the year's plan sit two slower questions: is the stock in the right place, and are the sites? Here is Lindewaard's network, asked both.<\/p>\n<div class=\"story\"><div class=\"stage\"><div class=\"diagram\" data-diagram=\"network\" data-story=\"1\"><\/div><\/div><div class=\"steps\"><div class=\"step\" data-state=\"today\"><p><strong>Lindewaard today.<\/strong> Three plants, two co-packers, two distribution centres and 12 customers' delivery points. The whole network costs €36.55M a year, everything included.<\/p><\/div><div class=\"step\" data-state=\"rebalance\"><p><strong>Is the stock in the right place?<\/strong> The plan already moves stock wherever a move pays. The rebalancing check reads the plan for stock it holds and never uses: on the published plan it finds 0 moves worth making.<\/p><\/div><div class=\"step\" data-state=\"candidates\"><p><strong>Could a new site pay?<\/strong> Two are on the table: DC Venlo (€1.20M a year to run, €8.00M to build) and Moerdijk Bottling (€3.20M, €26.00M). A greenfield design may open either.<\/p><\/div><div class=\"step\" data-state=\"customers\"><p><strong>Customers move with the network.<\/strong> Each may be served from any site in reach. Closing a distribution centre moves its customers; it does not lose them.<\/p><\/div><div class=\"step\" data-state=\"brownfield\"><p><strong>Could a site close?<\/strong> A brownfield design may also close any of Lindewaard's own sites, paying the closing cost (DC Tilburg's: €2.00M). Co-packers are never on the list.<\/p><\/div><div class=\"step\" data-state=\"verdict\"><p><strong>The answer: close DC Tilburg.<\/strong> €1,789,203 a year cheaper than today, for €2,000,000 once, paid back in 13 months; service from 99.00% to 99.32%. Without closing anything, moving 2 customers' deliveries saves €789,647 a year, and no new site pays for itself. So the closure is judged on what closing adds: against that network, €999,556 a year for €2,000,000, back in 2.0 years. DC Tilburg's fixed cost goes; without its pallets the plants co-pack 8,227 more units and 17,957 more units go short. Proven within the gap asked.<\/p><\/div><\/div><\/div>\n<p>Until 21 October the answer here was \"keep today's network\". It was the search, not the network: choosing every site at once, the brownfield design stopped 14.6% from its bound and could not tell a saving of three million euro a year from none. Priced one closure at a time, each closure is a question the solver answers quickly and proves, and closing DC Tilburg stood out. Before that, until 18 October, \"keep\" was partly built in: a closed DC lost its customers and a new one could take none.<\/p>"},{"name":"How it works","html":"<h3>Rebalancing: move it, or keep paying to hold it<\/h3>\n<p>Stock costs warehousing and the capital tied up in it; moving it costs freight and carbon. The rebalancing check prices that trade for every block of stock the plan holds and never uses:<\/p>\n<ul>\n<li><strong>Spare<\/strong> is what a site holds in <em>every<\/em> later bucket, above the buffer it is held to and any stock the year's plan needs at the end. A build-up that ships out next week is not spare.<\/li>\n<li><strong>Wanted<\/strong> is a shortage elsewhere that the stock can still reach and sell: arriving before the bucket ends, and young enough for that site's customers.<\/li>\n<li><strong>One block, one move.<\/strong> The same idle units sit in every bucket; they are moved once.<\/li>\n<\/ul>\n<div class=\"diagram\" data-diagram=\"spare\"><\/div>\n<p>The first version of this check read the plant's stock less the plant's own demand, which is nothing, and called the whole build-up spare: 47,733 kg of Bitterbal Bites at Oss Foods in D05, \"worth moving\", although the plan ships it out by D07. Read properly, a plan solved to its gap has nothing to move: every move that paid is already in it. The check earns its place on a plan that was edited by hand, committed, or not proven.<\/p>\n<h3>Network design: greenfield and brownfield<\/h3>\n<p>A design solves the network twice. First as it is, then with the sites themselves as decisions, and compares:<\/p>\n<ul>\n<li><strong>Greenfield<\/strong> may open candidate sites. A candidate plant copies the lines of a named site; every candidate gets lanes to every site within reach, priced off the same rate card as the rest.<\/li>\n<li><strong>Brownfield<\/strong> may also close any own site. Co-packers stay: leaving a toll manufacturer is a contract decision, not a network one. A closed site's stock is written off at standard cost.<\/li>\n<li><strong>Settled by parts, each proven.<\/strong> Greenfield designs each combination of the candidates with them pinned (none, Venlo, Moerdijk, both). Brownfield adds each own site closed on its own. The cheapest is kept, every network priced is listed with its cost, and two closures that pay only together are not tried (a search of every combination is hours of solving, on the roadmap as a background job).<\/li>\n<li><strong>Ranked as the solver ranks networks.<\/strong> A year's running cost plus the one-off investment, opening capex and closing cost alike, spread over the amortisation years: ranked on the running cost alone, a new site would win whenever it ran cheaper, however much it cost to build.<\/li>\n<li><strong>Capital and running costs on one scale.<\/strong> The plan's horizon is scaled to a year, capex is written down over ten years, a closing cost over the same.<\/li>\n<li><strong>The second solve starts from the first.<\/strong> Today's network, every site open and every candidate shut, is handed over as the starting plan. Without that, the brownfield design found no plan at all in five minutes.<\/li>\n<li><strong>A difference smaller than the solver's tolerance is no difference.<\/strong> Both solves may stop within 1% of the best; a saving below €365,517 a year is reported as none.<\/li>\n<\/ul>\n<p>Lindewaard's answers: greenfield €789,647 a year from today's network in 2187 s, opening nothing, 2 customers' deliveries moved; brownfield €1,789,203 in 3022 s, closing DC Tilburg, 5 customers' deliveries moved.<\/p>\n<h3>Customers move with the network<\/h3>\n<p>Demand is booked at the site that serves it today, so service levels and every report read as before. What a design decides is where the stock comes from:<\/p>\n<ul>\n<li><strong>One site per customer<\/strong>, an open one, within delivery reach; plants may deliver direct.<\/li>\n<li><strong>Priced on the difference.<\/strong> A delivery costs a full truck on the rate card per unit it holds; a move pays the difference from today's delivery, so today's network costs exactly what it did. On Lindewaard the plan itself prices every delivery (chapter 10), so the difference lands on top of a delivery already paid for.<\/li>\n<li><strong>Contracts travel.<\/strong> A customer served from a new site takes its shelf-life terms with it.<\/li>\n<li><strong>A customer needs a place.<\/strong> Only customers with a delivery location can move; the rest stay with their DC. Lindewaard's twelve customers (supermarket chains, discounters, wholesalers and foodservice) are fictional, placed in the region their DCs serve today, never to make a candidate site win.<\/li>\n<li><strong>A customer served from two sites moves one range at a time.<\/strong> Two of Lindewaard's customers take their chilled range from Rotterdam and their dry range from Tilburg. Each range is a delivery of its own, and the design may move either without the other: closing Tilburg moves Noordster's dry range to Rotterdam, where its chilled range already comes from. Until 21 October such a customer was kept whole, and closing Tilburg stranded its dry range: €30.8M a year dearer instead of cheaper. Which ranges a site should handle at all is a design of its own, not done here.<\/li>\n<\/ul>\n<h3>One rate card prices every lane<\/h3>\n<p>Every lane, candidate lane and customer delivery is priced from the distance on the map, not typed in: the straight line times 1.27 for the road, then a fixed charge per trip and a rate per kilometre. <strong>Move the slider.<\/strong><\/p>\n<div class=\"diagram\" data-diagram=\"lane-cost\"><\/div>\n<h3>What one closure costs<\/h3>\n<p>A design can also be told: \"close DC Rotterdam, and price it\". The site is shut whatever it costs, its customers may move, and nothing new opens. Today's plan ships through Rotterdam, so it cannot be the starting point; the engine first plans the closed network with each of its customers at the nearest open site, then lets the design choose freely from there.<\/p>\n<ul>\n<li><strong>The price:<\/strong> €70.76M a year more than today (€107.31M), proven within 0.4% in 97 s.<\/li>\n<li><strong>Where it comes from:<\/strong> running the network gets cheaper by €6.19M over the planning horizon, but the units that go short rise from 191,287 to 15,714,988, and the cost of not serving them by €78.85M. Service falls from 99.0% to 60.2%; 9 customers' deliveries come from another site.<\/li>\n<li><strong>Why so much goes short:<\/strong> Oss and Helmond, the only plants making the two chilled products, have no lane except the one to Rotterdam, and each delivery comes from one site. Closed, a customer served from Oss cannot get Helmond's Saté Skewers, and one served from Helmond cannot get Oss's Bitterbal Bites; chilled trucks fall from 378 to 0. Tested on 20 October, before the twelve customers, by adding a lane between Oss and Helmond: the same closure then left almost no chilled stock short. Closing Rotterdam is really a question about that lane.<\/li>\n<\/ul>\n<p>A design that runs out of time says so: \"Not proven\", with the gap it reached.<\/p>\n<p><strong>The same closure with new sites also free to open.<\/strong> Left to choose DC Venlo and Moerdijk Bottling itself, the design kept its starting plan for 300 s and stopped 55% from the best possible. So it now designs each combination of the candidates with them pinned (none, Venlo, Moerdijk, both; up to three candidates) and keeps the cheapest. Each starts from a plan of the closed network; where that finds no plan in its time (both open did not), from the cheapest smaller combination's plan, whose extra site simply ships nothing. A combination stopped by the clock is ruled out when even its best possible cost is dearer than the cheapest found. Measured on Lindewaard on 21 Oct, 300 s per solve, with its twelve customers and their deliveries priced: if Rotterdam must close, opening Venlo is the cheapest way to do it, at €36.7M a year against €36.5M today before its €8M to build and Rotterdam's €2.6M to leave, in 37 minutes, within 5.7% of the best network possible. So it does not pay: closing DC Tilburg does (above). Not measured again since the distribution centres were right-sized and customers kept to them (22 Oct). Measured the same morning on the four customers of before, the same question found Venlo €1.6M a year cheaper than today; priced deliveries to twelve customers took that away. It is asked through the design service (<code>force_close<\/code> with <code>candidate_site_ids<\/code>), not on the Control Tower page.<\/p>\n<h3>What it does not do yet<\/h3>\n<ul>\n<li><strong>Re-plan buffers at a new site.<\/strong> A moved customer's demand stays booked, and buffered, where it was.<\/li>\n<li><strong>See a seasonal year in a short horizon.<\/strong> Scaling a horizon to a year assumes it is representative.<\/li>\n<\/ul>\n<p>Where stock should sit in the chain, buffer by buffer, is chapter 12's question. What each product and customer costs to serve is read off the plan by the engine's cost-to-serve report, with its allocation rules stated beside the numbers.<\/p>"},{"name":"The maths","html":"<p><strong>Sites.<\/strong> Each site <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><\/mrow><\/math> that may change has a switch <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>o<\/mi><mi>s<\/mi><\/msub><mo>&#x02208;<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math>. With <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>F<\/mi><mi>s<\/mi><\/msub><\/mrow><\/math> its annual fixed cost, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>K<\/mi><mi>s<\/mi><\/msub><\/mrow><\/math> its opening capex, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>C<\/mi><mi>s<\/mi><\/msub><\/mrow><\/math> its closing cost and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>L<\/mi><\/mrow><\/math> the write-down period in years, a design adds to the plan's cost<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mo>&#x02211;<\/mo><mrow><mi>s<\/mi><mo>&#x02208;<\/mo><mtext>candidates<\/mtext><\/mrow><\/msub><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msub><mi>F<\/mi><mi>s<\/mi><\/msub><mo>&#x0002B;<\/mo><mfrac><mrow><msub><mi>K<\/mi><mi>s<\/mi><\/msub><\/mrow><mrow><mi>L<\/mi><\/mrow><\/mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><msub><mi>o<\/mi><mi>s<\/mi><\/msub><mspace width=\"0.278em\" /><mo>&#x0002B;<\/mo><mspace width=\"0.278em\" /><msub><mo>&#x02211;<\/mo><mrow><mi>s<\/mi><mo>&#x02208;<\/mo><mtext>closable<\/mtext><\/mrow><\/msub><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msub><mi>F<\/mi><mi>s<\/mi><\/msub><mspace width=\"0.167em\" /><msub><mi>o<\/mi><mi>s<\/mi><\/msub><mo>&#x0002B;<\/mo><mfrac><mrow><msub><mi>C<\/mi><mi>s<\/mi><\/msub><\/mrow><mrow><mi>L<\/mi><\/mrow><\/mfrac><mspace width=\"0.167em\" /><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><msub><mi>o<\/mi><mi>s<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math><\/div>\n<p>and the plan's operating cost is scaled by <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>365<\/mn><mo>&#x0002F;<\/mo><mi>H<\/mi><\/mrow><\/math> for a horizon of <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>H<\/mi><\/mrow><\/math> days. A closed site makes, holds, ships and serves nothing:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>x<\/mi><mrow><mi>m<\/mi><mi>s<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0002C;<\/mo><mspace width=\"0.278em\" /><msub><mi>I<\/mi><mrow><mi>m<\/mi><mi>s<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0002C;<\/mo><mspace width=\"0.278em\" /><msub><mi>s<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0002C;<\/mo><mspace width=\"0.278em\" /><msubsup><mi>d<\/mi><mrow><mi>m<\/mi><mi>s<\/mi><mi>t<\/mi><\/mrow><mrow><mtext>own<\/mtext><\/mrow><\/msubsup><mspace width=\"0.278em\" /><mo>&#x02264;<\/mo><mspace width=\"0.278em\" /><mi>M<\/mi><mspace width=\"0.167em\" /><msub><mi>o<\/mi><mi>s<\/mi><\/msub><mspace width=\"1em\" /><mtext>for&#x000A0;every&#x000A0;lane&#x000A0;<\/mtext><mi>&#x02113;<\/mi><mtext>&#x000A0;touching&#x000A0;<\/mtext><mi>s<\/mi><\/mrow><\/math><\/div>\n<p><strong>Customers.<\/strong> Customer <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>c<\/mi><\/mrow><\/math>, served today from <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>h<\/mi><mi>c<\/mi><\/msub><\/mrow><\/math>, may be served from any site <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><\/mrow><\/math> in reach, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>c<\/mi><\/msub><\/mrow><\/math>. With <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>a<\/mi><mrow><mi>c<\/mi><mi>s<\/mi><\/mrow><\/msub><mo>&#x02208;<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> the assignment and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>y<\/mi><mrow><mi>m<\/mi><mi>c<\/mi><mi>s<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math> the units delivered from <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><\/mrow><\/math>:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mo>&#x02211;<\/mo><mrow><mi>s<\/mi><mo>&#x02208;<\/mo><msub><mi>S<\/mi><mi>c<\/mi><\/msub><\/mrow><\/msub><msub><mi>a<\/mi><mrow><mi>c<\/mi><mi>s<\/mi><\/mrow><\/msub><mo>&#x0003D;<\/mo><mn>1<\/mn><mspace width=\"2em\" /><msub><mi>a<\/mi><mrow><mi>c<\/mi><mi>s<\/mi><\/mrow><\/msub><mo>&#x02264;<\/mo><msub><mi>o<\/mi><mi>s<\/mi><\/msub><mspace width=\"2em\" /><msub><mi>y<\/mi><mrow><mi>m<\/mi><mi>c<\/mi><mi>s<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x02264;<\/mo><msub><mi>D<\/mi><mrow><mi>m<\/mi><mi>c<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"0.167em\" /><msub><mi>a<\/mi><mrow><mi>c<\/mi><mi>s<\/mi><\/mrow><\/msub><\/mrow><\/math><\/div>\n<p>The delivery leaves <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><\/mrow><\/math>'s stock, its demand stays booked at <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>h<\/mi><mi>c<\/mi><\/msub><\/mrow><\/math>, and it costs the difference from today's delivery, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>&#x003B4;<\/mi><mrow><mi>c<\/mi><mi>s<\/mi><mi>m<\/mi><\/mrow><\/msub><\/mrow><\/math> per unit:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mo>&#x0002B;<\/mo><msub><mo>&#x02211;<\/mo><mrow><mi>m<\/mi><mo>&#x0002C;<\/mo><mi>c<\/mi><mo>&#x0002C;<\/mo><mi>s<\/mi><mo>&#x0002C;<\/mo><mi>t<\/mi><\/mrow><\/msub><msub><mi>&#x003B4;<\/mi><mrow><mi>c<\/mi><mi>s<\/mi><mi>m<\/mi><\/mrow><\/msub><mspace width=\"0.167em\" /><msub><mi>y<\/mi><mrow><mi>m<\/mi><mi>c<\/mi><mi>s<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/div>\n<p>A moved customer's shelf-life limit holds where it is assigned, with its own cover <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>Q<\/mi><mrow><mi>c<\/mi><mi>s<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math> added to the site's:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>I<\/mi><mrow><mi>m<\/mi><mi>s<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x02264;<\/mo><msub><mi>Q<\/mi><mrow><mi>s<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>Q<\/mi><mrow><mi>c<\/mi><mi>s<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><mi>M<\/mi><mspace width=\"0.167em\" /><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><msub><mi>a<\/mi><mrow><mi>c<\/mi><mi>s<\/mi><\/mrow><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math><\/div>\n<p><strong>How sure.<\/strong> Both solves stop within a relative gap <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><\/mrow><\/math> of their best possible plans, so a saving is a finding only above <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><\/mrow><\/math> times today's cost: here 1% of €36.55M.<\/p>\n<p><strong>Rebalancing.<\/strong> With <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I<\/mi><mrow><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math> the stock at site <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><\/mrow><\/math> after bucket <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>R<\/mi><mi>p<\/mi><\/msub><\/mrow><\/math> the floor it is held to, the spare stock and a move's value are<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mtext>spare<\/mtext><mrow><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0003D;<\/mo><mo>max<\/mo><mo minsize=\"1.623em\" maxsize=\"1.623em\">(<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.278em\" /><msub><mo>min<\/mo><mrow><mi>u<\/mi><mo>&#x02265;<\/mo><mi>t<\/mi><\/mrow><\/msub><mo minsize=\"1.2em\" maxsize=\"1.2em\">(<\/mo><msub><mi>I<\/mi><mrow><mi>p<\/mi><mi>u<\/mi><\/mrow><\/msub><mo>&#x02212;<\/mo><msub><mi>R<\/mi><mi>p<\/mi><\/msub><mo minsize=\"1.2em\" maxsize=\"1.2em\">)<\/mo><mo minsize=\"1.623em\" maxsize=\"1.623em\">)<\/mo><\/mrow><\/math><\/div>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>net<\/mtext><mo>&#x0003D;<\/mo><mi>q<\/mi><mspace width=\"0.167em\" /><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>g<\/mi><mi>m<\/mi><\/msub><mo>&#x0002B;<\/mo><msub><mi>&#x003C1;<\/mi><mi>m<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mtext>carrying&#x000A0;released<\/mtext><mo>&#x02212;<\/mo><mtext>freight<\/mtext><mo>&#x02212;<\/mo><mtext>carbon<\/mtext><\/mrow><\/math><\/div>\n<p>for <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>q<\/mi><\/mrow><\/math> units moved against shortages they can still reach, with <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>g<\/mi><mi>m<\/mi><\/msub><\/mrow><\/math> the margin and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>&#x003C1;<\/mi><mi>m<\/mi><\/msub><\/mrow><\/math> the shortage penalty.<\/p>\n<p><strong>Geography.<\/strong> With <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><\/mrow><\/math> the great-circle distance, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BA;<\/mi><\/mrow><\/math> the circuity, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><\/mrow><\/math> the fixed charge per trip and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v<\/mi><\/mrow><\/math> the rate per kilometre:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>road&#x000A0;km<\/mtext><mo>&#x0003D;<\/mo><mi>&#x003BA;<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mspace width=\"2em\" /><mtext>cost<\/mtext><mo>&#x0003D;<\/mo><mi>F<\/mi><mo>&#x0002B;<\/mo><mi>v<\/mi><mi>&#x000B7;<\/mi><mtext>road&#x000A0;km<\/mtext><mspace width=\"2em\" /><mtext>days<\/mtext><mo>&#x0003D;<\/mo><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x02308;<\/mo><mfrac><mrow><mtext>road&#x000A0;km<\/mtext><\/mrow><mrow><mtext>speed<\/mtext><mi>&#x000B7;<\/mi><mtext>hours<\/mtext><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mtext>handling<\/mtext><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x02309;<\/mo><\/mrow><\/mrow><\/math><\/div>\n<p>Lindewaard's card: €227.53 a trip and €1.685 a kilometre ambient, €320.04 and €2.222 chilled; 65 km/h, 9 hours a day, 0.5 day handling; 0.85 kg CO₂e a kilometre on the owned fleet.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Design, both modes<\/td>\n<td><code>engine/design.py<\/code> (<code>NetworkDesigner.design<\/code>), <code>POST /api/v1/design<\/code><\/td>\n<\/tr>\n<tr>\n<td>Site switches, customer assignment<\/td>\n<td><code>engine/optimizer.py<\/code> (<code>SiteDesignInputs<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Who can be served from where<\/td>\n<td><code>engine/design.py<\/code> (<code>customer_reach<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>The starting plan<\/td>\n<td><code>engine/design.py<\/code> (<code>as_is_start<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>One closure priced<\/td>\n<td><code>engine/design.py<\/code> (<code>DesignOptions.force_close<\/code>, <code>nearest_open_site<\/code>), <code>force_close<\/code> on <code>POST /api/v1/design<\/code><\/td>\n<\/tr>\n<tr>\n<td>Several futures at once<\/td>\n<td><code>engine/design.py<\/code> (<code>RobustNetworkDesigner<\/code>), <code>POST /api/v1/design/robust<\/code><\/td>\n<\/tr>\n<tr>\n<td>Rebalancing<\/td>\n<td><code>engine/redistribution.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Cost to serve<\/td>\n<td><code>engine/costtoserve.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Rate card and distances<\/td>\n<td><code>engine/geography.py<\/code> (<code>FreightRateCard<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Customer locations<\/td>\n<td><code>customer_locations.csv<\/code> (optional; prices each delivery where the workspace prices them, and lets a design move a customer)<\/td>\n<\/tr>\n<tr>\n<td>Which site delivers each range<\/td>\n<td><code>customer_sourcing.csv<\/code> (optional; per customer and temperature zone, with the customer's share of that site's demand)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>The answers on this page<\/strong> come from <code>tools/manual_design.py<\/code>, which runs the engine's own design endpoint on the demo workspace; the rebalancing figures from the published plans, kept current by <code>tools/refresh_redistribution.py<\/code>.<\/p>\n<p><strong>Tests that guard it.<\/strong> A closed DC's customers are served from the other distribution centre, at 97.9% service, all its room allows (pinned to the closed DC, service fell to 56.6%); a customer never moves to a plant; a customer without a location never moves; the design starts from today's network with every switch set; a rounded quick first plan is never reported as a design; a forced closure starts from a plan of the closed network, and a design stopped by the clock is never called optimal; stock the plan ships out later is not spare; a block of idle stock is moved once; the published plans carry today's rebalancing report.<\/p>"}],"search":" above the year's plan sit two slower questions: is the stock in the right place, and are the sites? here is lindewaard's network, asked both. lindewaard today. three plants, two co-packers, two distribution centres and 12 customers' delivery points. the whole network costs €36.55m a year, everything included. is the stock in the right place? the plan already moves stock wherever a move pays. the rebalancing check reads the plan for stock it holds and never uses: on the published plan it finds 0 moves worth making. could a new site pay? two are on the table: dc venlo (€1.20m a year to run, €8.00m to build) and moerdijk bottling (€3.20m, €26.00m). a greenfield design may open either. customers move with the network. each may be served from any site in reach. closing a distribution centre moves its customers; it does not lose them. could a site close? a brownfield design may also close any of lindewaard's own sites, paying the closing cost (dc tilburg's: €2.00m). co-packers are never on the list. the answer: close dc tilburg. €1,789,203 a year cheaper than today, for €2,000,000 once, paid back in 13 months; service from 99.00% to 99.32%. without closing anything, moving 2 customers' deliveries saves €789,647 a year, and no new site pays for itself. so the closure is judged on what closing adds: against that network, €999,556 a year for €2,000,000, back in 2.0 years. dc tilburg's fixed cost goes; without its pallets the plants co-pack 8,227 more units and 17,957 more units go short. proven within the gap asked. until 21 october the answer here was \"keep today's network\". it was the search, not the network: choosing every site at once, the brownfield design stopped 14.6% from its bound and could not tell a saving of three million euro a year from none. priced one closure at a time, each closure is a question the solver answers quickly and proves, and closing dc tilburg stood out. before that, until 18 october, \"keep\" was partly built in: a closed dc lost its customers and a new one could take none. rebalancing: move it, or keep paying to hold it stock costs warehousing and the capital tied up in it; moving it costs freight and carbon. the rebalancing check prices that trade for every block of stock the plan holds and never uses: spare is what a site holds in every later bucket, above the buffer it is held to and any stock the year's plan needs at the end. a build-up that ships out next week is not spare. wanted is a shortage elsewhere that the stock can still reach and sell: arriving before the bucket ends, and young enough for that site's customers. one block, one move. the same idle units sit in every bucket; they are moved once. the first version of this check read the plant's stock less the plant's own demand, which is nothing, and called the whole build-up spare: 47,733 kg of bitterbal bites at oss foods in d05, \"worth moving\", although the plan ships it out by d07. read properly, a plan solved to its gap has nothing to move: every move that paid is already in it. the check earns its place on a plan that was edited by hand, committed, or not proven. network design: greenfield and brownfield a design solves the network twice. first as it is, then with the sites themselves as decisions, and compares: greenfield may open candidate sites. a candidate plant copies the lines of a named site; every candidate gets lanes to every site within reach, priced off the same rate card as the rest. brownfield may also close any own site. co-packers stay: leaving a toll manufacturer is a contract decision, not a network one. a closed site's stock is written off at standard cost. settled by parts, each proven. greenfield designs each combination of the candidates with them pinned (none, venlo, moerdijk, both). brownfield adds each own site closed on its own. the cheapest is kept, every network priced is listed with its cost, and two closures that pay only together are not tried (a search of every combination is hours of solving, on the roadmap as a background job). ranked as the solver ranks networks. a year's running cost plus the one-off investment, opening capex and closing cost alike, spread over the amortisation years: ranked on the running cost alone, a new site would win whenever it ran cheaper, however much it cost to build. capital and running costs on one scale. the plan's horizon is scaled to a year, capex is written down over ten years, a closing cost over the same. the second solve starts from the first. today's network, every site open and every candidate shut, is handed over as the starting plan. without that, the brownfield design found no plan at all in five minutes. a difference smaller than the solver's tolerance is no difference. both solves may stop within 1% of the best; a saving below €365,517 a year is reported as none. lindewaard's answers: greenfield €789,647 a year from today's network in 2187 s, opening nothing, 2 customers' deliveries moved; brownfield €1,789,203 in 3022 s, closing dc tilburg, 5 customers' deliveries moved. customers move with the network demand is booked at the site that serves it today, so service levels and every report read as before. what a design decides is where the stock comes from: one site per customer , an open one, within delivery reach; plants may deliver direct. priced on the difference. a delivery costs a full truck on the rate card per unit it holds; a move pays the difference from today's delivery, so today's network costs exactly what it did. on lindewaard the plan itself prices every delivery (chapter 10), so the difference lands on top of a delivery already paid for. contracts travel. a customer served from a new site takes its shelf-life terms with it. a customer needs a place. only customers with a delivery location can move; the rest stay with their dc. lindewaard's twelve customers (supermarket chains, discounters, wholesalers and foodservice) are fictional, placed in the region their dcs serve today, never to make a candidate site win. a customer served from two sites moves one range at a time. two of lindewaard's customers take their chilled range from rotterdam and their dry range from tilburg. each range is a delivery of its own, and the design may move either without the other: closing tilburg moves noordster's dry range to rotterdam, where its chilled range already comes from. until 21 october such a customer was kept whole, and closing tilburg stranded its dry range: €30.8m a year dearer instead of cheaper. which ranges a site should handle at all is a design of its own, not done here. one rate card prices every lane every lane, candidate lane and customer delivery is priced from the distance on the map, not typed in: the straight line times 1.27 for the road, then a fixed charge per trip and a rate per kilometre. move the slider. what one closure costs a design can also be told: \"close dc rotterdam, and price it\". the site is shut whatever it costs, its customers may move, and nothing new opens. today's plan ships through rotterdam, so it cannot be the starting point; the engine first plans the closed network with each of its customers at the nearest open site, then lets the design choose freely from there. the price: €70.76m a year more than today (€107.31m), proven within 0.4% in 97 s. where it comes from: running the network gets cheaper by €6.19m over the planning horizon, but the units that go short rise from 191,287 to 15,714,988, and the cost of not serving them by €78.85m. service falls from 99.0% to 60.2%; 9 customers' deliveries come from another site. why so much goes short: oss and helmond, the only plants making the two chilled products, have no lane except the one to rotterdam, and each delivery comes from one site. closed, a customer served from oss cannot get helmond's saté skewers, and one served from helmond cannot get oss's bitterbal bites; chilled trucks fall from 378 to 0. tested on 20 october, before the twelve customers, by adding a lane between oss and helmond: the same closure then left almost no chilled stock short. closing rotterdam is really a question about that lane. a design that runs out of time says so: \"not proven\", with the gap it reached. the same closure with new sites also free to open. left to choose dc venlo and moerdijk bottling itself, the design kept its starting plan for 300 s and stopped 55% from the best possible. so it now designs each combination of the candidates with them pinned (none, venlo, moerdijk, both; up to three candidates) and keeps the cheapest. each starts from a plan of the closed network; where that finds no plan in its time (both open did not), from the cheapest smaller combination's plan, whose extra site simply ships nothing. a combination stopped by the clock is ruled out when even its best possible cost is dearer than the cheapest found. measured on lindewaard on 21 oct, 300 s per solve, with its twelve customers and their deliveries priced: if rotterdam must close, opening venlo is the cheapest way to do it, at €36.7m a year against €36.5m today before its €8m to build and rotterdam's €2.6m to leave, in 37 minutes, within 5.7% of the best network possible. so it does not pay: closing dc tilburg does (above). not measured again since the distribution centres were right-sized and customers kept to them (22 oct). measured the same morning on the four customers of before, the same question found venlo €1.6m a year cheaper than today; priced deliveries to twelve customers took that away. it is asked through the design service ( force_close with candidate_site_ids ), not on the control tower page. what it does not do yet re-plan buffers at a new site. a moved customer's demand stays booked, and buffered, where it was. see a seasonal year in a short horizon. scaling a horizon to a year assumes it is representative. where stock should sit in the chain, buffer by buffer, is chapter 12's question. what each product and customer costs to serve is read off the plan by the engine's cost-to-serve report, with its allocation rules stated beside the numbers. sites. each site s that may change has a switch o s ∈ { 0 , 1 } . with f s its annual fixed cost, k s its opening capex, c s its closing cost and l the write-down period in years, a design adds to the plan's cost ∑ s ∈ candidates ( f s + k s l ) o s + ∑ s ∈ closable ( f s o s + c s l ( 1 − o s ) ) and the plan's operating cost is scaled by 365 / h for a horizon of h days. a closed site makes, holds, ships and serves nothing: x m s t , i m s t , s ℓ m t , d m s t own ≤ m o s for every lane  ℓ  touching  s customers. customer c , served today from h c , may be served from any site s in reach, s c . with a c s ∈ { 0 , 1 } the assignment and y m c s t the units delivered from s : ∑ s ∈ s c a c s = 1 a c s ≤ o s y m c s t ≤ d m c t a c s the delivery leaves s 's stock, its demand stays booked at h c , and it costs the difference from today's delivery, δ c s m per unit: + ∑ m , c , s , t δ c s m y m c s t a moved customer's shelf-life limit holds where it is assigned, with its own cover q c s t added to the site's: i m s t ≤ q s t + q c s t + m ( 1 − a c s ) how sure. both solves stop within a relative gap g of their best possible plans, so a saving is a finding only above g times today's cost: here 1% of €36.55m. rebalancing. with i p t the stock at site p after bucket t and r p the floor it is held to, the spare stock and a move's value are spare p t = max ( 0 , min u ≥ t ( i p u − r p ) ) net = q ( g m + ρ m ) + carrying released − freight − carbon for q units moved against shortages they can still reach, with g m the margin and ρ m the shortage penalty. geography. with d the great-circle distance, κ the circuity, f the fixed charge per trip and v the rate per kilometre: road km = κ d cost = f + v · road km days = ⌈ road km speed · hours + handling ⌉ lindewaard's card: €227.53 a trip and €1.685 a kilometre ambient, €320.04 and €2.222 chilled; 65 km/h, 9 hours a day, 0.5 day handling; 0.85 kg co₂e a kilometre on the owned fleet. what where design, both modes engine/design.py ( networkdesigner.design ), post /api/v1/design site switches, customer assignment engine/optimizer.py ( sitedesigninputs ) who can be served from where engine/design.py ( customer_reach ) the starting plan engine/design.py ( as_is_start ) one closure priced engine/design.py ( designoptions.force_close , nearest_open_site ), force_close on post /api/v1/design several futures at once engine/design.py ( robustnetworkdesigner ), post /api/v1/design/robust rebalancing engine/redistribution.py cost to serve engine/costtoserve.py rate card and distances engine/geography.py ( freightratecard ) customer locations customer_locations.csv (optional; prices each delivery where the workspace prices them, and lets a design move a customer) which site delivers each range customer_sourcing.csv (optional; per customer and temperature zone, with the customer's share of that site's demand) the answers on this page come from tools/manual_design.py , which runs the engine's own design endpoint on the demo workspace; the rebalancing figures from the published plans, kept current by tools/refresh_redistribution.py . tests that guard it. a closed dc's customers are served from the other distribution centre, at 97.9% service, all its room allows (pinned to the closed dc, service fell to 56.6%); a customer never moves to a plant; a customer without a location never moves; the design starts from today's network with every switch set; a rounded quick first plan is never reported as a design; a forced closure starts from a plan of the closed network, and a design stopped by the clock is never called optimal; stock the plan ships out later is not spare; a block of idle stock is moved once; the published plans carry today's rebalancing report. "},{"part":"Planning","number":"12","slug":"buffers","title":"Inventory and buffers (DDMRP)","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>A buffer is a stock target with three zones, placed where swings in demand and supply should stop. Here is a real one from Lindewaard's plan, and why the plan could not hold it.<\/p>\n<div class=\"story\"><div class=\"stage\"><div class=\"diagram\" data-diagram=\"buffer\" data-story=\"1\"><\/div><\/div><div class=\"steps\"><div class=\"step\" data-state=\"zones\"><p><strong>Three zones.<\/strong> Bitterbal Bites at DC Rotterdam: red is the safety layer, yellow the cover for the replenishment time, green the order size.<\/p><\/div><div class=\"step\" data-state=\"plan\"><p><strong>The plan is held to red.<\/strong> Falling below it is allowed but priced, at a multiple of the cost of carrying the stock.<\/p><\/div><div class=\"step\" data-state=\"shelf\"><p><strong>But shelf life caps it.<\/strong> The product keeps 21 days, and Noordster Supermarkten accepts it only with 14.01 days left. Stock may be at most 5.99 days old, so the site cannot hold the full red zone.<\/p><\/div><div class=\"step\" data-state=\"verdict\"><p><strong>The plan says so.<\/strong> It reports the buckets below red, what that cost, and that the cap, not the planner, set the limit.<\/p><\/div><\/div><\/div>"},{"name":"How it works","html":"<p>Each buffered part gets three zones from its average daily use and its <strong>decoupled lead time<\/strong>, how long a refill really takes:<\/p>\n<ul>\n<li><strong>Red:<\/strong> daily use × lead time × a lead-time factor, plus a safety layer scaled by how uncertain the forecast is (its P90 against its P50).<\/li>\n<li><strong>Yellow:<\/strong> daily use × lead time.<\/li>\n<li><strong>Green:<\/strong> the largest of the usual order cycle, the minimum order quantity, or the red base.<\/li>\n<\/ul>\n<p>The lead time is <strong>derived from the network<\/strong>, not typed: the fastest of the ways a part can be replenished, waiting for the slowest ingredient of its recipe, and stopping at any other buffer. Derived this way, the hand-typed lead times turned out optimistic by 8 to 16 days on every buffer. An unreliable carrier stretches it further, and a co-packed part adds the 2-day return.<\/p>"},{"name":"The maths","html":"<p>With <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mi>u<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><\/mrow><\/math> the average daily use, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>L<\/mi><\/mrow><\/math> the decoupled lead time, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f<\/mi><mi>L<\/mi><\/msub><\/mrow><\/math> the lead-time factor and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f<\/mi><mi>V<\/mi><\/msub><\/mrow><\/math> the variability factor:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>red<\/mtext><mo>&#x0003D;<\/mo><mover><mi>u<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mspace width=\"0.167em\" /><mi>L<\/mi><mspace width=\"0.167em\" /><msub><mi>f<\/mi><mi>L<\/mi><\/msub><mspace width=\"0.167em\" /><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msub><mi>f<\/mi><mi>V<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"2em\" /><mtext>yellow<\/mtext><mo>&#x0003D;<\/mo><mover><mi>u<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mspace width=\"0.167em\" /><mi>L<\/mi><mspace width=\"2em\" /><mtext>green<\/mtext><mo>&#x0003D;<\/mo><mo>max<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mover><mi>u<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mspace width=\"0.167em\" /><mi>c<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.278em\" /><mtext>MOQ<\/mtext><mo>&#x0002C;<\/mo><mspace width=\"0.278em\" /><mover><mi>u<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mspace width=\"0.167em\" /><mi>L<\/mi><mspace width=\"0.167em\" /><msub><mi>f<\/mi><mi>L<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math><\/div>\n<p>The decoupled lead time is a recursion over the network: for a part at a site, the minimum over its sources of the source's own time, where a buffered source contributes nothing and a recipe waits for its slowest component:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>L<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>i<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msub><mo>min<\/mo><mrow><mtext>source&#x000A0;<\/mtext><mi>j<\/mi><\/mrow><\/msub><mo minsize=\"1.623em\" maxsize=\"1.623em\">(<\/mo><msub><mi>&#x02113;<\/mi><mrow><mi>i<\/mi><mi>j<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><mo minsize=\"1.2em\" maxsize=\"1.2em\">[<\/mo><mspace width=\"0.167em\" /><mi>j<\/mi><mtext>&#x000A0;not&#x000A0;buffered<\/mtext><mspace width=\"0.167em\" /><mo minsize=\"1.2em\" maxsize=\"1.2em\">]<\/mo><mspace width=\"0.167em\" /><msub><mo>max<\/mo><mrow><mtext>component&#x000A0;<\/mtext><mi>k<\/mi><mtext>&#x000A0;of&#x000A0;<\/mtext><mi>j<\/mi><\/mrow><\/msub><mi>L<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>k<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo minsize=\"1.623em\" maxsize=\"1.623em\">)<\/mo><\/mrow><\/math><\/div>\n<p>In the plan, stock below red is a shortfall variable <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math> with <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I<\/mi><mo>&#x0002B;<\/mo><mi>r<\/mi><mo>&#x02265;<\/mo><mtext>red<\/mtext><\/mrow><\/math>, priced at a multiple of the carrying cost.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Zones and adherence<\/td>\n<td><code>engine/ddmrp.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Decoupled lead times across the network<\/td>\n<td><code>engine/meio.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Red-zone floor in the plan<\/td>\n<td><code>engine/optimizer.py<\/code> (<code>buffer_red_<\/code> constraints)<\/td>\n<\/tr>\n<tr>\n<td>Buffer settings per part<\/td>\n<td>the workspace's <code>buffer_profiles.csv<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}],"search":" a buffer is a stock target with three zones, placed where swings in demand and supply should stop. here is a real one from lindewaard's plan, and why the plan could not hold it. three zones. bitterbal bites at dc rotterdam: red is the safety layer, yellow the cover for the replenishment time, green the order size. the plan is held to red. falling below it is allowed but priced, at a multiple of the cost of carrying the stock. but shelf life caps it. the product keeps 21 days, and noordster supermarkten accepts it only with 14.01 days left. stock may be at most 5.99 days old, so the site cannot hold the full red zone. the plan says so. it reports the buckets below red, what that cost, and that the cap, not the planner, set the limit. each buffered part gets three zones from its average daily use and its decoupled lead time , how long a refill really takes: red: daily use × lead time × a lead-time factor, plus a safety layer scaled by how uncertain the forecast is (its p90 against its p50). yellow: daily use × lead time. green: the largest of the usual order cycle, the minimum order quantity, or the red base. the lead time is derived from the network , not typed: the fastest of the ways a part can be replenished, waiting for the slowest ingredient of its recipe, and stopping at any other buffer. derived this way, the hand-typed lead times turned out optimistic by 8 to 16 days on every buffer. an unreliable carrier stretches it further, and a co-packed part adds the 2-day return. with u ¯ the average daily use, l the decoupled lead time, f l the lead-time factor and f v the variability factor: red = u ¯ l f l ( 1 + f v ) yellow = u ¯ l green = max ( u ¯ c , moq , u ¯ l f l ) the decoupled lead time is a recursion over the network: for a part at a site, the minimum over its sources of the source's own time, where a buffered source contributes nothing and a recipe waits for its slowest component: l ( i ) = min source  j ( ℓ i j + [ j  not buffered ] max component  k  of  j l ( k ) ) in the plan, stock below red is a shortfall variable r with i + r ≥ red , priced at a multiple of the carrying cost. what where zones and adherence engine/ddmrp.py decoupled lead times across the network engine/meio.py red-zone floor in the plan engine/optimizer.py ( buffer_red_ constraints) buffer settings per part the workspace's buffer_profiles.csv "},{"part":"Planning","number":"13","slug":"disruptions","title":"Disruptions, scenarios and impact","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Every disruption story is planned three ways, and the difference between them is what seeing it coming is worth.<\/p>\n<div class=\"diagram\" data-diagram=\"three-ways\"><\/div>\n<div class=\"diagram\" data-diagram=\"stories\"><\/div>"},{"name":"How it works","html":"<p><strong>Three plans per story.<\/strong><\/p>\n<ul>\n<li><strong>No early action:<\/strong> the baseline runs until the day the disruption hits; then an emergency re-plan, with the first week frozen.<\/li>\n<li><strong>A week's notice:<\/strong> the same, re-planned seven days earlier.<\/li>\n<li><strong>Acting ahead:<\/strong> the disruption is known when the year is planned.<\/li>\n<\/ul>\n<p>A difference smaller than the tolerance the plans are proven to is reported as <strong>no measurable difference<\/strong>, never as a win.<\/p>\n<p><strong>Scenario files<\/strong> describe what-ifs as data (switch on charging the empty run home, size buffers on the real network) and run each on a scratch copy of the tables, so the live data is never touched. The scenario report compares them side by side, in money, with the gate's verdict on each.<\/p>\n<p><strong>Impact tracing<\/strong> answers the question a control tower exists for: <em>which customer orders does this put at risk?<\/em> A supplier, site or lane is taken out for given weeks; production and purchasing inside the supply lead time are pinned, because orders already placed cannot be undone, and the plan is solved again.<\/p>\n<p><strong>The stress test<\/strong> re-plans against the forecast's P90 (demand exceeded only one week in ten) with near-term supply pinned, and reports service, margin at risk and the customers who would lose orders.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The stories, built and published<\/td>\n<td><code>tools/build_showcase.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Scenario files and scenario reports<\/td>\n<td><code>engine/scenarios.py<\/code>, <code>engine/auditreport.py<\/code>, <code>tools/audit.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Impact of a supply event<\/td>\n<td><code>engine/impact.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Stress test<\/td>\n<td><code>engine/stochastic.py<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}],"search":" every disruption story is planned three ways, and the difference between them is what seeing it coming is worth. three plans per story. no early action: the baseline runs until the day the disruption hits; then an emergency re-plan, with the first week frozen. a week's notice: the same, re-planned seven days earlier. acting ahead: the disruption is known when the year is planned. a difference smaller than the tolerance the plans are proven to is reported as no measurable difference , never as a win. scenario files describe what-ifs as data (switch on charging the empty run home, size buffers on the real network) and run each on a scratch copy of the tables, so the live data is never touched. the scenario report compares them side by side, in money, with the gate's verdict on each. impact tracing answers the question a control tower exists for: which customer orders does this put at risk? a supplier, site or lane is taken out for given weeks; production and purchasing inside the supply lead time are pinned, because orders already placed cannot be undone, and the plan is solved again. the stress test re-plans against the forecast's p90 (demand exceeded only one week in ten) with near-term supply pinned, and reports service, margin at risk and the customers who would lose orders. what where the stories, built and published tools/build_showcase.py scenario files and scenario reports engine/scenarios.py , engine/auditreport.py , tools/audit.py impact of a supply event engine/impact.py stress test engine/stochastic.py "},{"part":"Planning","number":"14","slug":"sop-gate","title":"The S&OP release gate","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Before a plan reaches the factory it passes a set of checks. <strong>Move the sliders<\/strong>: they are the business's thresholds, set against Lindewaard's real plan of record.<\/p>\n<div class=\"diagram\" data-diagram=\"gate\"><\/div>"},{"name":"How it works","html":"<p>A plan is <strong>held for review<\/strong> when any check fails:<\/p>\n<ul>\n<li>service below 97%;<\/li>\n<li>margin at risk above 2% of the margin achievable;<\/li>\n<li>less than 18% of the achievable margin captured;<\/li>\n<li>more than 20% of volume on spot hauliers;<\/li>\n<li>an unresolved forecast dispute;<\/li>\n<li>the solver did not prove the plan within its tolerance.<\/li>\n<\/ul>\n<p>It is <strong>rejected<\/strong> outright below 5% of the achievable margin. The thresholds are policy, not physics: they are settings per run. Most weeks most plans pass and go on their own; only the real trade-offs reach the meeting, with the reason attached. That is management by exception.<\/p>\n<p><strong>Only a live branch can commit<\/strong> to a factory schedule, and only when live is switched on deliberately. Every story on the showcase is a sandbox branch.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Policy, checks and verdict<\/td>\n<td><code>engine/governance.py<\/code> (<code>IBPPolicy<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Commit to a schedule<\/td>\n<td><code>engine/schedulesink.py<\/code> (Postgres when configured, memory otherwise)<\/td>\n<\/tr>\n<tr>\n<td>The verdict in a plan<\/td>\n<td><code>ibp_verdict<\/code> in every plan the API returns<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}],"search":" before a plan reaches the factory it passes a set of checks. move the sliders : they are the business's thresholds, set against lindewaard's real plan of record. a plan is held for review when any check fails: service below 97%; margin at risk above 2% of the margin achievable; less than 18% of the achievable margin captured; more than 20% of volume on spot hauliers; an unresolved forecast dispute; the solver did not prove the plan within its tolerance. it is rejected outright below 5% of the achievable margin. the thresholds are policy, not physics: they are settings per run. most weeks most plans pass and go on their own; only the real trade-offs reach the meeting, with the reason attached. that is management by exception. only a live branch can commit to a factory schedule, and only when live is switched on deliberately. every story on the showcase is a sandbox branch. what where policy, checks and verdict engine/governance.py ( ibppolicy ) commit to a schedule engine/schedulesink.py (postgres when configured, memory otherwise) the verdict in a plan ibp_verdict in every plan the api returns "},{"part":"Planning","number":"15","slug":"atp","title":"Available to promise","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>A plan says what each site will have; customer service needs to know what it can still <strong>promise<\/strong>. The two differ by the orders already confirmed.<\/p>\n<div class=\"diagram\" data-diagram=\"atp\"><\/div>"},{"name":"How it works","html":"<ul>\n<li><strong>Supply by a bucket:<\/strong> the site's opening stock and everything the plan brings in (production, arrivals, open orders landing), less what it sends on to other sites and what it writes off.<\/li>\n<li><strong>Available to promise<\/strong> in a bucket is that supply less the confirmed orders due by then, and it is protected forward: a later confirmed order keeps its claim on stock that arrives earlier.<\/li>\n<li><strong>A promise date<\/strong> for a new order is the first bucket from which enough is available and stays available. Part of an order can ship on time and the rest follow, with a date.<\/li>\n<\/ul>"},{"name":"The maths","html":"<p>With <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> the cumulative supply and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>C<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> the cumulative confirmed orders by bucket <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math>, the cumulative ATP and what can be promised in <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> are<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>A<\/mi><mi>t<\/mi><\/msub><mo>&#x0003D;<\/mo><msub><mi>S<\/mi><mi>t<\/mi><\/msub><mo>&#x02212;<\/mo><msub><mi>C<\/mi><mi>t<\/mi><\/msub><mspace width=\"2em\" /><msub><mtext>ATP<\/mtext><mi>t<\/mi><\/msub><mo>&#x0003D;<\/mo><mo>max<\/mo><mo minsize=\"1.623em\" maxsize=\"1.623em\">(<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.278em\" /><msub><mo>min<\/mo><mrow><mi>u<\/mi><mo>&#x02265;<\/mo><mi>t<\/mi><\/mrow><\/msub><msub><mi>A<\/mi><mi>u<\/mi><\/msub><mo minsize=\"1.623em\" maxsize=\"1.623em\">)<\/mo><\/mrow><\/math><\/div>\n<p>so a new order of <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>q<\/mi><\/mrow><\/math> is promised in the first bucket <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> with <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mtext>ATP<\/mtext><mi>t<\/mi><\/msub><mo>&#x02265;<\/mo><mi>q<\/mi><\/mrow><\/math>.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ATP and promise dates<\/td>\n<td><code>engine/atp.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>In a plan<\/td>\n<td><code>available_to_promise<\/code> in every plan the API returns<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}],"search":" a plan says what each site will have; customer service needs to know what it can still promise . the two differ by the orders already confirmed. supply by a bucket: the site's opening stock and everything the plan brings in (production, arrivals, open orders landing), less what it sends on to other sites and what it writes off. available to promise in a bucket is that supply less the confirmed orders due by then, and it is protected forward: a later confirmed order keeps its claim on stock that arrives earlier. a promise date for a new order is the first bucket from which enough is available and stays available. part of an order can ship on time and the rest follow, with a date. with s t the cumulative supply and c t the cumulative confirmed orders by bucket t , the cumulative atp and what can be promised in t are a t = s t − c t atp t = max ( 0 , min u ≥ t a u ) so a new order of q is promised in the first bucket t with atp t ≥ q . what where atp and promise dates engine/atp.py in a plan available_to_promise in every plan the api returns "},{"part":"Planning","number":"16","slug":"kpis","title":"KPIs","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Every headline number has one definition, written once and shown everywhere from the same source: the Control Tower, the showcase and this manual.<\/p>\n<div class=\"diagram\" data-diagram=\"kpi-tree\"><\/div>"},{"name":"How it works","html":"<table>\n<thead>\n<tr>\n<th>KPI<\/th>\n<th>How it is calculated<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Service level<\/strong><\/td>\n<td>Demand served, by value: every unit sold at its list price, over every unit ordered at its list price, across the whole horizon. By value so that litres and kilograms are never added together: by volume, the unit a product happens to be counted in would decide how much it weighs. The volume figure is kept beside it (service_level_volume_pct). It counts demand served within its planning bucket; it is not an on-time-in-full (OTIF) measure. The S&amp;OP gate holds a plan below 97%.<\/td>\n<\/tr>\n<tr>\n<td><strong>Customer fill rate<\/strong><\/td>\n<td>The same as service level, for one customer: what they were served at list price over what they ordered at list price. Beside it, the fill rate by volume within each unit (litres, kilograms), where a ratio does not depend on the unit.<\/td>\n<\/tr>\n<tr>\n<td><strong>Margin at risk<\/strong><\/td>\n<td>For every unit ordered and not served: its gross margin plus the shortage penalty per unit. The penalty is a planning weight, not money, so this is larger than the margin actually lost. The S&amp;OP gate holds a plan whose margin at risk exceeds 2% of the margin achievable.<\/td>\n<\/tr>\n<tr>\n<td><strong>Revenue<\/strong><\/td>\n<td>Units sold times list price.<\/td>\n<\/tr>\n<tr>\n<td><strong>Gross margin<\/strong><\/td>\n<td>Revenue minus the cost of goods sold, taken at standard cost on what was sold. As a percentage, over revenue.<\/td>\n<\/tr>\n<tr>\n<td><strong>Total (landed) cost<\/strong><\/td>\n<td>Everything the plan spends: production, purchases, freight (road tolls and spot haulage included, and the delivery to each customer where the workspace prices it), empty return trips where charged, holding stock (warehousing plus the cost of capital on its value), and carbon at the carbon price on production and transport. The shortage penalty is not in it, and nor is the carbon in what is bought: the plan prices it when it chooses a supplier, but nobody invoices it, so it is reported beside total cost (purchase carbon), not in it.<\/td>\n<\/tr>\n<tr>\n<td><strong>Delivery to customers<\/strong><\/td>\n<td>The last leg, where the workspace prices it: for every unit served, a full truck from the site it is served from to the customer on the rate card, divided by what a truck holds of that product. Inside freight (and its carbon inside transport carbon); said apart so the last leg can be read on its own. A customer taking part loads would cost more per unit; that is not modelled.<\/td>\n<\/tr>\n<tr>\n<td><strong>Purchase carbon<\/strong><\/td>\n<td>The emissions of everything bought (each purchasing record's CO2e per unit, times what is bought, orders already in flight included), and those at the carbon price. A price the plan steers by when it chooses a supplier, not money paid: not in total cost or profit.<\/td>\n<\/tr>\n<tr>\n<td><strong>Profit before overheads<\/strong><\/td>\n<td>Revenue minus total cost. Where two plans end the year on different stock, the difference in year-end stock value is added, because stock carried is value kept, not cost spent.<\/td>\n<\/tr>\n<tr>\n<td><strong>Share of the hit won back<\/strong><\/td>\n<td>For a disruption: the profit it costs with no early action, minus what it costs acting ahead, over the profit it costs with no early action. Each hit is the baseline plan's profit minus the disrupted plan's.<\/td>\n<\/tr>\n<tr>\n<td><strong>Stock value<\/strong><\/td>\n<td>Units held times standard cost, finished goods and components. The average is weighted by how long each planning bucket lasts; the closing value is the end of the last bucket.<\/td>\n<\/tr>\n<tr>\n<td><strong>Truck trips<\/strong><\/td>\n<td>Departures: every truck that leaves, full or part-full, counts once.<\/td>\n<\/tr>\n<tr>\n<td><strong>Transport CO2e<\/strong><\/td>\n<td>On the public page: the ISO 14083 report's total, tonne-kilometres of every trip times a published emission factor for the vehicle; a plan without that report uses the engine's own factor, trucks times each lane's CO2e per truck, and is labelled so. The engine's own figure is the one the carbon price is charged on.<\/td>\n<\/tr>\n<tr>\n<td><strong>Divergence alerts<\/strong><\/td>\n<td>Products where the supplied forecast and the statistical baseline disagree by more than the tolerance. A dispute is one no known promotion explains; a planner decides which signal to trust. In the demo the supplied forecast is synthetic.<\/td>\n<\/tr>\n<tr>\n<td><strong>Proven within<\/strong><\/td>\n<td>How far the plan could be from the best possible one: the plan's cost minus the solver's proven lower bound, over the plan's cost. A plan the solver did not prove within its target is labelled as such.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"name":"Under the hood","html":"<p>The definitions live in <code>engine/kpis.py<\/code>; <code>docs/help/reference/kpis.md<\/code> is generated from it for the Control Tower, and a test fails if the two drift apart. The numbers themselves are computed in <code>engine/optimizer.py<\/code> from the solved plan, never estimated.<\/p>"}],"search":" every headline number has one definition, written once and shown everywhere from the same source: the control tower, the showcase and this manual. kpi how it is calculated service level demand served, by value: every unit sold at its list price, over every unit ordered at its list price, across the whole horizon. by value so that litres and kilograms are never added together: by volume, the unit a product happens to be counted in would decide how much it weighs. the volume figure is kept beside it (service_level_volume_pct). it counts demand served within its planning bucket; it is not an on-time-in-full (otif) measure. the s&op gate holds a plan below 97%. customer fill rate the same as service level, for one customer: what they were served at list price over what they ordered at list price. beside it, the fill rate by volume within each unit (litres, kilograms), where a ratio does not depend on the unit. margin at risk for every unit ordered and not served: its gross margin plus the shortage penalty per unit. the penalty is a planning weight, not money, so this is larger than the margin actually lost. the s&op gate holds a plan whose margin at risk exceeds 2% of the margin achievable. revenue units sold times list price. gross margin revenue minus the cost of goods sold, taken at standard cost on what was sold. as a percentage, over revenue. total (landed) cost everything the plan spends: production, purchases, freight (road tolls and spot haulage included, and the delivery to each customer where the workspace prices it), empty return trips where charged, holding stock (warehousing plus the cost of capital on its value), and carbon at the carbon price on production and transport. the shortage penalty is not in it, and nor is the carbon in what is bought: the plan prices it when it chooses a supplier, but nobody invoices it, so it is reported beside total cost (purchase carbon)  how far the plan could be from the best possible one: the plan's cost minus the solver's proven lower bound, over the plan's cost. a plan the solver did not prove within its target is labelled as such. the definitions live in engine/kpis.py ; docs/help/reference/kpis.md is generated from it for the control tower, and a test fails if the two drift apart. the numbers themselves are computed in engine/optimizer.py from the solved plan, never estimated. "},{"part":"Planning","number":"17","slug":"pnl-levers","title":"What each lever does to the P&L","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Every decision the plan weighs is priced in one line of a simple P&amp;L: revenue, less what it costs to buy, make, store, finance and move the product, carbon included. Moving a lever hits its own line first. The plan then answers, and that answer moves other lines.<\/p>\n<p>This chapter measures both, as a sensitivity analysis. Each lever is moved alone on Lindewaard's year, one way and then the other, and the year is planned again by the same engine at the same tolerance as the stories, from a profit before overheads of €25.07M. The tornado shows the profit effect of each lever both ways, largest first; the table below it breaks each effect down by P&amp;L line, or reads it as a finance review would (gross margin, EBITDA, working capital, economic profit).<\/p>\n<div class=\"diagram\" data-diagram=\"levers\"><\/div>"},{"name":"How it works","html":"<h3>The P&amp;L the plan is judged on<\/h3>\n<table>\n<thead>\n<tr>\n<th>Line<\/th>\n<th>What is in it<\/th>\n<th>What moves it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Revenue<\/strong><\/td>\n<td>Units served × selling price<\/td>\n<td>Demand, prices, and how much the plan can serve<\/td>\n<\/tr>\n<tr>\n<td><strong>Raw materials and packaging<\/strong><\/td>\n<td>Units bought × purchase price, orders already placed included<\/td>\n<td>Purchase prices, recipes, how much is made<\/td>\n<\/tr>\n<tr>\n<td><strong>Production<\/strong><\/td>\n<td>Units made × conversion cost, changeovers, line maintenance, co-packer fees<\/td>\n<td>Conversion and changeover costs, where and in what lots it is made<\/td>\n<\/tr>\n<tr>\n<td><strong>Warehousing<\/strong><\/td>\n<td>Stock × storage rate per pallet-week<\/td>\n<td>Storage rates, how much stock is held, and where<\/td>\n<\/tr>\n<tr>\n<td><strong>Capital tied up in stock<\/strong><\/td>\n<td>Stock at standard cost × cost of capital<\/td>\n<td>The cost of capital, how much stock is held<\/td>\n<\/tr>\n<tr>\n<td><strong>Transport, toll included<\/strong><\/td>\n<td>Trucks × trip and kilometre rates, toll, handling<\/td>\n<td>Truck rates, the toll, own fleet against hired trucks<\/td>\n<\/tr>\n<tr>\n<td><strong>Carbon price<\/strong><\/td>\n<td>Kilograms of CO₂e × the carbon price<\/td>\n<td>The carbon price, which trucks run, what is made where<\/td>\n<\/tr>\n<tr>\n<td><strong>Profit before overheads<\/strong><\/td>\n<td>Revenue less the six lines<\/td>\n<td>Everything above<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Offices, salaries and other overheads are not in it: no plan changes them. Stock left at the end of the year is counted as value kept, not as cost spent, so a plan that ends on more stock is not shown as cheaper than it is.<\/p>\n<h3>The direct hit, and the plan's answer<\/h3>\n<p>A price rise lands in its own line first. If the plan did nothing, a +10% purchase price would add 10% to the materials line and nothing else. The plan never does nothing: it plans the whole year again at the new price, and buys, makes, stores and moves differently where that pays. In the table the bold cell is the lever's own line; the others are the plan's answer. Some answers, from the 13 levers measured:<\/p>\n<p><strong>Raw materials +10%, prices held.<\/strong> The materials line rises €1.45M, the full 10% of €14.58M: each component has one supplier and the recipes are fixed, so there is nothing to buy around. Profit falls by the same, −€1.50M.<\/p>\n<p><strong>Demand +10%.<\/strong> Revenue grows 9.1%, not 10%: the network cannot make and move it all, so 62,706 more cases go short, and the share of truck trips hired rises from 4.7% to 13.4%. Profit +€1.98M.<\/p>\n<p><strong>Storage +50%.<\/strong> Kept as it was, the stock would cost €171k more to store. The plan holds €25k less on average and trucks more often instead: storage rises €149k, transport €67k. Profit −€220k.<\/p>\n<p><strong>Half the own fleet.<\/strong> The trips do not disappear, they are hired: the hired share goes from 4.7% to 50.3%, transport rises €321k and carbon €7k, since hired trucks are older and taxed harder.<\/p>\n<h3>Selling prices follow cost, unless they are held<\/h3>\n<p>Lindewaard prices each product at its rolled-up cost plus a target margin. Left alone, a dearer input raises the selling price with it, and because the margin is a percentage, profit goes up, not down. That is a policy on prices, not something a planner gets to assume for the coming year, so the cost levers here hold the selling prices where they were: the margin absorbs the cost. The price lever moves the margin target instead, since that is where Lindewaard's prices come from.<\/p>\n<h3>Some prices steer the plan; they are not cash<\/h3>\n<p>Three prices in the plan are not in the P&amp;L. A unit not delivered costs the plan its lost margin plus a penalty for the broken promise, times a multiplier (3 by default), so serving beats short-shipping. A DDMRP buffer breached costs the plan a penalty too. And the plan prices the carbon in what it buys, not only in what it makes and moves: a supplier with dirtier goods costs more to choose, but nobody invoices this business for its suppliers' carbon, so it is reported beside the P&amp;L as <strong>Purchase carbon<\/strong> (<code>purchase_carbon_kg<\/code>, <code>purchase_carbon_cost<\/code>), not in total cost. None of it is money anyone pays: it exists to make the plan behave, and it moves the P&amp;L only through the lines it changes.<\/p>\n<p><strong>The shortfall priced at 1× instead of 3×.<\/strong> The plan's own cost falls €1.10M, almost all of it penalty nobody pays. In money: service drops from 99.08% to 98.63%, revenue −€207k, costs −€124k; profit −€83k, inside the tolerance. The multiplier buys service, and on Lindewaard keeping it costs nothing measurable.<\/p>\n<p><strong>DDMRP buffers ignored.<\/strong> Stock carried falls €285k on average and profit rises +€137k, at practically the same service (99.08% to 99.08%). That is not a case against buffers: the plan sees one demand forecast and plans to it exactly. Buffers pay for themselves in the weeks that do not go to forecast, which a single plan cannot show; the stress test is where they earn it.<\/p>\n<p><strong>Carbon price doubled.<\/strong> The carbon line rises €147k, close to the full direct hit of €145k: little transport can be re-routed. The plan's own cost rises €948k, because it also prices the carbon in what it buys, about €801k at the published price, which the carbon line does not show.<\/p>\n<h3>Working capital is not profit<\/h3>\n<p>Average stock carried is money tied up, a balance-sheet number. What it costs the year is the capital line: stock at standard cost times the cost of capital. The table shows the stock carried beside the P&amp;L, in grey, never as a gain or a loss.<\/p>\n<h3>The same plans, read by finance<\/h3>\n<p>A finance review does not stop at profit before overheads. It asks what the plan does to gross margin, to EBITDA, to the cash tied up in the business, and whether the business earns more than its capital costs. The table's \"Financial KPIs\" view answers those for every lever, from the same plans. At the baseline: revenue €45.34M, gross margin 36.5%, EBITDA €5.09M (11.2% of revenue), working capital €3.75M, economic profit −€1.24M at a return on capital of 10.1%.<\/p>\n<p>Two levers show why the view matters:<\/p>\n<ul>\n<li><strong>The cost of capital, doubled,<\/strong> moves EBITDA by −€43k and economic profit by −€3.30M. It is a financing cost, not an operating one: it belongs below EBITDA, against all the capital the business employs, not only its stock.<\/li>\n<li><strong>Ignoring the DDMRP buffers<\/strong> frees −€252k of working capital and moves economic profit by +€106k. That is the trade the buffers' service has to justify, in the money a CFO counts.<\/li>\n<\/ul>\n<p>Lindewaard is fictional and its plan has no balance sheet, so the view needs assumptions. Only the site fixed costs are its own data; the rest are stated here and in the diagram, and none of them changes between levers:<\/p>\n<table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Value<\/th>\n<th>Basis<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Site fixed costs<\/td>\n<td>€14.60M a year: plants €10.90M (in the cost of goods), DCs €3.70M<\/td>\n<td>Lindewaard's data: its five own sites<\/td>\n<\/tr>\n<tr>\n<td>Overheads (SG&amp;A)<\/td>\n<td>12% of the baseline's revenue, €5.44M<\/td>\n<td>Assumed; no plan changes them<\/td>\n<\/tr>\n<tr>\n<td>Fixed assets<\/td>\n<td>€23.50M book value<\/td>\n<td>Assumed: each site at 25% of what a new one costs (plant €26.00M, DC €8.00M, the candidates' capex in its data)<\/td>\n<\/tr>\n<tr>\n<td>Depreciation<\/td>\n<td>€2.35M a year<\/td>\n<td>Assumed: new-site cost over 40 years, straight line<\/td>\n<\/tr>\n<tr>\n<td>Customers pay in<\/td>\n<td>45 days<\/td>\n<td>Assumed<\/td>\n<\/tr>\n<tr>\n<td>Suppliers paid in<\/td>\n<td>60 days<\/td>\n<td>Assumed<\/td>\n<\/tr>\n<tr>\n<td>Tax<\/td>\n<td>25.8%<\/td>\n<td>Dutch corporate income tax, upper rate<\/td>\n<\/tr>\n<tr>\n<td>Cost of capital<\/td>\n<td>12% a year<\/td>\n<td>The plan's own; the cost-of-capital lever moves it<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>When a change is not a finding<\/h3>\n<p>Every plan is proven to within 0.5% of the best possible, here ±€134k on the year. Two plans that differ by less than that are the same plan as far as anyone can tell, so the table writes \"within\" instead of a number. The lines inside such a plan can still move, and those moves are real: the plan found another way to the same cost.<\/p>"},{"name":"The maths","html":"<p><strong>The P&amp;L.<\/strong> With <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>R<\/mi><\/mrow><\/math> revenue and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>C<\/mi><mi>k<\/mi><\/msub><\/mrow><\/math> the six cost lines, profit before overheads is<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>&#x003A0;<\/mi><mo>&#x0003D;<\/mo><mi>R<\/mi><mo>&#x02212;<\/mo><msubsup><mo>&#x02211;<\/mo><mrow><mi>k<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><mrow><mn>6<\/mn><\/mrow><\/msubsup><msub><mi>C<\/mi><mi>k<\/mi><\/msub><mo>&#x0002B;<\/mo><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msup><mi>V<\/mi><mrow><mtext>end<\/mtext><\/mrow><\/msup><mo>&#x02212;<\/mo><msubsup><mi>V<\/mi><mn>0<\/mn><mrow><mtext>end<\/mtext><\/mrow><\/msubsup><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math><\/div>\n<p>where <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>V<\/mi><mrow><mtext>end<\/mtext><\/mrow><\/msup><\/mrow><\/math> is the value of stock left at the end of the year and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mi>V<\/mi><mn>0<\/mn><mrow><mtext>end<\/mtext><\/mrow><\/msubsup><\/mrow><\/math> the baseline's.<\/p>\n<p><strong>What the plan minimises.<\/strong> The optimiser (chapter 9) minimises <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mi>;<\/mi><mi>&#x003B8;<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>: the six cost lines of plan <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inli
