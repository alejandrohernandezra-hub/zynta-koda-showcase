ne\"><mrow><mi>x<\/mi><\/mrow><\/math> plus the penalties for shortfall and buffer breaches, at prices <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B8;<\/mi><\/mrow><\/math>. The penalties are why <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><\/mrow><\/math> is not <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>&#x003A0;<\/mi><\/mrow><\/math>, and why a lever can move profit without moving <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><\/mrow><\/math> much, or the other way round.<\/p>\n<p><strong>A lever measured.<\/strong> Moving lever <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x02113;<\/mi><\/mrow><\/math> by a step <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>&#x003B4;<\/mi><mi>&#x02113;<\/mi><\/msub><\/mrow><\/math> and planning again gives<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>&#x00394;<\/mi><msub><mi>&#x003A0;<\/mi><mi>&#x02113;<\/mi><\/msub><mo>&#x0003D;<\/mo><mi>&#x003A0;<\/mi><mspace width=\"negativethinmathspace\" /><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msup><mi>x<\/mi><mo>&#x0002A;<\/mo><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>&#x003B8;<\/mi><mo>&#x0002B;<\/mo><msub><mi>&#x003B4;<\/mi><mi>&#x02113;<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mi>;<\/mi><mspace width=\"0.167em\" /><mi>&#x003B8;<\/mi><mo>&#x0002B;<\/mo><msub><mi>&#x003B4;<\/mi><mi>&#x02113;<\/mi><\/msub><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><mo>&#x02212;<\/mo><mi>&#x003A0;<\/mi><mspace width=\"negativethinmathspace\" /><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msup><mi>x<\/mi><mo>&#x0002A;<\/mo><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>&#x003B8;<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mi>;<\/mi><mspace width=\"0.167em\" /><mi>&#x003B8;<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math><\/div>\n<p>and each cell of the table is one line's part of it: <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x00394;<\/mi><mi>R<\/mi><\/mrow><\/math> or <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>&#x00394;<\/mi><msub><mi>C<\/mi><mi>k<\/mi><\/msub><\/mrow><\/math>.<\/p>\n<p><strong>What re-planning can and cannot do.<\/strong> Let prices only rise, from <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B8;<\/mi><\/mrow><\/math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>&#x003B8;<\/mi><mi>&#x02032;<\/mi><\/msup><\/mrow><\/math>: every possible plan then costs the same or more, and the set of possible plans does not change. For the best plans <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mo>&#x0002A;<\/mo><\/msup><\/mrow><\/math> (today) and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mi>&#x02032;<\/mi><\/msup><\/mrow><\/math> (after):<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>z<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mo>&#x0002A;<\/mo><\/msup><mi>;<\/mi><mi>&#x003B8;<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.278em\" /><mo>&#x02264;<\/mo><mspace width=\"0.278em\" /><mi>z<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mi>&#x02032;<\/mi><\/msup><mi>;<\/mi><mi>&#x003B8;<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.278em\" /><mo>&#x02264;<\/mo><mspace width=\"0.278em\" /><mi>z<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mi>&#x02032;<\/mi><\/msup><mi>;<\/mi><msup><mi>&#x003B8;<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.278em\" /><mo>&#x02264;<\/mo><mspace width=\"0.278em\" /><mi>z<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><msup><mi>x<\/mi><mo>&#x0002A;<\/mo><\/msup><mi>;<\/mi><msup><mi>&#x003B8;<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math><\/div>\n<p>Re-planning lands between today's cost (left) and today's plan kept at the new prices (right): never cheaper than before, never dearer than doing nothing. Both plans are proven only to within the tolerance, so this holds to it. It is a statement about <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><\/mrow><\/math>, the plan's own cost, not about profit: a lever that also moves a shadow price (a purchase price held at agreed selling prices lowers the margin, and with it the price of a shortfall) is not a pure rise and need not obey it. A test checks the left half on every lever that only raises prices or tightens a limit; lowering the shortfall's price, the one lever that lowers a price, cuts <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><\/mrow><\/math> by far more than the tolerance, which shows the check can fail.<\/p>\n<p><strong>The financial view.<\/strong> With <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>G<\/mi><mi>M<\/mi><\/mrow><\/math> gross margin (revenue less materials, production and the plants' fixed costs), <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>O<\/mi><\/mrow><\/math> the overheads, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>F<\/mi><mrow><mi>D<\/mi><mi>C<\/mi><\/mrow><\/msub><\/mrow><\/math> the DCs' fixed costs, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><\/mrow><\/math> depreciation, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> the tax rate, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K<\/mi><\/mrow><\/math> the capital employed and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>w<\/mi><\/mrow><\/math> the cost of capital:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>EBITDA<\/mtext><mo>&#x0003D;<\/mo><mi>G<\/mi><mi>M<\/mi><mo>&#x02212;<\/mo><msub><mi>C<\/mi><mrow><mtext>store<\/mtext><\/mrow><\/msub><mo>&#x02212;<\/mo><msub><mi>C<\/mi><mrow><mtext>transport<\/mtext><\/mrow><\/msub><mo>&#x02212;<\/mo><msub><mi>C<\/mi><mrow><mtext>carbon<\/mtext><\/mrow><\/msub><mo>&#x02212;<\/mo><msub><mi>F<\/mi><mrow><mi>D<\/mi><mi>C<\/mi><\/mrow><\/msub><mo>&#x02212;<\/mo><mi>O<\/mi><mo>&#x0002B;<\/mo><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msup><mi>V<\/mi><mrow><mtext>end<\/mtext><\/mrow><\/msup><mo>&#x02212;<\/mo><msubsup><mi>V<\/mi><mn>0<\/mn><mrow><mtext>end<\/mtext><\/mrow><\/msubsup><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math><\/div>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>NOPAT<\/mtext><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mtext>EBITDA<\/mtext><mo>&#x02212;<\/mo><mi>D<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002C;<\/mo><mspace width=\"2em\" /><mi>K<\/mi><mo>&#x0003D;<\/mo><mtext>fixed&#x000A0;assets<\/mtext><mo>&#x0002B;<\/mo><mtext>stock<\/mtext><mo>&#x0002B;<\/mo><mtext>receivables<\/mtext><mo>&#x02212;<\/mo><mtext>payables<\/mtext><\/mrow><\/math><\/div>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>Economic&#x000A0;profit<\/mtext><mo>&#x0003D;<\/mo><mtext>NOPAT<\/mtext><mo>&#x02212;<\/mo><mi>w<\/mi><mspace width=\"0.167em\" /><mi>K<\/mi><\/mrow><\/math><\/div>\n<p>The plan's own capital line, stock times <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>w<\/mi><\/mrow><\/math>, is left out of EBITDA: the capital charge is counted once, on all of <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K<\/mi><\/mrow><\/math>, in economic profit.<\/p>\n<p><strong>Why levers do not add up.<\/strong> Each row is measured alone. Two levers moved together are not the sum of two rows: the plan's answer to one changes how much of the other it uses.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The levers, their steps, the runner<\/td>\n<td><code>tools/manual_levers.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>The measured plans<\/td>\n<td><code>docs/manual/data/levers.json<\/code><\/td>\n<\/tr>\n<tr>\n<td>The table and the sentences under it<\/td>\n<td><code>tools/build_manual.py<\/code> (<code>_levers<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>The financial KPIs and their assumptions<\/td>\n<td><code>tools/build_manual.py<\/code> (<code>_finance<\/code>, <code>FINANCE<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>How a plan's P&amp;L is read<\/td>\n<td><code>tools/build_showcase.py<\/code> (<code>_pnl<\/code>), the same as the stories<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Each run copies the demo workspace, empties its supply disruptions as the stories do, applies one lever and plans with the published tolerance on the stories' fixed date. The baseline run reproduces the published plan of record to the cent.<\/p>\n<p>Each sentence in \"How it works\" is generated from the stored runs, and the build refuses when the runs stop saying what the sentence says (the materials rise landing in full, dearer storage answered with trucks, and so on).<\/p>\n<p><strong>Tests that guard it.<\/strong> Every lever the runner lists has a stored run, all proven; the baseline equals the plan of record; each row's profit is its lines added up; a change inside the tolerance is flagged, not reported; no price rise made the plan's own cost fall beyond the tolerance; the cost of capital moves economic profit and not EBITDA; every lever with a direction is measured both ways; a typed chapter number in the manual's text is refused.<\/p>"}],"search":" every decision the plan weighs is priced in one line of a simple p&l: revenue, less what it costs to buy, make, store, finance and move the product, carbon included. moving a lever hits its own line first. the plan then answers, and that answer moves other lines. this chapter measures both, as a sensitivity analysis. each lever is moved alone on lindewaard's year, one way and then the other, and the year is planned again by the same engine at the same tolerance as the stories, from a profit before overheads of €25.07m. the tornado shows the profit effect of each lever both ways, largest first; the table below it breaks each effect down by p&l line, or reads it as a finance review would (gross margin, ebitda, working capital, economic profit). the p&l the plan is judged on line what is in it what moves it revenue units served × selling price demand, prices, and how much the plan can serve raw materials and packaging units bought × purchase price, orders already placed included purchase prices, recipes, how much is made production units made × conversion cost, changeovers, line maintenance, co-packer fees conversion and changeover costs, where and in what lots it is made warehousing stock × storage rate per pallet-week storage rates, how much stock is held, and where capital tied up in stock stock at standard cost × cost of capital the cost of capital, how much stock is held transport, toll included trucks × trip and kilometre rates, toll, handling truck rates, the toll, own fleet against hired trucks carbon price kilograms of co₂e × the carbon price the carbon price, which trucks run, what is made where profit before overheads revenue less the six lines everything above offices, salaries and other overheads are not in it: no plan changes them. stock left at the end of the year is counted as value kept, not as cost spent, so a plan that ends on more stock is not shown as cheaper than it is. the direct hit, and the plan's answer a price rise lands in its own line first. if the plan did nothing, a +10% purchase price would add 10% to the materials line and nothing else. the plan never does nothing: it plans the whole year again at the new price, and buys, makes, stores and moves differently where that pays. in the table the bold cell is the lever's own line; the others are the plan's answer. some answers, from the 13 levers measured: raw materials +10%, prices held. the materials line rises €1.45m, the full 10% of €14.58m: each component has one supplier and the recipes are fixed, so there is nothing to buy around. profit falls by the same, −€1.50m. demand +10%. revenue grows 9.1%, not 10%: the network cannot make and move it all, so 62,706 more cases go short, and the share of truck trips hired rises from 4.7% to 13.4%. profit +€1.98m. storage +50%. kept as it was, the stock would cost €171k more to store. the plan holds €25k less on average and trucks more often instead: storage rises €149k, transport €67k. profit −€220k. half the own fleet. the trips do not disappear, they are hired: the hired share goes from 4.7% to 50.3%, transport rises €321k and carbon €7k, since hired trucks are older and taxed harder. selling prices follow cost, unless they are held lindewaard prices each product at its rolled-up cost plus a target margin. left alone, a dearer input raises the selling price with it, and because the margin is a percentage, profit goes up, not down. that is a policy on prices, not something a planner gets to assume for the coming year, so the cost levers here hold the selling prices where they were: the margin absorbs the cost. the price lever moves the margin target instead, since that is where lindewaard's prices come from. some prices steer the plan; they are not cash three prices in the plan are not in the p&l. a unit not delivered costs the plan its lost margin plus a penalty for the broken promise, times a multiplier (3 by default), so serving beats short-shipping. a ddmrp buffer breached costs the plan a penalty too. and the plan prices the carbon in what it buys, not only in what it makes and moves: a supplier with dirtier goods costs more to choose, but nobody invoices this business for its suppliers' carbon, so it is reported beside the p&l as purchase carbon ( purchase_carbon_kg , purchase_carbon_cost ), not in total cost. none of it is money anyone pays: it exists to make the plan behave, and it moves the p&l only through the lines it changes. the shortfall priced at 1× instead of 3×. the plan's own cost falls €1.10m, almost all of it penalty nobody pays. in money: service drops from 99.08% to 98.63%, revenue −€207k, costs −€124k; profit −€83k, inside the tolerance. the multiplier buys service, and on lindewaard keeping it costs nothing measurable. ddmrp buffers ignored. stock carried falls €285k on average and profit rises +€137k, at practically the same service (99.08% to 99.08%). that is not a case against buffers: the plan sees one demand forecast and plans to it exactly. buffers pay for themselves in the weeks that do not go to forecast, which a single plan cannot show; the stress test is where they earn it. carbon price doubled. the carbon line rises €147k, close to the full direct hit of €145k: little transport can be re-routed. the plan's own cost rises €948k, because it also prices the carbon in what it buys, about €801k at the published price, which the carbon line does not show. working capital is not profit average stock carried is money tied up, a balance-sheet number. what it costs the year is the capital line: stock at standard cost times the cost of capital. the table shows the stock carried beside the p&l, in grey, never as a gain or a loss. the same plans, read by finance a finance review does not stop at profit before overheads. it asks what the plan does to gross margin, to ebitda, to the cash tied up in the business, and whether the business earns more than its capital costs. the table's \"financial kpis\" view answers those for every lever, from the same plans. at the baseline: revenue €45.34m, gross margin 36.5%, ebitda €5.09m (11.2% of revenue), working capital €3.75m, economic profit −€1.24m at a return on capital of 10.1%. two levers show why the view matters: the cost of capital, doubled, moves ebitda by −€43k and economic profit by −€3.30m. it is a financing cost, not an operating one: it belongs below ebitda, against all the capital the business employs, not only its stock. ignoring the ddmrp buffers frees −€252k of working capital and moves economic profit by +€106k. that is the trade the buffers' service has to justify, in the money a cfo counts. lindewaard is fictional and its plan has no balance sheet, so the view needs assumptions. only the site fixed costs are its own data; the rest are stated here and in the diagram, and none of them changes between levers: item value basis site fixed costs €14.60m a year: plants €10.90m (in the cost of goods), dcs €3.70m lindewaard's data: its five own sites overheads (sg&a) 12% of the baseline's revenue, €5.44m assumed; no plan changes them fixed assets €23.50m book value assumed: each site at 25% of what a new one costs (plant €26.00m, dc €8.00m, the candidates' capex in its data) depreciation €2.35m a year assumed: new-site cost over 40 years, straight line customers pay in 45 days assumed suppliers paid in 60 days assumed tax 25.8% dutch corporate income tax, upper rate cost of capital 12% a year the plan's own; the cost-of-capital lever moves it when a change is not a finding every plan is proven to within 0.5% of the best possible, here ±€134k on the year. two plans that differ by less than that are the same plan as far as anyone can tell, so the table writes \"within\" instead of a number. the lines inside such a plan can still move, and those moves are real: the plan found another way to the same cost. the p&l. with r revenue and c k the six cost lines, profit before overheads is π = r − ∑ k = 1 6 c k + ( v end − v 0 end ) where v end is the value of stock left at the end of the year and v 0 end the baseline's. what the plan minimises. the optimiser (chapter 9) minimises z ( x ; θ ) : the six cost lines of plan x plus the penalties for shortfall and buffer breaches, at prices θ . the penalties are why z is not − π , and why a lever can move profit without moving z much, or the other way round. a lever measured. moving lever ℓ by a step δ ℓ and planning again gives δ π ℓ = π ( x * ( θ + δ ℓ ) ; θ + δ ℓ ) − π ( x * ( θ ) ; θ ) and each cell of the table is one line's part of it: δ r or − δ c k . what re-planning can and cannot do. let prices only rise, from θ to θ ′ : every possible plan then costs the same or more, and the set of possible plans does not change. for the best plans x * (today) and x ′ (after): z ( x * ; θ ) ≤ z ( x ′ ; θ ) ≤ z ( x ′ ; θ ′ ) ≤ z ( x * ; θ ′ ) re-planning lands between today's cost (left) and today's plan kept at the new prices (right): never cheaper than before, never dearer than doing nothing. both plans are proven only to within the tolerance, so this holds to it. it is a statement about z , the plan's own cost, not about profit: a lever that also moves a shadow price (a purchase price held at agreed selling prices lowers the margin, and with it the price of a shortfall) is not a pure rise and need not obey it. a test checks the left half on every lever that only raises prices or tightens a limit; lowering the shortfall's price, the one lever that lowers a price, cuts z by far more than the tolerance, which shows the check can fail. the financial view. with g m gross margin (revenue less materials, production and the plants' fixed costs), o the overheads, f d c the dcs' fixed costs, d depreciation, t the tax rate, k the capital employed and w the cost of capital: ebitda = g m − c store − c transport − c carbon − f d c − o + ( v end − v 0 end ) nopat = ( ebitda − d ) ( 1 − t ) , k = fixed assets + stock + receivables − payables economic profit = nopat − w k the plan's own capital line, stock times w , is left out of ebitda: the capital charge is counted once, on all of k , in economic profit. why levers do not add up. each row is measured alone. two levers moved together are not the sum of two rows: the plan's answer to one changes how much of the other it uses. what where the levers, their steps, the runner tools/manual_levers.py the measured plans docs/manual/data/levers.json the table and the sentences under it tools/build_manual.py ( _levers ) the financial kpis and their assumptions tools/build_manual.py ( _finance , finance ) how a plan's p&l is read tools/build_showcase.py ( _pnl ), the same as the stories each run copies the demo workspace, empties its supply disruptions as the stories do, applies one lever and plans with the published tolerance on the stories' fixed date. the baseline run reproduces the published plan of record to the cent. each sentence in \"how it works\" is generated from the stored runs, and the build refuses when the runs stop saying what the sentence says (the materials rise landing in full, dearer storage answered with trucks, and so on). tests that guard it. every lever the runner lists has a stored run, all proven; the baseline equals the plan of record; each row's profit is its lines added up; a change inside the tolerance is flagged, not reported; no price rise made the plan's own cost fall beyond the tolerance; the cost of capital moves economic profit and not ebitda; every lever with a direction is measured both ways; a typed chapter number in the manual's text is refused. "},{"part":"Planning","number":"18","slug":"sustainability","title":"Sustainability (ISO 14083)","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Every trip is counted the way ISO 14083 counts it: the weight moved times the distance driven, times a published emission factor for the vehicle.<\/p>\n<div class=\"diagram\" data-diagram=\"emissions\"><\/div>"},{"name":"How it works","html":"<ul>\n<li><strong>Tonne-kilometres:<\/strong> each shipment's weight times its lane's road distance, empty runs included where charged.<\/li>\n<li><strong>Emission factor:<\/strong> a published well-to-wheel factor per vehicle type, with its source and the date it applies from. For a heavy tractor and semi-trailer on Dutch roads, the 2025 list gives 0.088 kg CO2e/tkm WTW.<\/li>\n<li><strong>The report:<\/strong> total, by lane and by carrier, with the factor and source named, so a controller can check every line.<\/li>\n<li><strong>Priced in the plan:<\/strong> carbon also carries a price in the objective, on production and transport, higher for spot hauliers. It is a planning price that steers the plan, not a tax anyone pays today.<\/li>\n<\/ul>"},{"name":"The maths","html":"<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>E<\/mi><mo>&#x0003D;<\/mo><msub><mo>&#x02211;<\/mo><mrow><mtext>trips<\/mtext><\/mrow><\/msub><mi>w<\/mi><mi>&#x000B7;<\/mi><mi>d<\/mi><mi>&#x000B7;<\/mi><msub><mi>&#x003B5;<\/mi><mi>v<\/mi><\/msub><\/mrow><\/math><\/div>\n<p>with <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>w<\/mi><\/mrow><\/math> tonnes carried, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><\/mrow><\/math> kilometres driven and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>&#x003B5;<\/mi><mi>v<\/mi><\/msub><\/mrow><\/math> the factor for vehicle type <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v<\/mi><\/mrow><\/math> in kg CO₂e per tonne-km.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Factors and tolls, dated, with sources<\/td>\n<td><code>engine/roadcost.py<\/code>, the workspace's <code>emission_factors.csv<\/code><\/td>\n<\/tr>\n<tr>\n<td>The report in a plan<\/td>\n<td><code>emissions_iso14083<\/code> in every plan the API returns<\/td>\n<\/tr>\n<tr>\n<td>How the factors were checked<\/td>\n<td><code>docs/road-cost.md<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}],"search":" every trip is counted the way iso 14083 counts it: the weight moved times the distance driven, times a published emission factor for the vehicle. tonne-kilometres: each shipment's weight times its lane's road distance, empty runs included where charged. emission factor: a published well-to-wheel factor per vehicle type, with its source and the date it applies from. for a heavy tractor and semi-trailer on dutch roads, the 2025 list gives 0.088 kg co2e/tkm wtw. the report: total, by lane and by carrier, with the factor and source named, so a controller can check every line. priced in the plan: carbon also carries a price in the objective, on production and transport, higher for spot hauliers. it is a planning price that steers the plan, not a tax anyone pays today. e = ∑ trips w · d · ε v with w tonnes carried, d kilometres driven and ε v the factor for vehicle type v in kg co₂e per tonne-km. what where factors and tolls, dated, with sources engine/roadcost.py , the workspace's emission_factors.csv the report in a plan emissions_iso14083 in every plan the api returns how the factors were checked docs/road-cost.md "},{"part":"Planning","number":"19","slug":"ai","title":"AI in the loop","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>AI explains; people and the gate decide; deterministic code writes. The picture shows every path, and which ones AI can use.<\/p>\n<div class=\"diagram\" data-diagram=\"ai-boundary\"><\/div>"},{"name":"How it works","html":"<p><strong>The explainer.<\/strong> When a master-data edit is refused or challenged, or a plan is held, the explainer says why in plain words and what to do about it. A deterministic explainer needs no key and no network; a language-model explainer can be switched on. Either way it reads the result and writes nothing. On a private workspace it runs only with the data owner's recorded consent.<\/p>\n<p><strong>The MCP server<\/strong> lets an AI assistant (Claude Desktop, Claude Code and others) read the published plans and ask what-ifs:<\/p>\n<ul>\n<li>list the stories, explain a plan, list its exceptions, give the KPI definitions;<\/li>\n<li>solve a scenario with one decision switched on, on a scratch copy;<\/li>\n<li>trace which orders a supply event puts at risk.<\/li>\n<\/ul>\n<p>It runs locally, next to the data, in its own environment.<\/p>\n<p><strong>Why it cannot write.<\/strong> No tool edits master data; no tool commits a schedule. A test calls every tool with the master-data editor, the table writer and every schedule store rigged to fail, and none fails; another checks that the server never imports a write path.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Explainer (deterministic and language model)<\/td>\n<td><code>engine/explain.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Consent for a private workspace<\/td>\n<td><code>engine/workspace.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>MCP server and its tools<\/td>\n<td><code>tools/mcp_server.py<\/code>, <code>docs/mcp.md<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}],"search":" ai explains; people and the gate decide; deterministic code writes. the picture shows every path, and which ones ai can use. the explainer. when a master-data edit is refused or challenged, or a plan is held, the explainer says why in plain words and what to do about it. a deterministic explainer needs no key and no network; a language-model explainer can be switched on. either way it reads the result and writes nothing. on a private workspace it runs only with the data owner's recorded consent. the mcp server lets an ai assistant (claude desktop, claude code and others) read the published plans and ask what-ifs: list the stories, explain a plan, list its exceptions, give the kpi definitions; solve a scenario with one decision switched on, on a scratch copy; trace which orders a supply event puts at risk. it runs locally, next to the data, in its own environment. why it cannot write. no tool edits master data; no tool commits a schedule. a test calls every tool with the master-data editor, the table writer and every schedule store rigged to fail, and none fails; another checks that the server never imports a write path. what where explainer (deterministic and language model) engine/explain.py consent for a private workspace engine/workspace.py mcp server and its tools tools/mcp_server.py , docs/mcp.md "},{"part":"Using it","number":"20","slug":"control-tower","title":"Control Tower tour","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>The Control Tower is the planner's screen: one page that runs the engine, shows what needs a decision, and opens every tool. A walk through it, top to bottom.<\/p>\n<div class=\"story\"><div class=\"stage\"><div class=\"diagram\" data-diagram=\"tower\" data-story=\"1\"><\/div><\/div><div class=\"steps\"><div class=\"step\" data-state=\"pick\"><p><strong>Pick a company and a story.<\/strong> Two fictional companies, Lindewaard in the Netherlands and Ashford in the US, each with its disruption stories. A story is a plan already made, so it opens at once.<\/p><\/div><div class=\"step\" data-state=\"sandbox\"><p><strong>The sidebar is a sandbox.<\/strong> 10 review sections sit on the page; the levers sit in the sidebar: the scenario branch, the carbon price, the S&amp;OP gate's thresholds and the planning altitude.<\/p><\/div><div class=\"step\" data-state=\"run\"><p><strong>Run the plan.<\/strong> The button sends the sandbox to the planning service. A plan comes back with the gate's verdict: released, held for a person, or rejected.<\/p><\/div><div class=\"step\" data-state=\"read\"><p><strong>Read what needs a decision.<\/strong> Exceptions come worst first, each with why it matters and what to do. Beside them, promise an order from the plan's own stock.<\/p><\/div><div class=\"step\" data-state=\"reviews\"><p><strong>Then the reviews, at three altitudes.<\/strong> What each function decides, where the functions disagree, and the few decisions leadership must take, with the money attached.<\/p><\/div><div class=\"step\" data-state=\"tools\"><p><strong>The tools sit on the same page.<\/strong> Edit master data and see the effect before saving, trace a disruption to the orders it hits, redesign the network.<\/p><\/div><div class=\"step\" data-state=\"learn\"><p><strong>And Learn explains each idea<\/strong>, beside the feature it belongs to, with a question to check yourself.<\/p><\/div><\/div><\/div>\n<p>The Control Tower never computes a number the engine owns. It shows what the plan says, and it compares figures with their targets.<\/p>\n<p>This chapter is the tour. Every input, option and consequence is in the four that follow: the sidebar setting by setting (chapter 21), running a plan and reading each review (chapter 22), editing master data (chapter 23), and impact tracing and network design (chapter 24).<\/p>"},{"name":"How it works","html":"<h3>The sidebar: the scenario sandbox<\/h3>\n<table>\n<thead>\n<tr>\n<th>Group<\/th>\n<th>What it sets<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Scenario sandbox<\/td>\n<td>The company, the scenario branch a run writes to, and whether an approved plan is committed to the live branch<\/td>\n<\/tr>\n<tr>\n<td>ESG carbon taxation<\/td>\n<td>The carbon price, the multiplier on spot hauliers, an optional hard carbon budget<\/td>\n<\/tr>\n<tr>\n<td>Virtual IBP gates<\/td>\n<td>The S&amp;OP gate's thresholds: minimum service, margin at risk, spot haulier share, open demand disputes<\/td>\n<\/tr>\n<tr>\n<td>Planning altitude<\/td>\n<td>Operational, tactical or strategic, and whether to plan in layers<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>A run writes only to its own scenario branch. A schedule is committed only on the branch named LIVE, with live commit armed, and only when the S&amp;OP gate releases the plan; asking for live on any other branch is refused.<\/p>\n<h3>The page, top to bottom<\/h3>\n<ol>\n<li><strong>Workspace and story.<\/strong> Pick one; the plan, its map and its money open at once, from the published plans.<\/li>\n<li><strong>Run optimization<\/strong>, <strong>Refresh DDMRP buffers<\/strong>, <strong>Clear.<\/strong> The first two call the planning service; the first visit after an update wakes it, which takes up to a minute, and the page says so.<\/li>\n<li><strong>What needs a decision.<\/strong> Exceptions worst first, each with <em>why<\/em> and <em>do<\/em>. Under each plan, <strong>Promise an order<\/strong>: a product, a site, a quantity and a date in, a promise out, from the same code the engine uses.<\/li>\n<li><strong>The review bar<\/strong>, 10 sections:<\/li>\n<\/ol>\n<div class=\"diagram\" data-diagram=\"tower-sections\"><\/div>\n<h3>Reviews at three altitudes<\/h3>\n<p>The same plan answers three different questions, so it is shown three ways rather than as a wall of tabs:<\/p>\n<ul>\n<li><strong>Functional reviews<\/strong>, one per function (demand, supply, logistics, inventory, procurement): its own KPIs, its own owner, its own exceptions.<\/li>\n<li><strong>Pre-S&amp;OP reconciliation<\/strong>: only what one function cannot settle alone.<\/li>\n<li><strong>Executive review<\/strong>: only what is critical, in money.<\/li>\n<\/ul>\n<p>A KPI carries an owner, a target and a direction, and scores itself on track, watch or off track. A test checks every review figure is the plan's own value, and that a figure shown at two altitudes is the same number.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The page<\/td>\n<td><code>app.py<\/code> (Streamlit), <code>streamlit_app.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Review layer<\/td>\n<td><code>engine/review.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Promise an order<\/td>\n<td><code>engine/atp.py<\/code>, loaded by the page on its own<\/td>\n<\/tr>\n<tr>\n<td>Lessons<\/td>\n<td><code>help_center.py<\/code>, <code>docs/help/<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The page reads the planning service at <code>API_BASE_URL<\/code>. Its section names and descriptions on this page are read from <code>app.py<\/code> when the manual is built.<\/p>"}],"search":" the control tower is the planner's screen: one page that runs the engine, shows what needs a decision, and opens every tool. a walk through it, top to bottom. pick a company and a story. two fictional companies, lindewaard in the netherlands and ashford in the us, each with its disruption stories. a story is a plan already made, so it opens at once. the sidebar is a sandbox. 10 review sections sit on the page; the levers sit in the sidebar: the scenario branch, the carbon price, the s&op gate's thresholds and the planning altitude. run the plan. the button sends the sandbox to the planning service. a plan comes back with the gate's verdict: released, held for a person, or rejected. read what needs a decision. exceptions come worst first, each with why it matters and what to do. beside them, promise an order from the plan's own stock. then the reviews, at three altitudes. what each function decides, where the functions disagree, and the few decisions leadership must take, with the money attached. the tools sit on the same page. edit master data and see the effect before saving, trace a disruption to the orders it hits, redesign the network. and learn explains each idea , beside the feature it belongs to, with a question to check yourself. the control tower never computes a number the engine owns. it shows what the plan says, and it compares figures with their targets. this chapter is the tour. every input, option and consequence is in the four that follow: the sidebar setting by setting (chapter 21), running a plan and reading each review (chapter 22), editing master data (chapter 23), and impact tracing and network design (chapter 24). the sidebar: the scenario sandbox group what it sets scenario sandbox the company, the scenario branch a run writes to, and whether an approved plan is committed to the live branch esg carbon taxation the carbon price, the multiplier on spot hauliers, an optional hard carbon budget virtual ibp gates the s&op gate's thresholds: minimum service, margin at risk, spot haulier share, open demand disputes planning altitude operational, tactical or strategic, and whether to plan in layers a run writes only to its own scenario branch. a schedule is committed only on the branch named live, with live commit armed, and only when the s&op gate releases the plan; asking for live on any other branch is refused. the page, top to bottom workspace and story. pick one; the plan, its map and its money open at once, from the published plans. run optimization , refresh ddmrp buffers , clear. the first two call the planning service; the first visit after an update wakes it, which takes up to a minute, and the page says so. what needs a decision. exceptions worst first, each with why and do . under each plan, promise an order : a product, a site, a quantity and a date in, a promise out, from the same code the engine uses. the review bar , 10 sections: reviews at three altitudes the same plan answers three different questions, so it is shown three ways rather than as a wall of tabs: functional reviews , one per function (demand, supply, logistics, inventory, procurement): its own kpis, its own owner, its own exceptions. pre-s&op reconciliation : only what one function cannot settle alone. executive review : only what is critical, in money. a kpi carries an owner, a target and a direction, and scores itself on track, watch or off track. a test checks every review figure is the plan's own value, and that a figure shown at two altitudes is the same number. what where the page app.py (streamlit), streamlit_app.py review layer engine/review.py promise an order engine/atp.py , loaded by the page on its own lessons help_center.py , docs/help/ the page reads the planning service at api_base_url . its section names and descriptions on this page are read from app.py when the manual is built. "},{"part":"Using it","number":"21","slug":"tower-sidebar","title":"The sidebar, setting by setting","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>The sidebar is where a planner sets the question before asking it. Nothing in it changes a table: every setting is a field of the request the Control Tower sends to the planning service when you press <strong>Run optimization<\/strong>, and it applies to that run only. There are five groups, top to bottom: which data and which branch, the carbon price, the S&amp;OP gate's thresholds, how large a question to ask, and the solver.<\/p>\n<p>Every effect below was measured the way a visitor would see it: the hosted default plan (the operational profile, 10 buckets ahead) on Lindewaard, one setting moved at a time, the rest left at their defaults. The baseline costs €694k over the horizon at 100.00% service and answers in 4 s; a difference inside ±€83k is the solver's tolerance, not the setting.<\/p>"},{"name":"How it works","html":"<h3>Five questions, one group each<\/h3>\n<p>Each group of the sidebar answers one question a planner asks before planning. The names on screen are the engine's own; here is what they mean in everyday planning terms.<\/p>\n<table>\n<thead>\n<tr>\n<th>Group on screen<\/th>\n<th>The question it answers<\/th>\n<th>In everyday planning terms<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Scenario sandbox<\/strong><\/td>\n<td>Whose data, and where does this plan live?<\/td>\n<td>A planning version: the live one execution follows, and simulation copies beside it<\/td>\n<\/tr>\n<tr>\n<td><strong>ESG carbon taxation<\/strong><\/td>\n<td>What is a kilogram of CO₂ worth to this business?<\/td>\n<td>An internal carbon price, and if wanted a hard cap on emissions<\/td>\n<\/tr>\n<tr>\n<td><strong>Virtual IBP gates<\/strong><\/td>\n<td>Which plans may go out without a meeting?<\/td>\n<td>The S&amp;OP sign-off rules, applied by the engine on every run<\/td>\n<\/tr>\n<tr>\n<td><strong>Planning altitude<\/strong><\/td>\n<td>How far ahead, and in how much detail?<\/td>\n<td>Operational, tactical or strategic planning<\/td>\n<\/tr>\n<tr>\n<td><strong>Solver<\/strong><\/td>\n<td>How sure must the answer be, and against what demand?<\/td>\n<td>The optimiser's tolerance, and a stress test against high demand<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Every setting at a glance<\/h3>\n<p>Read from the Control Tower's own code when this page is built, so it cannot drift from the screen.<\/p>\n<table>\n<thead>\n<tr>\n<th>Setting<\/th>\n<th>Default<\/th>\n<th>Control and range<\/th>\n<th>The screen's help text<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Workspace<\/strong><\/td>\n<td>—<\/td>\n<td>list: the workspaces offered<\/td>\n<td>Whose tables to plan on. Each workspace keeps its own master data, change log and committed plans.<\/td>\n<\/tr>\n<tr>\n<td><strong>Network<\/strong><\/td>\n<td>ZYNTA_KODA<\/td>\n<td>choice: ZYNTA_KODA, REFERENCE<\/td>\n<td>ZYNTA_KODA is the full Master Data Dictionary network; REFERENCE is the small fixture the unit tests pin constraints against.<\/td>\n<\/tr>\n<tr>\n<td><strong>Scenario branch<\/strong><\/td>\n<td>SANDBOX<\/td>\n<td>list: LIVE, BASELINE, SANDBOX, Custom…<\/td>\n<td>Where a run's committed plans are kept, so two planners never overwrite each other. A branch changes no data: to plan an event, open a story, trace it under Impact tracing, or edit master data.<\/td>\n<\/tr>\n<tr>\n<td><strong>Custom scenario_id<\/strong><\/td>\n<td>SANDBOX-2<\/td>\n<td>text: up to 64 characters<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Arm live commit<\/strong><\/td>\n<td>off<\/td>\n<td>switch<\/td>\n<td>Commits the approved schedule to the live branch (kept in Postgres when the service has a database; in memory otherwise).<\/td>\n<\/tr>\n<tr>\n<td><strong>Carbon price (€/kg CO₂e)<\/strong><\/td>\n<td>the workspace's own price<\/td>\n<td>slider: 0 to 0.5<\/td>\n<td>Starts at this workspace's own price, … a tonne, from its planning parameters.<\/td>\n<\/tr>\n<tr>\n<td><strong>Spot 3PL tax multiplier<\/strong><\/td>\n<td>3<\/td>\n<td>slider: 1 to 6<\/td>\n<td>Spot fleets are taxed harder than internal fleets.<\/td>\n<\/tr>\n<tr>\n<td><strong>Enforce a hard carbon budget<\/strong><\/td>\n<td>off<\/td>\n<td>tick box<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Carbon budget (kg CO₂e)<\/strong><\/td>\n<td>empty<\/td>\n<td>number: from 0<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Min service level (%)<\/strong><\/td>\n<td>97<\/td>\n<td>slider: 80 to 100<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Max margin at risk (% of margin achievable)<\/strong><\/td>\n<td>2<\/td>\n<td>slider: 0 to 10<\/td>\n<td>A plan that puts more of its achievable margin at risk than this is held for a person to decide. Your own setting: 2% by default.<\/td>\n<\/tr>\n<tr>\n<td><strong>Cost of capital (% a year)<\/strong><\/td>\n<td>12<\/td>\n<td>slider: 0 to 25<\/td>\n<td>Charged against every unit held. Leaving it at zero makes holding stock look cheaper than moving it.<\/td>\n<\/tr>\n<tr>\n<td><strong>Max methodology disputes<\/strong><\/td>\n<td>0<\/td>\n<td>number: from 0<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Max spot 3PL share (%)<\/strong><\/td>\n<td>20<\/td>\n<td>slider: 0 to 100<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Profile<\/strong><\/td>\n<td>depends on where it runs<\/td>\n<td>choice: OPERATIONAL, TACTICAL, STRATEGIC<\/td>\n<td>How long a plan may take is a property of the decision it supports. Operational freezes the committed window, shortens the horizon and relaxes pallet counts; strategic opens everything.<\/td>\n<\/tr>\n<tr>\n<td><strong>Plan in layers<\/strong><\/td>\n<td>Auto<\/td>\n<td>list: Auto, On, Off<\/td>\n<td>Layers: the year per product family (one liquid on one line), then each product for the first four weeks. Auto plans a full year in layers above 8 finished products, where one plan in full detail finds nothing in time (15 products: no plan in 30 minutes; in layers 21 s). The demo companies have 5 products, so Auto plans them in full detail; choose On to see the layers.<\/td>\n<\/tr>\n<tr>\n<td><strong>Reuse the last plan of record (faster)<\/strong><\/td>\n<td>off<\/td>\n<td>switch<\/td>\n<td>Skip re-solving the plan of record and replan against the last one this engine proved for this profile. Seconds instead of minutes on a full year; see the note below.<\/td>\n<\/tr>\n<tr>\n<td><strong>Optimality gap<\/strong><\/td>\n<td>1%<\/td>\n<td>slider: prove it, 0.5%, 1.0%, 2.0%, 5.0%<\/td>\n<td>The inputs are a forecast. 1% solves in seconds; proving optimality takes minutes and buys about 0.3%.<\/td>\n<\/tr>\n<tr>\n<td><strong>Stress the plan against the P90<\/strong><\/td>\n<td>on for OPERATIONAL<\/td>\n<td>switch<\/td>\n<td>Plan on the P50, then re-solve against the top of the forecast band with production and purchasing inside the supply lead time pinned. One extra solve, and it answers the question the plan otherwise cannot: how wrong can this be, and who loses. On a full year it roughly doubles the wait.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Scenario sandbox: which data, which branch<\/h3>\n<blockquote>\n<p>Like a planning version: try plans here without touching execution. Only the LIVE branch, with commit armed, can write to the factory schedule.<\/p>\n<\/blockquote>\n<p><strong>What it is.<\/strong> A planner needs a place to try things that execution will not act on, much like the active planning version and the simulation versions of an APS such as SAP APO or IBP. Here that place is a <strong>branch<\/strong>:<\/p>\n<ul>\n<li>Every plan you run is filed under a branch, and plans committed on it are kept apart from every other branch's, so two planners never overwrite each other's schedule.<\/li>\n<li><strong>LIVE<\/strong> is the branch connected to execution, and even there nothing is published unless you arm it on purpose.<\/li>\n<li>Every other branch is a <strong>sandbox<\/strong>: the worst a bad plan can do there is be looked at.<\/li>\n<li>A branch changes <strong>no data<\/strong>. The products, sites and prices underneath are the <strong>workspace<\/strong>'s one set of tables: one company, with its own master data, history and committed plans.<\/li>\n<\/ul>\n<p><strong>The settings<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Setting<\/th>\n<th>Default and options<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Workspace<\/strong><\/td>\n<td>Lindewaard; or Ashford Brookvale Foods (shown only where the service offers more than one)<\/td>\n<td>Whose tables to plan on. The currency follows the workspace. Switching clears the plan on screen, so one company's plan is never shown under another's name<\/td>\n<\/tr>\n<tr>\n<td><strong>Network<\/strong><\/td>\n<td>ZYNTA_KODA; or REFERENCE<\/td>\n<td>The full network in the workspace's tables, or a small fixed network the unit tests pin constraints against<\/td>\n<\/tr>\n<tr>\n<td><strong>Scenario branch<\/strong><\/td>\n<td>SANDBOX; or LIVE, BASELINE, <strong>Custom…<\/strong><\/td>\n<td>The branch the run is filed under. <strong>Custom…<\/strong> opens <strong>Custom scenario_id<\/strong> for a name of your own (up to 64 characters)<\/td>\n<\/tr>\n<tr>\n<td><strong>Arm live commit<\/strong><\/td>\n<td>off; shown only on LIVE<\/td>\n<td>On, a plan that passes every S&amp;OP check is written to the live schedule (kept in Postgres when the service has a database, in memory otherwise), and the sidebar warns that an AUTO_COMMIT verdict will publish to the floor<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Measured on Lindewaard<\/strong><\/p>\n<ul>\n<li>REFERENCE: Planned on the defaults it is a different, much smaller company: €62k over 10 buckets, in 0.3 s, and it ignores the workspace. There is no reason to plan on it except to see the engine on a network small enough to check by hand.<\/li>\n<\/ul>\n<p><strong>Watch out<\/strong><\/p>\n<ul>\n<li><strong>A branch is not a scenario.<\/strong> To plan a disruption, use a story (chapter 13), <strong>Impact tracing<\/strong> (chapter 24) or a master-data edit (chapter 23). An edit changes the workspace for every branch, not only this one.<\/li>\n<li><strong>Fixed 20 Oct:<\/strong> the list used to offer WHATIF-PORT-STRIKE (the default), WHATIF-CARBON-SHOCK and WHATIF-COPACKER-OUTAGE, which planned exactly the same data as BASELINE: names that promised an event with nothing behind them. They are gone, and the branch's help now says a branch changes no data.<\/li>\n<\/ul>\n<h3>ESG carbon taxation<\/h3>\n<blockquote>\n<p>An internal carbon price trades emissions against cost; the budget below is a hard cap that does not trade at all.<\/p>\n<\/blockquote>\n<p><strong>What it is.<\/strong> ESG stands for environmental, social and governance; this group is the environmental part, what the plan should do about the carbon it causes. Two different tools:<\/p>\n<ul>\n<li><strong>A carbon price<\/strong> is an internal tax. Each kilogram costs the plan money it pays nobody, so a lower-carbon option wins whenever it is cheap enough, and a dirtier one still wins when it is worth the difference. Companies set such a price so that emissions compete with cost in every decision, not only in the annual report.<\/li>\n<li><strong>A carbon budget<\/strong> is a cap. The plan may not emit more, whatever it costs, down to not making what customers ordered.<\/li>\n<\/ul>\n<p><strong>The settings<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Setting<\/th>\n<th>Default and range<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Carbon price<\/strong> (per kg CO₂e)<\/td>\n<td>the workspace's own price; 0 to 0.50<\/td>\n<td>Prices every kilogram the plan emits making and moving goods, and every kilogram in what it buys, inside the cost the plan minimises<\/td>\n<\/tr>\n<tr>\n<td><strong>Spot 3PL tax multiplier<\/strong><\/td>\n<td>3; 1 to 6<\/td>\n<td>How much harder carbon is priced on hired spot trucks than on the own fleet (1×); contracted hauliers are priced at 1.5×<\/td>\n<\/tr>\n<tr>\n<td><strong>Enforce a hard carbon budget<\/strong><\/td>\n<td>off<\/td>\n<td>Ticked, opens <strong>Carbon budget (kg CO₂e)<\/strong>: production and transport emissions over the whole horizon may not exceed it. Bought-in materials are not counted<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Where each part of the price lands:<\/p>\n<ul>\n<li><strong>Making and moving:<\/strong> in the plan's total cost, as its <strong>Carbon price<\/strong> line.<\/li>\n<li><strong>What is bought:<\/strong> steers which supplier the plan chooses, but is reported beside total cost, not in it, because nobody invoices this business for its suppliers' emissions (chapter 17).<\/li>\n<li><strong>The starting price<\/strong> is the workspace's <code>carbon_tax_per_kg<\/code> planning parameter: 0.085 on both demo companies, €85 a tonne for Lindewaard and $85 for Ashford. The help text says it in the workspace's currency, and switching workspace resets it.<\/li>\n<\/ul>\n<p><strong>Measured on Lindewaard<\/strong> (28-day plan)<\/p>\n<ul>\n<li><strong>Carbon price at 0:<\/strong> −€7k, inside the ±€83k tolerance against the baseline; at the top, 0.50: +€33k, inside the ±€83k tolerance. Four weeks leave little room to re-route, so the price mostly lands as cost.<\/li>\n<li><strong>Spot multiplier:<\/strong> at 1× the plan costs −€510, inside the ±€83k tolerance; at 6×, +€10, inside the ±€83k tolerance. The plan hires almost no spot trucks (0.4% of trips), so there is little for it to act on; on a plan that hires more, it pushes volume back onto the own fleet.<\/li>\n<li><strong>Carbon budget:<\/strong> the plan emits 78,943 kg in production and transport; a budget of 71,048 kg holds them to 70,333 kg at 100.00% service, and the plan costs −€14k, inside the ±€83k tolerance. A budget much tighter than that is met by making less.<\/li>\n<\/ul>\n<p><strong>Watch out<\/strong><\/p>\n<ul>\n<li><strong>The spot multiplier is a policy, not a measurement.<\/strong> It comes from the engine's specification: a spot truck's kilograms are reported as they are, only the price on them is higher, which steers volume onto trucks the business runs or contracts.<\/li>\n<li><strong>Set a budget against a number, not a guess.<\/strong> The box starts empty, and the caption above it says what your last run emitted and over how many days; before your first run it says to run without a budget first.<\/li>\n<li><strong>Fixed 20 Oct:<\/strong> the price started at a typed 0.085 and said \"$85\" on a euro workspace. The budget started at 16,500 kg, far below what this network emits in four weeks: ticking it cut service from 100.00% to 70.62%, cost fell to €527k because the plan made less, and the S&amp;OP gate held it (fails on service and margin at risk).<\/li>\n<\/ul>\n<h3>Virtual IBP gates: when a plan is released<\/h3>\n<blockquote>\n<p>The S&amp;OP sign-off limits, applied on every run: a plan inside them is released, one outside them is held for a person to decide.<\/p>\n<\/blockquote>\n<p><strong>What it is.<\/strong> Integrated business planning (IBP) is S&amp;OP grown up: the monthly process where demand, supply and finance agree one plan, and leadership signs off what could not be agreed lower down. Most plans do not need that meeting, because they sit inside limits everyone has already agreed. <strong>Virtual<\/strong> means the engine applies those limits itself, on every run, the moment a plan is made:<\/p>\n<table>\n<thead>\n<tr>\n<th>Verdict<\/th>\n<th>When<\/th>\n<th>What happens<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>AUTO_COMMIT<\/strong><\/td>\n<td>Every check passes<\/td>\n<td>Released on its own (written to the schedule only on LIVE, armed)<\/td>\n<\/tr>\n<tr>\n<td><strong>HOLD_FOR_SNOP<\/strong><\/td>\n<td>Any check fails<\/td>\n<td>Held for people, each broken limit named and measured<\/td>\n<\/tr>\n<tr>\n<td><strong>REJECT<\/strong><\/td>\n<td>No usable plan, or planned margin below 5% of the margin achievable<\/td>\n<td>Rejected outright<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>People agree the limits once; the engine enforces them every time, and the meeting spends its time on the plans that need it. That is management by exception, and it is what \"a person decides\" means in this engine (the gate itself is chapter 14).<\/p>\n<p><strong>The settings.<\/strong> The sliders are the limits. <strong>They never change the plan, only the verdict on it<\/strong>: measured, moving any of them leaves the plan identical to the cent.<\/p>\n<table>\n<thead>\n<tr>\n<th>Setting<\/th>\n<th>Default and range<\/th>\n<th>The check<\/th>\n<th>Holds the plan when<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Min service level (%)<\/strong><\/td>\n<td>97, 80 to 100<\/td>\n<td>Service by value against the promise<\/td>\n<td>service falls below it<\/td>\n<\/tr>\n<tr>\n<td><strong>Max margin at risk (% of margin achievable)<\/strong><\/td>\n<td>2, 0 to 10<\/td>\n<td>Margin on unserved demand plus its penalty, as a share of the margin the plan could earn<\/td>\n<td>the share exceeds it<\/td>\n<\/tr>\n<tr>\n<td><strong>Max methodology disputes<\/strong><\/td>\n<td>0, from 0<\/td>\n<td>Forecasts that differ from the engine's baseline by more than ±25% with no promotion to explain them<\/td>\n<td>there are more disputes than this<\/td>\n<\/tr>\n<tr>\n<td><strong>Max spot 3PL share (%)<\/strong><\/td>\n<td>20, 0 to 100<\/td>\n<td>Share of truck trips on hired spot trucks<\/td>\n<td>the share exceeds it<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Two checks have no slider:<\/p>\n<ul>\n<li><strong>Proven:<\/strong> the plan must be proven within its gap; a plan stopped by the clock is held.<\/li>\n<li><strong>Margin floor:<\/strong> planned margin must be at least 18% of the achievable margin.<\/li>\n<\/ul>\n<p><strong>Cost of capital (% a year)<\/strong> sits in this group but is not a limit: it is a price. It charges for the money tied up in every unit held (at standard cost), so it moves the plan, not the verdict.<\/p>\n<p><strong>Measured on Lindewaard<\/strong><\/p>\n<ul>\n<li><strong>The full-year plan of record<\/strong> serves 99.08% with 4.7% of trips hired: released at the defaults; a <strong>Min service level<\/strong> of 99.5% or a <strong>Max spot 3PL share<\/strong> of 5% would hold it.<\/li>\n<li><strong>Cost of capital at 0%:<\/strong> the plan costs −€13k, inside the ±€83k tolerance; at 25%, +€13k, inside the ±€83k tolerance.<\/li>\n<\/ul>\n<p><strong>Watch out<\/strong><\/p>\n<ul>\n<li><strong>Cost of capital at zero<\/strong> makes holding stock look cheaper than moving it, and the plan builds stock it should not.<\/li>\n<\/ul>\n<h3>Planning altitude: how large a question<\/h3>\n<blockquote>\n<p>How far ahead and in how much detail: the weeks being executed, the planning year, or the network itself.<\/p>\n<\/blockquote>\n<p><strong>What it is.<\/strong> The same network is planned at three altitudes. Further ahead the forecast is less certain, so planning it in days would be precision nobody has, at the price of a model many times larger.<\/p>\n<ul>\n<li><strong>Operational:<\/strong> the next weeks, in days, where a decision is about to be executed and detail matters.<\/li>\n<li><strong>Tactical:<\/strong> the year, in weeks and then months, for capacity, stock build and purchasing.<\/li>\n<li><strong>Strategic:<\/strong> the network itself, which sites to have.<\/li>\n<\/ul>\n<p><strong>The settings<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Profile<\/th>\n<th>Horizon and grain<\/th>\n<th>Committed<\/th>\n<th>Gap<\/th>\n<th>Time limit<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>OPERATIONAL<\/strong><\/td>\n<td>Days at the front, then weeks: about 28 days<\/td>\n<td>the first bucket<\/td>\n<td>10%<\/td>\n<td>4 s<\/td>\n<\/tr>\n<tr>\n<td><strong>TACTICAL<\/strong><\/td>\n<td>A full year: a week of days, seven weeks, then months<\/td>\n<td>the first bucket<\/td>\n<td>5%<\/td>\n<td>600 s<\/td>\n<\/tr>\n<tr>\n<td><strong>STRATEGIC<\/strong><\/td>\n<td>A full year, sites themselves open to decision<\/td>\n<td>nothing<\/td>\n<td>2%<\/td>\n<td>1500 s<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>Setting<\/th>\n<th>Default and options<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Plan in layers<\/strong><\/td>\n<td>Auto; On, Off<\/td>\n<td>Plans the year per product family first, then each product for the first four weeks (chapter 9). <strong>Auto<\/strong> layers only above 8 finished products, so both demo companies are planned in full detail; <strong>On<\/strong> forces layers to show them<\/td>\n<\/tr>\n<tr>\n<td><strong>Reuse the last plan of record (faster)<\/strong><\/td>\n<td>off<\/td>\n<td>Skips the first of a plan's two solves (below). Disabled on STRATEGIC, which commits nothing<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>A plan is normally solved twice: first the whole horizon with nothing committed (the <strong>plan of record<\/strong>), then again with the committed window held to it. <strong>Reuse<\/strong> holds the window to the last plan of record this engine proved for this profile, so only the second solve runs: seconds instead of minutes on a full year.<\/p>\n<p><strong>Measured on Lindewaard<\/strong><\/p>\n<ul>\n<li><strong>Operational:<\/strong> 4 s. <strong>Tactical<\/strong>, a full year: 122 s, at 99.08% service; about three minutes on the hosted service.<\/li>\n<li><strong>Layers On<\/strong>, full year: the year in 14 s instead of 122 s, but +€1.36M in cost, 98.04% service instead of 99.08%, and the S&amp;OP gate holds it (margin at risk, disputes). Layers buy speed with detail; on five products, full detail is affordable and better, which is why Auto does not layer them.<\/li>\n<\/ul>\n<p><strong>Watch out<\/strong><\/p>\n<ul>\n<li><strong>The hosted Control Tower starts on OPERATIONAL<\/strong> because it answers in seconds; locally it starts on TACTICAL. Operational also lets pallet counts fall out of the shipment rather than be decided one by one.<\/li>\n<li><strong>Keep the page open on a full year:<\/strong> a phone that locks its screen drops the connection.<\/li>\n<li><strong>Reuse can lag a setting.<\/strong> If the carbon price or cost of capital changed since the plan of record, the committed window still reflects the old one, and the result says so. With no plan of record yet, or master data changed since, it solves fresh and says why.<\/li>\n<\/ul>\n<h3>Solver<\/h3>\n<blockquote>\n<p>The optimiser proves how far its plan can be from the best possible: that distance is the gap.<\/p>\n<\/blockquote>\n<p><strong>What it is.<\/strong> The engine plans with a mathematical optimiser: a mixed-integer program, solved by CBC (chapter 9).<\/p>\n<ul>\n<li>It searches for the <strong>cheapest plan<\/strong> that keeps every constraint, and alongside it proves a <strong>bound<\/strong>, the least any plan could possibly cost.<\/li>\n<li>The <strong>optimality gap<\/strong> is the distance between the two: a plan proven within 1% cannot be more than 1% dearer than the best plan that exists.<\/li>\n<li>The <strong>P90 stress test<\/strong> asks a different question: not how good the plan is, but how it holds if demand comes in high, at the level actual demand should stay under nine times in ten.<\/li>\n<\/ul>\n<p><strong>The settings<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Setting<\/th>\n<th>Default and options<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Optimality gap<\/strong><\/td>\n<td>1%; prove it, 0.5%, 1%, 2%, 5%<\/td>\n<td>Applies <strong>only to Network design<\/strong> (chapter 24)<\/td>\n<\/tr>\n<tr>\n<td><strong>Stress the plan against the P90<\/strong><\/td>\n<td>on for OPERATIONAL, off otherwise<\/td>\n<td>Solves the plan on the middle of the forecast (P50), then again against the top of the band with production and purchasing inside the supply lead time held where they are; reports what could not be fixed in time and whose orders lose (Executive review, chapter 22)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Why the gap slider applies only to network design:<\/p>\n<ul>\n<li><strong>Plans<\/strong> solve to their profile's own gap (table above), because a profile sets its gap and its time limit together, for how long that horizon may take; the slider would move one without the other.<\/li>\n<li><strong>A design<\/strong> uses the slider because the gap decides what it can tell apart: two networks closer than the gap are reported as no difference.<\/li>\n<\/ul>\n<p><strong>Measured on Lindewaard<\/strong><\/p>\n<ul>\n<li><strong>Stress test:<\/strong> Measured on the 28-day default: demand +13.0% at the P90, service 97.46% instead of 100.00%, €145k of margin at risk, with 21 days of supply already spent.<\/li>\n<\/ul>\n<p><strong>Watch out<\/strong><\/p>\n<ul>\n<li><strong>The stress test roughly doubles the wait on a full year<\/strong>, which is why it is off by default there.<\/li>\n<\/ul>\n<h3>What is not a setting<\/h3>\n<p>The sidebar sets the question; it does not change Lindewaard. Sites, products, prices, lead times, recipes and customers' terms are master data (chapter 23); disruptions are stories or impact traces; a lever moved across a whole year is chapter 17.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The sidebar and the request it builds<\/td>\n<td><code>app.py<\/code> (<code>with st.sidebar:<\/code>, <code>optimize_payload<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>The request's fields and their defaults<\/td>\n<td><code>main.py<\/code> (<code>OptimizeRequest<\/code>, <code>ESGIn<\/code>, <code>IBPPolicyIn<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>The profiles<\/td>\n<td><code>engine/profiles.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>The S&amp;OP gate<\/td>\n<td><code>engine/governance.py<\/code> (<code>IBPPolicy<\/code>, <code>VirtualIBPDispatcher<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>The measured runs<\/td>\n<td><code>tools/manual_tower.py<\/code>, <code>docs/manual/data/tower.json<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The table at the top of the chapter is read from <code>app.py<\/code> at build time: label, default, range and help text, so a slider whose default changes changes the manual. The measured runs read the same defaults from <code>app.py<\/code> before moving one setting.<\/p>\n<p><strong>Tests that guard it.<\/strong> Every input in the Control Tower is named in this part of the manual; the sidebar table is the app's own; a gate threshold leaves the plan unchanged; the carbon budget at its default holds the plan.<\/p>"}],"search":" the sidebar is where a planner sets the question before asking it. nothing in it changes a table: every setting is a field of the request the control tower sends to the planning service when you press run optimization , and it applies to that run only. there are five groups, top to bottom: which data and which branch, the carbon price, the s&op gate's thresholds, how large a question to ask, and the solver. every effect below was measured the way a visitor would see it: the hosted default plan (the operational profile, 10 buckets ahead) on lindewaard, one setting moved at a time, the rest left at their defaults. the baseline costs €694k over the horizon at 100.00% service and answers in 4 s; a difference inside ±€83k is the solver's tolerance, not the setting. five questions, one group each each group of the sidebar answers one question a planner asks before planning. the names on screen are the engine's own; here is what they mean in everyday planning terms. group on screen the question it answers in everyday planning terms scenario sandbox whose data, and where does this plan live? a planning version: the live one execution follows, and simulation copies beside it esg carbon taxation what is a kilogram of co₂ worth to this business? an internal carbon price, and if wanted a hard cap on emissions virtual ibp gates which plans may go out without a meeting? the s&op sign-off rules, applied by the engine on every run planning altitude how far ahead, and in how much detail? operational, tactical or strategic planning solver how sure must the answer be, and against what demand? the optimiser's tolerance, and a stress test against high demand every setting at a glance read from the control tower's own code when this page is built, so it cannot drift from the screen. setting default control and range the screen's help text workspace — list: the workspaces offered whose tables to plan on. each workspace keeps its own master data, change log and committed plans. network zynta_koda choice: zynta_koda, reference zynta_koda is the full master data dictionary network; reference is the small fixture the unit tests pin constraints against. scenario branch sandbox list: live, baseline, sandbox, custom… where a run's committed plans are kept, so two planners never overwrite each other. a branch changes no data: to plan an event, open a story, trace it under impact tracing, or edit master data. custom scenario_id sandbox-2 text: up to 64 characters — arm live commit off switch commits the approved schedule to the live branch (kept in postgres when the service has a database; in memory otherwise). carbon price (€/kg co₂e) the workspace's own price slider: 0 to 0.5 starts at this workspace's own price, … a tonne, from its planning parameters. spot 3pl tax multiplier 3 slider: 1 to 6 spot fleets are taxed harder than internal fleets. enforce a hard carbon budget off tick box — carbon budget (kg co₂e) empty number: from 0 — min service level (%) 97 slider: 80 to 100 — max margin at risk (% of margin achievable) 2 slider: 0 to 10 a plan that puts more of its achievable margin at risk than this is held for a person to decide. your own setting: 2% by default. cost of capital (% a year) 12 slider: 0 to 25 charged against every unit held. leaving it at zero makes holding stock look cheaper than moving it. max methodology disputes 0 number: from 0 — max spot 3pl share (%) 20 slider: 0 to 100 — profile depends on where it runs choice: operational, tactical, strategic how long a plan may take is a property of the decision it supports. operational freezes the committed window, shortens the horizon and relaxes pallet counts; strategic opens everything. plan in layers auto list: auto, on, off layers: the year per product family (one liquid on one line), then each product for the first four weeks. auto plans a full year in layers above 8 finished products, where one plan in full detail finds nothing in time (15 products: no plan in 30 minutes; in layers 21 s). the demo companies have 5 products, so auto plans them in full detail; choose on to see the layers. reuse the last plan of record (faster) off switch skip re-solving the plan of record and replan against the last one this engine proved for this profile. seconds instead of minutes on a full year; see the note below. optimality gap 1% slider: prove it, 0.5%, 1.0%, 2.0%, 5.0% the inputs are a forecast. 1% solves in seconds; proving optimality takes minutes and buys about 0.3%. stress the plan against the p90 on for operational switch plan on the p50, then re-solve against the top of the forecast band with production and purchasing inside the supply lead time pinned. one extra solve, and it answers the question the plan otherwise cannot: how wrong can this be, and who loses. on a full year it roughly doubles the wait. scenario sandbox: which data, which branch like a planning version: try plans here without touching execution. only the live branch, with commit armed, can write to the factory schedule. what it is. a planner needs a place to try things that execution will not act on, much like the active planning version and the simulation versions of an aps such as sap apo or ibp. here that place is a branch : every plan you run is filed under a branch, and plans committed on it are kept apart from every other branch's, so two planners never overwrite each other's schedule. live is the branch connected to execution, and even there nothing is published unless you arm it on purpose. every other branch is a sandbox : the worst a bad plan can do there is be looked at. a branch changes no data . the products, sites and prices underneath are the workspace 's one set of tables: one company, with its own master data, history and committed plans. the settings setting default and options what it does workspace lindewaard; or ashford brookvale foods (shown only where the service offers more than one) whose tables to plan on. the currency follows the workspace. switching clears the plan on screen, so one company's plan is never shown under another's name network zynta_koda; or reference the full network in the workspace's tables, or a small fixed network the unit tests pin constraints against scenario branch sandbox; or live, baseline, custom… the branch the run is filed under. custom… opens custom scenario_id for a name of your own (up to 64 characters) arm live commit off; shown only on live on, a plan that passes every s&op check is written to the live schedule (kept in postgres when the service has a database, in memory otherwise), and the sidebar warns that an auto_commit ve at 16,500 kg, far below what this network emits in four weeks: ticking it cut service from 100.00% to 70.62%, cost fell to €527k because the plan made less, and the s&op gate held it (fails on service and margin at risk). virtual ibp gates: when a plan is released the s&op sign-off limits, applied on every run: a plan inside them is released, one outside them is held for a person to decide. what it is. integrated business planning (ibp) is s&op grown up: the monthly process where demand, supply and finance agree one plan, and leadership signs off what could not be agreed lower down. most plans do not need that meeting, because they sit inside limits everyone has already agreed. virtual means the engine applies those limits itself, on every run, the moment a plan is made: verdict when what happens auto_commit every check passes released on its own (written to the schedule only on live, armed) hold_for_snop any check fails held for people, each broken limit named and measured reject no usable plan, or planned margin below 5% of the margin achievable rejected outright people agree the limits once; the engine enforces them every time, and the meeting spends its time on the plans that need it. that is management by exception, and it is what \"a person decides\" means in this engine (the gate itself is chapter 14). the settings. the sliders are the limits. they never change the plan, only the verdict on it : measured, moving any of them leaves the plan identical to the cent. setting default and range the check holds the plan when min service level (%) 97, 80 to 100 service by value against the promise service falls below it max margin at risk (% of margin achievable) 2, 0 to 10 margin on unserved demand plus its penalty, as a share of the margin the plan could earn the share exceeds it max methodology disputes 0, from 0 forecasts that differ from the engine's baseline by more than ±25% with no promotion to explain them there are more disputes than this max spot 3pl share
