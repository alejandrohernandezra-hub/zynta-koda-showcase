<!doctype html>

<style>
:root {
  --bg: #eef2f4; --surface: #ffffff; --surface-alt: #f5f8f9; --ink: #13212b; --muted: #556670; --rule: #d9e1e5;
  --signal: #0d6f6e; --signal-soft: #dcefee; --signal-ink: #ffffff; --event: #b36b12; --event-soft: #f5e6d1;
  --base-line: #8a9aa4; --good: #256f22; --good-soft: #e3f3e2; --bad: #a3361f; --bad-soft: #fae6e2;
  --border: #c3ced4; --shadow: 0 1px 2px rgba(19, 33, 43, 0.06), 0 6px 24px rgba(19, 33, 43, 0.06);
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e161b; --surface: #162128; --surface-alt: #1b2830; --ink: #e5ecef; --muted: #98a9b2; --rule: #26343c;
    --signal: #5fc4c2; --signal-soft: #143331; --signal-ink: #0e161b; --event: #e3a24c; --event-soft: #38280f;
    --base-line: #6f818b; --good: #8fcb86; --good-soft: #1b331a; --bad: #f08a72; --bad-soft: #3b1d17;
    --border: #36474f; --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px rgba(0, 0, 0, 0.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e161b; --surface: #162128; --surface-alt: #1b2830; --ink: #e5ecef; --muted: #98a9b2; --rule: #26343c;
  --signal: #5fc4c2; --signal-soft: #143331; --signal-ink: #0e161b; --event: #e3a24c; --event-soft: #38280f;
  --base-line: #6f818b; --good: #8fcb86; --good-soft: #1b331a; --bad: #f08a72; --bad-soft: #3b1d17;
  --border: #36474f; --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px rgba(0, 0, 0, 0.25); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1.0625rem; line-height: 1.7; font-feature-settings: "kern", "liga"; }
[hidden] { display: none !important; }
a { color: var(--signal); text-underline-offset: 0.18em; text-decoration-thickness: 1px; }
h1, h2, h3, h4 { font-family: var(--display); letter-spacing: -0.015em; text-wrap: balance; margin: 0; }
p { margin: 0 0 1em; }
strong { font-weight: 700; }
code { font-family: var(--mono); font-size: 0.84em; background: var(--surface-alt); border: 1px solid var(--rule); border-radius: 6px; padding: 0.08em 0.35em; overflow-wrap: anywhere; }

/* ---- top bar ---- */
.top { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule); }
.top-inner { max-width: 88rem; margin: 0 auto; padding: 0.6rem 20px; display: flex; align-items: center; gap: 0.8rem; }
.brand { display: flex; align-items: center; gap: 0.55rem; font: 800 1.02rem var(--display); color: var(--ink); text-decoration: none; white-space: nowrap; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--signal); color: var(--signal-ink); display: grid; place-items: center; font: 900 0.8rem var(--display); }
.brand span { color: var(--muted); font-weight: 600; }
.top .spacer { flex: 1; }
.top a.back { font: 600 0.88rem var(--display); color: var(--muted); text-decoration: none; white-space: nowrap; }
.top a.back:hover { color: var(--ink); }
.btn { font: 600 0.85rem var(--display); color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 0.38rem 0.85rem; cursor: pointer; }
.btn:hover { border-color: var(--border); }
.menu-btn { display: none; }

/* ---- layout ---- */
.shell { max-width: 88rem; margin: 0 auto; display: grid; grid-template-columns: 16rem minmax(0, 1fr); gap: 3rem; padding: 2rem 20px 5rem; }
nav.toc { position: sticky; top: 4.4rem; align-self: start; max-height: calc(100vh - 5.4rem); overflow-y: auto; padding-right: 0.4rem; scrollbar-width: thin; }
.search { width: 100%; font: 400 0.95rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 0.5rem 0.75rem; }
.search:focus { outline: 2px solid var(--signal); outline-offset: 1px; }
.search-note { font-size: 0.8rem; color: var(--muted); min-height: 1.2rem; margin: 0.35rem 0 0.2rem; }
.progress { font: 600 0.74rem var(--mono); color: var(--muted); margin: 0.2rem 0 0.4rem; }
.progress-bar { height: 4px; border-radius: 4px; background: var(--rule); overflow: hidden; margin-bottom: 0.6rem; }
.progress-bar i { display: block; height: 100%; background: var(--signal); }
.toc h4 { font: 700 0.7rem var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 1.2rem 0 0.35rem; }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc li a { display: grid; grid-template-columns: 1.7rem 1fr; padding: 0.3rem 0.5rem; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 0.92rem; line-height: 1.35; }
.toc li a:hover { background: var(--surface); }
.toc li a.on { background: var(--surface); box-shadow: inset 3px 0 0 var(--signal); font-weight: 700; }
.toc li a .n { color: var(--muted); font: 600 0.76rem var(--mono); padding-top: 0.12rem; }
.toc li.planned a { color: var(--muted); opacity: 0.7; }
.toc li.planned a .n::after { content: ""; }
.toc li.miss { display: none; }

/* ---- chapter ---- */
main { min-width: 0; }
.hero { display: grid; grid-template-columns: auto 1fr; gap: 0 1.4rem; align-items: end; margin-bottom: 1.6rem; max-width: 56rem; }
.hero .num { grid-row: span 2; font: 900 clamp(3.6rem, 9vw, 6rem) / 0.85 var(--display); color: transparent; -webkit-text-stroke: 2px var(--signal); letter-spacing: -0.04em; }
.hero .kicker { font: 600 0.76rem var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--signal); }
.hero h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; line-height: 1.08; }
.prose > * { max-width: 42rem; }
.prose > .story { max-width: 70rem; }
.prose > .diagram { max-width: 56rem; }
.prose > p:first-child { font-size: 1.18rem; line-height: 1.6; color: var(--ink); }
.prose h3 { font-size: 1.22rem; margin: 2.6rem 0 0.7rem; display: flex; align-items: center; gap: 0.6rem; }
.prose h3::before { content: ""; width: 0.55rem; height: 0.55rem; border-radius: 2px; background: var(--signal); flex: none; }
.prose ul, .prose ol { padding-left: 1.3rem; margin: 0 0 1.2em; }
.prose li { margin: 0.35em 0; }
.prose li::marker { color: var(--signal); }
.prose table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 0.93rem; margin: 1.2rem 0 1.6rem; display: block; overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; }
.prose th, .prose td { text-align: left; padding: 0.6rem 0.85rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
.prose tr:last-child td { border-bottom: 0; }
.prose th { font: 700 0.74rem var(--display); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: var(--surface-alt); white-space: nowrap; }
.prose td:first-child { font-weight: 600; }

/* layers */
.deeper { margin-top: 3.4rem; max-width: 56rem; }
.deeper-head { font: 700 0.76rem var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.7rem; }
.tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 0.6rem; }
.tab { display: grid; grid-template-columns: 2.2rem 1fr; gap: 0.1rem 0.7rem; align-items: center; text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 0.75rem 0.9rem; cursor: pointer; box-shadow: var(--shadow); transition: border-color 0.15s, transform 0.15s; }
.tab:hover { border-color: var(--border); transform: translateY(-1px); }
.tab .ico { grid-row: span 2; width: 2.2rem; height: 2.2rem; border-radius: 10px; background: var(--signal-soft); color: var(--signal); display: grid; place-items: center; }
.tab .ico svg { width: 1.25rem; height: 1.25rem; }
.tab b { font: 700 0.98rem var(--display); }
.tab small { font-size: 0.8rem; color: var(--muted); }
.tab[aria-pressed="true"] { border-color: var(--signal); box-shadow: inset 0 0 0 1px var(--signal), var(--shadow); }
.tab[aria-pressed="true"] .ico { background: var(--signal); color: var(--signal-ink); }
.pane { margin-top: 1.8rem; padding-top: 0.4rem; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 4rem; max-width: 56rem; }
.pager a { display: block; text-decoration: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 0.8rem 1rem; color: var(--ink); font: 700 0.98rem var(--display); }
.pager a small { display: block; font: 600 0.72rem var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.pager a.next { text-align: right; grid-column: 2; }
.pager a:hover { border-color: var(--signal); }
.planned-note { background: var(--surface); border: 1px dashed var(--border); border-radius: 14px; padding: 1.4rem; color: var(--muted); max-width: 42rem; }

/* maths */
.math { overflow-x: auto; padding: 0.9rem 1rem; margin: 0.8rem 0 1.2rem; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; }
math { font-size: 1.06em; }
.math math { font-size: 1.14em; }

/* ---- story (scroll-driven) ---- */
.story { display: grid; grid-template-columns: minmax(15rem, 20rem) minmax(0, 1fr); gap: 2.6rem; margin: 2.2rem 0 1.6rem; }
.story .steps { order: 1; padding: 22vh 0 26vh; }
.story .stage { order: 2; position: sticky; top: 5.2rem; align-self: start; }
.story .step { margin: 0 0 42vh; padding: 1.1rem 1.2rem; background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; box-shadow: var(--shadow); opacity: 0.45; transition: opacity 0.3s, border-color 0.3s, transform 0.3s; }
.story .step:last-child { margin-bottom: 0; }
.story .step.on { opacity: 1; border-color: var(--signal); transform: translateX(4px); }
.story .step p { margin: 0; font-size: 1.04rem; }
.story .diagram { margin: 0; }

/* ---- diagrams ---- */
.diagram { margin: 1.6rem 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 18px; padding: 1.1rem; box-shadow: var(--shadow); }
.diagram svg { display: block; width: 100%; height: auto; overflow: visible; }
.diagram svg text { font-family: var(--body); fill: var(--ink); }
.diagram .cap { font-size: 0.86rem; color: var(--muted); margin-top: 0.6rem; line-height: 1.5; }
.diagram .detail { margin-top: 0.8rem; padding: 0.75rem 0.9rem; background: var(--surface-alt); border-radius: 12px; font-size: 0.95rem; line-height: 1.55; min-height: 3.3rem; }
.diagram .detail b { font-family: var(--display); }
/* nodes */
.node { cursor: pointer; }
.node .card { fill: var(--surface); stroke: var(--border); stroke-width: 1.2; transition: fill 0.35s, stroke 0.35s; }
.node .chip { fill: var(--signal-soft); transition: fill 0.35s; }
.node .glyph { color: var(--signal); transition: color 0.35s; }
.node .sub { fill: var(--muted); }
.node.on .card { fill: var(--signal-soft); stroke: var(--signal); stroke-width: 2; }
.node.on .chip { fill: var(--signal); }
.node.on .glyph { color: var(--signal-ink); }
.node.dim { opacity: 0.42; }
.node.warn .chip { fill: var(--event-soft); } .node.warn .glyph { color: var(--event); }
.node.warn.on .card { fill: var(--event-soft); stroke: var(--event); } .node.warn.on .chip { fill: var(--event); } .node.warn.on .glyph { color: var(--signal-ink); }
.node.bad .chip { fill: var(--bad-soft); } .node.bad .glyph { color: var(--bad); }
.node.bad.on .card { fill: var(--bad-soft); stroke: var(--bad); } .node.bad.on .chip { fill: var(--bad); } .node.bad.on .glyph { color: var(--signal-ink); }
.node:focus { outline: none; } .node:focus-visible .card { stroke: var(--event); stroke-width: 2.6; }
.node, .edge, .fade { transition: opacity 0.4s; }
/* edges */
.edge path { fill: none; stroke: var(--base-line); stroke-width: 1.6; }
.edge.on path { stroke: var(--signal); stroke-width: 2.2; stroke-dasharray: 7 6; animation: flow 0.9s linear infinite; }
.edge.dashed path { stroke-dasharray: 4 4; stroke: var(--event); }
.edge .lbl-bg { fill: var(--surface); }
.edge text { font-size: 12.5px; fill: var(--muted) !important; }
.edge.on text { fill: var(--signal) !important; font-weight: 700; }
.edge.dim { opacity: 0.3; }
@keyframes flow { to { stroke-dashoffset: -13; } }
.draw { transition: stroke-dashoffset 1.2s ease-out; }
.hidden-el { opacity: 0 !important; pointer-events: none; }
/* controls */
.chips { display: flex; gap: 0.45rem; flex-wrap: wrap; margin-top: 0.6rem; }
.chip-btn { font: 600 0.86rem var(--display); color: var(--ink); background: var(--surface-alt); border: 1px solid var(--rule); border-radius: 999px; padding: 0.35rem 0.8rem; cursor: pointer; display: inline-flex; gap: 0.45rem; align-items: center; }
.chip-btn[aria-pressed="true"] { background: var(--signal); color: var(--signal-ink); border-color: var(--signal); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 0.7rem; }
.pcard { display: grid; grid-template-columns: 2.4rem 1fr; gap: 0.2rem 0.75rem; align-content: start; background: var(--surface-alt); border: 1px solid var(--rule); border-radius: 14px; padding: 0.9rem; cursor: pointer; text-align: left; font: inherit; color: inherit; transition: border-color 0.2s, transform 0.2s; }
.pcard:hover { transform: translateY(-1px); border-color: var(--border); }
.pcard[aria-pressed="true"] { border-color: var(--signal); background: var(--signal-soft); }
.pcard .ico { grid-row: span 2; width: 2.4rem; height: 2.4rem; border-radius: 10px; background: var(--surface); color: var(--signal); display: grid; place-items: center; border: 1px solid var(--rule); }
.pcard .ico svg { width: 1.3rem; height: 1.3rem; }
.pcard h5 { font: 700 1rem var(--display); margin: 0.1rem 0 0; }
.pcard p { font-size: 0.9rem; margin: 0; color: var(--muted); line-height: 1.5; grid-column: 2; }
.slider { display: grid; grid-template-columns: 9rem 1fr 4.6rem; gap: 0.7rem; align-items: center; font-size: 0.94rem; margin: 0.4rem 0; }
.slider input { width: 100%; accent-color: var(--signal); }
.slider output { font: 600 0.9rem var(--mono); text-align: right; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); gap: 0.55rem; margin-top: 0.9rem; }
.stat { background: var(--surface-alt); border-radius: 12px; padding: 0.6rem 0.8rem; }
.stat b { display: block; font: 800 1.35rem var(--display); letter-spacing: -0.02em; }
.stat span { font-size: 0.8rem; color: var(--muted); }

@media (max-width: 1100px) { .story { grid-template-columns: minmax(14rem, 18rem) minmax(0, 1fr); gap: 1.6rem; } }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; gap: 0; padding-top: 1.4rem; }
  .menu-btn { display: inline-block; }
  nav.toc { position: fixed; inset: 3.2rem 0 0 0; max-height: none; background: var(--bg); z-index: 35; padding: 1rem 20px 3rem; display: none; }
  body.menu-open nav.toc { display: block; }
  .top a.back { display: none; }
  .top .long { display: none; }
  .brand span { display: none; }
  .story { grid-template-columns: 1fr; gap: 0; }
  .story .stage { order: 0; top: 3.3rem; z-index: 6; background: var(--bg); padding: 0.4rem 0 0.7rem; }
  .story .stage .diagram { padding: 0.6rem; }
  .story .stage .diagram svg { max-height: 46vh; }
  .story .stage .detail { display: none; }
  .story .steps { order: 1; padding: 12vh 0 18vh; position: relative; z-index: 5; }
  .story .step { margin-bottom: 52vh; opacity: 1; transform: none !important; }
  .slider { grid-template-columns: 6.8rem 1fr 3.8rem; }
  .pager { grid-template-columns: 1fr; } .pager a.next { grid-column: 1; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before { transition: none !important; animation: none !important; }
}
</style>
</head>

<script>
const DATA = {"chapters":[{"part":"Introduction","number":"1","slug":"what-it-is","title":"What Zynta-Koda is, and isn't","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Zynta-Koda is a supply chain planning engine that <strong>shows its working<\/strong>. Scroll through what it does.<\/p>\n<div class=\"story\"><div class=\"stage\"><div class=\"diagram\" data-diagram=\"at-a-glance\" data-story=\"1\"><\/div><\/div><div class=\"steps\"><div class=\"step\" data-state=\"data\"><p><strong>It starts from a company's data.<\/strong> Sites, lines, lanes, prices and demand: one company's tables, checked on the way in.<\/p><\/div><div class=\"step\" data-state=\"decide\"><p><strong>It decides what to make, buy, move and store,<\/strong> for every product, site and week of the coming year, at the lowest cost that keeps every physical rule.<\/p><\/div><div class=\"step\" data-state=\"check\"><p><strong>Then it checks itself.<\/strong> The plan has to pass the business's own S&amp;OP checks. One that fails is held for a person, with its reasons.<\/p><\/div><div class=\"step\" data-state=\"release\"><p><strong>And it shows its working:<\/strong> what the plan costs, how sure the solver is, and what it can still promise customers.<\/p><\/div><\/div><\/div>\n<p>The two companies on these pages are <strong>fictional<\/strong>: Lindewaard, a Benelux drinks and snacks maker, and Ashford, a US one. The numbers are not: every one of them was computed by the engine.<\/p>"},{"name":"How it works","html":"<p><strong>What it is<\/strong><\/p>\n<ul>\n<li><strong>An optimisation engine.<\/strong> It turns a company's data into a mathematical model with thousands of decisions, and a solver finds the cheapest plan that keeps every physical rule: line hours, truck sizes, shelf life, lead times.<\/li>\n<li><strong>A gate before release.<\/strong> No plan is released because the solver liked it. It has to pass the same S&amp;OP checks a business would apply (service at least 97%, margin at risk at most 2% of the margin achievable, and others). Otherwise it is held for a person.<\/li>\n<li><strong>A Control Tower.<\/strong> A screen for planners: the plan, its exceptions worst first, what it can still promise a customer, and why.<\/li>\n<li><strong>A place to ask \"what if\".<\/strong> Six disruptions, each planned three ways: react on the day, act with a week's notice, or act ahead.<\/li>\n<\/ul>\n<p><strong>What it isn't<\/strong><\/p>\n<ul>\n<li><strong>Not a product.<\/strong> It is personal research into what makes planners trust a plan, built by one person with AI coding assistants.<\/li>\n<li><strong>Not connected to a real company.<\/strong> It reads files shaped like an ERP export (SAP, Dynamics 365); there is no live link to one.<\/li>\n<li><strong>Not an AI that decides.<\/strong> AI explains plans in plain words. It never approves or changes one (chapter 4).<\/li>\n<\/ul>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>Built with<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Engine<\/td>\n<td>Python 3.11, mixed-integer model in PuLP 3.3.2, solved by CBC (open-source, COIN-OR)<\/td>\n<\/tr>\n<tr>\n<td>API<\/td>\n<td>FastAPI, stateless; plans committed to Postgres when one is configured<\/td>\n<\/tr>\n<tr>\n<td>Control Tower<\/td>\n<td>Streamlit, in its own container with no solver in it<\/td>\n<\/tr>\n<tr>\n<td>This manual and the showcase<\/td>\n<td>static pages built from the plans by <code>tools/build_manual.py<\/code> and <code>tools/build_site.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Evidence<\/td>\n<td>over 500 tests in one suite, run on every change<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The source is private; the showcase and this manual are public.<\/p>"}],"search":" zynta-koda is a supply chain planning engine that shows its working . scroll through what it does. it starts from a company's data. sites, lines, lanes, prices and demand: one company's tables, checked on the way in. it decides what to make, buy, move and store, for every product, site and week of the coming year, at the lowest cost that keeps every physical rule. then it checks itself. the plan has to pass the business's own s&op checks. one that fails is held for a person, with its reasons. and it shows its working: what the plan costs, how sure the solver is, and what it can still promise customers. the two companies on these pages are fictional : lindewaard, a benelux drinks and snacks maker, and ashford, a us one. the numbers are not: every one of them was computed by the engine. what it is an optimisation engine. it turns a company's data into a mathematical model with thousands of decisions, and a solver finds the cheapest plan that keeps every physical rule: line hours, truck sizes, shelf life, lead times. a gate before release. no plan is released because the solver liked it. it has to pass the same s&op checks a business would apply (service at least 97%, margin at risk at most 2% of the margin achievable, and others). otherwise it is held for a person. a control tower. a screen for planners: the plan, its exceptions worst first, what it can still promise a customer, and why. a place to ask \"what if\". six disruptions, each planned three ways: react on the day, act with a week's notice, or act ahead. what it isn't not a product. it is personal research into what makes planners trust a plan, built by one person with ai coding assistants. not connected to a real company. it reads files shaped like an erp export (sap, dynamics 365); there is no live link to one. not an ai that decides. ai explains plans in plain words. it never approves or changes one (chapter 4). part built with engine python 3.11, mixed-integer model in pulp 3.3.2, solved by cbc (open-source, coin-or) api fastapi, stateless; plans committed to postgres when one is configured control tower streamlit, in its own container with no solver in it this manual and the showcase static pages built from the plans by tools/build_manual.py and tools/build_site.py evidence over 500 tests in one suite, run on every change the source is private; the showcase and this manual are public. "},{"part":"Introduction","number":"2","slug":"the-problem","title":"The problem: planning under disruption","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>A plan is a bet on next year. Then a supplier goes dark, a line breaks, a road closes. The question is not whether disruptions happen, but <strong>when the plan finds out<\/strong>: on the day, or early enough to act.<\/p>\n<div class=\"story\"><div class=\"stage\"><div class=\"diagram\" data-diagram=\"react-vs-ahead\" data-story=\"1\"><\/div><\/div><div class=\"steps\"><div class=\"step\" data-state=\"normal\"><p><strong>A normal year.<\/strong> Lindewaard's Sparkling Lemonade is made steadily through the year: the dashed line is the running total.<\/p><\/div><div class=\"step\" data-state=\"outage\"><p><strong>Then a bottling line goes down<\/strong> for four weeks in the summer peak, the busiest time of the year.<\/p><\/div><div class=\"step\" data-state=\"ahead\"><p><strong>Acting ahead,<\/strong> the plan makes more in the months before, so the summer is served from stock built in spring.<\/p><\/div><div class=\"step\" data-state=\"money\"><p><strong>What seeing it coming is worth.<\/strong> With no early action the outage costs €512k of profit; acting ahead, €213k. <strong>58% of the hit won back.<\/strong><\/p><\/div><\/div><\/div>"},{"name":"How it works","html":"<p>Planning runs in a cycle, and the engine has a job at each step:<\/p>\n<div class=\"diagram\" data-diagram=\"planning-cycle\"><\/div>\n<ol>\n<li><strong>Demand.<\/strong> What customers will order: history, forecasts and the orders already confirmed.<\/li>\n<li><strong>Plan.<\/strong> The optimiser decides production, purchasing, transport and stock for the whole year.<\/li>\n<li><strong>Check.<\/strong> The S&amp;OP gate tests the plan against the business's own rules.<\/li>\n<li><strong>Release.<\/strong> A plan that passes goes to the factory; one that fails waits for a person.<\/li>\n<li><strong>Execute and learn.<\/strong> Reality arrives. A disruption, or just a forecast that was wrong, starts the next turn of the cycle.<\/li>\n<\/ol>\n<p>Every disruption story is planned <strong>three ways<\/strong>, each a full plan:<\/p>\n<ul>\n<li><strong>No early action:<\/strong> the baseline plan runs until the day it hits, then an emergency re-plan.<\/li>\n<li><strong>A week's notice:<\/strong> the same, re-planned seven days earlier.<\/li>\n<li><strong>Acting ahead:<\/strong> the disruption is known when the year is planned.<\/li>\n<\/ul>\n<p>The difference between the first and the last is what seeing it coming is worth.<\/p>"},{"name":"The maths","html":"<p>Each plan's profit before overheads is revenue minus total cost. Against the baseline plan <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><\/mrow><\/math>, a disruption planned one way, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><\/mrow><\/math>, costs<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mtext>hit<\/mtext><mi>X<\/mi><\/msub><mo>&#x0003D;<\/mo><msub><mtext>profit<\/mtext><mi>B<\/mi><\/msub><mo>&#x02212;<\/mo><msub><mtext>profit<\/mtext><mi>X<\/mi><\/msub><\/mrow><\/math><\/div>\n<p>and the share of the hit that acting ahead (<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math>) wins back over no early action (<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>L<\/mi><\/mrow><\/math>, for late) is<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>won&#x000A0;back<\/mtext><mo>&#x0003D;<\/mo><mfrac><mrow><msub><mtext>hit<\/mtext><mi>L<\/mi><\/msub><mo>&#x02212;<\/mo><msub><mtext>hit<\/mtext><mi>A<\/mi><\/msub><\/mrow><mrow><msub><mtext>hit<\/mtext><mi>L<\/mi><\/msub><\/mrow><\/mfrac><\/mrow><\/math><\/div>\n<p>Every plan is only proven to within a tolerance of the best possible one (chapter 9), so a difference smaller than that tolerance is reported as <strong>no measurable difference<\/strong>, not as a finding.<\/p>"},{"name":"Under the hood","html":"<ul>\n<li>The stories are built by <code>tools/build_showcase.py<\/code>: each is a plan of record plus re-plans, with the frozen first week pinned.<\/li>\n<li>6 stories per company carry the three-way comparison; their numbers feed the showcase, this manual and the walkthrough video.<\/li>\n<li>A test fails if the video's spoken percentage stops matching the plans.<\/li>\n<\/ul>"}],"search":" a plan is a bet on next year. then a supplier goes dark, a line breaks, a road closes. the question is not whether disruptions happen, but when the plan finds out : on the day, or early enough to act. a normal year. lindewaard's sparkling lemonade is made steadily through the year: the dashed line is the running total. then a bottling line goes down for four weeks in the summer peak, the busiest time of the year. acting ahead, the plan makes more in the months before, so the summer is served from stock built in spring. what seeing it coming is worth. with no early action the outage costs €512k of profit; acting ahead, €213k. 58% of the hit won back. planning runs in a cycle, and the engine has a job at each step: demand. what customers will order: history, forecasts and the orders already confirmed. plan. the optimiser decides production, purchasing, transport and stock for the whole year. check. the s&op gate tests the plan against the business's own rules. release. a plan that passes goes to the factory; one that fails waits for a person. execute and learn. reality arrives. a disruption, or just a forecast that was wrong, starts the next turn of the cycle. every disruption story is planned three ways , each a full plan ong> Demand becomes the numbers to serve; the optimiser finds the cheapest plan that keeps every rule.<\/p><\/div><div class=\"step\" data-state=\"gate\"><p><strong>The gate.<\/strong> Nothing reaches the factory without passing the S&amp;OP checks.<\/p><\/div><div class=\"step\" data-state=\"out\"><p><strong>Decisions out:<\/strong> to planners in the Control Tower, to other systems through the API, to AI assistants through a read-only server.<\/p><\/div><div class=\"step\" data-state=\"ai\"><p><strong>AI beside the flow, not in it.<\/strong> The explainer reads plans and explains them in plain words. It has no path to write.<\/p><\/div><\/div><\/div>\n<p>Click any box in the picture for what it does and where it lives in the code.<\/p>"},{"name":"How it works","html":"<ul>\n<li><strong>Workspace.<\/strong> One company's tables: sites, products, recipes, lines, lanes, prices, demand. Each company is isolated in its own folder; customer data never enters the code repository.<\/li>\n<li><strong>Data checks.<\/strong> Every edit is checked before the engine sees it: refused if it breaks a rule, previewed if it moves the plan, challenged if it looks wrong.<\/li>\n<li><strong>Demand.<\/strong> History and forecasts become the demand the plan must serve. A forecast is only used if it beat a simple baseline on weeks it never saw (chapter 8).<\/li>\n<li><strong>Optimiser.<\/strong> Builds the model and solves it (chapter 9).<\/li>\n<li><strong>S&amp;OP gate.<\/strong> Releases the plan, or holds it with its reasons (chapter 14).<\/li>\n<li><strong>Outputs.<\/strong> The Control Tower for planners, an API for systems, a read-only MCP server for AI assistants, and the public showcase.<\/li>\n<li><strong>AI explainer.<\/strong> Reads plans and explains them. It sits beside the flow, never in it: it has no path to write.<\/li>\n<\/ul>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>Box<\/th>\n<th>Code<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Workspace<\/td>\n<td><code>engine/masterstore.py<\/code>, <code>engine/workspace.py<\/code>, <code>workspaces/<\/code><\/td>\n<\/tr>\n<tr>\n<td>Data checks<\/td>\n<td><code>engine/masterdata.py<\/code>, <code>engine/challenge.py<\/code>, <code>engine/datahealth.py<\/code>, <code>engine/preview.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Demand<\/td>\n<td><code>engine/demand.py<\/code>, <code>engine/forecastfile.py<\/code>, <code>tools/forecast.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Optimiser<\/td>\n<td><code>engine/optimizer.py<\/code>, <code>engine/solvers.py<\/code>, <code>engine/tidy.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>S&amp;OP gate<\/td>\n<td><code>engine/governance.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>API<\/td>\n<td><code>main.py<\/code> (FastAPI)<\/td>\n<\/tr>\n<tr>\n<td>Control Tower<\/td>\n<td><code>app.py<\/code> (Streamlit)<\/td>\n<\/tr>\n<tr>\n<td>MCP server<\/td>\n<td><code>tools/mcp_server.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>AI explainer<\/td>\n<td><code>engine/explain.py<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The API image carries the solver; the Control Tower image carries none, and talks to the API over HTTP.<\/p>"}],"search":" data goes in on one side, decisions come out on the other, and nothing reaches the factory without passing the gate. data in. one company's tables live in their own workspace: sites, materials, recipes, lines, lanes, prices, demand. checked on the way in. an edit that breaks a rule is refused, one that moves the plan is previewed, one that looks wrong is challenged. the engine. demand becomes the numbers to serve; the optimiser finds the cheapest plan that keeps every rule. the gate. nothing reaches the factory without passing the s&op checks. decisions out: to planners in the control tower, to other systems through the api, to ai assistants through a read-only server. ai beside the flow, not in it. the explainer reads plans and explains them in plain words. it has no path to write. click any box in the picture for what it does and where it live ot approve a plan, edit data or commit a schedule.<\/li>\n<li><strong>Measured, not estimated.<\/strong> A claim about speed or cost comes with the run that measured it. A change is tested by its counterfactual: the test shows the effect disappears when the change is removed.<\/li>\n<li><strong>Every number is traceable.<\/strong> Each KPI has one definition, shown in the Control Tower and the showcase from the same source (chapter 16).<\/li>\n<li><strong>A plan says how sure it is.<\/strong> The solver proves how far a plan can be from the best possible one. A plan it did not prove is labelled and held, never presented as optimal.<\/li>\n<li><strong>Customer data stays in its workspace.<\/strong> Never in the code repository, the tests, the build pipeline or the public demo; never sent to an AI without the customer's recorded consent.<\/li>\n<\/ol>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>Rule<\/th>\n<th>What enforces it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><code>test_no_mcp_tool_can_reach_a_write_path<\/code> calls every AI-facing tool with every write path rigged to fail; a customer workspace runs the AI explainer only with a recorded consent (<code>engine/workspace.py<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Benchmarks under <code>docs/benchmarks/<\/code>, each with method and raw rows; the R&amp;D log records refuted hypotheses, including the author's own<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><code>engine/kpis.py<\/code> is the single definition; a test fails if the generated reference drifts<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><code>engine/solverreport.py<\/code> reads the solver's own log; the gate holds unproven plans (<code>hold_unproven_plans<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Customer workspaces live outside git; a licence check runs on every change; the repository history was scanned for secrets (<code>docs/security/secret-scan.md<\/code>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}],"search":" five rules decide how the engine behaves when convenience and trust pull apart. click a rule to see what enforces it. ai explains; people and the gate decide; deterministic code writes. an ai may explain why a master-data edit was refused, or why a plan was held. it cannot approve a plan, edit data or commit a schedule. measured, not estimated. a claim about speed or cost comes with the run that measured it. a change is tested by its counterfactual: the test shows the effect disappears when the change is removed. every number is traceable. each kpi has one definition, shown in the control tower and the showcase from the same source (chapter 16). a plan says how sure it is. the solver proves how far a plan can be from the best possible one. a plan it did not prove is labelled and held, never presented as optimal. customer data stays in its workspace. never in the code repository, the tests, the build pipeline or the public demo; never sent to an ai without the customer's recorded consent. rule what enforces it 1 test_no_mcp_tool_can_reach_a_write_path calls every ai-facing tool with every write path rigged to fail; a customer workspace runs the ai explainer only with a recorded consent ( engine/workspace.py ) 2 benchmarks under docs/benchmarks/ , each with method and raw rows; the r&d log records refuted hypotheses, including the author's own 3 engine/kpis.py is the single definition; a test fails if the generated reference drifts 4 engine/solverreport.py reads the solver's own log; the gate holds unproven plans ( hold_unproven_plans ) 5 customer workspaces live outside git; a licence check runs on every change; the repository history was scanned for secrets ( docs/security/secret-scan.md ) "},{"part":"Introduction","number":"5","slug":"how-to-read","title":"How to read this manual","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Start general, go as deep as you like. Every chapter opens with an <strong>overview and a picture<\/strong>. Three deeper layers sit behind tabs; open only the ones you want.<\/p>\n<div class=\"diagram\" data-diagram=\"layers-legend\"><\/div>"},{"name":"How it works","html":"<ul>\n<li><strong>Parts I and II<\/strong> go from the whole system down to each mechanism. Part I takes about five minutes.<\/li>\n<li><strong>Part III<\/strong> is task by task, for someone using the Control Tower.<\/li>\n<li><strong>Part IV<\/strong> is for IT and for anyone asking whether to trust it: deployment, security, tests.<\/li>\n<li><strong>Greyed chapters<\/strong> are planned and not written yet; the map shows the whole manual from the start.<\/li>\n<li><strong>Search<\/strong> finds a word in every layer of every written chapter, not only the open one.<\/li>\n<li>Numbers in the text are filled in from the engine and the published plans when the page is built, so they match the showcase.<\/li>\n<\/ul>"}],"search":" start general, go as deep as you like. every chapter opens with an overview and a picture . three deeper layers sit behind tabs; open only the ones you want. parts i and ii go from the whole system down to each mechanism. part i takes about five minutes. part iii is task by task, for someone using the control tower. part iv is for it and for anyone asking whether to trust it: deployment, security, tests. greyed chapters are planned and not written yet; the map shows the whole manual from the start. search finds a word in every layer of every written chapter, not only the open one. numbers in the text are filled in from the engine and the published plans when the page is built, so they match the showcase. "},{"part":"Planning","number":"6","slug":"planning-flow","title":"The planning flow","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>One request to the engine runs the whole flow, from the tables to a verdict, in this order.<\/p>\n<div class=\"story\"><div class=\"stage\"><div class=\"diagram\" data-diagram=\"flow\" data-story=\"1\"><\/div><\/div><div class=\"steps\"><div class=\"step\" data-state=\"load\"><p><strong>Load.<\/strong> The workspace's tables are read and checked: sites, products, recipes, lines, lanes, prices, stock, orders.<\/p><\/div><div class=\"step\" data-state=\"demand\"><p><strong>Demand.<\/strong> History and forecasts become the demand to serve, bucket by bucket, with an uncertainty band.<\/p><\/div><div class=\"step\" data-state=\"record\"><p><strong>Plan of record.<\/strong> The year is planned once without a committed window. It is what the next re-plan is anchored to.<\/p><\/div><div class=\"step\" data-state=\"replan\"><p><strong>Re-plan.<\/strong> The first bucket of the plan of record is frozen, so trucks already promised stay promised, and the rest is re-planned from it.<\/p><\/div><div class=\"step\" data-state=\"review\"><p><strong>Review.<\/strong> Exceptions, available to promise, redistribution, cost to serve and the stress test are read off the plan.<\/p><\/div><div class=\"step\" data-state=\"gate\"><p><strong>Gate.<\/strong> The S&amp;OP checks release the plan or hold it with reasons.<\/p><\/div><\/div><\/div>"},{"name":"How it works","html":"<ul>\n<li><strong>Two solves, on purpose.<\/strong> The plan of record is the reference; the re-plan keeps its first bucket fixed. A plan that reopened what was already dispatched would be correct on paper and impossible on the yard.<\/li>\n<li><strong>The plan of record can be reused.<\/strong> Solved once, it is kept for the same workspace, network and settings; a re-plan then takes seconds instead of minutes. Any master-data change invalidates it.<\/li>\n<li><strong>Large ranges are planned in layers<\/strong> (chapter 9): the year per family, then the near weeks per product.<\/li>\n<li><strong>Everything after the solve reads the plan; nothing changes it<\/strong> except the tidy-up of unneeded pallets and trucks, which can only make it cheaper.<\/li>\n<li><strong>Only a live branch can commit.<\/strong> Every story on the showcase is a sandbox: the gate says what it would do, and nothing reaches a factory schedule.<\/li>\n<\/ul>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>Step<\/th>\n<th>Code<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Request and orchestration<\/td>\n<td><code>main.optimize<\/code><\/td>\n<\/tr>\n<tr>\n<td>Plan of record and reuse<\/td>\n<td><code>main._stored_record<\/code>, <code>main._keep_record<\/code><\/td>\n<\/tr>\n<tr>\n<td>Frozen window<\/td>\n<td><code>engine/profiles.py<\/code> (<code>CommittedPlan<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Reviews after the solve<\/td>\n<td><code>engine/exceptions.py<\/code>, <code>engine/atp.py<\/code>, <code>engine/redistribution.py<\/code>, <code>engine/costtoserve.py<\/code>, <code>engine/stochastic.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Gate and commit<\/td>\n<td><code>engine/governance.py<\/code>, <code>engine/schedulesink.py<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}],"search":" one request to the engine runs the whole flow, from the tables to a verdict, in this order. load. the workspace's tables are read and checked: sites, products, recipes, lines, lanes, prices, stock, orders. demand. history and forecasts become the demand to serve, bucket by bucket, with an uncertainty band. plan of record. the year is planned once without a committed window. it is what the next re-plan is anchored to. re-plan. the first bucket of the plan of record is frozen, so trucks already promised stay promised, and the rest is re-planned from it. review. exceptions, available to promise, redistribution, cost to serve and the stress test are read off the plan. gate. the s&op checks release the plan or hold it with reasons. two solves, on purpose. the plan of record is the reference; the re-plan keeps its first bucket fixed. a plan that reopened what was already dispatched would be correct on paper and impossible on the yard. the plan of record can be reused. solved once, it is kept for the same workspace, network and settings; a re-plan then takes seconds instead of minutes. any master-data change invalidates it. large ranges are planned in layers (chapter 9): the year per family, then the near weeks per product. everything after the solve reads the plan; nothing changes it except the tidy-up of unneeded pallets and trucks, which can only make it cheaper. only a live branch can commit. every story on the showcase is a sandbox: the gate says what it would do, and nothing reaches a factory schedule. step code request and orchestration main.optimize plan of record and reuse main._stored_record , main._keep_record frozen window engine/profiles.py ( committedplan ) reviews after the solve engine/exceptions.py , engine/atp.py , engine/redistribution.py , engine/costtoserve.py , engine/stochastic.py gate and commit engine/governance.py , engine/schedulesink.py "},{"part":"Planning","number":"7","slug":"master-data","title":"Master data and workspaces","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>A plan is only as good as the tables under it. Every change to them is checked four ways before the engine plans on it.<\/p>\n<div class=\"story\"><div class=\"stage\"><div class=\"diagram\" data-diagram=\"edit-check\" data-story=\"1\"><\/div><\/div><div class=\"steps\"><div class=\"step\" data-state=\"edit\"><p><strong>Someone changes a value:<\/strong> a lead time, a price, a shelf life.<\/p><\/div><div class=\"step\" data-state=\"refuse\"><p><strong>Refused<\/strong> if it breaks a rule the network cannot live with: a supplier or site that does not exist, with the codes that do (\"did you mean…\").<\/p><\/div><div class=\"step\" data-state=\"challenge\"><p><strong>Challenged<\/strong> if it is legal but looks wrong: a lead time of 21 days where the same vendor's other lines say 7, a value five times what it was.<\/p><\/div><div class=\"step\" data-state=\"preview\"><p><strong>Previewed<\/strong> before it is saved: the plan is solved with and without the change, and the difference is shown.<\/p><\/div><div class=\"step\" data-state=\"audit\"><p><strong>Recorded<\/strong> with a name and a reason, so a number that moved can be explained six months later.<\/p><\/div><\/div><\/div>"},{"name":"How it works","html":"<p><strong>A workspace is one company.<\/strong> Its tables live in their own folder: sites, materials, recipes (bills of materials), routings and line capacities, lanes, purchasing records, stock, open supply, sales orders, demand history, shelf-life agreements, tolls and emission factors. The demo company has 25 of them. A customer's workspace lives outside the code repository, always.<\/p>\n<p><strong>Dates are part of the data.<\/strong> A recipe line, routing or purchasing record can carry dated versions: a price that changes on 1 January is read bucket by bucket, as things stand on each bucket's first day. Overlapping versions are refused.<\/p>\n<p><strong>Getting a company's data in.<\/strong><\/p>\n<ul>\n<li><strong>From SAP:<\/strong> <code>tools/onboard.py<\/code> reads SAP-shaped extracts through a mapping file and writes a workspace. Proven on the demo: the demo exported in SAP's shape and onboarded back gives identical tables.<\/li>\n<li><strong>From Dynamics 365:<\/strong> the extract is documented; the mapping file is written with the first Dynamics customer.<\/li>\n<li><strong>The data-health report<\/strong> runs every check over the whole data set at once, in the customer's own part numbers: what is missing, inconsistent or suspicious, and whether a plan can be built at all.<\/li>\n<\/ul>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Tables and dated versions<\/td>\n<td><code>engine/masterstore.py<\/code>, <code>engine/masterdata.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Refuse, challenge, preview<\/td>\n<td><code>engine/masterdata.py<\/code>, <code>engine/challenge.py<\/code>, <code>engine/preview.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Workspaces and consent<\/td>\n<td><code>engine/workspace.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Onboarding from extracts<\/td>\n<td><code>tools/onboard.py<\/code>, <code>docs/onboarding/sap-extract.md<\/code>, <code>docs/onboarding/mappings/<\/code><\/td>\n<\/tr>\n<tr>\n<td>Data-health report<\/td>\n<td><code>engine/datahealth.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Field by field<\/td>\n<td><code>docs/zynta-koda-master-data-dictionary.md<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The API serves the tables at <code>/api/v1/master<\/code>, with every change logged at <code>/api/v1/master/changes<\/code>. A test round-trips the demo through the SAP shape and requires identical tables; another plants faults in an extract and requires every one to be reported.<\/p>"}],"search":" a plan is only as good as the tables under it. every change to them is checked four ways before the engine plans on it. someone changes a value: a lead time, a price, a shelf life. refused if it breaks a rule the network cannot live with: a supplier or site that does not exist, with the codes that do (\"did you mean…\"). challenged if it is legal but looks wrong: a lead time of 21 days where the same vendor's other lines say 7, a value five times what it was. previewed before it is saved: the plan is solved with and without the change, and the difference is shown. recorded with a name and a reason, so a number that moved can be explained six months later. a workspace is one company. its tables live in their own folder: sites, materials, recipes (bills of materials), routings and line capacities, lanes, purchasing records, stock, open supply, sales orders, demand history, shelf-life agreements, tolls and emission factors. the demo company has 25 of them. a customer's workspace lives outside the code repository, always. dates are part of the data. a recipe line, routing or purchasing record can carry dated versions: a price that changes on 1 january is read bucket by bucket, as things stand on each bucket's first day. overlapping versions are refused. getting a company's data in. from sap: tools/onboard.py reads sap-shaped extracts through a mapping file and writes a workspace. proven on the demo: the demo exported in sap's shape and onboarded back gives identical tables. from dynamics 365: the extract is documented; the mapping file is written with the first dynamics customer. the data-health report runs every check over the whole data set at once, in the customer's own part numbers: what is missing, inconsistent or suspicious, and whether a plan can be built at all. what where tables and dated versions engine/masterstore.py , engine/masterdata.py refuse, challenge, preview engine/masterdata.py , engine/challenge.py , engine/preview.py workspaces and consent engine/workspace.py onboarding from extracts tools/onboard.py , docs/onboarding/sap-extract.md , docs/onboarding/mappings/ data-health report engine/datahealth.py field by field docs/zynta-koda-master-data-dictionary.md the api serves the tables at /api/v1/master , with every change logged at /api/v1/master/changes . a test round-trips the demo through the sap shape and requires identical tables; another plants faults in an extract and requires every one to be reported. "},{"part":"Planning","number":"8","slug":"demand","title":"Demand and forecasting","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>The plan serves a forecast, so the forecast has to earn its place. A model is used only if it beat a simple baseline on weeks it never saw.<\/p>\n<div class=\"diagram\" data-diagram=\"backtest\"><\/div>\n<p>On Lindewaard's history the winner is a <strong>mix of three<\/strong> (the median of ETS, Theta and Chronos-2): weighted quantile loss 0.0695 against 0.0843 for the engine's own seasonal model, a lead clear of chance. Its lead over Chronos-2 alone is not clear (90% interval -0.0077 to +0.0047).<\/p>\n<p>An earlier run, before a product launch was added to the history, chose the engine's own model. <strong>The answer changed when the data did<\/strong>, which is why the backtest is re-run rather than last month's winner trusted.<\/p>"},{"name":"How it works","html":"<p><strong>The backtest.<\/strong> Each model is fitted on the weeks up to a start point and forecasts the next 13. The start point moves forward two weeks at a time, 20 times; everything is refitted each time, from those weeks alone. The first 10 start points calibrate the uncertainty band; the last 10 are scored.<\/p>\n<p><strong>The decision rule was fixed before the first run:<\/strong> the lowest weighted quantile loss among models whose P90 (the level demand should exceed only one week in ten) covers 85–95% of weeks; within 2%, the simpler model.<\/p>\n<p><strong>Promotions are known ahead,<\/strong> as they are in a business. Every model gets the same promotion calendar.<\/p>\n<p><strong>When two signals disagree.<\/strong> The engine compares the forecast it is given with its own baseline. If they differ by more than 25% in a bucket with no promotion to explain it, the bucket is disputed: the surge above the baseline is cut by 50%, and the plan is held at the S&amp;OP gate until a planner decides which signal to trust.<\/p>\n<p><strong>What it cannot prove.<\/strong> The demand history is synthetic, generated from a seasonal model with noise. The backtest proves the pipeline and the scoring are honest; it does not prove accuracy on a real business.<\/p>"},{"name":"The maths","html":"<p>For each product, site and week, with <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math> the actual demand and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mover><mi>q<\/mi><mo stretchy=\"false\">&#x0005E;<\/mo><\/mover><mi>&#x003C4;<\/mi><\/msub><\/mrow><\/math> the forecast quantile <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C4;<\/mi><\/mrow><\/math> (P50, P90):<\/p>\n<p><strong>Pinball loss<\/strong> of one quantile:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>L<\/mi><mi>&#x003C4;<\/mi><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x0002C;<\/mo><mover><mi>q<\/mi><mo stretchy=\"false\">&#x0005E;<\/mo><\/mover><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>max<\/mo><mo minsize=\"1.2em\" maxsize=\"1.2em\">(<\/mo><mi>&#x003C4;<\/mi><mspace width=\"0.167em\" /><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mover><mi>q<\/mi><mo stretchy=\"false\">&#x0005E;<\/mo><\/mover><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002C;<\/mo><mspace width=\"0.278em\" /><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>&#x003C4;<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mover><mi>q<\/mi><mo stretchy=\"false\">&#x0005E;<\/mo><\/mover><mo>&#x02212;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo minsize=\"1.2em\" maxsize=\"1.2em\">)<\/mo><\/mrow><\/math><\/div>\n<p><strong>Weighted quantile loss<\/strong>, summed over all series and weeks, scaled by volume:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>WQL<\/mtext><mo>&#x0003D;<\/mo><mfrac><mrow><mn>2<\/mn><mo>&#x02211;<\/mo><mo minsize=\"1.2em\" maxsize=\"1.2em\">(<\/mo><msub><mi>L<\/mi><mrow><mn>0.5<\/mn><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>L<\/mi><mrow><mn>0.9<\/mn><\/mrow><\/msub><mo minsize=\"1.2em\" maxsize=\"1.2em\">)<\/mo><\/mrow><mrow><mn>2<\/mn><mo>&#x02211;<\/mo><mi>y<\/mi><\/mrow><\/mfrac><\/mrow><\/math><\/div>\n<p><strong>MASE<\/strong> compares the P50's absolute error with that of \"same week last year\": below 1 beats it.<\/p>\n<p><strong>P90 coverage<\/strong> is the share of weeks with <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x02264;<\/mo><msub><mover><mi>q<\/mi><mo stretchy=\"false\">&#x0005E;<\/mo><\/mover><mrow><mn>0.9<\/mn><\/mrow><\/msub><\/mrow><\/math>; the target is 90%.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Forecasting job (offline, own environment)<\/td>\n<td><code>tools/forecast.py<\/code>, <code>requirements-forecast.txt<\/code><\/td>\n<\/tr>\n<tr>\n<td>Forecast file the engine reads<\/td>\n<td><code>engine/forecastfile.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Baseline, reconciliation and the dispute rule<\/td>\n<td><code>engine/demand.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Results and method<\/td>\n<td><code>docs/forecasting.md<\/code>, <code>docs/benchmarks/<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The job never runs inside the API or the Control Tower; it writes a file with its model, version and scores, and every plan says which forecast it was built on.<\/p>"}],"search":" the plan serves a forecast, so the forecast has to earn its place. a model is used only if it beat a simple baseline on weeks it never saw. on lindewaard's history the winner is a mix of three (the median of ets, theta and chronos-2): weighted quantile loss 0.0695 against 0.0843 for the engine's own seasonal model, a lead clear of chance. its lead over chronos-2 alone is not clear (90% interval -0.0077 to +0.0047). an earlier run, before a product launch was added to the history, chose the engine's own model. the answer changed when the data did , which is why the backtest is re-run rather than last month's winner trusted. the backtest. each model is fitted on the weeks up to a start point and forecasts the next 13. the start point moves forward two weeks at a time, 20 times; everything is refitted each time, from those weeks alone. the first 10 start points calibrate the uncertainty band; the last 10 are scored. the decision rule was fixed before the first run: the lowest weighted quantile loss among models whose p90 (the level demand should exceed only one week in ten) covers 85–95% of weeks; within 2%, the simpler model. promotions are known ahead, as they are in a business. every model gets the same promotion calendar. when two signals disagree. the engine compares the forecast it is given with its own baseline. if they differ by more than 25% in a bucket with no promotion to explain it, the bucket is disputed: the surge above the baseline is cut by 50%, and the plan is held at the s&op gate until a planner decides which signal to trust. what it cannot prove. the demand history is synthetic, generated from a seasonal model with noise. the backtest proves the pipeline and the scoring are honest; it does not prove accuracy on a real business. for each product, site and week, with y the actual demand and q ^ τ the forecast quantile τ (p50, p90): pinball loss of one quantile: l τ ( y , q ^ ) = max ( τ ( y − q ^ ) , ( 1 − τ ) ( q ^ − y ) ) weighted quantile loss , summed over all series and weeks, scaled by volume: wql = 2 ∑ ( l 0.5 + l 0.9 ) 2 ∑ y mase compares the p50's absolute error with that of \"same week last year\": below 1 beats it. p90 coverage is the share of weeks with y ≤ q ^ 0.9 ; the target is 90%. what where forecasting job (offline, own environment) tools/forecast.py , requirements-forecast.txt forecast file the engine reads engine/forecastfile.py baseline, reconciliation and the dispute rule engine/demand.py results and method docs/forecasting.md , docs/benchmarks/ the job never runs inside the api or the control tower; it writes a file with its model, version and scores, and every plan says which forecast it was built on. "},{"part":"Planning","number":"9","slug":"optimiser","title":"The optimiser","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>The optimiser turns a company's data into the cheapest plan that keeps every physical rule, and proves how good that plan is.<\/p>\n<div class=\"story\"><div class=\"stage\"><div class=\"diagram\" data-diagram=\"optimiser\" data-story=\"1\"><\/div><\/div><div class=\"steps\"><div class=\"step\" data-state=\"decide\"><p><strong>Five decisions,<\/strong> for every product, site and time bucket of the year: <strong>make, buy, move, store, or fall short.<\/strong><\/p><\/div><div class=\"step\" data-state=\"price\"><p><strong>Each has a price, and it adds them all up.<\/strong> Lindewaard's plan of record costs €19.56M a year, mostly materials and production.<\/p><\/div><div class=\"step\" data-state=\"short\"><p><strong>Falling short is priced too:<\/strong> the margin of the lost sale plus a penalty for the broken promise. Service is weighed against cost, never hidden.<\/p><\/div><div class=\"step\" data-state=\"proof\"><p><strong>Then it proves how good the plan is.<\/strong> No plan can cost less than the bound; this one is within <strong>0.40%<\/strong> of it, against a target of 0.5%.<\/p><\/div><\/div><\/div>\n<p>The result: <strong>99.09%<\/strong> of demand served for <strong>€19.56M<\/strong>, in 2,496 truck trips.<\/p>"},{"name":"How it works","html":"<h3>What it decides, and what it weighs<\/h3>\n<p>Every decision has a price, and the optimiser adds them all up:<\/p>\n<ul>\n<li><strong>Making<\/strong> costs the line's variable cost and maintenance per hour. Each <strong>changeover<\/strong> (setup) costs time and money, so the plan prefers fewer, longer runs.<\/li>\n<li><strong>Buying<\/strong> costs the supplier's price, plus any surcharge in force in that week.<\/li>\n<li><strong>Moving<\/strong> is priced per <strong>truck<\/strong>, toll included, not per unit. A half-empty truck costs as much as a full one, which is why the plan consolidates.<\/li>\n<li><strong>Storing<\/strong> costs warehouse space and the <strong>capital<\/strong> tied up in the stock.<\/li>\n<li><strong>Carbon<\/strong> is priced on production and transport at the carbon price.<\/li>\n<li><strong>Falling short<\/strong> costs the margin of the lost sale <strong>plus<\/strong> a penalty for the broken promise. Shortages are priced, not forbidden: when one more setup or truck would cost more than the shortage, the optimiser takes the shortage, and the plan says so.<\/li>\n<\/ul>\n<h3>Try it: a small company, solved for real<\/h3>\n<p>One plant (its own line, 40 hours a week), a co-packer that may only send back to the plant, one distribution centre, two products, four weeks. <strong>Move the sliders.<\/strong> Every combination was solved by the real optimiser to proven optimality; the page only looks the answer up.<\/p>\n<div class=\"diagram\" data-diagram=\"toy\"><\/div>\n<p>Things to notice: as demand rises past what the line can make, the co-packer fills in first (it costs more), then shortages appear. At low demand the plan still leaves a little short: one more changeover would cost more than those few units are worth.<\/p>\n<h3>Time: fine near, coarse far<\/h3>\n<p>The tactical plan covers a year as 7 days, then 7 weeks, then 11 months of 28 days: detailed where decisions are about to be executed, coarse where they are only directions. The first bucket is committed: the next plan will not reopen it.<\/p>\n<div class=\"diagram\" data-diagram=\"buckets\"><\/div>\n<table>\n<thead>\n<tr>\n<th>Profile<\/th>\n<th>Used for<\/th>\n<th style=\"text-align: right;\">Solver target<\/th>\n<th style=\"text-align: right;\">Time limit<\/th>\n<th style=\"text-align: right;\">Answer expected within<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Operational<\/td>\n<td>the next days, execution<\/td>\n<td style=\"text-align: right;\">10%<\/td>\n<td style=\"text-align: right;\">4 s<\/td>\n<td style=\"text-align: right;\">5 s<\/td>\n<\/tr>\n<tr>\n<td>Tactical<\/td>\n<td>the year, the planning cycle<\/td>\n<td style=\"text-align: right;\">5%<\/td>\n<td style=\"text-align: right;\">600 s<\/td>\n<td style=\"text-align: right;\">180 s<\/td>\n<\/tr>\n<tr>\n<td>Strategic<\/td>\n<td>network design<\/td>\n<td style=\"text-align: right;\">2%<\/td>\n<td style=\"text-align: right;\">1500 s<\/td>\n<td style=\"text-align: right;\">1800 s<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Planning in layers, for large ranges<\/h3>\n<p>Above 8 finished products, a whole year in full detail is too large to solve in time. The engine then plans in <strong>two layers<\/strong>: the year per <strong>product family<\/strong> (products that share a liquid and a line), then the first 28 days per <strong>product<\/strong>, ending with the stock the year plan needs after them.<\/p>\n<div class=\"diagram\" data-diagram=\"layers\"><\/div>\n<h3>How sure is the plan?<\/h3>\n<p>A solver cannot try every plan, so it works from both sides. It keeps the <strong>best plan found so far<\/strong> (its cost is the <em>objective<\/em>) and proves a <strong>bound<\/strong>: no plan can be cheaper than that. The real best plan lies between the two. The <strong>gap<\/strong> is how far apart they are; when it falls below the target, the plan is <strong>proven<\/strong>.<\/p>\n<div class=\"diagram\" data-diagram=\"gap\"><\/div>\n<p>A plan the solver did not prove in its time limit is labelled as such and held at the S&amp;OP gate, never presented as optimal.<\/p>\n<h3>Which solver<\/h3>\n<p>Plans are solved by <strong>CBC<\/strong>, the open-source COIN-OR solver, through PuLP 3.3.2. Full-detail plans use CBC 2.10.3. A plan in layers of more than 8 products uses CBC's development build, which measured 2.6 to 8 times faster on those (the showcase's \"Which solver plans what\" has the table). Every plan records which solver and version made it.<\/p>\n<h3>When the clock runs out<\/h3>\n<p>If the solver finds no plan at all in its time, the engine builds a <strong>quick first plan<\/strong>: it solves the model with every whole-number decision allowed to be fractional, rounds those decisions (2.3 trucks become 3), fixes them, and solves again for the rest. The result keeps every rule; the first solve's cost is a bound, so its distance from the best is proven too. It is labelled and held for review. A plan with a label beats no plan.<\/p>\n<h3>After the solve: tidying up<\/h3>\n<p>Inside its proven gap a solver may book a pallet with nothing on it, or a truck with room to spare. Too cheap to matter to the gap, but nonsense on a load plan. After the solve, every whole-number pallet, truck and empty-return count is lowered to the least that every constraint allows. Nothing is re-solved: the plan only gets cheaper and still keeps every rule.<\/p>"},{"name":"The maths","html":"<p>The plan is a <strong>mixed-integer linear programme<\/strong>: a linear cost to minimise, linear rules, and some decisions that must be whole numbers. Below is the core, simplified for reading (buying, for instance, is mostly of components, not finished goods); the code adds the details named at the end.<\/p>\n<p><strong>Indices.<\/strong> Materials <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math>, sites <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><\/mrow><\/math>, time buckets <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math>, lanes <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x02113;<\/mi><\/mrow><\/math> (from one site to another), customers <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>c<\/mi><\/mrow><\/math>.<\/p>\n<p><strong>Decisions.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Symbol<\/th>\n<th>Meaning<\/th>\n<th>Kind<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/td>\n<td>units made<\/td>\n<td>continuous, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math><\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>y<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/td>\n<td>a changeover (setup) happens<\/td>\n<td>binary<\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>b<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/td>\n<td>units bought<\/td>\n<td>continuous, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math><\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>s<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/td>\n<td>units shipped on a lane<\/td>\n<td>continuous, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math><\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>q<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/td>\n<td>pallets on a lane<\/td>\n<td>integer<\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>k<\/mi><mrow><mi>&#x02113;<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/td>\n<td>trucks on a lane<\/td>\n<td>integer<\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/td>\n<td>stock at the end of a bucket<\/td>\n<td>continuous, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math><\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>c<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/td>\n<td>a customer's demand not served<\/td>\n<td>continuous, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Objective.<\/strong> Minimise total cost plus the price of shortfall:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mo>min<\/mo><mspace width=\"0.278em\" /><mspace width=\"0.278em\" /><msub><mo>&#x02211;<\/mo><mrow><mi>m<\/mi><mo>&#x0002C;<\/mo><mi>p<\/mi><mo>&#x0002C;<\/mo><mi>t<\/mi><\/mrow><\/msub><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msub><mi>v<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><\/msub><mspace width=\"0.167em\" /><msub><mi>x<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>f<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><\/msub><mspace width=\"0.167em\" /><msub><mi>y<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>&#x003C0;<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"0.167em\" /><msub><mi>b<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>h<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"0.167em\" /><msub><mi>I<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math><\/div>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mo>&#x0002B;<\/mo><msub><mo>&#x02211;<\/mo><mrow><mi>&#x02113;<\/mi><mo>&#x0002C;<\/mo><mi>t<\/mi><\/mrow><\/msub><msub><mi>F<\/mi><mrow><mi>&#x02113;<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"0.167em\" /><msub><mi>k<\/mi><mrow><mi>&#x02113;<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"0.278em\" /><mo>&#x0002B;<\/mo><msub><mo>&#x02211;<\/mo><mrow><mi>m<\/mi><mo>&#x0002C;<\/mo><mi>p<\/mi><mo>&#x0002C;<\/mo><mi>c<\/mi><mo>&#x0002C;<\/mo><mi>t<\/mi><\/mrow><\/msub><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msub><mi>g<\/mi><mi>m<\/mi><\/msub><mo>&#x0002B;<\/mo><msub><mi>&#x003C1;<\/mi><mi>m<\/mi><\/msub><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><msub><mi>w<\/mi><mi>c<\/mi><\/msub><mspace width=\"0.167em\" /><msub><mi>u<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>c<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/div>\n<p>where <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v<\/mi><\/mrow><\/math> is the variable cost of making a unit (with its carbon), <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><\/mrow><\/math> the cost of a changeover, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C0;<\/mi><\/mrow><\/math> the purchase price, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><\/mrow><\/math> the cost of a truck (freight, toll and carbon), <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><\/mrow><\/math> the cost of holding a unit for the bucket (warehousing and capital), <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><\/mrow><\/math> the gross margin, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C1;<\/mi><\/mrow><\/math> the shortage penalty and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>w<\/mi><mi>c<\/mi><\/msub><\/mrow><\/math> the customer's weight.<\/p>\n<p><strong>Stock balance.<\/strong> What a site holds at the end of a bucket is what it held before, plus what it made and received, minus what it sent and served:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>I<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0003D;<\/mo><msub><mi>I<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mo>&#x0002C;<\/mo><mi>t<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>x<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>b<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mo>&#x02211;<\/mo><mrow><mi>&#x02113;<\/mi><mo>&#x02208;<\/mo><mtext>in<\/mtext><mo stretchy=\"false\">&#x00028;<\/mo><mi>p<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/msub><msub><mi>s<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mi>t<\/mi><mo>&#x02212;<\/mo><msub><mi>L<\/mi><mi>&#x02113;<\/mi><\/msub><\/mrow><\/msub><mo>&#x02212;<\/mo><msub><mo>&#x02211;<\/mo><mrow><mi>&#x02113;<\/mi><mo>&#x02208;<\/mo><mtext>out<\/mtext><mo stretchy=\"false\">&#x00028;<\/mo><mi>p<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/msub><msub><mi>s<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x02212;<\/mo><msubsup><mi>d<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><mrow><mtext>served<\/mtext><\/mrow><\/msubsup><\/mrow><\/math><\/div>\n<p>with <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>L<\/mi><mi>&#x02113;<\/mi><\/msub><\/mrow><\/math> the lane's lead time in buckets, and demand either served or short:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msubsup><mi>d<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><mrow><mtext>served<\/mtext><\/mrow><\/msubsup><mo>&#x0002B;<\/mo><msub><mo>&#x02211;<\/mo><mi>c<\/mi><\/msub><msub><mi>u<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>c<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0003D;<\/mo><msub><mi>D<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/div>\n<p><strong>Line hours.<\/strong> Running and changeovers must fit in the hours the line really gives, after its efficiency (OEE):<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mo>&#x02211;<\/mo><mi>m<\/mi><\/msub><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msub><mi>r<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><\/msub><mspace width=\"0.167em\" /><msub><mi>x<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>&#x003C3;<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><\/msub><mspace width=\"0.167em\" /><msub><mi>y<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><mo>&#x02264;<\/mo><msub><mi>H<\/mi><mrow><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mi>&#x000B7;<\/mi><msub><mtext>OEE<\/mtext><mi>p<\/mi><\/msub><\/mrow><\/math><\/div>\n<p><strong>Lot sizes.<\/strong> Nothing is made without a changeover, and a run is at least its minimum lot:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msubsup><mi>Q<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><mrow><mo>min<\/mo><\/mrow><\/msubsup><mspace width=\"0.167em\" /><msub><mi>y<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"0.278em\" /><mo>&#x02264;<\/mo><mspace width=\"0.278em\" /><msub><mi>x<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"0.278em\" /><mo>&#x02264;<\/mo><mspace width=\"0.278em\" /><msubsup><mi>Q<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><mrow><mo>max<\/mo><\/mrow><\/msubsup><mspace width=\"0.167em\" /><msub><mi>y<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/div>\n<p><strong>Pallets and trucks.<\/strong> A part pallet takes a whole slot; pallets ride on whole trucks; no truck leaves empty, and dense freight runs out of payload before slots:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>s<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x02264;<\/mo><msub><mi>n<\/mi><mi>m<\/mi><\/msub><mspace width=\"0.167em\" /><msub><mi>q<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"2em\" /><msub><mo>&#x02211;<\/mo><mi>m<\/mi><\/msub><msub><mi>q<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x02264;<\/mo><msub><mi>P<\/mi><mi>&#x02113;<\/mi><\/msub><mspace width=\"0.167em\" /><msub><mi>k<\/mi><mrow><mi>&#x02113;<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"2em\" /><msub><mo>&#x02211;<\/mo><mi>m<\/mi><\/msub><msub><mi>&#x003BA;<\/mi><mi>m<\/mi><\/msub><mspace width=\"0.167em\" /><msub><mi>s<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x02264;<\/mo><msub><mi>W<\/mi><mi>&#x02113;<\/mi><\/msub><mspace width=\"0.167em\" /><msub><mi>k<\/mi><mrow><mi>&#x02113;<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/div>\n<p>with <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>n<\/mi><mi>m<\/mi><\/msub><\/mrow><\/math> units per pallet, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>P<\/mi><mi>&#x02113;<\/mi><\/msub><\/mrow><\/math> pallets per truck, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>&#x003BA;<\/mi><mi>m<\/mi><\/msub><\/mrow><\/math> kilograms per unit and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>W<\/mi><mi>&#x02113;<\/mi><\/msub><\/mrow><\/math> the maximum payload.<\/p>\n<p><strong>How sure: the gap.<\/strong> With <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><\/mrow><\/math> the cost of the plan found and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><munder><mrow><mi>z<\/mi><\/mrow><mo accent=\"true\">&#x02015;<\/mo><\/munder><\/mrow><\/math> the bound the solver proved,<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>gap<\/mtext><mo>&#x0003D;<\/mo><mfrac><mrow><mi>z<\/mi><mo>&#x02212;<\/mo><munder><mrow><mi>z<\/mi><\/mrow><mo accent=\"true\">&#x02015;<\/mo><\/munder><\/mrow><mrow><mi>z<\/mi><\/mrow><\/mfrac><\/mrow><\/math><\/div>\n<p>and the plan is proven when the gap is at or below the target: 5% for the tactical profile, 0.5% for the published plans.<\/p>\n<p><strong>Layers.<\/strong> The year layer solves the same model with each family <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><\/mrow><\/math> as one product. Its stock at the hand-over, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mover><mi>I<\/mi><mo stretchy=\"false\">&#x0007E;<\/mo><\/mover><mrow><mi>f<\/mi><mi>p<\/mi><\/mrow><\/msub><\/mrow><\/math>, is split between the family's products by their share of its demand, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>&#x003B1;<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><\/msub><\/mrow><\/math>, and becomes a target for the near weeks, priced like a shortage if missed:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>I<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mo>&#x0002C;<\/mo><mi>T<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>e<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><\/msub><mo>&#x02265;<\/mo><msub><mi>&#x003B1;<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><\/msub><mspace width=\"0.167em\" /><msub><mover><mi>I<\/mi><mo stretchy=\"false\">&#x0007E;<\/mo><\/mover><mrow><mi>f<\/mi><mi>p<\/mi><\/mrow><\/msub><mo>&#x0002C;<\/mo><mspace width=\"2em\" /><mtext>cost&#x000A0;<\/mtext><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>g<\/mi><mi>m<\/mi><\/msub><mo>&#x0002B;<\/mo><msub><mi>&#x003C1;<\/mi><mi>m<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><msub><mi>e<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><\/msub><\/mrow><\/math><\/div>\n<p>A target the near weeks cannot reach is a finding, not an infeasible model.<\/p>\n<p><strong>Also in the cod
