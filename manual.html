ch was added to the history, chose the engine's own model. <strong>The answer changed when the data did<\/strong>, which is why the backtest is re-run rather than last month's winner trusted.<\/p>"},{"name":"How it works","html":"<p><strong>The backtest.<\/strong> Each model is fitted on the weeks up to a start point and forecasts the next 13. The start point moves forward two weeks at a time, 20 times; everything is refitted each time, from those weeks alone. The first 10 start points calibrate the uncertainty band; the last 10 are scored.<\/p>\n<p><strong>The decision rule was fixed before the first run:<\/strong> the lowest weighted quantile loss among models whose P90 (the level demand should exceed only one week in ten) covers 85–95% of weeks; within 2%, the simpler model.<\/p>\n<p><strong>Promotions are known ahead,<\/strong> as they are in a business. Every model gets the same promotion calendar.<\/p>\n<p><strong>When two signals disagree.<\/strong> The engine compares the forecast it is given with its own baseline. If they differ by more than 25% in a bucket with no promotion to explain it, the bucket is disputed: the surge above the baseline is cut by 50%, and the plan is held at the S&amp;OP gate until a planner decides which signal to trust.<\/p>\n<p><strong>What it cannot prove.<\/strong> The demand history is synthetic, generated from a seasonal model with noise. The backtest proves the pipeline and the scoring are honest; it does not prove accuracy on real data, which remains untested.<\/p>"},{"name":"The maths","html":"<p>For each product, site and week, with <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math> the actual demand and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mover><mi>q<\/mi><mo stretchy=\"false\">&#x0005E;<\/mo><\/mover><mi>&#x003C4;<\/mi><\/msub><\/mrow><\/math> the forecast quantile <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C4;<\/mi><\/mrow><\/math> (P50, P90):<\/p>\n<p><strong>Pinball loss<\/strong> of one quantile:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>L<\/mi><mi>&#x003C4;<\/mi><\/msub><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x0002C;<\/mo><mover><mi>q<\/mi><mo stretchy=\"false\">&#x0005E;<\/mo><\/mover><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>max<\/mo><mo minsize=\"1.2em\" maxsize=\"1.2em\">(<\/mo><mi>&#x003C4;<\/mi><mspace width=\"0.167em\" /><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mover><mi>q<\/mi><mo stretchy=\"false\">&#x0005E;<\/mo><\/mover><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002C;<\/mo><mspace width=\"0.278em\" /><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>&#x003C4;<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mover><mi>q<\/mi><mo stretchy=\"false\">&#x0005E;<\/mo><\/mover><mo>&#x02212;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo minsize=\"1.2em\" maxsize=\"1.2em\">)<\/mo><\/mrow><\/math><\/div>\n<p><strong>Weighted quantile loss<\/strong>, summed over all series and weeks, scaled by volume:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>WQL<\/mtext><mo>&#x0003D;<\/mo><mfrac><mrow><mn>2<\/mn><mo>&#x02211;<\/mo><mo minsize=\"1.2em\" maxsize=\"1.2em\">(<\/mo><msub><mi>L<\/mi><mrow><mn>0.5<\/mn><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>L<\/mi><mrow><mn>0.9<\/mn><\/mrow><\/msub><mo minsize=\"1.2em\" maxsize=\"1.2em\">)<\/mo><\/mrow><mrow><mn>2<\/mn><mo>&#x02211;<\/mo><mi>y<\/mi><\/mrow><\/mfrac><\/mrow><\/math><\/div>\n<p><strong>MASE<\/strong> compares the P50's absolute error with that of \"same week last year\": below 1 beats it.<\/p>\n<p><strong>P90 coverage<\/strong> is the share of weeks with <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x02264;<\/mo><msub><mover><mi>q<\/mi><mo stretchy=\"false\">&#x0005E;<\/mo><\/mover><mrow><mn>0.9<\/mn><\/mrow><\/msub><\/mrow><\/math>; the target is 90%.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Forecasting job (offline, own environment)<\/td>\n<td><code>tools/forecast.py<\/code>, <code>requirements-forecast.txt<\/code><\/td>\n<\/tr>\n<tr>\n<td>Forecast file the engine reads<\/td>\n<td><code>engine/forecastfile.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Baseline, reconciliation and the dispute rule<\/td>\n<td><code>engine/demand.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Results and method<\/td>\n<td><code>docs/forecasting.md<\/code>, <code>docs/benchmarks/<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The job never runs inside the API or the Control Tower; it writes a file with its model, version and scores, and every plan says which forecast it was built on.<\/p>"}],"search":" the plan serves a forecast, so the forecast has to earn its place. a model is used only if it beat a simple baseline on weeks it never saw. on lindewaard's history the winner is a mix of three (the median of ets, theta and chronos-2): weighted quantile loss 0.0695 against 0.0843 for the engine's own seasonal model, a lead clear of chance. its lead over chronos-2 alone is not clear (90% interval -0.0077 to +0.0047). an earlier run, before a product launch was added to the history, chose the engine's own model. the answer changed when the data did , which is why the backtest is re-run rather than last month's winner trusted. the backtest. each model is fitted on the weeks up to a start point and forecasts the next 13. the start point moves forward two weeks at a time, 20 times; everything is refitted each time, from those weeks alone. the first 10 start points calibrate the uncertainty band; the last 10 are scored. the decision rule was fixed before the first run: the lowest weighted quantile loss among models whose p90 (the level demand should exceed only one week in ten) covers 85–95% of weeks; within 2%, the simpler model. promotions are known ahead, as they are in a business. every model gets the same promotion calendar. when two signals disagree. the engine compares the forecast it is given with its own baseline. if they differ by more than 25% in a bucket with no promotion to explain it, the bucket is disputed: the surge above the baseline is cut by 50%, and the plan is held at the s&op gate until a planner decides which signal to trust. what it cannot prove. the demand history is synthetic, generated from a seasonal model with noise. the backtest proves the pipeline and the scoring are honest; it does not prove accuracy on real data, which remains untested. for each product, site and week, with y the actual demand and q ^ τ the forecast quantile τ (p50, p90): pinball loss of one quantile: l τ ( y , q ^ ) = max ( τ ( y − q ^ ) , ( 1 − τ ) ( q ^ − y ) ) weighted quantile loss , summed over all series and weeks, scaled by volume: wql = 2 ∑ ( l 0.5 + l 0.9 ) 2 ∑ y mase compares the p50's absolute error with that of \"same week last year\": below 1 beats it. p90 coverage is the share of weeks with y ≤ q ^ 0.9 ; the target is 90%. what where forecasting job (offline, own environment) tools/forecast.py , requirements-forecast.txt forecast file the engine reads engine/forecastfile.py baseline, reconciliation and the dispute rule engine/demand.py results and method docs/forecasting.md , docs/benchmarks/ the job never runs inside the api or the control tower; it writes a file with its model, version and scores, and every plan says which forecast it was built on. "},{"part":"Planning","number":"9","slug":"optimiser","title":"The optimiser","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>The optimiser turns a company's data into the cheapest plan that keeps every physical rule, and proves how good that plan is.<\/p>\n<div class=\"story\"><div class=\"stage\"><div class=\"diagram\" data-diagram=\"optimiser\" data-story=\"1\"><\/div><\/div><div class=\"steps\"><div class=\"step\" data-state=\"decide\"><p><strong>Five decisions,<\/strong> for every product, site and time bucket of the year: <strong>make, buy, move, store, or fall short.<\/strong><\/p><\/div><div class=\"step\" data-state=\"price\"><p><strong>Each has a price, and it adds them all up.<\/strong> Lindewaard's plan of record costs €20.28M a year, mostly materials and production.<\/p><\/div><div class=\"step\" data-state=\"short\"><p><strong>Falling short is priced too:<\/strong> the margin of the lost sale plus a penalty for the broken promise. Service is weighed against cost, never hidden.<\/p><\/div><div class=\"step\" data-state=\"proof\"><p><strong>Then it proves how good the plan is.<\/strong> No plan can cost less than the bound; this one is within <strong>0.29%<\/strong> of it, against a target of 0.5%.<\/p><\/div><\/div><\/div>\n<p>The result: <strong>99.08%<\/strong> of demand served for <strong>€20.28M<\/strong>, in 2,456 truck trips.<\/p>"},{"name":"How it works","html":"<h3>What it decides, and what it weighs<\/h3>\n<p>Every decision has a price, and the optimiser adds them all up:<\/p>\n<ul>\n<li><strong>Making<\/strong> costs the line's variable cost and maintenance per hour. Each <strong>changeover<\/strong> (setup) costs time and money, so the plan prefers fewer, longer runs.<\/li>\n<li><strong>Buying<\/strong> costs the supplier's price, plus any surcharge in force in that week.<\/li>\n<li><strong>Moving<\/strong> is priced per <strong>truck<\/strong>, toll included, not per unit. A half-empty truck costs as much as a full one, which is why the plan consolidates.<\/li>\n<li><strong>Storing<\/strong> costs warehouse space and the <strong>capital<\/strong> tied up in the stock.<\/li>\n<li><strong>Carbon<\/strong> is priced on production and transport at the carbon price.<\/li>\n<li><strong>Falling short<\/strong> costs the margin of the lost sale <strong>plus<\/strong> a penalty for the broken promise. Shortages are priced, not forbidden: when one more setup or truck would cost more than the shortage, the optimiser takes the shortage, and the plan says so.<\/li>\n<\/ul>\n<h3>Try it: a small company, solved for real<\/h3>\n<p>One plant (its own line, 40 hours a week), a co-packer that may only send back to the plant, one distribution centre, two products, four weeks. <strong>Move the sliders.<\/strong> Every combination was solved by the real optimiser to proven optimality; the page only looks the answer up.<\/p>\n<div class=\"diagram\" data-diagram=\"toy\"><\/div>\n<p>Things to notice: as demand rises past what the line can make, the co-packer fills in first (it costs more), then shortages appear. At low demand the plan still leaves a little short: one more changeover would cost more than those few units are worth.<\/p>\n<h3>Time: fine near, coarse far<\/h3>\n<p>The tactical plan covers a year as 7 days, then 7 weeks, then 11 months of 28 days: detailed where decisions are about to be executed, coarse where they are only directions. The first bucket is committed: the next plan will not reopen it.<\/p>\n<div class=\"diagram\" data-diagram=\"buckets\"><\/div>\n<table>\n<thead>\n<tr>\n<th>Profile<\/th>\n<th>Used for<\/th>\n<th style=\"text-align: right;\">Solver target<\/th>\n<th style=\"text-align: right;\">Time limit<\/th>\n<th style=\"text-align: right;\">Answer expected within<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Operational<\/td>\n<td>the next days, execution<\/td>\n<td style=\"text-align: right;\">10%<\/td>\n<td style=\"text-align: right;\">4 s<\/td>\n<td style=\"text-align: right;\">5 s<\/td>\n<\/tr>\n<tr>\n<td>Tactical<\/td>\n<td>the year, the planning cycle<\/td>\n<td style=\"text-align: right;\">5%<\/td>\n<td style=\"text-align: right;\">600 s<\/td>\n<td style=\"text-align: right;\">180 s<\/td>\n<\/tr>\n<tr>\n<td>Strategic<\/td>\n<td>network design<\/td>\n<td style=\"text-align: right;\">2%<\/td>\n<td style=\"text-align: right;\">1500 s<\/td>\n<td style=\"text-align: right;\">1800 s<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Planning in layers, for large ranges<\/h3>\n<p>Above 8 finished products, a whole year in full detail is too large to solve in time. The engine then plans in <strong>two layers<\/strong>: the year per <strong>product family<\/strong> (products that share a liquid and a line), then the first 28 days per <strong>product<\/strong>, ending with the stock the year plan needs after them. Both are solved as a <strong>rough cut<\/strong>: runs, pallets and trucks in whole numbers for the first 7 days, averages after, and pallets counted from what is shipped.<\/p>\n<div class=\"diagram\" data-diagram=\"layers\"><\/div>\n<h3>How sure is the plan?<\/h3>\n<p>A solver cannot try every plan, so it works from both sides. It keeps the <strong>best plan found so far<\/strong> (its cost is the <em>objective<\/em>) and proves a <strong>bound<\/strong>: no plan can be cheaper than that. The real best plan lies between the two. The <strong>gap<\/strong> is how far apart they are; when it falls below the target, the plan is <strong>proven<\/strong>.<\/p>\n<div class=\"diagram\" data-diagram=\"gap\"><\/div>\n<p>A plan the solver did not prove in its time limit is labelled as such and held at the S&amp;OP gate, never presented as optimal.<\/p>\n<h3>Which solver<\/h3>\n<p>Plans are solved by <strong>CBC<\/strong>, the open-source COIN-OR solver, through PuLP 3.3.2. Full-detail plans use CBC 2.10.3. A plan in layers of more than 8 products uses CBC's development build, which measured 2.6 to 8 times faster on those (the showcase's \"Which solver plans what\" has the table). Every plan records which solver and version made it.<\/p>\n<h3>When the clock runs out<\/h3>\n<p>If the solver finds no plan at all in its time, the engine builds a <strong>quick first plan<\/strong>: it solves the model with every whole-number decision allowed to be fractional, rounds those decisions (2.3 trucks become 3), fixes them, and solves again for the rest. The result keeps every rule; the first solve's cost is a bound, so its distance from the best is proven too. It is labelled and held for review. A plan with a label beats no plan.<\/p>\n<h3>After the solve: tidying up<\/h3>\n<p>Inside its proven gap a solver may book a pallet with nothing on it, or a truck with room to spare. Too cheap to matter to the gap, but nonsense on a load plan. After the solve, every whole-number pallet, truck and empty-return count is lowered to the least that every constraint allows. Nothing is re-solved: the plan only gets cheaper and still keeps every rule.<\/p>"},{"name":"The maths","html":"<p>The plan is a <strong>mixed-integer linear programme<\/strong>: a linear cost to minimise, linear rules, and some decisions that must be whole numbers. Below is the core, simplified for reading (buying, for instance, is mostly of components, not finished goods); the code adds the details named at the end.<\/p>\n<p><strong>Indices.<\/strong> Materials <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math>, sites <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><\/mrow><\/math>, time buckets <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math>, lanes <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x02113;<\/mi><\/mrow><\/math> (from one site to another), customers <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>c<\/mi><\/mrow><\/math>.<\/p>\n<p><strong>Decisions.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Symbol<\/th>\n<th>Meaning<\/th>\n<th>Kind<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/td>\n<td>units made<\/td>\n<td>continuous, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math><\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>y<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/td>\n<td>a changeover (setup) happens<\/td>\n<td>binary<\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>b<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/td>\n<td>units bought<\/td>\n<td>continuous, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math><\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>s<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/td>\n<td>units shipped on a lane<\/td>\n<td>continuous, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math><\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>q<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/td>\n<td>pallets on a lane<\/td>\n<td>integer<\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>k<\/mi><mrow><mi>&#x02113;<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/td>\n<td>trucks on a lane<\/td>\n<td>integer<\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/td>\n<td>stock at the end of a bucket<\/td>\n<td>continuous, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math><\/td>\n<\/tr>\n<tr>\n<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>c<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/td>\n<td>a customer's demand not served<\/td>\n<td>continuous, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02265;<\/mo><mn>0<\/mn><\/mrow><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Objective.<\/strong> Minimise total cost plus the price of shortfall:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mo>min<\/mo><mspace width=\"0.278em\" /><mspace width=\"0.278em\" /><msub><mo>&#x02211;<\/mo><mrow><mi>m<\/mi><mo>&#x0002C;<\/mo><mi>p<\/mi><mo>&#x0002C;<\/mo><mi>t<\/mi><\/mrow><\/msub><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msub><mi>v<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><\/msub><mspace width=\"0.167em\" /><msub><mi>x<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>f<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><\/msub><mspace width=\"0.167em\" /><msub><mi>y<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>&#x003C0;<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"0.167em\" /><msub><mi>b<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>h<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"0.167em\" /><msub><mi>I<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math><\/div>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mo>&#x0002B;<\/mo><msub><mo>&#x02211;<\/mo><mrow><mi>&#x02113;<\/mi><mo>&#x0002C;<\/mo><mi>t<\/mi><\/mrow><\/msub><msub><mi>F<\/mi><mrow><mi>&#x02113;<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"0.167em\" /><msub><mi>k<\/mi><mrow><mi>&#x02113;<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"0.278em\" /><mo>&#x0002B;<\/mo><msub><mo>&#x02211;<\/mo><mrow><mi>m<\/mi><mo>&#x0002C;<\/mo><mi>p<\/mi><mo>&#x0002C;<\/mo><mi>c<\/mi><mo>&#x0002C;<\/mo><mi>t<\/mi><\/mrow><\/msub><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msub><mi>g<\/mi><mi>m<\/mi><\/msub><mo>&#x0002B;<\/mo><msub><mi>&#x003C1;<\/mi><mi>m<\/mi><\/msub><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><msub><mi>w<\/mi><mi>c<\/mi><\/msub><mspace width=\"0.167em\" /><msub><mi>u<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>c<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"0.278em\" /><mo>&#x0002B;<\/mo><msub><mo>&#x02211;<\/mo><mrow><mi>m<\/mi><mo>&#x0002C;<\/mo><mi>p<\/mi><mo>&#x0002C;<\/mo><mi>c<\/mi><mo>&#x0002C;<\/mo><mi>t<\/mi><\/mrow><\/msub><msub><mi>&#x003B4;<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>c<\/mi><\/mrow><\/msub><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msub><mi>D<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>c<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x02212;<\/mo><msub><mi>u<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>c<\/mi><mi>t<\/mi><\/mrow><\/msub><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math><\/div>\n<p>where <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v<\/mi><\/mrow><\/math> is the variable cost of making a unit (with its carbon), <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><\/mrow><\/math> the cost of a changeover, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C0;<\/mi><\/mrow><\/math> the purchase price, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><\/mrow><\/math> the cost of a truck (freight, toll and carbon), <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><\/mrow><\/math> the cost of holding a unit for the bucket (warehousing and capital), <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><\/mrow><\/math> the gross margin, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C1;<\/mi><\/mrow><\/math> the shortage penalty, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>w<\/mi><mi>c<\/mi><\/msub><\/mrow><\/math> the customer's weight, and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B4;<\/mi><\/mrow><\/math> the delivery of a unit from site <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><\/mrow><\/math> to customer <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>c<\/mi><\/mrow><\/math> (a full truck's cost and carbon over what it holds), where the workspace prices deliveries: only what is served is delivered.<\/p>\n<p><strong>Stock balance.<\/strong> What a site holds at the end of a bucket is what it held before, plus what it made and received, minus what it sent and served:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>I<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0003D;<\/mo><msub><mi>I<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mo>&#x0002C;<\/mo><mi>t<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>x<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>b<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mo>&#x02211;<\/mo><mrow><mi>&#x02113;<\/mi><mo>&#x02208;<\/mo><mtext>in<\/mtext><mo stretchy=\"false\">&#x00028;<\/mo><mi>p<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/msub><msub><mi>s<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mi>t<\/mi><mo>&#x02212;<\/mo><msub><mi>L<\/mi><mi>&#x02113;<\/mi><\/msub><\/mrow><\/msub><mo>&#x02212;<\/mo><msub><mo>&#x02211;<\/mo><mrow><mi>&#x02113;<\/mi><mo>&#x02208;<\/mo><mtext>out<\/mtext><mo stretchy=\"false\">&#x00028;<\/mo><mi>p<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/msub><msub><mi>s<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x02212;<\/mo><msubsup><mi>d<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><mrow><mtext>served<\/mtext><\/mrow><\/msubsup><\/mrow><\/math><\/div>\n<p>with <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>L<\/mi><mi>&#x02113;<\/mi><\/msub><\/mrow><\/math> the lane's lead time in buckets, and demand either served or short:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msubsup><mi>d<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><mrow><mtext>served<\/mtext><\/mrow><\/msubsup><mo>&#x0002B;<\/mo><msub><mo>&#x02211;<\/mo><mi>c<\/mi><\/msub><msub><mi>u<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>c<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0003D;<\/mo><msub><mi>D<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/div>\n<p><strong>Line hours.<\/strong> Running and changeovers must fit in the hours the line really gives, after its efficiency (OEE):<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mo>&#x02211;<\/mo><mi>m<\/mi><\/msub><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msub><mi>r<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><\/msub><mspace width=\"0.167em\" /><msub><mi>x<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>&#x003C3;<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><\/msub><mspace width=\"0.167em\" /><msub><mi>y<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><mo>&#x02264;<\/mo><msub><mi>H<\/mi><mrow><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mi>&#x000B7;<\/mi><msub><mtext>OEE<\/mtext><mi>p<\/mi><\/msub><\/mrow><\/math><\/div>\n<p><strong>Lot sizes.<\/strong> Nothing is made without a changeover, and a run is at least its minimum lot:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msubsup><mi>Q<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><mrow><mo>min<\/mo><\/mrow><\/msubsup><mspace width=\"0.167em\" /><msub><mi>y<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"0.278em\" /><mo>&#x02264;<\/mo><mspace width=\"0.278em\" /><msub><mi>x<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"0.278em\" /><mo>&#x02264;<\/mo><mspace width=\"0.278em\" /><msubsup><mi>Q<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><mrow><mo>max<\/mo><\/mrow><\/msubsup><mspace width=\"0.167em\" /><msub><mi>y<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/div>\n<p><strong>Pallets and trucks.<\/strong> A part pallet takes a whole slot; pallets ride on whole trucks; no truck leaves empty, and dense freight runs out of payload before slots:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>s<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x02264;<\/mo><msub><mi>n<\/mi><mi>m<\/mi><\/msub><mspace width=\"0.167em\" /><msub><mi>q<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"2em\" /><msub><mo>&#x02211;<\/mo><mi>m<\/mi><\/msub><msub><mi>q<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x02264;<\/mo><msub><mi>P<\/mi><mi>&#x02113;<\/mi><\/msub><mspace width=\"0.167em\" /><msub><mi>k<\/mi><mrow><mi>&#x02113;<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"2em\" /><msub><mo>&#x02211;<\/mo><mi>m<\/mi><\/msub><msub><mi>&#x003BA;<\/mi><mi>m<\/mi><\/msub><mspace width=\"0.167em\" /><msub><mi>s<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x02264;<\/mo><msub><mi>W<\/mi><mi>&#x02113;<\/mi><\/msub><mspace width=\"0.167em\" /><msub><mi>k<\/mi><mrow><mi>&#x02113;<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/div>\n<p>with <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>n<\/mi><mi>m<\/mi><\/msub><\/mrow><\/math> units per pallet, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>P<\/mi><mi>&#x02113;<\/mi><\/msub><\/mrow><\/math> pallets per truck, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>&#x003BA;<\/mi><mi>m<\/mi><\/msub><\/mrow><\/math> kilograms per unit and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>W<\/mi><mi>&#x02113;<\/mi><\/msub><\/mrow><\/math> the maximum payload.<\/p>\n<p><strong>How sure: the gap.<\/strong> With <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><\/mrow><\/math> the cost of the plan found and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><munder><mrow><mi>z<\/mi><\/mrow><mo accent=\"true\">&#x02015;<\/mo><\/munder><\/mrow><\/math> the bound the solver proved,<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>gap<\/mtext><mo>&#x0003D;<\/mo><mfrac><mrow><mi>z<\/mi><mo>&#x02212;<\/mo><munder><mrow><mi>z<\/mi><\/mrow><mo accent=\"true\">&#x02015;<\/mo><\/munder><\/mrow><mrow><mi>z<\/mi><\/mrow><\/mfrac><\/mrow><\/math><\/div>\n<p>and the plan is proven when the gap is at or below the target: 5% for the tactical profile, 0.5% for the published plans.<\/p>\n<p><strong>Layers.<\/strong> The year layer solves the same model with each family <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><\/mrow><\/math> as one product. Its stock at the hand-over, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mover><mi>I<\/mi><mo stretchy=\"false\">&#x0007E;<\/mo><\/mover><mrow><mi>f<\/mi><mi>p<\/mi><\/mrow><\/msub><\/mrow><\/math>, is split between the family's products by their share of its demand, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>&#x003B1;<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><\/msub><\/mrow><\/math>, and becomes a target for the near weeks, priced like a shortage if missed:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>I<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mo>&#x0002C;<\/mo><mi>T<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>e<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><\/msub><mo>&#x02265;<\/mo><msub><mi>&#x003B1;<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><\/msub><mspace width=\"0.167em\" /><msub><mover><mi>I<\/mi><mo stretchy=\"false\">&#x0007E;<\/mo><\/mover><mrow><mi>f<\/mi><mi>p<\/mi><\/mrow><\/msub><mo>&#x0002C;<\/mo><mspace width=\"2em\" /><mtext>cost&#x000A0;<\/mtext><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>g<\/mi><mi>m<\/mi><\/msub><mo>&#x0002B;<\/mo><msub><mi>&#x003C1;<\/mi><mi>m<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><msub><mi>e<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><\/msub><\/mrow><\/math><\/div>\n<p>A target the near weeks cannot reach is a finding, not an infeasible model.<\/p>\n<p><strong>Also in the code:<\/strong> components exploded from recipes (bill of materials), shelf life (stock older than its customers accept is written off at standard cost), DDMRP buffer floors whose breach is priced, co-packer rules (they may only send back to their parent plant), dangerous goods only on licensed carriers, the empty run home where charged, a committed first bucket that is not reopened, and optionally a time fence beyond which changeovers, pallets and trucks are planned as averages.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Model and solve<\/td>\n<td><code>engine/optimizer.py<\/code> (<code>MILPOptimizer.solve<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Solver choice<\/td>\n<td><code>engine/solvers.py<\/code>: <code>ZK_SOLVER<\/code>, or the default; <code>prefer()<\/code> for plans in layers<\/td>\n<\/tr>\n<tr>\n<td>How the solve ended<\/td>\n<td><code>engine/solverreport.py<\/code> reads the solver's own log, both CBC builds<\/td>\n<\/tr>\n<tr>\n<td>Quick first plan<\/td>\n<td><code>engine/firstplan.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Tidy-up<\/td>\n<td><code>engine/tidy.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Planning in layers<\/td>\n<td><code>main.plan_layered<\/code>, <code>engine/families.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Profiles and buckets<\/td>\n<td><code>engine/profiles.py<\/code>, <code>engine/horizon.py<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Size.<\/strong> Lindewaard's full year in full detail is 19,707 decisions, 7,775 of them whole numbers, under 17,688 constraints.<\/p>\n<p><strong>Solvers.<\/strong> PuLP 3.3.2 with CBC 2.10.3 (bundled) and the development build from cbcbox 2.935 (used for plans in layers above 8 products). HiGHS and SCIP are wired in for benchmarks (<code>ZK_SOLVER=highs<\/code>, <code>ZK_SOLVER=scip<\/code>) and measured slower on the engine's real flow.<\/p>\n<p><strong>Tests that guard it.<\/strong> The toy above is regenerated and checked by <code>tools/manual_toy.py --check<\/code>. The suite checks, among others: a plan with a tighter formulation finds the same optimum; both CBC logs are read correctly; a plan in layers hands the family stock to the near weeks; the tidy-up never breaks a constraint; and an unproven plan is held.<\/p>"}],"search":" the optimiser turns a company's data into the cheapest plan that keeps every physical rule, and proves how good that plan is. five decisions, for every product, site and time bucket of the year: make, buy, move, store, or fall short. each has a price, and it adds them all up. lindewaard's plan of record costs €20.28m a year, mostly materials and production. falling short is priced too: the margin of the lost sale plus a penalty for the broken promise. service is weighed against cost, never hidden. then it proves how good the plan is. no plan can cost less than the bound; this one is within 0.29% of it, against a target of 0.5%. the result: 99.08% of demand served for €20.28m , in 2,456 truck trips. what it decides, and what it weighs every decision has a price, and the optimiser adds them all up: making costs the line's variable cost and maintenance per hour. each changeover (setup) costs time and money, so the plan prefers fewer, longer runs. buying costs the supplier's price, plus any surcharge in force in that week. moving is priced per truck , toll included, not per unit. a half-empty truck costs as much as a full one, which is why the plan consolidates. storing costs warehouse space and the capital tied up in the stock. carbon is priced on production and transport at the carbon price. falling short costs the margin of the lost sale plus a penalty for the broken promise. shortages are priced, not forbidden: when one more setup or truck would cost more than the shortage, the optimiser takes the shortage, and the plan says so. try it: a small company, solved for real one plant (its own line, 40 hours a week), a co-packer that may only send back to the plant, one distribution centre, two products, four weeks. move the sliders. every combination was solved by the real optimiser to proven optimality; the page only looks the answer up. things to notice: as demand rises past what the line can make, the co-packer fills in first (it costs more), then shortages appear. at low demand the plan still leaves a little short: one more changeover would cost more than those few units are worth. time: fine near, coarse far the tactical plan covers a year as 7 days, then 7 weeks, then 11 months of 28 days: detailed where decisions are about to be executed, coarse where they are only directions. the first bucket is committed: the next plan will not reopen it. profile used for solver target time limit answer expected within operational the next days, execution 10% 4 s 5 s tactical the year, the planning cycle 5% 600 s 180 s strategic network design 2% 1500 s 1800 s planning in layers, for large ranges above 8 finished products, a whole year in full detail is too large to solve in time. the engine then plans in two layers : the year per product family (products that share a liquid and a line), then the first 28 days per product , ending with the stock the year plan needs after them. both are solved as a rough cut : runs, pallets and trucks in whole numbers for the first 7 days, averages after, and pallets counted from what is shipped. how sure is the plan? a solver cannot try every plan, so it works from both sides. it keeps the best plan found so far (its cost is the objective ) and proves a bound : no plan can be cheaper than that. the real best plan lies between the two. the gap is how far apart they are; when it falls below the target, the plan is proven . a plan the solver did not prove in its time limit is labelled as such and held at the s&op gate, never presented as optimal. which solver plans are solved by cbc , the open-source coin-or solver, through pulp 3.3.2. full-detail plans use cbc 2.10.3. a plan in layers of more than 8 products uses cbc's development build, which measured 2.6 to 8 times faster on those (the showcase's \"which solver plans what\" has the table). every plan records which solver and version made it. when the clock runs out if the solver finds no plan at all in its time, the engine builds a quick first plan : it solves the model with every whole-number decision allowed to be fractional, rounds those decisions (2.3 trucks become 3), fixes them, and solves again for the rest. the result keeps every rule; the first solve's cost is a bound, so its distance from the best is proven too. it is labelled and held for review. a plan with a label beats no plan. after the solve: tidying up inside its proven gap a solver may book a pallet with nothing on it, or a truck with room to spare. too cheap to matter to the gap, but nonsense on a load plan. after the solve, every whole-number pallet, truck and empty-return count is lowered to the least that every constraint allows. nothing is re-solved: the plan only gets cheaper and still keeps every rule. the plan is a mixed-integer linear programme : a linear cost to minimise, linear rules, and some decisions that must be whole numbers. below is the core, simplified for reading (buying, for instance, is mostly of components, not finished goods); the code adds the details named at the end. indices. materials m , sites p , time buckets t , lanes ℓ (from one site to another), customers c . decisions. symbol meaning kind x m p t units made continuous, ≥ 0 y m p t a changeover (setup) happens binary b m p t units bought continuous, ≥ 0 s ℓ m t units shipped on a lane continuous, ≥ 0 q ℓ m t pallets on a lane integer k ℓ t trucks on a lane integer i m p t stock at the end of a bucket continuous, ≥ 0 u m p c t a customer's demand not served continuous, ≥ 0 objective. minimise total cost plus the price of shortfall: min ∑ m , p , t ( v m p x m p t + f m p y m p t + π m p t b m p t + h m p t i m p t ) + ∑ ℓ , t f ℓ t k ℓ t + ∑ m , p , c , t ( g m + ρ m ) w c u m p c t + ∑ m , p , c , t δ m p c ( d m p c t − u m p c t ) where v is the variable cost of making a unit (with its carbon), f the cost of a changeover, π the purchase price, f the cost of a truck (freight, toll and carbon), h the cost of holding a unit for the bucket (warehousing and capital), g the gross margin, ρ the shortage penalty, w c the customer's weight, and δ the delivery of a unit from site p to customer c (a full truck's cost and carbon over what it holds), where the workspace prices deliveries: only what is served is delivered. stock balance. what a site holds at the end of a bucket is what it held before, plus what it made and received, minus what it sent and served: i m p t = i m p , t − 1 + x m p t + b m p t + ∑ ℓ ∈ in ( p ) s ℓ m , t − l ℓ − ∑ ℓ ∈ out ( p ) s ℓ m t − d m p t served with l ℓ the lane's lead time in buckets, and demand either served or short: d m p t served + ∑ c u m p c t = d m p t line hours. running and changeovers must fit in the hours the line really gives, after its efficiency (oee): ∑ m ( r m p x m p t + σ m p y m p t ) ≤ h p t · oee p lot sizes. nothing is made without a changeover, and a run is at least its minimum lot: q m p min y m p t ≤ x m p t ≤ q m p max y m p t pallets and trucks. a part pallet takes a whole slot; pallets ride on whole trucks; no truck leaves empty, and dense freight runs out of payload before slots: s ℓ m t ≤ n m q ℓ m t ∑ m q ℓ m t ≤ p ℓ k ℓ t ∑ m κ m s ℓ m t ≤ w ℓ k ℓ t with n m units per pallet, p ℓ pallets per truck, κ m kilograms per unit and w ℓ the maximum payload. how sure: the gap. with z the cost of the plan found and z ― the bound the solver proved, gap = z − z ― z and the plan is proven when the gap is at or below the target: 5% for the tactical profile, 0.5% for the published plans. layers. the year layer solves the same model with each family f as one product. its stock at the hand-over, i ~ f p , is split between the family's products by their share of its demand, α m p , and becomes a target for the near weeks, priced like a shortage if missed: i m p , t + e m p ≥ α m p i ~ f p , cost  ( g m + ρ m ) e m p a target the near weeks cannot reach is a finding, not an infeasible model. also in the code: components exploded from recipes (bill of materials), shelf life (stock older than its customers accept is written off at standard cost), ddmrp buffer floors whose breach is priced, co-packer rules (they may only send back to their parent plant), dangerous goods only on licensed carriers, the empty run home where charged, a committed first bucket that is not reopened, and optionally a time fence beyond which changeovers, pallets and trucks are planned as averages. what where model and solve engine/optimizer.py ( milpoptimizer.solve ) solver choice engine/solvers.py : zk_solver , or the default; prefer() for plans in layers how the solve ended engine/solverreport.py reads the solver's own log, both cbc builds quick first plan engine/firstplan.py tidy-up engine/tidy.py planning in layers main.plan_layered , engine/families.py profiles and buckets engine/profiles.py , engine/horizon.py size. lindewaard's full year in full detail is 19,707 decisions, 7,775 of them whole numbers, under 17,688 constraints. solvers. pulp 3.3.2 with cbc 2.10.3 (bundled) and the development build from cbcbox 2.935 (used for plans in layers above 8 products). highs and scip are wired in for benchmarks ( zk_solver=highs , zk_solver=scip ) and measured slower on the engine's real flow. tests that guard it. the toy above is regenerated and checked by tools/manual_toy.py --check . the suite checks, among others: a plan with a tighter formulation finds the same optimum; both cbc logs are read correctly; a plan in layers hands the family stock to the near weeks; the tidy-up never breaks a constraint; and an unproven plan is held. "},{"part":"Planning","number":"10","slug":"network-rules","title":"Network rules","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>The plan has to be one a warehouse could actually run. These are the physical and contractual rules the optimiser cannot break, priced or forbidden.<\/p>\n<div class=\"story\"><div class=\"stage\"><div class=\"diagram\" data-diagram=\"truck\" data-story=\"1\"><\/div><\/div><div class=\"steps\"><div class=\"step\" data-state=\"slots\"><p><strong>A truck has slots.<\/strong> A standard trailer takes 30 pallets, and a part pallet still takes a whole slot.<\/p><\/div><div class=\"step\" data-state=\"payload\"><p><strong>And a weight limit.<\/strong> Dense drinks fill the 24,000 kg legal payload long before the slots: the truck leaves \"full\" with empty floor.<\/p><\/div><div class=\"step\" data-state=\"zones\"><p><strong>Chilled, ambient and dangerous goods do not share.<\/strong> Each temperature zone, and each class of dangerous goods, rides its own vehicle.<\/p><\/div><div class=\"step\" data-state=\"copacker\"><p><strong>Co-packers send everything back.<\/strong> A batch made by a contract manufacturer returns to its parent plant for quality release before it can ship: 2 extra days, freight both ways.<\/p><\/div><\/div><\/div>"},{"name":"How it works","html":"<p><strong>Freight<\/strong><\/p>\n<ul>\n<li><strong>Full truckloads<\/strong> are paid whole: fill decides cost. A trailer is limited by 30 pallets or 24,000 kg, whichever comes first, and no truck leaves without a load.<\/li>\n<li><strong>Groupage<\/strong> (a few pallets on someone else's vehicle) is paid per pallet, about 2.5× the full-load rate, and stops being groupage past a few pallets.<\/li>\n<li><strong>Own fleet first:<\/strong> 50 trips a period across all own lanes; beyond that, contracted or spot hauliers at their own price and carbon.<\/li>\n<li><strong>The empty run home<\/strong> is charged where a lane says so: either the trailer carries something back, or someone pays for the kilometres it runs empty.<\/li>\n<li><strong>Road tolls:<\/strong> the Dutch truck toll, in force since 1 July 2026, is charged per kilometre on every departure, empty runs included, at the rates for the date the truck leaves.<\/li>\n<\/ul>\n<p><strong>Co-packing.<\/strong> A co-packer adds capacity at a price: a toll fee of 3× the product's conversion cost, 2× the freight, 2× the normal waste, and the return trip for quality release. It may never ship straight to a customer.<\/p>\n<p><strong>Shelf life.<\/strong> Each customer accepts stock only with a minimum remaining life (often two thirds). Stock older than the strictest customer of its pool accepts is written off at standard cost, and short-life stock is not allowed to shuttle between sites to hide its age.<\/p>\n<p><strong>Customers and the last leg.<\/strong> A customer is delivered each temperature range from one site: most take everything from one DC, but a customer may take its chilled range from the DC with the cold store and its dry range from the nearest one. A site's demand in a range is split between the customers it delivers that range to, in their shares. Where the workspace prices deliveries, as Lindewaard does, every unit served pays a full truck from its site to its customer on the rate card, divided by what a truck holds of it, with its carbon at the carbon price, inside the plan's freight and transport carbon. On the 28-day plan that is €54k of the €102k of transport, and 6.8 t of CO₂e. A customer taking part loads costs more per unit than a full truck; that is not modelled.<\/p>\n<p><strong>Dangerous goods.<\/strong> A flammable flavour concentrate travels only with carriers licensed for it, on lanes certified for it; a site without a licence cannot store it.<\/p>"},{"name":"The maths","html":"<p>For a lane <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x02113;<\/mi><\/mrow><\/math>, temperature zone <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><\/mrow><\/math> and bucket <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math>, with <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>q<\/mi><\/mrow><\/math> pallets, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><\/mrow><\/math> units shipped and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math> trucks:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mo>&#x02211;<\/mo><mrow><mi>m<\/mi><mo>&#x02208;<\/mo><mi>z<\/mi><\/mrow><\/msub><msub
