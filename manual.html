control tower, and a test fails if the two drift apart. the numbers themselves are computed in engine/optimizer.py from the solved plan, never estimated. "},{"part":"Planning","number":"17","slug":"sustainability","title":"Sustainability (ISO 14083)","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Every trip is counted the way ISO 14083 counts it: the weight moved times the distance driven, times a published emission factor for the vehicle.<\/p>\n<div class=\"diagram\" data-diagram=\"emissions\"><\/div>"},{"name":"How it works","html":"<ul>\n<li><strong>Tonne-kilometres:<\/strong> each shipment's weight times its lane's road distance, empty runs included where charged.<\/li>\n<li><strong>Emission factor:<\/strong> a published well-to-wheel factor per vehicle type, with its source and the date it applies from. For a heavy tractor and semi-trailer on Dutch roads, the 2025 list gives 0.088 kg CO2e/tkm WTW.<\/li>\n<li><strong>The report:<\/strong> total, by lane and by carrier, with the factor and source named, so a controller can check every line.<\/li>\n<li><strong>Priced in the plan:<\/strong> carbon also carries a price in the objective, on production and transport, higher for spot hauliers. It is a planning price that steers the plan, not a tax anyone pays today.<\/li>\n<\/ul>"},{"name":"The maths","html":"<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>E<\/mi><mo>&#x0003D;<\/mo><msub><mo>&#x02211;<\/mo><mrow><mtext>trips<\/mtext><\/mrow><\/msub><mi>w<\/mi><mi>&#x000B7;<\/mi><mi>d<\/mi><mi>&#x000B7;<\/mi><msub><mi>&#x003B5;<\/mi><mi>v<\/mi><\/msub><\/mrow><\/math><\/div>\n<p>with <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>w<\/mi><\/mrow><\/math> tonnes carried, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><\/mrow><\/math> kilometres driven and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>&#x003B5;<\/mi><mi>v<\/mi><\/msub><\/mrow><\/math> the factor for vehicle type <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v<\/mi><\/mrow><\/math> in kg CO₂e per tonne-km.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Factors and tolls, dated, with sources<\/td>\n<td><code>engine/roadcost.py<\/code>, the workspace's <code>emission_factors.csv<\/code><\/td>\n<\/tr>\n<tr>\n<td>The report in a plan<\/td>\n<td><code>emissions_iso14083<\/code> in every plan the API returns<\/td>\n<\/tr>\n<tr>\n<td>How the factors were checked<\/td>\n<td><code>docs/road-cost.md<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}],"search":" every trip is counted the way iso 14083 counts it: the weight moved times the distance driven, times a published emission factor for the vehicle. tonne-kilometres: each shipment's weight times its lane's road distance, empty runs included where charged. emission factor: a published well-to-wheel factor per vehicle type, with its source and the date it applies from. for a heavy tractor and semi-trailer on dutch roads, the 2025 list gives 0.088 kg co2e/tkm wtw. the report: total, by lane and by carrier, with the factor and source named, so a controller can check every line. priced in the plan: carbon also carries a price in the objective, on production and transport, higher for spot hauliers. it is a planning price that steers the plan, not a tax anyone pays today. e = ∑ trips w · d · ε v with w tonnes carried, d kilometres driven and ε v the factor for vehicle type v in kg co₂e per tonne-km. what where factors and tolls, dated, with sources engine/roadcost.py , the workspace's emission_factors.csv the report in a plan emissions_iso14083 in every plan the api returns how the factors were checked docs/road-cost.md "},{"part":"Planning","number":"18","slug":"ai","title":"AI in the loop","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>AI explains; people and the gate decide; deterministic code writes. The picture shows every path, and which ones AI can use.<\/p>\n<div class=\"diagram\" data-diagram=\"ai-boundary\"><\/div>"},{"name":"How it works","html":"<p><strong>The explainer.<\/strong> When a master-data edit is refused or challenged, or a plan is held, the explainer says why in plain words and what to do about it. A deterministic explainer needs no key and no network; a language-model explainer can be switched on. Either way it reads the result and writes nothing. For a customer's workspace it runs only with the customer's recorded consent.<\/p>\n<p><strong>The MCP server<\/strong> lets an AI assistant (Claude Desktop, Claude Code and others) read the published plans and ask what-ifs:<\/p>\n<ul>\n<li>list the stories, explain a plan, list its exceptions, give the KPI definitions;<\/li>\n<li>solve a scenario with one decision switched on, on a scratch copy;<\/li>\n<li>trace which orders a supply event puts at risk.<\/li>\n<\/ul>\n<p>It runs locally, next to the data, in its own environment.<\/p>\n<p><strong>Why it cannot write.<\/strong> No tool edits master data; no tool commits a schedule. A test calls every tool with the master-data editor, the table writer and every schedule store rigged to fail, and none fails; another checks that the server never imports a write path.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Explainer (deterministic and language model)<\/td>\n<td><code>engine/explain.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Consent for a customer workspace<\/td>\n<td><code>engine/workspace.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>MCP server and its tools<\/td>\n<td><code>tools/mcp_server.py<\/code>, <code>docs/mcp.md<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}],"search":" ai explains; people and the gate decide; deterministic code writes. the picture shows every path, and which ones ai can use. the explainer. when a master-data edit is refused or challenged, or a plan is held, the explainer says why in plain words and what to do about it. a deterministic explainer needs no key and no network; a language-model explainer can be switched on. either way it reads the result and writes nothing. for a customer's workspace it runs only with the customer's recorded consent. the mcp server lets an ai assistant (claude desktop, claude code and others) read the published plans and ask what-ifs: list the stories, explain a plan, list its exceptions, give the kpi definitions; solve a scenario with one decision switched on, on a scratch copy; trace which orders a supply event puts at risk. it runs locally, next to the data, in its own environment. why it cannot write. no tool edits master data; no tool commits a schedule. a test calls every tool with the master-data editor, the table writer and every schedule store rigged to fail, and none fails; another checks that the server never imports a write path. what where explainer (deterministic and language model) engine/explain.py consent for a customer workspace engine/workspace.py mcp server and its tools tools/mcp_server.py , docs/mcp.md "},{"part":"Using it","number":"19","slug":"control-tower","title":"Control Tower tour","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>The Control Tower is the planner's screen: one page that runs the engine, shows what needs a decision, and opens every tool. A walk through it, top to bottom.<\/p>\n<div class=\"story\"><div class=\"stage\"><div class=\"diagram\" data-diagram=\"tower\" data-story=\"1\"><\/div><\/div><div class=\"steps\"><div class=\"step\" data-state=\"pick\"><p><strong>Pick a company and a story.<\/strong> Two fictional companies, Lindewaard in the Netherlands and Ashford in the US, each with its disruption stories. A story is a plan already made, so it opens at once.<\/p><\/div><div class=\"step\" data-state=\"sandbox\"><p><strong>The sidebar is a sandbox.<\/strong> 10 review sections sit on the page; the levers sit in the sidebar: the scenario branch, the carbon price, the S&amp;OP gate's thresholds and the planning altitude.<\/p><\/div><div class=\"step\" data-state=\"run\"><p><strong>Run the plan.<\/strong> The button sends the sandbox to the planning service. A plan comes back with the gate's verdict: released, held for a person, or rejected.<\/p><\/div><div class=\"step\" data-state=\"read\"><p><strong>Read what needs a decision.<\/strong> Exceptions come worst first, each with why it matters and what to do. Beside them, promise an order from the plan's own stock.<\/p><\/div><div class=\"step\" data-state=\"reviews\"><p><strong>Then the reviews, at three altitudes.<\/strong> What each function decides, where the functions disagree, and the few decisions leadership must take, with the money attached.<\/p><\/div><div class=\"step\" data-state=\"tools\"><p><strong>The tools sit on the same page.<\/strong> Edit master data and see the effect before saving, trace a disruption to the orders it hits, redesign the network.<\/p><\/div><div class=\"step\" data-state=\"learn\"><p><strong>And Learn explains each idea<\/strong>, beside the feature it belongs to, with a question to check yourself.<\/p><\/div><\/div><\/div>\n<p>The Control Tower never computes a number the engine owns. It shows what the plan says, and it compares figures with their targets.<\/p>"},{"name":"How it works","html":"<h3>The sidebar: the scenario sandbox<\/h3>\n<table>\n<thead>\n<tr>\n<th>Group<\/th>\n<th>What it sets<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Scenario sandbox<\/td>\n<td>The company, the scenario branch a run writes to, and whether an approved plan is committed to the live branch<\/td>\n<\/tr>\n<tr>\n<td>ESG carbon taxation<\/td>\n<td>The carbon price, the multiplier on spot hauliers, an optional hard carbon budget<\/td>\n<\/tr>\n<tr>\n<td>Virtual IBP gates<\/td>\n<td>The S&amp;OP gate's thresholds: minimum service, margin at risk, spot haulier share, open demand disputes<\/td>\n<\/tr>\n<tr>\n<td>Planning altitude<\/td>\n<td>Operational, tactical or strategic, and whether to plan in layers<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>A run writes only to its own scenario branch. A schedule is committed only on the branch named LIVE, with live commit armed, and only when the S&amp;OP gate releases the plan; asking for live on any other branch is refused.<\/p>\n<h3>The page, top to bottom<\/h3>\n<ol>\n<li><strong>Workspace and story.<\/strong> Pick one; the plan, its map and its money open at once, from the published plans.<\/li>\n<li><strong>Run optimization<\/strong>, <strong>Refresh DDMRP buffers<\/strong>, <strong>Clear.<\/strong> The first two call the planning service; the first visit after an update wakes it, which takes up to a minute, and the page says so.<\/li>\n<li><strong>What needs a decision.<\/strong> Exceptions worst first, each with <em>why<\/em> and <em>do<\/em>. Under each plan, <strong>Promise an order<\/strong>: a product, a site, a quantity and a date in, a promise out, from the same code the engine uses.<\/li>\n<li><strong>The review bar<\/strong>, 10 sections:<\/li>\n<\/ol>\n<div class=\"diagram\" data-diagram=\"tower-sections\"><\/div>\n<h3>Reviews at three altitudes<\/h3>\n<p>The same plan answers three different questions, so it is shown three ways rather than as a wall of tabs:<\/p>\n<ul>\n<li><strong>Functional reviews<\/strong>, one per function (demand, supply, logistics, inventory, procurement): its own KPIs, its own owner, its own exceptions.<\/li>\n<li><strong>Pre-S&amp;OP reconciliation<\/strong>: only what one function cannot settle alone.<\/li>\n<li><strong>Executive review<\/strong>: only what is critical, in money.<\/li>\n<\/ul>\n<p>A KPI carries an owner, a target and a direction, and scores itself on track, watch or off track. A test checks every review figure is the plan's own value, and that a figure shown at two altitudes is the same number.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The page<\/td>\n<td><code>app.py<\/code> (Streamlit), <code>streamlit_app.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Review layer<\/td>\n<td><code>engine/review.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Promise an order<\/td>\n<td><code>engine/atp.py<\/code>, loaded by the page on its own<\/td>\n<\/tr>\n<tr>\n<td>Lessons<\/td>\n<td><code>help_center.py<\/code>, <code>docs/help/<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The page reads the planning service at <code>API_BASE_URL<\/code>. Its section names and descriptions on this page are read from <code>app.py<\/code> when the manual is built.<\/p>"}],"search":" the control tower is the planner's screen: one page that runs the engine, shows what needs a decision, and opens every tool. a walk through it, top to bottom. pick a company and a story. two fictional companies, lindewaard in the netherlands and ashford in the us, each with its disruption stories. a story is a plan already made, so it opens at once. the sidebar is a sandbox. 10 review sections sit on the page; the levers sit in the sidebar: the scenario branch, the carbon price, the s&op gate's thresholds and the planning altitude. run the plan. the button sends the sandbox to the planning service. a plan comes back with the gate's verdict: released, held for a person, or rejected. read what needs a decision. exceptions come worst first, each with why it matters and what to do. beside them, promise an order from the plan's own stock. then the reviews, at three altitudes. what each function decides, where the functions disagree, and the few decisions leadership must take, with the money attached. the tools sit on the same page. edit master data and see the effect before saving, trace a disruption to the orders it hits, redesign the network. and learn explains each idea , beside the feature it belongs to, with a question to check you  what where the page app.py (streamlit), streamlit_app.py review layer engine/review.py promise an order engine/atp.py , loaded by the page on its own lessons help_center.py , docs/help/ the page reads the planning service at api_base_url . its section names and descriptions on this page are read from app.py when the manual is built. "},{"part":"Using it","number":"20","slug":"tasks","title":"Common tasks","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Seven things people come to Zynta-Koda to do, and which part of the system each one uses. Every task is below as steps on the screen, and as the call that does the same through the API where there is one.<\/p>\n<div class=\"diagram\" data-diagram=\"task-map\"><\/div>"},{"name":"How it works","html":"<h3>Plan the year<\/h3>\n<ol>\n<li>In the sidebar, set <strong>Planning altitude<\/strong> to Tactical, and the gate's thresholds under <strong>Virtual IBP gates<\/strong>.<\/li>\n<li>Press <strong>Run optimization<\/strong>. The plan comes back with the S&amp;OP gate's verdict.<\/li>\n<li>Read <strong>What needs a decision<\/strong>, worst first, then the reviews.<\/li>\n<\/ol>\n<p><code>bash\ncurl -X POST $ZK/api/v1/optimize -H \"Content-Type: application/json\" \\\n  -d '{\"scenario_id\": \"Q1-PLAN\", \"workspace\": \"demo-benelux\", \"profile\": \"TACTICAL\"}'<\/code><\/p>\n<h3>Test a disruption<\/h3>\n<ol>\n<li>Pick a story: each is planned three ways, reacting on the day, acting with a week's notice, and acting ahead.<\/li>\n<li>Compare the three on profit and service; the map shows which sites and lanes change.<\/li>\n<li>For an event of your own, use <strong>Impact tracing<\/strong>: a supplier, a site or a lane, and the weeks it is out.<\/li>\n<\/ol>\n<p><code>bash\ncurl -X POST $ZK/api/v1/impact -H \"Content-Type: application/json\" \\\n  -d '{\"scenario_id\": \"WHAT-IF\", \"workspace\": \"demo-benelux\",\n       \"events\": [{\"event_id\": \"E1\", \"kind\": \"SUPPLIER\", \"targets\": [\"V-FLAVOUR-01\"], \"periods\": [\"W01\", \"W02\"]}]}'<\/code><\/p>\n<h3>Promise an order<\/h3>\n<ol>\n<li>Under a plan, open <strong>Promise an order<\/strong>.<\/li>\n<li>Choose the product and the site, type the quantity and the date it is wanted.<\/li>\n<li>The answer is what can ship on time, and when the rest can follow, from the plan's own stock (chapter 15).<\/li>\n<\/ol>\n<h3>Fix master data<\/h3>\n<ol>\n<li>Open <strong>Master data<\/strong> and pick the table.<\/li>\n<li>Edit a row. Before anything is saved, the change is checked against every rule the tables must keep, and its effect is shown.<\/li>\n<li>If it is refused, ask why in plain words: the explainer answers, and approves nothing.<\/li>\n<\/ol>\n<p><code>bash\ncurl -X PATCH $ZK/api/v1/master/materials/FG-1001 -H \"Content-Type: application/json\" \\\n  -d '{\"values\": {\"shelf_life_days\": 150}, \"author\": \"planner@lindewaard\", \"reason\": \"new packaging\", \"preview\": true}'<\/code><\/p>\n<h3>Onboard a company's data<\/h3>\n<p>From an ERP extract (SAP or Dynamics 365 tables) to a workspace, on your own machine:<\/p>\n<p><code>bash\npython tools/onboard.py onboard RAW_DIR --mapping MAP.toml --workspace NAME\npython tools/onboard.py report workspaces/NAME     # the data-health report<\/code><\/p>\n<p>The health report lists every fault at once, worst first. Customer data stays on the machine (chapter 23).<\/p>\n<h3>Redesign the network<\/h3>\n<ol>\n<li>Open <strong>Network design<\/strong>; choose greenfield (may open candidate sites) or brownfield (may also close own sites).<\/li>\n<li>The design solves today's network and the redesigned one and compares them, customers free to move between sites (chapter 11).<\/li>\n<\/ol>\n<p><code>bash\ncurl -X POST $ZK/api/v1/design -H \"Content-Type: application/json\" \\\n  -d '{\"scenario_id\": \"DESIGN\", \"workspace\": \"demo-benelux\", \"mode\": \"BROWNFIELD\"}'<\/code><\/p>\n<h3>Ask an AI assistant<\/h3>\n<p>Point an assistant that speaks MCP at <code>tools/mcp_server.py<\/code>. It can read the published plans, list exceptions, explain KPIs and ask what-ifs; it cannot change anything (chapter 21).<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>Task<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Plan<\/td>\n<td><code>POST /api/v1/optimize<\/code> (<code>main.optimize<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Disruption<\/td>\n<td>the stories in <code>showcase/<\/code>, <code>POST /api/v1/impact<\/code><\/td>\n<\/tr>\n<tr>\n<td>Promise<\/td>\n<td><code>engine/atp.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Master data<\/td>\n<td><code>/api/v1/master/...<\/code>, <code>engine/masterstore.py<\/code>, <code>engine/explain.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Onboarding<\/td>\n<td><code>tools/onboard.py<\/code>, <code>docs/onboarding/<\/code><\/td>\n<\/tr>\n<tr>\n<td>Design<\/td>\n<td><code>POST /api/v1/design<\/code>, <code>engine/design.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>AI<\/td>\n<td><code>tools/mcp_server.py<\/code>, <code>docs/mcp.md<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><code>$ZK<\/code> is the planning service's address. A local one: <code>uvicorn main:app --port 8080<\/code>.<\/p>"}],"search":" seven things people come to zynta-koda to do, and which part of the system each one uses. every task is below as steps on the screen, and as the call that does the same through the api where there is one. plan the year in the sidebar, set planning altitude to tactical, and the gate's thresholds under virtual ibp gates . press run optimization . the plan comes back with the s&op gate's verdict. read what needs a decision , worst first, then the reviews. bash curl -x post $zk/api/v1/optimize -h \"content-type: application/json\" \\ -d '{\"scenario_id\": \"q1-plan\", \"workspace\": \"demo-benelux\", \"profile\": \"tactical\"}' test a disruption pick a story: each is planned three ways, reacting on the day, acting with a week's notice, and acting ahead. compare the three on profit and service; the map shows which sites and lanes change. for an event of your own, use impact tracing : a supplier, a site or a lane, and the weeks it is out. bash curl -x post $zk/api/v1/impact -h \"content-type: application/json\" \\ -d '{\"scenario_id\": \"what-if\", \"workspace\": \"demo-benelux\", \"events\": [{\"event_id\": \"e1\", \"kind\": \"supplier\", \"targets\": [\"v-flavour-01\"], \"periods\": [\"w01\", \"w02\"]}]}' promise an order under a plan, open promise an order . choose the product and the site, type the quantity and the date it is wanted. the answer is what can ship on time, and when the rest can follow, from the plan's own stock (chapter 15). fix master data open master data and pick the table. edit a row. before anything is saved, the change is checked against every rule the tables must keep, and its effect is shown. if it is refused, ask why in plain words: the explainer answers, and approves nothing. bash curl -x patch $zk/api/v1/master/materials/fg-1001 -h \"content-type: application/json\" \\ -d '{\"values\": {\"shelf_life_days\": 150}, \"author\": \"planner@lindewaard\", \"reason\": \"new packaging\", \"preview\": true}' onboard a company's data from an erp extract (sap or dynamics 365 tables) to a workspace, on your own machine: bash python tools/onboard.py onboard raw_dir --mapping map.toml --workspace name python tools/onboard.py report workspaces/name # the data-health report the health report lists every fault at once, worst first. customer data stays on the machine (chapter 23). redesign the network open network design ; choose greenfield (may open candidate sites) or brownfield (may also close own sites). the design solves today's network and the redesigned one and compares them, customers free to move between sites (chapter 11). bash curl -x post $zk/api/v1/design -h \"content-type: application/json\" \\ -d '{\"scenario_id\": \"design\", \"workspace\": \"demo-benelux\", \"mode\": \"brownfield\"}' ask an ai assistant point an assistant that speaks mcp at tools/mcp_server.py . it can read the published plans, list exceptions, explain kpis and ask what-ifs; it cannot change anything (chapter 21). task where plan post /api/v1/optimize ( main.optimize ) disruption the stories in showcase/ , post /api/v1/impact promise engine/atp.py master data /api/v1/master/... , engine/masterstore.py , engine/explain.py onboarding tools/onboard.py , docs/onboarding/ design post /api/v1/design , engine/design.py ai tools/mcp_server.py , docs/mcp.md $zk is the planning service's address. a local one: uvicorn main:app --port 8080 . "},{"part":"Using it","number":"21","slug":"api","title":"API","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Everything the Control Tower does goes through the planning service's API, and anything else can use it too: 21 endpoints, read here from the service itself. <strong>Pick one.<\/strong><\/p>\n<div class=\"diagram\" data-diagram=\"api\"><\/div>"},{"name":"How it works","html":"<h3>Every call names its scenario branch<\/h3>\n<p>Every request body carries a <code>scenario_id<\/code>: the sandbox branch the run reads from and writes to. A what-if can never touch the live schedule by accident; asking for live on any branch but LIVE is refused.<\/p>\n<p>A request may also name a <code>workspace<\/code>: the company's tables to plan on. The public demo opens only the demo workspaces.<\/p>\n<h3>The main calls<\/h3>\n<table>\n<thead>\n<tr>\n<th>Call<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>POST /api/v1/optimize<\/code><\/td>\n<td>Plans the network and puts the plan through the S&amp;OP gate<\/td>\n<\/tr>\n<tr>\n<td><code>POST /api/v1/impact<\/code><\/td>\n<td>Plans the network as it stands, then prices one or more supply events against it<\/td>\n<\/tr>\n<tr>\n<td><code>POST /api/v1/design<\/code><\/td>\n<td>Solves today's network and a redesigned one, and compares<\/td>\n<\/tr>\n<tr>\n<td><code>POST /api/v1/design/robust<\/code><\/td>\n<td>Designs one network to be right across several demand futures<\/td>\n<\/tr>\n<tr>\n<td><code>POST /api/v1/ddmrp<\/code><\/td>\n<td>Sizes the DDMRP buffers<\/td>\n<\/tr>\n<tr>\n<td><code>/api/v1/master/...<\/code><\/td>\n<td>Reads and edits the master data: every change previewable, checked and logged<\/td>\n<\/tr>\n<tr>\n<td><code>GET /api/v1/commits/...<\/code><\/td>\n<td>The schedules committed on a branch<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>A plan that cannot be made says so as an answer rather than a crash: proven infeasible and out of time with nothing found are told apart, with the solver's own report and the constraint log (HTTP 409).<\/p>\n<h3>Interactive documentation<\/h3>\n<p>The service describes itself at <code>/docs<\/code>: every endpoint, every field, its limits and an example, generated from the code.<\/p>\n<h3>The read-only MCP server<\/h3>\n<p>An AI assistant that speaks MCP (the Model Context Protocol) can ask the plans questions through 6 tools. Every one reads; none writes:<\/p>\n<div class=\"diagram\" data-diagram=\"mcp\"><\/div>\n<p>The server runs in its own environment and calls the engine directly. A test calls every tool with every write path rigged to fail, and none fails.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The service<\/td>\n<td><code>main.py<\/code> (FastAPI), <code>uvicorn main:app<\/code><\/td>\n<\/tr>\n<tr>\n<td>Request and response models<\/td>\n<td><code>main.py<\/code> (Pydantic)<\/td>\n<\/tr>\n<tr>\n<td>MCP server<\/td>\n<td><code>tools/mcp_server.py<\/code>, <code>docs/mcp.md<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The endpoint list and the MCP tools on this page are read from the running app in <code>main.py<\/code> and from <code>tools/mcp_server.py<\/code> (<code>TOOLS<\/code>) when the manual is built, so they cannot drift from the code.<\/p>"}],"search":" everything the control tower does goes through the planning service's api, and anything else can use it too: 21 endpoints, read here from the service itself. pick one. every call names its scenario branch every request body carries a scenario_id : the sandbox branch the run reads from and writes to. a what-if can never touch the live schedule by accident; asking for live on any branch but live is refused. a request may also name a workspace : the company's tables to plan on. the public demo opens only the demo workspaces. the main calls call what it does post /api/v1/optimize plans the network and puts the plan through the s&op gate post /api/v1/impact plans the network as it stands, then prices one or more supply events against it post /api/v1/design solves today's network and a redesigned one, and compares post /api/v1/design/robust designs one network to be right across several demand futures post /api/v1/ddmrp sizes the ddmrp buffers /api/v1/master/... reads and edits the master data: every change previewable, checked and logged get /api/v1/commits/... the schedules committed on a branch a plan that cannot be made says so as an answer rather than a crash: proven infeasible and out of time with nothing found are told apart, with the solver's own report and the constraint log (http 409). interactive documentation the service describes itself at /docs : every endpoint, every field, its limits and an example, generated from the code. the read-only mcp server an ai assistant that speaks mcp (the model context protocol) can ask the plans questions through 6 tools. every one reads; none writes: the server runs in its own environment and calls the engine directly. a test calls every tool with every write path rigged to fail, and none fails. what where the service main.py (fastapi), uvicorn main:app request and response models main.py (pydantic) mcp server tools/mcp_server.py , docs/mcp.md the endpoint list and the mcp tools on this page are read from the running app in main.py and from tools/mcp_server.py ( tools ) when the manual is built, so they cannot drift from the code. "},{"part":"Operating and trust","number":"22","slug":"deployment","title":"Deployment","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Zynta-Koda is small enough to run on free hosting and careful enough to keep a customer's data off it. Where each part runs, from a commit to the page.<\/p>\n<div class=\"story\"><div class=\"stage\"><div class=\"diagram\" data-diagram=\"deploy\" data-story=\"1\"><\/div><\/div><div class=\"steps\"><div class=\"step\" data-state=\"code\"><p><strong>One repository.<\/strong> The engine, the planning service, the Control Tower, the showcase and this manual live in one private repository.<\/p><\/div><div class=\"step\" data-state=\"test\"><p><strong>Every push is tested.<\/strong> 470 fast tests first, then the whole suite with real solves. The services redeploy on every push too; the tests do not hold a deploy back, so a red run is the first thing fixed.<\/p><\/div><div class=\"step\" data-state=\"serve\"><p><strong>Two services redeploy.<\/strong> The planning service on Render (Frankfurt), the Control Tower on Streamlit Community Cloud, which calls it.<\/p><\/div><div class=\"step\" data-state=\"show\"><p><strong>The showcase and this manual are static pages<\/strong> on GitHub Pages: published plans, generated, never hand-edited.<\/p><\/div><div class=\"step\" data-state=\"keep\"><p><strong>Committed schedules are kept in Postgres<\/strong> when the service has a database; without one it says so on start and keeps them in memory.<\/p><\/div><div class=\"step\" data-state=\"private\"><p><strong>A customer's data never goes there.<\/strong> It is planned on the customer's machine, or the customer's own cloud, never on the public services.<\/p><\/div><\/div><\/div>"},{"name":"How it works","html":"<h3>Two images, one Dockerfile<\/h3>\n<p>The planning service and the Control Tower are built as two images from one <code>Dockerfile<\/code>: the service carries the solver and no Streamlit, the Control Tower carries no solver. A service that wakes from sleep pays for its image size on every wake, so the split matters. Each build fails rather than deploys if its own imports do not resolve, and the service's build proves both CBC builds run.<\/p>\n<p>In CI the two images are built and probed only when something they are made of changes (the engine, the service, the Control Tower, their dependency lists); a change to docs, tests or the showcase runs the tests alone.<\/p>\n<h3>Asleep is normal<\/h3>\n<p>Free hosting sleeps when nobody calls. The planning service restarts after every update, and the first call after that takes up to a minute; the Control Tower wakes it once per visit and says so while it waits. A free database pauses after a week of quiet, so committing retries with backoff rather than failing.<\/p>\n<h3>For a customer<\/h3>\n<ul>\n<li><strong>On the customer's machine:<\/strong> the engine runs with <code>ZK_MODE=private<\/code> on the customer's workspace, on an encrypted volume (chapter 23).<\/li>\n<li><strong>In the customer's own cloud:<\/strong> the same images run on Cloud Run or any container host, behind that platform's own access control. The service has no login of its own, by design: no home-grown authentication.<\/li>\n<\/ul>\n<h3>Configuration<\/h3>\n<table>\n<thead>\n<tr>\n<th>Setting<\/th>\n<th>Where<\/th>\n<th>What<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>API_BASE_URL<\/code><\/td>\n<td>Control Tower<\/td>\n<td>the planning service's address<\/td>\n<\/tr>\n<tr>\n<td><code>DATABASE_URL<\/code><\/td>\n<td>planning service<\/td>\n<td>Postgres for committed schedules; unset, in memory<\/td>\n<\/tr>\n<tr>\n<td><code>ZK_MODE<\/code><\/td>\n<td>planning service<\/td>\n<td><code>private<\/code> opens customer workspaces; otherwise public demo<\/td>\n<\/tr>\n<tr>\n<td><code>ZK_SOLVER<\/code><\/td>\n<td>planning service<\/td>\n<td>override the solver (default CBC)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Credentials go into the hosting platform's settings, never into files, commits or logs.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Images<\/td>\n<td><code>Dockerfile<\/code> (targets <code>api<\/code> and <code>ui<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Tests on every push<\/td>\n<td><code>.github/workflows/ci.yml<\/code><\/td>\n<\/tr>\n<tr>\n<td>Image builds<\/td>\n<td><code>.github/workflows/images.yml<\/code><\/td>\n<\/tr>\n<tr>\n<td>Control Tower entry<\/td>\n<td><code>streamlit_app.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Showcase and manual<\/td>\n<td><code>tools/build_site.py<\/code>, <code>tools/build_manual.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Deployment decisions<\/td>\n<td><code>docs/zynta-koda-adr.md<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}],"search":" zynta-koda is small enough to run on free hosting and careful enough to keep a customer's data off it. where each part runs, from a commit to the page. one repository. the engine, the planning service, the control tower, the showcase and this manual live in one private repository. every push is tested. 470 fast tests first, then the whole suite with real solves. the services redeploy on every push too; the tests do not hold a deploy back, so a red run is the first thing fixed. two services redeploy. the planning service on render (frankfurt), the control tower on streamlit community cloud, which calls it. the showcase and this manual are static pages on github pages: published plans, generated, never hand-edited. committed schedules are kept in postgres when the service has a database; without one it says so on start and keeps them in memory. a customer's data never goes there. it is planned on the customer's machine, or the customer's own cloud, never on the public services. two images, one dockerfile the planning service and the control tower are built as two images from one dockerfile : the service carries the solver and no streamlit, the control tower carries no solver. a service that wakes from sleep pays for its image size on every wake, so the split matters. each build fails rather than deploys if its own imports do not resolve, and the service's build proves both cbc builds run. in ci the two images are built and probed only when something they are made of changes (the engine, the service, the control tower, their dependency lists); a change to docs, tests or the showcase runs the tests alone. asleep is normal free hosting sleeps when nobody calls. the planning service restarts after every update, and the first call after that takes up to a minute; the control tower wakes it once per visit and says so while it waits. a free database pauses after a week of quiet, so committing retries with backoff rather than failing. for a customer on the customer's machine: the engine runs with zk_mode=private on the customer's workspace, on an encrypted volume (chapter 23). in the customer's own cloud: the same images run on cloud run or any container host, behind that platform's own access control. the service has no login of its own, by design: no home-grown authentication. configuration setting where what api_base_url control tower the planning service's address database_url planning service postgres for committed schedules; unset, in memory zk_mode planning service private opens customer workspaces; otherwise public demo zk_solver planning service override the solver (default cbc) credentials go into the hosting platform's settings, never into files, commits or logs. what where images dockerfile (targets api and ui ) tests on every push .github/workflows/ci.yml image builds .github/workflows/images.yml control tower entry streamlit_app.py showcase and manual tools/build_site.py , tools/build_manual.py deployment decisions docs/zynta-koda-adr.md "},{"part":"Operating and trust","number":"23","slug":"security","title":"Security and data","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>A planning engine sees a company's whole supply chain, so what it does with that data is the first question a buyer asks. The rules are few, enforced in code, and each one is proved by a test.<\/p>\n<div class=\"diagram\" data-diagram=\"boundary\"><\/div>\n<ul>\n<li><strong>Customer data never enters git, CI or the public demo.<\/strong> It lives in a workspace git ignores and builds exclude; the public demo refuses to open one.<\/li>\n<li><strong>It is deleted on an agreed date.<\/strong> Every customer workspace carries a delete-by date, and the engine refuses to open it afterwards.<\/li>\n<li><strong>Nothing leaves the machine for an AI model without a recorded opt-in.<\/strong> The explainer is the only feature that calls an outside model; for a customer it stays off until the opt-in is recorded: who, when, for what.<\/li>\n<li><strong>The AI never writes.<\/strong> It answers questions. The only way into the tables is the master-data editor, and a test proves the editor never imports the explainer.<\/li>\n<\/ul>"},{"name":"How it works","html":"<h3>A customer's data, start to end<\/h3>\n<ol>\n<li><strong>Received<\/strong> as an ERP extract: tables, not system access, and no personal data needed.<\/li>\n<li><strong>Stored<\/strong> in one workspace per customer, on an encrypted volume, with a manifest saying whose data it is and its delete-by date.<\/li>\n<li><strong>Processed<\/strong> on that machine with the engine in private mode. Never on the public demo, never in CI.<\/li>\n<li><strong>Retained<\/strong> until the delete-by date. The outputs (the data-health report, the decision audit) go to the customer.<\/li>\n<li><strong>Deleted<\/strong> on that date, and the engine will not open the workspace after it.<\/li>\n<\/ol>\n<h3>Public by default, private on purpose<\/h3>\n<p>Unless private mode is set, the engine runs as a public demo: it lists, opens and plans only the demo companies, whatever it is asked. Opening a customer's workspace takes a deliberate setting on the machine that holds it.<\/p>\n<h3>No home-grown login<\/h3>\n<p>The planning service has no login of its own. An instance with customer data runs on a machine that data may be on, or behind the hosting platform's own access control, never as an open address. Writing authentication is how small systems get breached.<\/p>\n<h3>Licences and secrets<\/h3>\n<ul>\n<li><strong>Every dependency's licence allows commercial use.<\/strong> CI fails on a non-commercial or source-available licence, an unreviewed package with none, or model weights whose terms are denied.<\/li>\n<li><strong>No secrets in the repository.<\/strong> The full history was scanned once and none found; credentials go into the hosting platform's settings, never into files, commits or logs.<\/li>\n<\/ul>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The rules<\/td>\n<td><code>SECURITY.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>Data handling, end to end<\/td>\n<td><code>docs/security/data-handling.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>Questionnaire answers<\/td>\n<td><code>docs/security/questionnaire-answers.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>Public demo and private mode<\/td>\n<td><code>engine/workspace.py<\/code> (<code>ZK_MODE<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>The explainer and its consent<\/td>\n<td><code>engine/explain.py<\/code>, <code>workspace.json<\/code><\/td>\n<\/tr>\n<tr>\n<td>Licence check<\/td>\n<td><code>tools/licences.py<\/code>, <code>docs/licences.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>History scan<\/td>\n<td><code>docs/security/secret-scan.md<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Tests that guard it.<\/strong> The public demo refuses to list, open or plan on a customer workspace; a workspace past its delete-by date will not open; the explainer stays off for a customer without a recorded opt-in; the master-data editor never imports the explainer; no AI-facing tool can reach a write path; the licence check fails on a planted non-commercial package.<\/p>"}],"search":" a planning engine sees a company's whole supply chain, so what it does with that data is the first question a buyer asks. the rules are few, enforced in code, and each one is proved by a test. customer data never enters git, ci or the public demo. it lives in a workspace git ignores and builds exclude; the public demo refuses to open one. it is deleted on an agreed date. every customer workspace carries a delete-by date, and the engine refuses to open it afterwards. nothing leaves the machine for an ai model without a recorded opt-in. the explainer is the only feature that calls an outside model; for a customer it stays off until the opt-in is recorded: who, when, for what. the ai never writes. it answers questions. the only way into the tables is the master-data editor, and a test proves the editor never imports the explainer. a customer's data, start to end received as an erp extract: tables, not system access, and no personal data needed. stored in one workspace per customer, on an encrypted volume, with a manifest saying whose data it is and its delete-by date. processed on that machine with the engine in private mode. never on the public demo, never in ci. retained until the delete-by date. the outputs (the data-health report, the decision audit) go to the customer. deleted on that date, and the engine will not open the workspace after it. public by default, private on purpose unless private mode is set, the engine runs as a public demo: it lists, opens and plans only the demo companies, whatever it is asked. opening a customer's workspace takes a deliberate setting on the machine that holds it. no home-grown login the planning service has no login of its own. an instance with customer data runs on a machine that data may be on, or behind the hosting platform's own access control, never as an open address. writing authentication is how small systems get breached. licences and secrets every dependency's licence allows commercial use. ci fails on a non-commercial or source-available licence, an unreviewed package with none, or model weights whose terms are denied. no secrets in the repository. the full history was scanned once and none found; credentials go into the hosting platform's settings, never into files, commits or logs. what where the rules security.md data handling, end to end docs/security/data-handling.md questionnaire answers docs/security/questionnaire-answers.md public demo and private mode engine/workspace.py ( zk_mode ) the explainer and its consent engine/explain.py , workspace.json licence check tools/licences.py , docs/licences.md history scan docs/security/secret-scan.md tests that guard it. the public demo refuses to list, open or plan on a customer workspace; a workspace past its delete-by date will not open; the explainer stays off for a customer without a recorded opt-in; the master-data editor never imports the explainer; no ai-facing tool can reach a write path; the licence check fails on a planted non-commercial package. "},{"part":"Operating and trust","number":"24","slug":"evidence","title":"Evidence: tests and benchmarks","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Every claim in this manual is either computed by the engine or checked by a test. Here is what checks what, and how the numbers were measured.<\/p>\n<div class=\"diagram\" data-diagram=\"tests\"><\/div>\n<ul>\n<li><strong>Fast tests<\/strong> (470) run on every change: rules, readers, reports, the pages and this manual.<\/li>\n<li><strong>Slow tests<\/strong> (69) solve real models: a full year, a design, a re-plan. They run on every push, the whole suite in a quarter of an hour.<\/li>\n<li><strong>Published numbers are regenerated, not typed.<\/strong> The showcase, the README's front page and this manual are built from the plans and the code, and a test fails when any of them goes stale.<\/li>\n<\/ul>"},{"name":"How it works","html":"<h3>What the tests hold<\/h3>\n<table>\n<thead>\n<tr>\n<th>Claim<\/th>\n<th>How it is held<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The plan keeps every rule<\/td>\n<td>tests that break each rule on purpose and expect the plan to refuse or price it<\/td>\n<\/tr>\n<tr>\n<td>A number on a page is the engine's<\/td>\n<td>the page, the README block and this manual are rebuilt and compared with what is published<\/td>\n<\/tr>\n<tr>\n<td>A plan is what the engine makes<\/td>\n<td>the stories' data has a fingerprint; a plan made from other tables fails<\/td>\n<\/tr>\n<tr>\n<td>Committed plans survive a restart<\/td>\n<td>real Postgres in CI, read back from a separate process; a skipped test fails the run<\/td>\n<\/tr>\n<tr>\n<td>Nothing writes through the AI<\/td>\n<td>every AI-facing tool is called with every write path rigged to fail<\/td>\n<\/tr>\n<tr>\n<td>Licences allow commercial use<\/td>\n<td>the licence check runs on every change and fails on a planted bad licence<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Counterfactuals: a test must be able to fail<\/h3>\n<p>A test that passes on the broken code proves nothing. Fixes in this project come with a test that fails before the fix and passes after it: the redistribution report's \"spare\" stock (shipped out three days later), a closed DC that lost its customers, a design start CBC threw away. The R&amp;D log records each, including the claims that turned out wrong.<\/p>\n<h3>Benchmarks, dated<\/h3>\n<p>Solve times are measured on the engine's own models and its real flow, two CPUs, and kept with their date and settings in <code>docs/benchmarks/<\/code>: the solver comparison, planning in layers, scaling to 150 products, the forecasting backtest. A number that was measured once on a cold start and not again in the real flow is reported as such, or withdrawn.<\/p>\n<h3>Forecasting, scored honestly<\/h3>\n<p>Every model is backtested on weeks it never saw, rolling forward, and scored on its whole forecast range. The chosen one beat the engine's own model clearly, 0.0695 against 0.0843; its lead over the next best is not established. The history is synthetic: this proves the pipeline and the scoring, not accuracy on a real business (chapter 8).<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The suite<\/td>\n<td><code>test_engine.py<\/code> (<code>pytest -m \"not slow\"<\/code> for the fast tier)<\/td>\n<\/tr>\n<tr>\n<td>CI<\/td>\n<td><code>.github/workflows/ci.yml<\/code><\/td>\n<\/tr>\n<tr>\n<td>Benchmarks<\/td>\n<td><code>docs/benchmarks/<\/code>, <code>tools/bench_solvers.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>The log of what was measured and refuted<\/td>\n<td><code>docs/rnd-log/<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}],"search":" every claim in this manual is either computed by the engine or checked by a test. here is what checks what, and how the numbers were measured. fast tests (470) run on every change: rules, readers, reports, the pages and this manual. slow tests (69) solve real models: a full year, a design, a re-plan. they run on every push, the whole suite in a quarter of an hour. published numbers are regenerated, not typed. the showcase, the readme's front page and this manual are built from the plans and the code, and a test fails when any of them goes stale. what the tests hold claim how it is held the plan keeps every rule tests that break each rule on purpose and expect the plan to refuse or price it a number on a page is the engine's the page, the readme block and this manual are rebuilt and compared with what is published a plan is what the engine makes the stories' data has a fingerprint; a plan made from other tables fails committed plans survive a restart real postgres in ci, read back from a separate process; a skipped test fails the run nothing writes through the ai every ai-facing tool is called with every write path rigged to fail licences allow commercial Above that size it still answers, more slowly, and says how close to the best it is.<\/p>"},{"name":"How it works","html":"<h3>What it does not do yet<\/h3>\n<ul>\n<li><strong>Real forecasting accuracy is not proven.<\/strong> The forecasting pipeline and its scoring are; the history it was scored on is synthetic.<\/li>\n<li><strong>Fictional companies only, in public.<\/strong> Both demo companies, their data and their disruptions are invented. On a real company's data it runs privately, on that company's extract.<\/li>\n<li><strong>No live ERP connection.<\/strong> Data comes in as an extract and goes out as a plan and a report; nothing is written back to an ERP.<\/li>\n<li><strong>One horizon stands for the year<\/strong> in network design: a seasonal business needs a horizon long enough to hold its season.<\/li>\n<li><strong>A forced change cannot yet be priced on its own<\/strong> in network design (\"what would closing this site cost?\"); it says so rather than guess.<\/li>\n<li><strong>The AI explains and never decides.<\/strong> That is a design choice, not a gap: the rules decide, the gate decides, the planner decides.<\/li>\n<li><strong>One person built it.<\/strong> It has no login of its own and is not run as a service for others; a customer instance runs on the customer's machine or cloud.<\/li>\n<\/ul>\n<h3>Roadmap<\/h3>\n<div class=\"diagram\" data-diagram=\"roadmap\"><\/div>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Solver measurements<\/td>\n<td><code>docs/benchmarks/solvers-2026-10-18.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>Scaling measurements<\/td>\n<td><code>docs/benchmarks/<\/code><\/td>\n<\/tr>\n<tr>\n<td>The roadmap the showcase shows<\/td>\n<td><code>frontpage.py<\/code> (<code>ROADMAP<\/code>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The table above and the roadmap are read from the same source as the public page, so the two cannot tell different stories.<\/p>"}],"search":" what zynta-koda does not do yet, measured where it can be, and what is being worked on. a planning tool that hides its limits gets trusted for the wrong things. where it stops today: a full year for 150 products, planned in layers, takes 224 to 249 seconds, proven on two processors; the budget for a year's plan is 180 s. above that size it still answers, more slowly, and says how close to the best it is. what it does not do yet real forecasting accuracy is not proven. the forecasting pipeline and its scoring are; the history it was scored on is synthetic. fictional companies only, in public. both demo companies, their data and their disruptions are invented. on a real company's data it runs privately, on that company's extract. no live erp connection. data comes in as an extract and goes out as a plan and a report; nothing is written back to an erp. one horizon stands for the year in network design: a seasonal business needs a horizon long enough to hold its season. a forced change cannot yet be priced on its own in network design (\"what would closing this site cost?\"); it says so rather than guess. the ai explains and never decides. that is a design choice, not a gap: the rules decide, the gate decides, the planner decides. one person built it. it has no login of its own and is not run as a service for others; a customer instance runs on the customer's machine or cloud. roadmap what where solver measurements docs/benchmarks/solvers-2026-10-18.md scaling measurements docs/benchmarks/ the roadmap the showcase shows frontpage.py ( roadmap ) the table above and the roadmap are read from the same source as the public page, so the two cannot tell different stories. "},{"part":"Appendices","number":"A","slug":"glossary","title":"Glossary","written":false},{"part":"Appendices","number":"B","slug":"kpi-reference","title":"KPI reference","written":false},{"part":"Appendices","number":"C","slug":"decisions","title":"Design decisions (ADR index)","written":fa function show(slug) {

  current = c;
  const q = $("q").value.trim().toLowerCase();
  let open = null;
  if (q && c.written) {
    const deep = c.layers.find((l) => l.name !== "Overview" && l.html.toLowerCase().includes(q)
      && !c.layers[0].html.toLowerCase().includes(q));
    if (deep) open = deep.name;
  }
  const i = DATA.chapters.indexOf(c);
  const prev = DATA.chapters.slice(0, i).reverse().find((x) => x.written);
  const next = DATA.chapters.slice(i + 1).find((x) => x.written);
  let body;
  if (!c.written) {
    body = `<p class="planned-note">This chapter is planned and not written yet. It will follow the same pattern: a short story with a picture, then how it works, the maths and what is under the hood.</p>`;
  } else {
    const over = c.layers[0], deep = c.layers.slice(1);
    body = `<section class="prose overview">${over.html}</section>`;

/* ---------- stories: the card nearest the reading line sets the picture ---------- */
// The reading line is the middle of the screen on a wide screen and lower down
// on a phone, where the picture holds the top half.
function storyTick() {
  const line = innerWidth <= 900 ? innerHeight * 0.74 : innerHeight * 0.5;
  $("main").querySelectorAll(".story").forEach((story) => {
    const steps = [...story.querySelectorAll(".step")];
    if (!steps.length) return;
    let best = steps[0], dist = Infinity;
    steps.forEach((s) => {
      const r = s.getBoundingClientRect(), d = Math.abs(r.top + r.height / 2 - line);
      if (r.top + r.height / 2 <= line + innerHeight * 0.25 && d < dist) { dist = d; best = s; }
    });
    if (story._on === best) return;
    story._on = best;
    steps.forEach((s) => s.classList.toggle("on", s === best));
    const host = story.querySelector(".diagram");
    host._state = best.dataset.state;
    if (host._fig && host._fig.set) host._fig.set(best.dataset.state);
  });
}

const DIAGRAMS = {
  /* Chapter 1: from data to a released plan, one stage lit per step. */

    const stages = [["data", "Company data", "checked tables", "data"], ["decide", "Optimiser", "the year's plan", "chip"], ["check", "S&OP gate", "the checks", "gate"], ["release", "Released", "or held", "screen"]];
    const labels = ["tables", "plan", "verdict"];
    const s = n ? svg(360, 196, "From a company's data to a released plan") : svg(820, 250, "From a company's data to a released plan");
    const nodes = {}, edges = [];
    stages.forEach(([key, t, sub, ico], i) => {
      const [x, y, w, h] = n ? [[2, 4], [196, 4], [196, 122], [2, 122]][i].concat([162, 70]) : [4 + i * 208, 40, 170, 72];
      nodes[key] = node(s, x, y, w, h, t, {icon: ico, sub, tone: key === "check" ? "warn" : "", size: n ? 14 : undefined, subSize: n ? 12 : undefined});
      if (i < 3) edges.push(n ? edge(s, ["M166,39 L194,39", "M277,76 L277,120", "M194,157 L166,157"][i], null)
                              : edge(s, `M${x + w + 3},${y + h / 2} L${x + 205},${y + h / 2}`, null));
    });
    // What each stage adds, drawn under it on wide screens, beside it on phones.
    const extras = {
      decide: ["factory", "cart", "truck", "store", "alert"],
      check: ["service ≥ 97%", "margin at risk ≤ 2%", "proven by the solver"],
      release: ["production", "trucks", "promises"],
    };
    const extraG = {};
    for (const [key, items] of Object.entries(extras)) {
      const g = el("g", {class: "fade hidden-el"}, s); extraG[key] = g;
      const base = stages.findIndex((x) => x[0] === key);
      items.forEach((it, j) => {
        if (key === "decide") {
          const cx = n ? 320 : 4 + base * 208 + j * 35, cy = n ? 10 + base * 118 - 4 + j * 0 : 140;

        } else {

          if (n) return;

        }
      });
    }
    if (!n) el("text", {class: "fade", x: 208 + 4, y: 196, "font-size": 13.5, style: "fill: var(--muted)"}, extraG.decide, "make · buy · move · store · short");
    host.appendChild(s);
    const order = stages.map((x) => x[0]);
    return {set(state) {
      const k = order.indexOf(state);
      order.forEach((key, i) => { nodes[key].classList.toggle("on", i === k); nodes[key].classList.toggle("dim", i > k); });
      edges.forEach((e, i) => { e.classList.toggle("on", i === k - 1); e.classList.toggle("dim", i >= k); });
      Object.entries(extraG).forEach(([key, g]) => g.classList.toggle("hidden-el", order.indexOf(key) > k));
    }};
  },

  /* Chapter 2: the outage, drawn in the order the story tells it. */
  "react-vs-ahead"(host) {
    const n = narrowOf(host), ch = DATA.diagrams.outage.chart, names = Object.keys(ch.series), M = DATA.diagrams.outage_money;
    const W = n ? 360 : 760, H = n ? 270 : 330, L = n ? 44 : 64, R = n ? 10 : 20, T = 24, B = 44;
    const all = names.flatMap((k) => ch.series[k]);

    rows.forEach(([label, v, color], j) => {

      el("rect", {x: bx, y, width: bw * v / M.hit_late, height: 38, rx: 6, fill: color}, money2);

    const wx = bx + bw * M.hit_ahead / M.hit_late, wy = 70 + 74 + 52;
    el("path", {d: `M${wx},${wy} L${wx},${wy + 10} L${bx + bw},${wy + 10} L${bx + bw},${wy}`, fill: "none", stroke: "var(--good)", "stroke-width": 2}, money2);
    el("text", {x: (wx + bx + bw) / 2, y: wy + 32, "text-anchor": "middle", "font-size": 15, "font-weight": 800, style: "fill: var(--good)"}, money2, `${M.won_back}% won back`);

  /* Chapter 9: the five decisions, their price, the shortage, the proof. */
  optimiser(host) {
    const n = narrowOf(host), D = DATA.diagrams, G = D.gap, total = D.costs.reduce((a, c) => a + c.value, 0);
    const W = n ? 360 : 760, H = n ? 360 : 350, s = svg(W, H, "What the optimiser decides, what it costs and how sure it is");
    const dec = [["Make", "factory"], ["Buy", "cart"], ["Move", "truck"], ["Store", "store"], ["Fall short", "alert"]];
    const decG = [];
    dec.forEach(([t, ico], i) => {
      const w = n ? 66 : 136, x = i * (w + (n ? 7.5 : 20)), g = node(s, x, 8, w, n ? 84 : 92, t, {icon: ico, vertical: true, size: n ? 11.5 : 14, tone: i === 4 ? "bad" : ""});
      decG.push(g);
    });
    // The price: the plan's cost by kind, as one stacked bar.
    const priceG = el("g", {class: "fade hidden-el"}, s);
    const by = n ? 122 : 136;
    el("text", {x: 0, y: by, "font-size": 13, "font-weight": 700}, priceG, `Plan of record: ${money(D.total_cost)} a year`);
    const palette = ["var(--signal)", "var(--event)", "var(--base-line)", "var(--good)", "var(--bad)", "var(--border)"];
    let x = 0;
    D.costs.forEach((c, i) => {
      const w = Math.max(2, (c.value / total) * W);
      el("rect", {x, y: by + 10, width: w, height: 34, fill: palette[i], stroke: "var(--surface)"}, priceG);
      x += w;
    });
    D.costs.slice(0, n ? 3 : 4).forEach((c, i) => {
      const xx = n ? 0 : (i % 2) * (W / 2), yy = n ? by + 64 + i * 18 : by + 64 + Math.floor(i / 2) * 20;
      el("rect", {x: xx, y: yy - 9, width: 10, height: 10, fill: palette[i], rx: 2}, priceG);
      el("text", {x: xx + 15, y: yy, "font-size": 11.5}, priceG, `${c.label} ${fmt(100 * c.value / total, 0)}%`);
    });
    // The shortage: priced, beside the cost, not inside it.
    const shortG = el("g", {class: "fade hidden-el"}, s);
    const sy = n ? by + 128 : by + 104;
    el("rect", {x: 0, y: sy, width: W * D.shortfall_penalty / total, height: 22, rx: 4, fill: "var(--bad-soft)", stroke: "var(--bad)", "stroke-dasharray": "4 3"}, shortG);
    el("text", {x: W * D.shortfall_penalty / total + 8, y: sy + 15, "font-size": 12, style: "fill: var(--bad)"}, shortG, `+ shortfall priced at ${money(D.shortfall_penalty)}: a weight, not money paid`);
    // The proof: bound, plan and the gap between them.
    const proofG = el("g", {class: "fade hidden-el"}, s);
    const py = n ? H - 50 : H - 52, lo = G.bound - (G.objective - G.bound) * 0.8, hi = G.objective + (G.objective - G.bound) * 0.8;
    const PX = (v) => 10 + (v - lo) / (hi - lo) * (W - 20);
    el("line", {x1: 10, x2: W - 10, y1: py, y2: py, stroke: "var(--border)", "stroke-width": 2}, proofG);
    el("rect", {x: PX(G.bound), y: py - 10, width: PX(G.objective) - PX(G.bound), height: 20, fill: "var(--signal-soft)"}, proofG);
    [[G.bound, "bound", "var(--good)", -16], [G.objective, "plan", "var(--signal)", 30]].forEach(([v, t, c, dy]) => {
      el("line", {x1: PX(v), x2: PX(v), y1: py - 16, y2: py + 16, stroke: c, "stroke-width": 3}, proofG);
      el("text", {x: PX(v), y: py + dy, "text-anchor": "middle", "font-size": 12, "font-weight": 700, style: `fill: ${c}`}, proofG, `${t} ${money(v)}`);
    });
    el("text", {x: W / 2, y: py + 46, "text-anchor": "middle", "font-size": 13, "font-weight": 800}, proofG, `gap ${fmt(100 * G.achieved, 2)}% ≤ ${fmt(100 * G.requested, 1)}%: proven`);
    host.appendChild(s);
    return {set(state) {
      const k = ["decide", "price", "short", "proof"].indexOf(state);
      decG.forEach((g, i) => { g.classList.toggle("on", (k === 0) || (k === 2 && i === 4)); g.classList.toggle("dim", k === 3); });
      priceG.classList.toggle("hidden-el", k < 1); priceG.style.opacity = k === 3 ? 0.35 : "";
      shortG.classList.toggle("hidden-el", k < 2); shortG.style.opacity = k === 3 ? 0.35 : "";
      proofG.classList.toggle("hidden-el", k < 3);
    }};
  },

  flow(host) {

    const s = n ? svg(360, 330, "The planning flow") : svg(820, 200, "The planning flow");
    const N = {}, E = [];
    st.forEach(([k, t, ico], i) => {
      const [x, y, w, h] = n ? [(i % 2) * 186 + 2, Math.floor(i / 2) * 106 + 4, 170, 70] : [i * 137, 50, 118, 92];
      N[k] = node(s, x, y, w, h, t, {icon: ico, vertical: !n, size: 13.5, tone: k === "gate" ? "warn" : ""});
      if (i < st.length - 1) {
        if (n) E.push(i % 2 === 0 ? edge(s, `M${x + w + 2},${y + 35} L${x + w + 14},${y + 35}`, null)
                                  : edge(s, `M${x + 85},${y + h + 2} C${x + 85},${y + h + 20} 87,${y + h + 14} 87,${y + 104}`, null));
        else E.push(edge(s, `M${x + w + 2},${y + h / 2} L${x + 135},${y + h / 2}`, null));
      }
    });
    const loop = n ? edge(s, "M180,322 C100,330 20,320 20,290", "next cycle", {at: [100, 322]}) : edge(s, "M745,146 C745,190 70,190 59,146", "next cycle: the frozen bucket stays", {at: [400, 178]});
    loop.classList.add("dashed");
    host.appendChild(s);
    const order = st.map((x) => x[0]);
    return {set(state) {
      const k = order.indexOf(state);
      order.forEach((key, i) => { N[key].classList.toggle("on", i === k); N[key].classList.toggle("dim", i > k); });
      E.forEach((e, i) => { e.classList.toggle("on", i === k - 1); e.classList.toggle("dim", i >= k); });
      loop.classList.toggle("dim", k < order.length - 1);
    }};
  },

      node(cop, 0, py, cw, 50, "Plant", {icon: "factory", size: 13});

      return `<div class="slider"><label for="gate-${i}">${esc(label[g.name] || g.name)}</label><input id="gate-${i}" type="range" min="0" max="${max}" step="${max > 20 ? 0.5 : 0.1}" value="${g.threshold}"><output id="gate-${i}-o"></output></div>`;

        + `<div class="stat" style="background: ${held.length ? "var(--event-soft)" : "var(--good-soft)"}"><b>${held.length ? "HOLD" : "RELEASE"}</b><span>${held.length ? `for a person: ${held.map((r) => (label[r[0].name] || r[0].name).split(",")[0].toLowerCase()).join(", ")}` : (proven && proven.passed ? "all checks pass, proven" : "")}</span></div>`;

      while (s.firstChild) s.removeChild(s.firstChild);

      } else {
        el("text", {x: 10, y: 14, "font-size": 12.5, "font-weight": 700}, s, `${where}: promisable by bucket, cases`);
      }
      for (let i = 0; i < k; i++) {
        const v = row.atp[i], h = (H - 60) * v / Math.max(max, q);
        el("rect", {x: 10 + i * bw + 1, y: H - 24 - h, width: bw - 3, height: h, rx: 2, fill: v >= q ? "var(--signal)" : "var(--base-line)", opacity: i < d ? 0.4 : 1}, s);

  /* The Benelux network on its map: today, the moves, the candidates, the customers, the verdict. */
  network(host) {
    const D = DATA.diagrams.design, n = narrowOf(host);
    const lon0 = n ? 3.9 : 3.3, lon1 = n ? 6.35 : 6.8, lat0 = n ? 50.85 : 50.95, lat1 = n ? 52.8 : 52.6;
    const cos = Math.cos(51.75 * Math.PI / 180), W = n ? 360 : 760;
    const k = W / ((lon1 - lon0) * cos), H = Math.round((lat1 - lat0) * k);
    const X = (lon) => (lon - lon0) * cos * k, Y = (lat) => (lat1 - lat) * k;
    const s = svg(W, H, "Lindewaard's network on the map of the Benelux");
    s.style.overflow = "hidden";
    const clip = `clip${++markerSeq}`;
    el("rect", {x: 0, y: 0, width: W, height: H}, el("clipPath", {id: clip}, el("defs", {}, s)));
    const land = el("g", {"clip-path": `url(#${clip})`}, s);
    el("rect", {x: 0, y: 0, width: W, height: H, rx: 14, fill: "var(--surface-alt)"}, land);
    D.map.rings.forEach((country) => country.rings.forEach((ring) => {
      el("path", {d: "M" + ring.map(([lo, la]) => `${X(lo).toFixed(1)},${Y(la).toFixed(1)}`).join("L") + "Z",
        fill: "var(--surface)", stroke: "var(--rule)", "stroke-width": 1}, land);
    }));
    const at = {}; D.sites.forEach((x) => { at[x.id] = [X(x.lon), Y(x.lat)]; });
    const short = (x) => x.type === "DC" ? x.name.replace(/ \(proposed\)/, "") : x.city + (x.type === "COPACKER" && !n ? " (co-pack)" : "");
    // Lanes, then customers' links, then the sites on top.
    const lanes = el("g", {}, s);
    D.lanes.forEach((l) => { if (at[l.from] && at[l.to]) {
      el("line", {x1: at[l.from][0], y1: at[l.from][1], x2: at[l.to][0], y2: at[l.to][1], class: "lane", stroke: "var(--base-line)", "stroke-width": 1.6, opacity: 0.7}, lanes); } });
    const serving = D.sites.filter((x) => x.type !== "COPACKER");

  /* One rate card prices every lane: distance in, cost, time and carbon out. */
  "lane-cost"(host) {
    const R = DATA.diagrams.rates, n = narrowOf(host);
    const wrap = document.createElement("div");
    wrap.innerHTML = `<div class="slider"><label for="lc-km">Straight line</label><input id="lc-km" type="range" min="20" max="320" step="5" value="90"><output id="lc-kmo"></output></div>`;
    host.appendChild(wrap);
    const W = n ? 360 : 760, H = 220, L = n ? 46 : 60, s = svg(W, H, "Cost per kilometre against distance"); host.appendChild(s);
    const out = document.createElement("div"); out.className = "detail"; host.appendChild(out);
    const maxKm = 320 * R.circuity, X = (km) => L + (km / maxKm) * (W - L - 14);
    const perKm = (km, reefer) => ((reefer ? R.reefer_fixed : R.fixed) + (reefer ? R.reefer_per_km : R.per_km) * km) / km;
    const top = perKm(20, true), Y = (v) => H - 30 - (v / top) * (H - 64);
    const draw = () => {
      const straight = +$("lc-km").value, road = straight * R.circuity;
      $("lc-kmo").textContent = `${straight} km`;
      while (s.firstChild) s.removeChild(s.firstChild);
      el("text", {x: 10, y: 16, "font-size": 13, "font-weight": 700}, s, "Cost per road kilometre, a full truck");
      [0, top / 2, top].forEach((v) => {
        el("line", {x1: L, x2: W - 14, y1: Y(v), y2: Y(v), stroke: "var(--rule)"}, s);
        el("text", {x: L - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 11, style: "fill: var(--muted)"}, s, `€${fmt(v, 1)}`);
      });
      [["ambient", false, "var(--signal)"], ["chilled", true, "var(--event)"]].forEach(([name, reefer, color]) => {
        const pts = []; for (let km = 20; km <= maxKm; km += 8) pts.push(`${X(km).toFixed(1)},${Y(perKm(km, reefer)).toFixed(1)}`);
        el("polyline", {points: pts.join(" "), fill: "none", stroke: color, "stroke-width": 2.5}, s);
        el("text", {x: W - 16, y: Y(perKm(maxKm, reefer)) + (reefer ? -8 : 16), "text-anchor": "end", "font-size": 11.5, "font-weight": 700, style: `fill: ${color}`}, s, name);
        el("circle", {cx: X(road), cy: Y(perKm(road, reefer)), r: 5, fill: color}, s);
      });
      el("line", {x1: X(road), x2: X(road), y1: 26, y2: H - 30, stroke: "var(--ink)", "stroke-dasharray": "3 3"}, s);
      el("text", {x: L, y: H - 10, "font-size": 11, style: "fill: var(--muted)"}, s, "0 km");
      el("text", {x: W - 14, y: H - 10, "text-anchor": "end", "font-size": 11, style: "fill: var(--muted)"}, s, `${fmt(maxKm)} km by road`);
      const amb = R.fixed + R.per_km * road, ree = R.reefer_fixed + R.reefer_per_km * road;
      const days = Math.ceil(road / (R.speed * R.hours) + R.handling), co2 = R.co2_km * road;
      out.innerHTML = `<b>${fmt(road)} km by road</b> (${straight} km × ${R.circuity}): <b>€${fmt(amb)}</b> a truck ambient, <b>€${fmt(ree)}</b> chilled; ${days} day${days > 1 ? "s" : ""} door to door; ${fmt(co2)} kg CO₂e on the owned fleet (€${fmt(co2 * R.carbon_price)} at the carbon price).`;
    };
    $("lc-km").oninput = draw; draw();
    caption(host, "The fixed charge per trip is why long hauls cost less per kilometre. Every lane, candidate and customer delivery is priced off this one card.");
  },

      push: line(side("code", "r"), side("ci", "l"), "push"),
      api: line(side("ci", "r"), side("render", "l"), "redeploy", [336, 66]),
      ui: line(side("ci", "r"), side("streamlit", "l"), ""),
      calls: line(side("streamlit", "t"), side("render", "b"), "calls", [510, 108]),
      site: line(side("ci", "r"), side("pages", "l"), "published", [336, 232], true),
      keep: line(side("render", "r"), side("db", "l"), "", null),
    };
    host.appendChild(s);
    const lit = {
      code: [["code"], ["push"]], test: [["ci"], ["push"]], serve: [["render", "streamlit"], ["api", "ui", "calls"]],
      show: [["pages"], ["site"]], keep: [["db"], ["keep"]], private: [["local"], []],
    };
    return {set(state) {
      const [ns, es] = lit[state] || lit.code;
      Object.entries(nodes).forEach(([k, g]) => g.classList.toggle("on", ns.includes(k)));
      Object.entries(E).forEach(([k, g]) => g.classList.toggle("on", es.includes(k)));
    }};
  },

  /* ---------- Part IV ---------- */

  /* Chapter 23: what stays on the machine, what may leave, and what never writes. */
  boundary(host) {
    const n = narrowOf(host), W = n ? 360 : 760, H = n ? 476 : 290;
    const s = svg(W, H, "What stays on the machine and what may leave it");
    const A = n ? [4, 4, W - 8, 214] : [4, 4, 372, H - 8], B = n ? [4, 230, W - 8, 242] : [392, 4, W - 396, H - 8];
    el("rect", {x: A[0], y: A[1], width: A[2], height: A[3], rx: 14, fill: "var(--good-soft)", stroke: "var(--good)"}, s);
    el("rect", {x: B[0], y: B[1], width: B[2], height: B[3], rx: 14, fill: "var(--surface-alt)", stroke: "var(--rule)"}, s);
    el("text", {x: A[0] + 14, y: A[1] + 22, "font-size": 13, "font-weight": 800, style: "fill: var(--good)"}, s, "The customer's machine, encrypted");
    el("text", {x: B[0] + 14, y: B[1] + 22, "font-size": 13, "font-weight": 800}, s, "Outside: demo companies only");
    const w = n ? 160 : 160, h = 58, o = {size: 13, subSize: 11.5};
    const P = n ? {ws: [14, 40], eng: [186, 40], ex: [186, 140], git: [14, 262], demo: [14, 330], site: [14, 398], ai: [186, 330]}
                : {ws: [16, 44], eng: [204, 44], ex: [204, 190], git: [404, 44], demo: [584, 44], site: [404, 120], ai: [584, 190]};
    node(s, P.ws[0], P.ws[1], w, h, "Workspace", Object.assign({icon: "lock", sub: "a customer's tables"}, o));
    node(s, P.eng[0], P.eng[1], w, h, "Engine", Object.assign({icon: "chip", sub: "private mode"}, o));
    node(s, P.ex[0], P.ex[1], w, h, "Explainer", Object.assign({icon: "spark", sub: "answers only"}, o));
    node(s, P.git[0], P.git[1], w, h, "GitHub, CI", Object.assign({icon: "code", sub: "demo data"}, o));
    node(s, P.demo[0], P.demo[1], w, h, "Hosted demo", Object.assign({icon: "screen", sub: "demo data"}, o));
    node(s, P.site[0], P.site[1], w, h, "Showcase", Object.assign({icon: "book", sub: "demo data"}, o));
    node(s, P.ai[0], P.ai[1], n ? 160 : 166, h, "AI model", Object.assign({icon: "chat", sub: "outside, if allowed"}, o));
    edge(s, `M${P.ws[0] + w},${P.ws[1] + h / 2} L${P.eng[0]},${P.eng[1] + h / 2}`, "", {}).classList.add("on");
    const optin = n ? `M${P.ex[0] + w / 2},${P.ex[1] + h} L${P.ai[0] + 80},${P.ai[1]}` : `M${P.ex[0] + w},${P.ex[1] + h / 2} L${P.ai[0]},${P.ai[1] + h / 2}`;
    edge(s, optin, "recorded opt-in only", {at: n ? [P.ex[0] + 80, P.ex[1] + h + 18] : [(P.ex[0] + w + P.ai[0]) / 2, P.ex[1] + h / 2 - 12], dashed: true}).classList.add("on");
    // The explainer and the tables: no line, by design.
    const nx = n ? P.ws[0] + 80 : P.ws[0] + 80, ny = n ? P.ex[1] + 28 : P.ex[1] + 30;
    el("text", {x: nx, y: ny, "text-anchor": "middle", "font-size": 12, "font-weight": 800, style: "fill: var(--bad)"}, s, "✕ never writes");
    el("text", {x: nx, y: ny + 16, "text-anchor": "middle", "font-size": 11, style: "fill: var(--bad)"}, s, "to the tables");
    host.appendChild(s);
    caption(host, "Customer data lives in workspaces git ignores and builds exclude; the public demo refuses to open one. The explainer is the only feature that calls an outside model.");
  },

  /* Chapter 24: the test suite, by how long a test may take. */
  tests(host) {
    const T = DATA.diagrams.tests, n = narrowOf(host), W = n ? 360 : 760, H = 120;
    const s = svg(W, H, "The test suite, fast and slow");
    const total = T.fast + T.slow, bw = W - 20, fw = bw * T.fast / total;
    el("text", {x: 10, y: 18, "font-size": 13, "font-weight": 700}, s, `${total} tests in one suite`);
    el("rect", {x: 10, y: 32, width: fw, height: 34, rx: 8, fill: "var(--signal)"}, s);
    el("rect", {x: 10 + fw + 2, y: 32, width: bw - fw - 2, height: 34, rx: 8, fill: "var(--event)"}, s);
    el("text", {x: 22, y: 54, "font-size": 13, "font-weight": 800, style: "fill: var(--signal-ink)"}, s, `${T.fast} fast`);
    el("text", {x: W - 18, y: 54, "text-anchor": "end", "font-size": 13, "font-weight": 800, style: "fill: var(--signal-ink)"}, s, `${T.slow} slow`);
    el("text", {x: 10, y: 88, "font-size": 12, style: "fill: var(--muted)"}, s, n ? "fast: every change, minutes" : "fast: run on every change, a few minutes in all");
    el("text", {x: W - 10, y: 108, "text-anchor": "end", "font-size": 12, style: "fill: var(--muted)"}, s, n ? "slow: real solves, every push" : "slow: real solves of real models, on every push to the repository");
    host.appendChild(s);
  },

  /* Chapter 25: the roadmap the public page shows, from the same source. */
  roadmap(host) {
    const R = DATA.diagrams.roadmap;
    const wrap = document.createElement("div"); wrap.className = "road";
    wrap.innerHTML = R.items.map((r) => `<div class="road-card"><span class="road-st">${esc(r.status)}</span><b>${esc(r.head)}</b><p>${esc(r.body)}</p></div>`).join("");
    host.appendChild(wrap);
  },

  /* Chapter 25: where planning stops, measured, beside the solver used. */
  limits(host) {
    const R = DATA.diagrams.roadmap, n = narrowOf(host);
    const t = document.createElement("div"); t.className = "table-wrap";
    t.innerHTML = `<table><thead><tr><th>Plan</th><th>CBC 2.10.3</th><th>CBC development build</th></tr></thead><tbody>${
      R.solvers.map((r) => `<tr><td>${esc(r.plan)}</td><td${r.used === "old" ? ' class="used"' : ""}>${esc(r.old)}</td><td${r.used === "new" ? ' class="used"' : ""}>${esc(r.new)}</td></tr>`).join("")}</tbody></table>`;
    host.appendChild(t);
    caption(host, "Engine-flow seconds on 2 CPUs; the highlighted solver is the one the engine uses for that plan. The budget for an answer is 180 s.");
  },
};

function drawDiagrams(root) {
  root.querySelectorAll(".diagram").forEach((host) => {
    if (host.closest("[hidden]")) return;
    const narrow = String(narrowOf(host));
    if (host.dataset.drawn === narrow) return;
    const f = DIAGRAMS[host.dataset.diagram];
    if (!f) { host.textContent = `Missing diagram: ${host.dataset.diagram}`; return; }
    host.innerHTML = ""; host.dataset.drawn = narrow;
    host._fig = f(host) || null;
    if (host._state && host._fig && host._fig.set) host._fig.set(host._state);
  });
}
let resizing;
window.addEventListener("resize", () => { clearTimeout(resizing); resizing = setTimeout(() => drawDiagrams($("main")), 150); });
route();
</script>
</body>
