he chapter is read from app.py at build time: label, default, range and help text, so a slider whose default changes changes the manual. the measured runs read the same defaults from app.py before moving one setting. tests that guard it. every input in the control tower is named in this part of the manual; the sidebar table is the app's own; a gate threshold leaves the plan unchanged; the carbon budget at its default holds the plan. "},{"part":"Using it","number":"22","slug":"tower-reviews","title":"Running a plan and reading the reviews","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>The Control Tower opens on a plan, never on an empty page: Lindewaard's published stories, planned in advance. Pick a story and the whole page follows it. Press <strong>Run optimization<\/strong> and the page shows your own plan instead, with the sidebar's settings (chapter 21). Either way the page reads top to bottom the same: five headline numbers, the S&amp;OP verdict, how the solve ended, and then the plan read ten ways, one section at a time, from what each function must decide to what the board must decide.<\/p>\n<div class=\"diagram\" data-diagram=\"tower-sections\"><\/div>"},{"name":"How it works","html":"<h3>The top row and the welcome<\/h3>\n<p>Under the byline, four buttons: <strong>ⓘ About<\/strong> reopens the welcome; <strong>📚 Learn<\/strong> lists every lesson; <strong>🧪 Real vs simulated<\/strong> says what is real (the optimisation, its constraints, the S&amp;OP check, the master-data checks, the explainer) and what is invented (all of the data); <strong>📖 Glossary<\/strong> explains the page's words. The welcome opens once per visit: three short screens with <strong>Next<\/strong>, <strong>Back<\/strong> and <strong>Skip<\/strong>, the last one ending on <strong>Show me the stories<\/strong>.<\/p>\n<h3>Stories, run, refresh, clear<\/h3>\n<p><strong>The story bar<\/strong> (<strong>Story<\/strong>) lists the published stories: the baseline and each disruption, planned three ways (no early action, a week's notice, acting ahead; chapter 13). Picking one moves its plan onto the page and its event onto the map. Stories cost nothing to open: they were solved in advance by the same engine.<\/p>\n<p><strong>▶︎ Run optimization<\/strong> sends the sidebar's request to the planning service and puts the answer on the page in place of the story. The wait depends on the profile: seconds for the 28-day plan, about three minutes for a full year on the hosted service. The page says \"Showing a live plan\" until you pick a story again.<\/p>\n<p><strong>↻ Refresh DDMRP buffers<\/strong> sizes the DDMRP buffers for the branch from usage and lead time, without planning (Inventory review, below). <strong>Clear<\/strong> removes the live plan and the buffers from the page.<\/p>\n<h3>The five headline numbers<\/h3>\n<table>\n<thead>\n<tr>\n<th>Tile<\/th>\n<th>What it is<\/th>\n<th>Beneath it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Margin at Risk<\/strong><\/td>\n<td>Gross margin on demand the plan cannot serve, plus a penalty per case for the broken promise. The penalty is a planning weight, not money, so this is larger than the margin actually lost<\/td>\n<td>How much goes short, in each product's own unit<\/td>\n<\/tr>\n<tr>\n<td><strong>Divergence Alerts<\/strong><\/td>\n<td>Products where the supplied forecast and the engine's baseline disagree beyond tolerance<\/td>\n<td>How many of them are disputes a planner must settle<\/td>\n<\/tr>\n<tr>\n<td><strong>Service Level<\/strong><\/td>\n<td>Demand served by value: units sold at list price over units ordered at list price, within the planning bucket. Not an OTIF measure<\/td>\n<td>How many exceptions need a planner<\/td>\n<\/tr>\n<tr>\n<td><strong>Gross Margin<\/strong><\/td>\n<td>Revenue less the cost of goods sold, as a share of revenue<\/td>\n<td>The amount<\/td>\n<\/tr>\n<tr>\n<td><strong>Landed Cost<\/strong><\/td>\n<td>Everything it costs to make, buy, store and move the product to the distribution centres, carbon price included<\/td>\n<td>Truck trips, how many refrigerated, how full<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Under the tiles: service by volume for comparison, and <strong>How these numbers are calculated<\/strong>, the same definitions as chapter 16 and appendix B. <strong>⬇ Download this plan (Excel)<\/strong> saves every table of the plan on screen, one sheet each, with each material's unit beside it and a summary sheet of the KPIs; each table on the page also saves as CSV from the icon above it.<\/p>\n<h3>The verdict and how the solve ended<\/h3>\n<p>The banner is the S&amp;OP gate's verdict (chapter 14): <strong>Cleared every check<\/strong> (green, released on its own), <strong>Held for S&amp;OP review<\/strong> (amber, with each failed check said in words and by how much), or <strong>Rejected<\/strong> (red). <strong>ⓘ What is this check?<\/strong> explains it. Under it, 🧮 says how the solve ended: proven within its gap, or stopped by the clock, in which case its numbers are marked provisional. A plan made in layers adds <strong>🧱 Planned in layers<\/strong>: the families, the near weeks' service, how much of the year plan's closing stock they met, and both solve times. A reused plan of record says when it was made and whether the settings were the same.<\/p>\n<h3>Exceptions: \"Needs a decision here\"<\/h3>\n<p>Each review lists what the plan could not settle on its own, worst first: a title with its money impact, then <strong>Why<\/strong> (what happened) and <strong>Do<\/strong> (the recommended action), with its category and where it is. Nothing in the list is acted on automatically: it is the agenda.<\/p>\n<h3>The review bar: ten ways to read one plan<\/h3>\n<p>10 sections sit in one bar; <strong>ⓘ What's in each section?<\/strong> says what each is for. The first three read the plan at three altitudes, as an S&amp;OP cycle does: each function, then where they disagree, then the board.<\/p>\n<h4>Functional reviews<\/h4>\n<p>Five tabs, one per function, each opening with its owner and a headline, its KPIs, and its exceptions under <strong>Needs a decision here<\/strong>.<\/p>\n<p><strong>📈 Demand.<\/strong> <em>Disambiguation Gate<\/em>: every product-week where the supplied forecast (the P50) and the engine's own baseline diverge by more than ±25% without a promotion flag. Such a divergence is disputed and the surge halved until a planner rules; the table shows the divergence, both numbers, the reconciled P50 and the ruling. The caption names the forecast's source, model, licence and the backtest that chose it. <em>Who got served, when there was not enough<\/em>: per customer, ordered, served and short, fill rate by value and by volume, priority and its weight. A shortage is not pooled: it falls on somebody, and priority decides who (50 is neutral; higher goes first). Raising a customer's priority moves the shortage onto somebody else; it does not make it smaller.<\/p>\n<p><strong>🏭 Supply.<\/strong> <em>Production schedule<\/em>: every run, by bucket, product, plant and line, with quantity, hours, cost and CO₂e, flagged where it is made at a co-packer and needs quality release at the parent plant. Co-packer output cannot ship to customers: it goes back to its parent for release (two more days, double freight). <em>Component requirements<\/em>: what each run pulls through the recipe, scrap included, and from which plant. <em>Unmet demand<\/em>: units short and their margin at risk, by bucket, product and site.<\/p>\n<p><strong>🚚 Logistics.<\/strong> The network map, then: <em>Complications on the lanes<\/em>: each lane disruption, confirmed (already planned around) or expected (deliberately not: planning around what has not happened buys cover nobody agreed to), with its likelihood. <em>Lanes as the map makes them<\/em>: every lane's straight-line and road distance, circuity, lead time, cost per truck and per km, toll per truck where charged, CO₂e per truck, and whether the plan used it; a lane far above normal circuity is flagged. <em>Lateral transshipment actions<\/em>: every stock move between sites, truck by truck, with fill, payload, what bounds the truck (slots or weight), manifest, freight, CO₂e and carbon tax. <em>Boomerang QA returns<\/em>: co-packer output going back for release. <em>Load plan<\/em>: one row per product per dispatch. Under them, every constraint the plan enforced, in words.<\/p>\n<p><strong>📦 Inventory.<\/strong> <em>Did the plan hold its buffers?<\/em>: buffered parts, the share of bucket-parts above the red zone, buckets below red and the cost of running thin, then per part the zones, lowest and average stock, usage, lead time, buckets in red and when it recovered. <em>What shelf life lets you hold<\/em>: per product and site, the oldest stock it may dispatch, set by the strictest customer sharing that stock pool, and where a DDMRP buffer asks for more cover than a customer's shelf-life clause allows. <em>DDMRP buffers<\/em>: after <strong>Refresh DDMRP buffers<\/strong>, each part's zones, net flow position, penetration and the order to place now. <em>Stock with nowhere to go<\/em>: overstock the plan holds with no later use, and what holding it costs.<\/p>\n<p><strong>📜 Procurement.<\/strong> <em>Purchase orders the plan requires<\/em>: dependent demand exploded through the recipes, ordered back by each vendor's lead time, with quantity, price, value and vendor. <em>Supply agreements<\/em>: orders called off, how many break their agreement and the value, order value, and the value where the buyer arranges the freight (E and F Incoterms); per contract, the Incoterm, minimum order, ceiling, payment terms and the vendor's on-time record against its service level. An order that does not fit its agreement opens with what to tell purchasing.<\/p>\n<h4>Pre-S&amp;OP reconciliation<\/h4>\n<p>What no single function can settle. <em>Decisions this cycle cannot make for you<\/em>: every exception escalated, ranked by severity then money. <em>Move it, or keep paying to hold it<\/em>: each lateral move worth making and each overstock to review, priced as carrying (warehousing plus capital) against moving (freight plus carbon) and the shortage it avoids; a plan solved to its gap has already made every move that pays, so this view matters on a plan that was edited, committed or not proven. <em>Governance gates<\/em>: each S&amp;OP check with its observed value, threshold and pass or fail.<\/p>\n<h4>Executive review<\/h4>\n<p>The few decisions leadership must take, with the money attached: a headline (revenue, margin, cost to serve, stock), the financial KPIs, and <em>What is at risk<\/em>, the critical exceptions only. With the stress test on (chapter 21), <em>If the forecast is wrong upward<\/em>: demand at the top of the forecast band, the service the plan would actually deliver with supply inside the lead time already spent, the margin at risk, and the customer orders that lose. If operating cost <em>falls<\/em> under stress, the page says why: the plan short-ships instead of making more, which is not a saving. <em>Every KPI the plan produced<\/em> lists all of them.<\/p>\n<h4>Standard frameworks<\/h4>\n<p>The plan scored against SCOR, APICS and IBP / S&amp;OP metric sets, in three tabs, so it can be compared with anyone else's. Nothing is calculated anew: every figure is read off the plan. A third of these metrics cannot be computed from a plan at all (forecast accuracy, schedule adherence, delivery performance need execution data); they are listed with the reason, not filled with a guess. <strong>Show metrics this plan cannot compute<\/strong> (on by default) hides them when off. SCOR is grouped by its five attributes (reliability, responsiveness, agility, cost, asset management); a metric outside a believable range is flagged, not hidden.<\/p>\n<h4>Seasonality<\/h4>\n<p>The demand history every plan is built on, not specific to any branch: years of history, how many lines are seasonal, forecast accuracy (MAPE and bias on a holdout the fit never saw), and skill against \"same week last year\" (MASE below 1 beats it). <em>What the history says about each line<\/em>: strength of the season, peak and trough week and size, trend, promotion lift. <em>The actuals underneath<\/em>: pick a <strong>Line<\/strong> to see its weekly history; the seasonal index is estimated from unpromoted weeks only. <em>Where the forecast was scored<\/em>: the holdout results per line.<\/p>\n<h4>Standard costs<\/h4>\n<p>The costing run: what each product costs to make, rolled up from its recipe at its cheapest producing site, and what it sells for: material, conversion, overhead, standard cost, price and margin. Pick an <strong>Item<\/strong> to see the lines behind one cost, each component's gross quantity per unit (scrap included) and extended cost. Not branch-specific: a recipe does not branch with the plan.<\/p>\n<h4>Master data, Impact tracing, Network design<\/h4>\n<p>Each has its own chapter: 23, then 24 for the last two.<\/p>\n<h4>📚 Learn<\/h4>\n<p>Short lessons on the idea behind each section, each with a question to check yourself and the theory for the curious. The 📚 Learn buttons beside the features open the matching lesson, and 📚 Learn at the top of the page opens the whole list.<\/p>\n<h3>Promise an order<\/h3>\n<p>Under every plan, <strong>📦 Promise an order (available to promise)<\/strong> answers the customer-service question from the plan's own supply: pick a <strong>Product<\/strong>, a <strong>Site<\/strong>, <strong>Wanted by<\/strong> (a bucket) and a <strong>Quantity<\/strong> (default 1,000). The answer says whether it can be promised on time, and if not, how much can ship on time and when the rest can follow. Below it, by bucket: cumulative supply, confirmed orders and what is still promisable. Confirmed orders are reserved; forecast is not (the plan provides for it), and stock a confirmed order needs later cannot be promised now (chapter 15).<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The page, top to bottom<\/td>\n<td><code>app.py<\/code> (<code>ribbon<\/code>, <code>plan_download<\/code>, <code>level = st.radio(\"Review\", …)<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>The three review altitudes<\/td>\n<td><code>engine/review.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Exceptions<\/td>\n<td><code>engine/exceptions.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>The frameworks<\/td>\n<td><code>engine/frameworks.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Available to promise<\/td>\n<td><code>engine/atp.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>The workbook<\/td>\n<td><code>excel_export.py<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The section names and their one-line meanings above are the Control Tower's own (<code>SECTIONS<\/code> in <code>app.py<\/code>), read when this page is built.<\/p>\n<p><strong>Tests that guard it.<\/strong> Every input in the Control Tower is named in this part of the manual; the Control Tower opens each workspace on its own stories, money and map; a plan downloads as a workbook with a sheet per table.<\/p>"}],"search":" the control tower opens on a plan, never on an empty page: lindewaard's published stories, planned in advance. pick a story and the whole page follows it. press run optimization and the page shows your own plan instead, with the sidebar's settings (chapter 21). either way the page reads top to bottom the same: five headline numbers, the s&op verdict, how the solve ended, and then the plan read ten ways, one section at a time, from what each function must decide to what the board must decide. the top row and the welcome under the byline, four buttons: ⓘ about reopens the welcome; 📚 learn lists every lesson; 🧪 real vs simulated says what is real (the optimisation, its constraints, the s&op check, the master-data checks, the explainer) and what is invented (all of the data); 📖 glossary expla riced on the plan if you ask, and signed with a name and a reason. Nothing reaches the tables without passing the checks.<\/p>\n<div class=\"diagram\" data-diagram=\"edit-check\"><\/div>\n<p>Lindewaard has 23 tables. A change applies to the whole workspace, not to one scenario branch: every branch plans on the same tables. On the public demo, a saved change is kept only until the hosted service restarts or redeploys, which puts the published tables back; until then every visitor plans on it.<\/p>"},{"name":"How it works","html":"<h3>Picking a table<\/h3>\n<p><strong>Table<\/strong> lists every table with its row count. Under it: the table's key (what makes a row unique), its file, and the columns the engine <strong>recalculates on every build<\/strong>: a standard cost and a selling price are the result of the costing run, and a lane's distances and transit days come from the sites' coordinates. Those columns are greyed out; what is typed there is what the last calculation released.<\/p>\n<table>\n<thead>\n<tr>\n<th>Table<\/th>\n<th>Key<\/th>\n<th>Rows<\/th>\n<th>Columns<\/th>\n<th>Recalculated<\/th>\n<th>A blank means<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Material master<\/strong> (<code>materials.csv<\/code>)<\/td>\n<td>material_id<\/td>\n<td>17<\/td>\n<td>16<\/td>\n<td>standard_cost, sales_price<\/td>\n<td>target_gross_margin_pct (price as typed); shelf_life_days (does not expire); hazard_class (not hazardous)<\/td>\n<\/tr>\n<tr>\n<td><strong>Bill of material<\/strong> (<code>boms.csv<\/code>)<\/td>\n<td>parent_material_id, component_material_id, plant_id, valid_from<\/td>\n<td>29<\/td>\n<td>7<\/td>\n<td>—<\/td>\n<td>plant_id (all plants); valid_from (no start date); valid_to (no end date)<\/td>\n<\/tr>\n<tr>\n<td><strong>Routing<\/strong> (<code>routings.csv<\/code>)<\/td>\n<td>material_id, plant_id, work_center, valid_from<\/td>\n<td>14<\/td>\n<td>14<\/td>\n<td>—<\/td>\n<td>max_lot_size (no limit); valid_from (no start date); valid_to (no end date)<\/td>\n<\/tr>\n<tr>\n<td><strong>Purchasing info record<\/strong> (<code>purchasing.csv<\/code>)<\/td>\n<td>material_id, plant_id, vendor_id, valid_from<\/td>\n<td>20<\/td>\n<td>10<\/td>\n<td>—<\/td>\n<td>max_per_period (no limit); valid_from (no start date); valid_to (no end date)<\/td>\n<\/tr>\n<tr>\n<td><strong>Customer master<\/strong> (<code>customers.csv<\/code>)<\/td>\n<td>customer_id<\/td>\n<td>12<\/td>\n<td>7<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Remaining shelf-life agreement<\/strong> (<code>shelf_life_agreements.csv<\/code>)<\/td>\n<td>customer_id, material_id<\/td>\n<td>47<\/td>\n<td>5<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Buffer profile<\/strong> (<code>buffer_profiles.csv<\/code>)<\/td>\n<td>material_id, plant_id<\/td>\n<td>7<\/td>\n<td>8<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Site master<\/strong> (<code>sites.csv<\/code>)<\/td>\n<td>site_id<\/td>\n<td>9<\/td>\n<td>22<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Lane master<\/strong> (<code>lanes.csv<\/code>)<\/td>\n<td>lane_id<\/td>\n<td>9<\/td>\n<td>15<\/td>\n<td>straight_line_km, suggested_road_km, suggested_transit_days<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Lane disruption<\/strong> (<code>lane_disruptions.csv<\/code>)<\/td>\n<td>disruption_id<\/td>\n<td>5<\/td>\n<td>10<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Demand scenario<\/strong> (<code>demand_scenarios.csv<\/code>)<\/td>\n<td>scenario_id<\/td>\n<td>5<\/td>\n<td>7<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Stock position<\/strong> (<code>inventory_positions.csv<\/code>)<\/td>\n<td>material_id, plant_id<\/td>\n<td>38<\/td>\n<td>7<\/td>\n<td>on_order<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Open order<\/strong> (<code>open_supply.csv<\/code>)<\/td>\n<td>order_id<\/td>\n<td>25<\/td>\n<td>9<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Sales order<\/strong> (<code>sales_orders.csv<\/code>)<\/td>\n<td>order_id<\/td>\n<td>44<\/td>\n<td>8<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Planning parameter<\/strong> (<code>planning_parameters.csv<\/code>)<\/td>\n<td>parameter<\/td>\n<td>17<\/td>\n<td>5<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Supply disruption<\/strong> (<code>supply_disruptions.csv<\/code>)<\/td>\n<td>disruption_id<\/td>\n<td>5<\/td>\n<td>12<\/td>\n<td>—<\/td>\n<td>material_id (all materials); plant_id (all plants); value (not needed)<\/td>\n<\/tr>\n<tr>\n<td><strong>Road toll rate<\/strong> (<code>road_toll_rates.csv<\/code>)<\/td>\n<td>rate_id<\/td>\n<td>132<\/td>\n<td>14<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Tolled distance<\/strong> (<code>lane_road_use.csv<\/code>)<\/td>\n<td>lane_id, regime<\/td>\n<td>9<\/td>\n<td>4<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Fleet profile<\/strong> (<code>fleet_profiles.csv<\/code>)<\/td>\n<td>profile_id<\/td>\n<td>3<\/td>\n<td>11<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Lane fleet assignment<\/strong> (<code>lane_fleet.csv<\/code>)<\/td>\n<td>lane_id, mode<\/td>\n<td>0<\/td>\n<td>4<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Emission factor<\/strong> (<code>emission_factors.csv<\/code>)<\/td>\n<td>factor_id<\/td>\n<td>3<\/td>\n<td>10<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Customer location<\/strong> (<code>customer_locations.csv<\/code>)<\/td>\n<td>customer_id<\/td>\n<td>12<\/td>\n<td>5<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Customer sourcing<\/strong> (<code>customer_sourcing.csv<\/code>)<\/td>\n<td>customer_id, temperature_zone<\/td>\n<td>22<\/td>\n<td>5<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Editing in the grid<\/h3>\n<p>The grid is the table as stored. Edit a cell, add a row at the bottom, or select rows and delete them. Four things work differently from a spreadsheet:<\/p>\n<ul>\n<li><strong>Key columns cannot be renamed in place.<\/strong> A row is identified by its key; to change a key, delete the row and add the new one.<\/li>\n<li><strong>Blank cells can mean something.<\/strong> Where a blank is a decision, the grid says which one in brackets (the last column of the table above lists every one): a recipe line with no plant applies to <em>(all plants)<\/em>, a routing or purchasing record with no maximum has <em>(no limit)<\/em>, a product with no shelf life <em>(does not expire)<\/em>, a product with no target margin keeps its <em>(price as typed)<\/em>, and a validity date left blank means <em>(no start date)<\/em> or <em>(no end date)<\/em>. Type a value over the bracket to set one; leave it to keep the blank.<\/li>\n<li><strong>Units are shown, not edited.<\/strong> A unit column appears beside any material it names, read from the material master; change the unit on the material itself.<\/li>\n<li><strong>Greyed columns are recalculated<\/strong> (above).<\/li>\n<\/ul>\n<p><strong>⬇ Download this table (Excel)<\/strong> saves the table exactly as stored, blanks blank, so it can be edited offline and loaded back.<\/p>\n<h3>What you are about to change<\/h3>\n<p>As you edit, the grid is compared with the table as stored, row by key, and the difference is listed: <strong>CREATE<\/strong> (a new key), <strong>CHANGE<\/strong> (a field that moved, with its old and new value) or <strong>DELETE<\/strong> (a key that is gone). Nothing is written yet. \"Nothing yet\" means the grid still matches the table.<\/p>\n<h3>Your name, why, and the checks<\/h3>\n<p><strong>Your name<\/strong> is required to save: a lead time that moved with nobody's name on it is the one nobody can explain six months later. <strong>Why<\/strong> is optional and goes into the change log beside it.<\/p>\n<p>Every change goes through two kinds of check:<\/p>\n<ul>\n<li><strong>Refusals.<\/strong> A change is refused, and the file left untouched, if it would leave the tables describing a network that does not exist: a recipe naming a component nobody has, a routing at a site that is not there, a purchasing record for a vendor-plant pair the network cannot reach, validity dates that overlap for the same key. The refusal lists every fault, worst first, with what to fix. The dangerous shape of a typo is not a crash: the recipe still explodes and the plan comes back looking fine, which is why these are refused rather than warned about (chapter 7).<\/li>\n<li><strong>Challenges.<\/strong> A value that breaks no rule and still looks wrong is argued with, never blocked. Six rules: a number that moved 5 times or more (the shape of a slipped decimal point); a value 2 times away from its siblings (a vendor's other lead times, the other lines making the same product); a typed standard cost far from what the recipe rolls up to; a shelf life that leaves a customer's contract fewer than 3 days to pick and ship; a deleted purchasing record that leaves a part with one vendor, or a plant with none; and a value typed into a column the plan will not read: a selling price on a product priced by its target margin (the challenge names the price the plan will use, and the margin the typed price implies), or a lane distance, transit time or quantity on order that the build recalculates. Each says what it noticed, against which evidence, what is likely, and what to do. None stops the save.<\/li>\n<\/ul>\n<h3>What would it do?<\/h3>\n<p><strong>What would it do?<\/strong> solves the plan twice, with and without the first change in the list, and shows the difference before anything is saved: service, cost (counting the shortage the plan does not avoid) and stock, each with its change, and the customers whose fill rate moves. It catches the edit that is perfectly legal and quietly wrong. A change inside what two solves can tell apart is reported as \"the field moves and the plan does not\"; the cost tile's help gives that noise floor. A refused change has no plan to compare against, and says so.<\/p>\n<h3>Ask about this change<\/h3>\n<p>Under <strong>Ask about this change<\/strong>, type <strong>Your question<\/strong> (\"why is this refused?\", \"which one first?\", \"what do I do?\") and press <strong>Ask<\/strong>. The answer is built from the refusals and challenges the system computed and nothing else, by deterministic rules. <strong>Use the model<\/strong> (off by default, and off entirely without a key) lets a language model phrase the answer instead; an answer that names anything the system did not compute is discarded, not shown. Either way it decides nothing: the save path never consults it (chapter 19).<\/p>\n<h3>Save<\/h3>\n<p><strong>Save<\/strong> (enabled once there is a change and a name) applies the changes in order, each through the same checks. If one is refused, nothing after it is applied and the refusal is shown; otherwise the page confirms how many fields changed and reloads the table.<\/p>\n<h3>Load a file<\/h3>\n<p><strong>Load a file<\/strong> takes a CSV with the table's columns (the box names them: <em>A CSV with these columns: …<\/em>). Each row is created or changed depending on whether its key already exists, and you see the diff (how many new, how many changed, every field) before anything is written; <strong>Apply this load<\/strong> writes it, through the same checks. Your name is needed first. A bulk load is how a master data set gets destroyed, so the difference between a load that adds four products and one that rewrites four hundred is shown before it happens.<\/p>\n<h3>Who changed what<\/h3>\n<p>The last 200 changes to the table, newest first: when, who, the action, the key, the field, the old and new value, and why.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The section<\/td>\n<td><code>app.py<\/code> (<code>level == \"Master data\"<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>The tables, their keys and columns<\/td>\n<td><code>engine/masterstore.py<\/code> (<code>TableSpec<\/code>, <code>TABLES<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Refusals<\/td>\n<td><code>engine/masterstore.py<\/code> (<code>MasterStore<\/code> checks), <code>engine/datahealth.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Challenges<\/td>\n<td><code>engine/challenge.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>What would it do?<\/td>\n<td><code>engine/preview.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>The explainer<\/td>\n<td><code>engine/explain.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>The service<\/td>\n<td><code>main.py<\/code> (<code>/api/v1/master/…<\/code>: list, read, create, change, delete, load, explain, changes)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The table list above is read from the planning service and the Control Tower's own blank meanings when this page is built.<\/p>\n<p><strong>Tests that guard it.<\/strong> Every input in the Control Tower is named in this part of the manual; a refused change leaves the file untouched; a challenge never blocks a save; the editor never imports the explainer; a load shows its diff before it writes.<\/p>"}],"search":" master data is the section where the tables the plan is built from are edited: products, recipes, lines, vendors, sites, lanes, customers, their contracts, stock, orders and the planning parameters. editing them used to mean editing files and shipping a release. here, a change is shown as a list of field changes before anything is written, checked against the rest of the network, argued with where it looks wrong, priced on the plan if you ask, and signed with a name and a reason. nothing reaches the tables without passing the checks. lindewaard has 23 tables. a change applies to the whole workspace, not to one scenario branch: every branch plans on the same tables. on the public demo, a saved change is kept only until the hosted service restarts or redeploys, which puts the published tables back; until then every visitor plans on it. picking a table table lists every table with its row count. under it: the table's key (what make delete, load, explain, changes) the table list above is read from the planning service and the control tower's own blank meanings when this page is built. tests that guard it. every input in the control tower is named in this part of the manual; a refused change leaves the file untouched; a challenge never blocks a save; the editor never imports the explainer; a load shows its diff before it writes. "},{"part":"Using it","number":"24","slug":"tower-network","title":"Impact tracing and network design","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>The last two sections of the review bar ask questions the plan does not answer by itself. <strong>Impact tracing<\/strong> asks <em>if this happens, whose orders do we lose and what is it worth?<\/em>: a lane, a site or a vendor is taken away and the plan solved again, with what is already committed held where it is. <strong>Network design<\/strong> asks the question before that one: <em>is this the right set of sites at all?<\/em> One is a cycle question with a short clock; the other is capital, and is answered on a year.<\/p>"},{"name":"How it works","html":"<h3>Impact tracing<\/h3>\n<p>The plan on the page already absorbs every <em>confirmed<\/em> disruption in the lane table. An <em>expected<\/em> one (a strike that may be called, a depot action not yet announced) is reported but deliberately not planned around, because cover against what has not happened is cover nobody agreed to pay for. Impact tracing is where an expected event, or any what-if of your own, becomes a number.<\/p>\n<table>\n<thead>\n<tr>\n<th>Input<\/th>\n<th>Default and options<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>What fails<\/strong><\/td>\n<td>LANE, SITE or SUPPLIER<\/td>\n<td>A lane stops carrying; a plant or distribution centre loses its hours; a vendor stops delivering<\/td>\n<\/tr>\n<tr>\n<td><strong>Which one<\/strong><\/td>\n<td>the first in the list; one or more<\/td>\n<td>Lanes from the plan's own map, sites from the network, vendors the plan buys from. Several picked fail together, as one event<\/td>\n<\/tr>\n<tr>\n<td><strong>When<\/strong><\/td>\n<td>the plan's first three buckets; any<\/td>\n<td>Empty means the whole horizon. <strong>A supplier event ignores it<\/strong>: a purchasing record carries one cap for the whole horizon, with no way to say \"stops in March, resumes in May\"<\/td>\n<\/tr>\n<tr>\n<td><strong>How likely<\/strong><\/td>\n<td>0.20, 0 to 1 in steps of 0.05<\/td>\n<td>Carried through, never applied to the plan: the event is traced as if it happens, and the likelihood only weights the money beside it<\/td>\n<\/tr>\n<tr>\n<td><strong>What it is<\/strong><\/td>\n<td>free text<\/td>\n<td>The event's name on the result; blank names it from what fails<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Trace it<\/strong> sends one event to the planning service on the sidebar's branch, network and profile, priced at the sidebar's carbon price and cost of capital, with 30 seconds for the trace. The service first plans the network as it stands, then plans it again without what failed, with production and purchasing inside the supply lead time pinned: orders already placed cannot be undone, and an event inside that window cannot be answered by making more. That is the substance of the answer, not a limit on it.<\/p>\n<p>The result, for an event that leaves a plan at all:<\/p>\n<table>\n<thead>\n<tr>\n<th>Tile or table<\/th>\n<th>What it is<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Service<\/strong><\/td>\n<td>Service by value with the event, and the points lost<\/td>\n<\/tr>\n<tr>\n<td><strong>Margin at risk<\/strong><\/td>\n<td>The event's own cost: margin on the extra demand not served, plus its penalty. A difference against the plan as it stands, not the quarter's total<\/td>\n<\/tr>\n<tr>\n<td><strong>Weighted by likelihood<\/strong><\/td>\n<td>Margin at risk times <strong>How likely<\/strong>, beside the raw figure, never instead of it: a 40% chance of losing a customer is not losing 40% of them, and a planner deciding whether to pre-build needs both<\/td>\n<\/tr>\n<tr>\n<td><strong>Supply already spent<\/strong><\/td>\n<td>The days, and buckets, the trace held where they were<\/td>\n<\/tr>\n<tr>\n<td><strong>Customers<\/strong><\/td>\n<td>Each customer hit: fill before and after, the points lost, the extra units short, priority<\/td>\n<\/tr>\n<tr>\n<td><strong>Orders at risk<\/strong><\/td>\n<td>Each order line that loses: customer, product, site, bucket, units short, margin at risk<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>An event the network absorbs (it reroutes and no order changes hands) says so in green. An event that leaves no plan at all says so in red, with the reason.<\/p>\n<p><strong>Measured on Lindewaard<\/strong>, the form at its defaults (the first three buckets, 20% likely), one event each: losing lane LN-001 (Breda to DC Tilburg) costs -0.08 points of service and €-4k of margin at risk (€-709 weighted), across 1 customers and 3 order lines; losing the Breda plant (PL01) costs -0.06 points of service and €-3k of margin at risk (€-589 weighted), across 2 customers and 3 order lines; losing the syrup vendor (V-SYRUP-01) costs -0.06 points of service and €-3k of margin at risk (€-589 weighted), across 2 customers and 3 order lines. Each answered in about 8 s.<\/p>\n<p>Three things a planner should know before reading those numbers:<\/p>\n<ul>\n<li><strong>The trace plans the network again on its own.<\/strong> It starts from 98.70% service, not the 100.00% on the page, because it solves at the profile's own gap with no stress test, and its differences are against that plan, not the one on screen.<\/li>\n<li><strong>It is priced like the sidebar's plan.<\/strong> The trace carries the sidebar's carbon price, spot multiplier, carbon budget and cost of capital. Until 20 Oct it was priced at the defaults whatever the sidebar said.<\/li>\n<li><strong>On the 28-day plan almost everything is already committed.<\/strong> Lindewaard's longest vendor lead time is 21 days, which pins 9 of the plan's 10 buckets. On a full-year profile the same event has room to be answered by making more, and costs less.<\/li>\n<\/ul>\n<p>Before anything is traced, the caption names this workspace's own expected events, the ones the plan reports and deliberately does not plan around: on Lindewaard, a possible depot action at Oss on lane LN-003, 40% likely. <strong>What it is<\/strong> offers the first of them as its example. Until 20 Oct both named a depot action at Brookvale, on the US company's network, whichever company was on screen.<\/p>\n<h3>Network design<\/h3>\n<p>Every other section plans inside a network taken as given. Network design solves the network twice on the strategic grain, once as it is and once as it could be, and reports the difference (chapter 11 explains the model and Lindewaard's answer in full).<\/p>\n<table>\n<thead>\n<tr>\n<th>Input<\/th>\n<th>Default and range<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Mode<\/strong><\/td>\n<td>GREENFIELD; or BROWNFIELD<\/td>\n<td>Greenfield may open the candidate sites (on Lindewaard, DC Venlo and Moerdijk Bottling, both <em>proposed<\/em> in the site master). Brownfield may also close an own site; a co-packer is never closed. In both, a customer may be served from another site<\/td>\n<\/tr>\n<tr>\n<td><strong>Amortise capex over (years)<\/strong><\/td>\n<td>10, 3 to 25<\/td>\n<td>Spreads a new site's opening cost over this many years, so it can be weighed against a year's operating cost. Shorter makes opening dearer<\/td>\n<\/tr>\n<tr>\n<td><strong>Candidate lane reach (km)<\/strong><\/td>\n<td>400, 100 to 800, in steps of 50<\/td>\n<td>How far a lane to or from a candidate site may run. A shorter reach gives a new site fewer customers to serve<\/td>\n<\/tr>\n<tr>\n<td><strong>Optimality gap<\/strong> (sidebar)<\/td>\n<td>1%<\/td>\n<td>How close to the best network the solver must prove it is. It applies here because it decides what the answer can tell apart: a saving smaller than the gap either solve stopped at is reported as no difference<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The sidebar's carbon price, spot multiplier and cost of capital also apply. The carbon budget does not, because it is kilograms over the plan's horizon and a design solves a different one: on Lindewaard the network as it stands emits 1,681,323 kg, 21 times the 78,943 kg of the 28-day plan. A budget set against the page's plan would hold the design to a small fraction of what today's network emits, and the design would answer a question nobody asked: which network emits least, whatever it costs, down to not serving customers.<\/p>\n<p><strong>🏗️ Design on this horizon<\/strong> answers with a verdict, then four numbers: <strong>Annual cost today<\/strong>, <strong>Annual cost proposed<\/strong> (with the saving), <strong>One-off investment<\/strong> and <strong>Payback<\/strong>. Under them, every site with its decision (keep, open, close), fixed cost a year, capex, exit cost, what it made, what crossed its lanes and why; then what changes in the plan underneath: service, cost, freight, trucks, carbon and stock. Three verdicts are possible:<\/p>\n<ul>\n<li><strong>Open … ; close …<\/strong> (green): the proposed network is cheaper by more than the solver's tolerance.<\/li>\n<li><strong>The network we run today is the one the model would build<\/strong> (blue).<\/li>\n<li><strong>The two networks are closer together than the tolerance that produced them<\/strong> (blue): treat it as no difference, or re-run at a tighter gap.<\/li>\n<\/ul>\n<p>On Lindewaard at these defaults: €1,789,203 a year cheaper than today, for €2,000,000 once, paid back in 13 months; service from 99.00% to 99.32%. Without closing anything, moving 2 customers' deliveries saves €789,647 a year, and no new site pays for itself. So the closure is judged on what closing adds: against that network, €999,556 a year for €2,000,000, back in 2.0 years. DC Tilburg's fixed cost goes; without its pallets the plants co-pack 8,227 more units and 17,957 more units go short. Proven within the gap asked. Greenfield took 2187 s, brownfield 3022 s, on a laptop. At the default settings, greenfield and brownfield alike, the section opens on that answer solved in advance by the same engine, saying when and how long it took; change a setting, or press the button, and it solves live. Settled by parts since 21 Oct, a live design on the hosted engine, with half a processor, takes longer than on the laptop; it has not been measured there yet. Keep the page open.<\/p>\n<p>The operating cost is scaled from the horizon up to a year so it can be weighed against a warehouse, which assumes the weeks ahead are representative of the year. The page warns about that: on a seasonal business, read the answer as a direction rather than a number.<\/p>\n<p><strong>🎲 Design across futures<\/strong> asks the same question against the workspace's demand scenarios instead of one horizon. Each future proposes the network it would like; every proposal is then priced in every future. It shows the futures (likelihood, demand multiplier, why), each network's cost in each future with its expected cost, worst case and maximum regret, and three numbers: <strong>Cheapest on average<\/strong>, <strong>Least bad worst-case<\/strong>, and <strong>Cost of not knowing<\/strong> (the gap between the best single network and perfect foresight). When the two readings agree it says so; when they differ, the gap between them is the decision, and it is a question of appetite rather than arithmetic. It solves at its own 2% gap, not the sidebar's, and gives each solve up to five minutes. No reason for that was recorded when it was built: the page simply did not send the slider. Looked at on 21 Oct, it was kept on purpose: about ten solves take 19 to 27 minutes on a laptop at 2% and 39 on the hosted engine, and a tighter gap on a forecast buys precision the forecast does not have. At the sidebar's 1% it is unmeasured. Each future's network as it stands is solved once and reused for everything priced in that future, and a network priced in the future that proposed it reuses that future's own solve. It is a heuristic, not a two-stage stochastic program: it cannot invent a hedge no single future would have proposed.<\/p>\n<p>Solved in advance on Lindewaard at the default settings, the request the button sends: 5 futures proposed 2 distinct networks, each priced in every future, in 39 minutes at up to 5 minutes and a 2% gap a solve. Cheapest on average: <strong>PL04<\/strong>, €41.23M a year expected; least bad worst case: <strong>PL04<\/strong> (the two agree); the cost of not knowing which future comes, €2.32M a year. While its settings are the defaults, the section opens on that answer, with when it was solved and how long it took; the button solves it again live. A good answer takes that long, and the page was not going to make a visitor wait for it.<\/p>\n<p><strong>On the hosted engine, away from the defaults, it takes about 40 minutes.<\/strong> Tried live there on 20 Oct at a lane reach of 350 km, it was refused after 580 s: with half a processor, one future's network as it stands found no plan in its five minutes. Each future now starts from the plan of the nearest future already solved, so the solver never starts empty-handed; asked the same question on 21 Oct, the hosted engine answered in 2,358 s (39 minutes), the same verdict as at the defaults. The button says so before it is pressed.<\/p>\n<p>The design service takes more than the page offers. Naming the candidate sites, the sites that may close or must not, a cap on open sites, the reach of a delivery, fixing customers to their sites, and putting a price on one closure on request (\"what would closing DC Rotterdam cost?\") are all fields of <code>POST /api/v1/design<\/code> (chapter 26), not inputs on this page.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The sections<\/td>\n<td><code>app.py<\/code> (<code>level == \"Impact tracing\"<\/code>, the final <code>else:<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Impact tracing<\/td>\n<td><code>engine/impact.py<\/code>, <code>POST /api/v1/impact<\/code> (<code>ImpactRequest<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Network design<\/td>\n<td><code>engine/design.py<\/code>, <code>POST /api/v1/design<\/code> (<code>DesignRequest<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Across futures<\/td>\n<td><code>engine/design.py<\/code> (<code>RobustNetworkDesigner<\/code>), <code>POST /api/v1/design/robust<\/code><\/td>\n<\/tr>\n<tr>\n<td>The measured runs<\/td>\n<td><code>tools/manual_tower.py --traces<\/code>, <code>--robust<\/code>; <code>tools/manual_design.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Solved in advance for the page<\/td>\n<td><code>tools/publish_designs.py<\/code> (showcase/<workspace>/design_greenfield.json, design_brownfield.json, robust_design.json)<\/td>\n<\/tr>\n<tr>\n<td>Timed on the hosted engine<\/td>\n<td><code>.github/workflows/measure-hosted.yml<\/code>, started by hand<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Tests that guard it.<\/strong> Every input in the Control Tower is named in this part of the manual; every figure in a trace is the event's cost, not the quarter's; an event the network absorbs is reported as absorbed, not as free; a vendor that stops shipping is capped, not struck off; a saving inside the solver's tolerance is reported as none.<\/p>"}],"search":" the last two sections of the review bar ask questions the plan does not answer by itself. impact tracing asks if this happens, whose orders do we lose and what is it worth? : a lane, a site or a vendor is taken away and the plan solved again, with what is already committed held where it is. network design asks the question before that one: is this the right set of sites at all rt":"Using it","number":"25","slug":"tasks","title":"Common tasks","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Seven things people come to Zynta-Koda to do, and which part of the system each one uses. Every task is below as steps on the screen, and as the call that does the same through the API where there is one.<\/p>\n<div class=\"diagram\" data-diagram=\"task-map\"><\/div>"},{"name":"How it works","html":"<h3>Plan the year<\/h3>\n<ol>\n<li>In the sidebar, set <strong>Planning altitude<\/strong> to Tactical, and the gate's thresholds under <strong>Virtual IBP gates<\/strong>.<\/li>\n<li>Press <strong>Run optimization<\/strong>. The plan comes back with the S&amp;OP gate's verdict.<\/li>\n<li>Read <strong>What needs a decision<\/strong>, worst first, then the reviews.<\/li>\n<\/ol>\n<p><code>bash\ncurl -X POST $ZK/api/v1/optimize -H \"Content-Type: application/json\" \\\n  -d '{\"scenario_id\": \"Q1-PLAN\", \"workspace\": \"demo-benelux\", \"profile\": \"TACTICAL\"}'<\/code><\/p>\n<h3>Test a disruption<\/h3>\n<ol>\n<li>Pick a story: each is planned three ways, reacting on the day, acting with a week's notice, and acting ahead.<\/li>\n<li>Compare the three on profit and service; the map shows which sites and lanes change.<\/li>\n<li>For an event of your own, use <strong>Impact tracing<\/strong>: a supplier, a site or a lane, and the weeks it is out.<\/li>\n<\/ol>\n<p><code>bash\ncurl -X POST $ZK/api/v1/impact -H \"Content-Type: application/json\" \\\n  -d '{\"scenario_id\": \"WHAT-IF\", \"workspace\": \"demo-benelux\",\n       \"events\": [{\"event_id\": \"E1\", \"kind\": \"SUPPLIER\", \"targets\": [\"V-FLAVOUR-01\"], \"periods\": [\"W01\", \"W02\"]}]}'<\/code><\/p>\n<h3>Promise an order<\/h3>\n<ol>\n<li>Under a plan, open <strong>Promise an order<\/strong>.<\/li>\n<li>Choose the product and the site, type the quantity and the date it is wanted.<\/li>\n<li>The answer is what can ship on time, and when the rest can follow, from the plan's own stock (chapter 15).<\/li>\n<\/ol>\n<h3>Fix master data<\/h3>\n<ol>\n<li>Open <strong>Master data<\/strong> and pick the table.<\/li>\n<li>Edit a row. Before anything is saved, the change is checked against every rule the tables must keep, and its effect is shown.<\/li>\n<li>If it is refused, ask why in plain words: the explainer answers, and approves nothing.<\/li>\n<\/ol>\n<p><code>bash\ncurl -X PATCH $ZK/api/v1/master/materials/FG-1001 -H \"Content-Type: application/json\" \\\n  -d '{\"values\": {\"shelf_life_days\": 150}, \"author\": \"planner@lindewaard\", \"reason\": \"new packaging\", \"preview\": true}'<\/code><\/p>\n<h3>Onboard a company's data<\/h3>\n<p>From an ERP extract (SAP or Dynamics 365 tables) to a workspace, on your own machine:<\/p>\n<p><code>bash\npython tools/onboard.py onboard RAW_DIR --mapping MAP.toml --workspace NAME\npython tools/onboard.py report workspaces/NAME     # the data-health report<\/code><\/p>\n<p>The health report lists every fault at once, worst first. Real data stays on the machine (chapter 28).<\/p>\n<h3>Redesign the network<\/h3>\n<ol>\n<li>Open <strong>Network design<\/strong>; choose greenfield (may open candidate sites) or brownfield (may also close own sites).<\/li>\n<li>The design solves today's network and the redesigned one and compares them, customers free to move between sites (chapter 11).<\/li>\n<\/ol>\n<p><code>bash\ncurl -X POST $ZK/api/v1/design -H \"Content-Type: application/json\" \\\n  -d '{\"scenario_id\": \"DESIGN\", \"workspace\": \"demo-benelux\", \"mode\": \"BROWNFIELD\"}'<\/code><\/p>\n<h3>Ask an AI assistant<\/h3>\n<p>Point an assistant that speaks MCP at <code>tools/mcp_server.py<\/code>. It can read the published plans, list exceptions, explain KPIs and ask what-ifs; it cannot change anything (chapter 26).<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>Task<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Plan<\/td>\n<td><code>POST /api/v1/optimize<\/code> (<code>main.optimize<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Disruption<\/td>\n<td>the stories in <code>showcase/<\/code>, <code>POST /api/v1/impact<\/code><\/td>\n<\/tr>\n<tr>\n<td>Promise<\/td>\n<td><code>engine/atp.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Master data<\/td>\n<td><code>/api/v1/master/...<\/code>, <code>engine/masterstore.py<\/code>, <code>engine/explain.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Onboarding<\/td>\n<td><code>tools/onboard.py<\/code>, <code>docs/onboarding/<\/code><\/td>\n<\/tr>\n<tr>\n<td>Design<\/td>\n<td><code>POST /api/v1/design<\/code>, <code>engine/design.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>AI<\/td>\n<td><code>tools/mcp_server.py<\/code>, <code>docs/mcp.md<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><code>$ZK<\/code> is the planning service's address. A local one: <code>uvicorn main:app --port 8080<\/code>.<\/p>"}],"search":" seven things people come to zynta-koda to do, and which part of the system each one uses. every task is below as steps on the screen, and as the call that does the same through the api where there is one. plan the year in the sidebar, set planning altitude to tactical, and the gate's thresholds under virtual ibp gates . press run optimization . the plan comes back with the s&op gate's verdict. read what needs a decision , worst first, then the reviews. bash curl -x post $zk/api/v1/optimize -h \"content-type: application/json\" \\ -d '{\"scenario_id\": \"q1-plan\", \"workspace\": \"demo-benelux\", \"profile\": \"tactical\"}' test a disruption pick a story: each is planned three ways, reacting on the day, acting with a week's notice, and acting ahead. compare the three on profit and service; the map shows which sites and lanes change. for an event of your own, use impact tracing : a supplier, a site or a lane, and the weeks it is out. bash curl -x post $zk/api/v1/impact -h \"content-type: application/json\" \\ -d '{\"scenario_id\": \"what-if\", \"workspace\": \"demo-benelux\", \"events\": [{\"event_id\": \"e1\", \"kind\": \"supplier\", \"targets\": [\"v-flavour-01\"], \"periods\": [\"w01\", \"w02\"]}]}' promise an order under a plan, open promise an order . choose the product and the site, type the quantity and the date it is wanted. the answer is what can ship on time, and when the rest can follow, from the plan's own stock (chapter 15). fix master data open master data and pick the table. edit a row. before anything is saved, the change is checked against every rule the tables must keep, and its effect is shown. if it is refused, ask why in plain words: the explainer answers, and approves nothing. bash curl -x patch $zk/api/v1/master/materials/fg-1001 -h \"content-type: application/json\" \\ -d '{\"values\": {\"shelf_life_days\": 150}, \"author\": \"planner@lindewaard\", \"reason\": \"new packaging\", \"preview\": true}' onboard a company's data from an erp extract (sap or dynamics 365 tables) to a workspace, on your own machine: bash python tools/onboard.py onboard raw_dir --mapping map.toml --workspace name python tools/onboard.py report workspaces/name # the data-health report the health report lists every fault at once, worst first. real data stays on the machine (chapter 28). redesign the network open network design ; choose greenfield (may open candidate sites) or brownfield (may also close own sites). the design solves today's network and the redesigned one and compares them, customers free to move between sites (chapter 11). bash curl -x post $zk/api/v1/design -h \"content-type: application/json\" \\ -d '{\"scenario_id\": \"design\", \"workspace\": \"demo-benelux\", \"mode\": \"brownfield\"}' ask an ai assistant point an assistant that speaks mcp at tools/mcp_server.py . it can read the published plans, list exceptions, explain kpis and ask what-ifs; it cannot change anything (chapter 26). task where plan post /api/v1/optimize ( main.optimize ) disruption the stories in showcase/ , post /api/v1/impact promise engine/atp.py master data /api/v1/master/... , engine/masterstore.py , engine/explain.py onboarding tools/onboard.py , docs/onboarding/ design post /api/v1/design , engine/design.py ai tools/mcp_server.py , docs/mcp.md $zk is the planning service's address. a local one: uvicorn main:app --port 8080 . "},{"part":"Using it","number":"26","slug":"api","title":"API","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Everything the Control Tower does goes through the planning service's API, and anything else can use it too: 21 endpoints, read here from the service itself. <strong>Pick one.<\/strong><\/p>\n<div class=\"diagram\" data-diagram=\"api\"><\/div>"},{"name":"How it works","html":"<h3>Every call names its scenario branch<\/h3>\n<p>Every request body carries a <code>scenario_id<\/code>: the sandbox branch the run reads from and writes to. A what-if can never touch the live schedule by accident; asking for live on any branch but LIVE is refused.<\/p>\n<p>A request may also name a <code>workspace<\/code>: the company's tables to plan on. The public demo opens only the demo workspaces.<\/p>\n<h3>The main calls<\/h3>\n<table>\n<thead>\n<tr>\n<th>Call<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>POST /api/v1/optimize<\/code><\/td>\n<td>Plans the network and puts the plan through the S&amp;OP gate<\/td>\n<\/tr>\n<tr>\n<td><code>POST /api/v1/impact<\/code><\/td>\n<td>Plans the network as it stands, then prices one or more supply events against it<\/td>\n<\/tr>\n<tr>\n<td><code>POST /api/v1/design<\/code><\/td>\n<td>Solves today's network and a redesigned one, and compares; with <code>force_close<\/code>, prices one closure<\/td>\n<\/tr>\n<tr>\n<td><code>POST /api/v1/design/robust<\/code><\/td>\n<td>Designs one network to be right across several demand futures<\/td>\n<\/tr>\n<tr>\n<td><code>POST /api/v1/ddmrp<\/code><\/td>\n<td>Sizes the DDMRP buffers<\/td>\n<\/tr>\n<tr>\n<td><code>/api/v1/master/...<\/code><\/td>\n<td>Reads and edits the master data: every change previewable, checked and logged<\/td>\n<\/tr>\n<tr>\n<td><code>GET /api/v1/commits/...<\/code><\/td>\n<td>The schedules committed on a branch<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>A plan that cannot be made says so as an answer rather than a crash: proven infeasible and out of time with nothing found are told apart, with the solver's own report and the constraint log (HTTP 409).<\/p>\n<h3>Interactive documentation<\/h3>\n<p>The service describes itself at <code>/docs<\/code>: every endpoint, every field, its limits and an example, generated from the code.<\/p>\n<h3>The read-only MCP server<\/h3>\n<p>An AI assistant that speaks MCP (the Model Context Protocol) can ask the plans questions through 6 tools. Every one reads; none writes:<\/p>\n<div class=\"diagram\" data-diagram=\"mcp\"><\/div>\n<p>The server runs in its own environment and calls the engine directly. A test calls every tool with every write path rigged to fail, and none fails.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The service<\/td>\n<td><code>main.py<\/code> (FastAPI), <code>uvicorn main:app<\/code><\/td>\n<\/tr>\n<tr>\n<td>Request and response models<\/td>\n<td><code>main.py<\/code> (Pydantic)<\/td>\n<\/tr>\n<tr>\n<td>MCP server<\/td>\n<td><code>tools/mcp_server.py<\/code>, <code>docs/mcp.md<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The endpoint list and the MCP tools on this page are read from the running app in <code>main.py<\/code> and from <code>tools/mcp_server.py<\/code> (<code>TOOLS<\/code>) when the manual is built, so they cannot drift from the code.<\/p>"}],"search":" everything the control tower does goes through the planning service's api, and anything else can use it too: 21 endpoints, read here from the service itself. pick one. every call names its scenario branch every request body carries a scenario_id : the sandbox branch the run reads from and writes to. a what-if can never touch the live schedule by accident; asking for live on any branch but live is refused. a request may also name a workspace : the company's tables to plan on. the public demo opens only the demo workspaces. the main calls call what it does post /api/v1/optimize plans the network and puts the plan through the s&op gate post /api/v1/impact plans the network as it stands, then prices one or more supply events against it post /api/v1/design solves today's network and a redesigned one, and compares; with force_close , prices one closure post /api/v1/design/robust designs one network to be right across several demand futures post /api/v1/ddmrp sizes the ddmrp buffers /api/v1/master/... reads and edits the master data: every change previewable, checked and logged get /api/v1/commits/... the schedules committed on a branch a plan that cannot be made says so as an answer rather than a crash: proven infeasible and out of time with nothing found are told apart, with the solver's own report and the constraint log (http 409). interactive documentation the service describes itself at /docs : every endpoint, every field, its limits and an example, generated from the code. the read-only mcp server an ai assistant that speaks mcp (the model context protocol) can ask the plans questions through 6 tools. every one reads; none writes: the server runs in its own environment and calls the engine directly. a test calls every tool with every write path rigged to fail, and none fails. what where the service main.py (fastapi), uvicorn main:app request and response models main.py (pydantic) mcp server tools/mcp_server.py , docs/mcp.md the endpoint list and the mcp tools on this page are read from the running app in main.py and from tools/mcp_server.py ( tools ) when the manual is built, so they cannot drift from the code. "},{"part":"Operating and trust","number":"27","slug":"deployment","title":"Deployment","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Zynta-Koda is small enough to run on free hosting and careful enough to keep real data off it. Where each part runs, from a commit to the page.<\/p>\n<div class=\"story\"><div class=\"stage\"><div class=\"diagram\" data-diagram=\"deploy\" data-story=\"1\"><\/div><\/div><div class=\"steps\"><div class=\"step\" data-state=\"code\"><p><strong>One repository.<\/strong> The engine, the planning service, the Control Tower, the showcase and this manual live in one private repository.<\/p><\/div><div class=\"step\" data-state=\"test\"><p><strong>Every push is tested.<\/strong> 513 fast tests first, then the whole suite with real solves. The services redeploy on every push too; the tests do not hold a deploy back, so a red run is the first thing fixed.<\/p><\/div><div class=\"step\" data-state=\"serve\"><p><strong>Two services redeploy.<\/strong> The planning service on Render (Frankfurt), the Control Tower on Streamlit Community Cloud, which calls it.<\/p><\/div><div class=\"step\" data-state=\"show\"><p><strong>The showcase and this manual are static pages<\/strong> on GitHub Pages: published plans, generated, never hand-edited.<\/p><\/div><div class=\"step\" data-state=\"keep\"><p><strong>Committed schedules are kept in Postgres<\/strong> when the service has a database; without one it says so on start and keeps them in memory.<\/p><\/div><div class=\"step\" data-state=\"private\"><p><strong>Real data never goes there.<\/strong> It would be planned only on the machine that holds it, never on the public services.<\/p><\/div><\/div><\/div>"},{"name":"How it works","html":"<h3>Two images, one Dockerfile<\/h3>\n<p>The planning service and the Control Tower are built as two images from one <code>Dockerfile<\/code>: the service carries the solver and no Streamlit, the Control Tower carries no solver. A service that wakes from sleep pays for its image size on every wake, so the split matters. Each build fails rather than deploys if its own imports do not resolve, and the service's build proves both CBC builds run.<\/p>\n<p>In CI the two images are built and probed only when something they are made of changes (the engine, the service, the Control Tower, their dependency lists); a change to docs, tests or the showcase runs the tests alone.<\/p>\n<h3>Asleep is normal<\/h3>\n<p>Free hosting sleeps when nobody calls. The planning service restarts after every update, and the first call after that takes up to a minute; the Control Tower wakes it once per visit and says so while it waits. A free database pauses after a week of quiet, so committing retries with backoff rather than failing.<\/p>\n<h3>Real data, kept private<\/h3>\n<ul>\n<li><strong>On the machine that holds it:<\/strong> the engine runs with <code>ZK_MODE=private<\/code> on a private workspace, on an encrypted volume (chapter 28).<\/li>\n<li><strong>In a private cloud account:<\/strong> the same images run on Cloud Run or any container host, behind that platform's own access control. The service has no login of its own, by design: no home-grown authentication.<\/li>\n<\/ul>\n<h3>Configuration<\/h3>\n<table>\n<thead>\n<tr>\n<th>Setting<\/th>\n<th>Where<\/th>\n<th>What<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>API_BASE_URL<\/code><\/td>\n<td>Control Tower<\/td>\n<td>the planning service's address<\/td>\n<\/tr>\n<tr>\n<td><code>DATABASE_URL<\/code><\/td>\n<td>planning service<\/td>\n<td>Postgres for committed schedules; unset, in memory<\/td>\n<\/tr>\n<tr>\n<td><code>ZK_MODE<\/code><\/td>\n<td>planning service<\/td>\n<td><code>private<\/code> opens private workspaces; otherwise public demo<\/td>\n<\/tr>\n<tr>\n<td><code>ZK_SOLVER<\/code><\/td>\n<td>planning service<\/td>\n<td>override the solver (default CBC)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Credentials go into the hosting platform's settings, never into files, commits or logs.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Images<\/td>\n<td><code>Dockerfile<\/code> (targets <code>api<\/code> and <code>ui<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Tests on every push<\/td>\n<td><code>.github/workflows/ci.yml<\/code><\/td>\n<\/tr>\n<tr>\n<td>Image builds<\/td>\n<td><code>.github/workflows/images.yml<\/code><\/td>\n<\/tr>\n<tr>\n<td>Control Tower entry<\/td>\n<td><code>streamlit_app.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Showcase and manual<\/td>\n<td><code>tools/build_site.py<\/code>, <code>tools/build_manual.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Deployment decisions<\/td>\n<td><code>docs/zynta-koda-adr.md<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}],"search":" zynta-koda is small enough to run on free hosting and careful enough to keep real data off it. where each part runs, from a commit to the page. one repository. the engine, the planning service, the control tower, the showcase and this manual live in one private repository. every push is tested. 513 fast tests first, then the whole suite with real solves. the services redeploy on every push too; the tests do not hold a deploy back, so a red run is the first thing fixed. two services redeploy. the planning service on render (frankfurt), the control tower on streamlit community cloud, which calls it. the showcase and this manual are static pages on github pages: published plans, generated, never hand-edited. committed schedules are kept in postgres when the service has a database; without one it says so on start and keeps them in memory. real data never goes there. it would be planned only on the machine that holds it, never on the public services. two images, one dockerfile the planning service and the control tower are built as two images from one dockerfile : the service carries the solver and no streamlit, the control tower carries no solver. a service that wakes from sleep pays for its image size on every wake, so the split matters. each build fails rather than deploys if its own imports do not resolve, and the service's build proves both cbc builds run. in ci the two images are built and probed only when something they are made of changes (the engine, the service, the control tower, their dependency lists); a change to docs, tests or the showcase runs the tests alone. asleep is normal free hosting sleeps when nobody calls. the planning service restarts after every update, and the first call after that takes up to a minute; the control tower wakes it once per visit and says so while it waits. a free database pauses after a week of quiet, so committing retries with backoff rather than failing. real data, kept private on the machine that holds it: the engine runs with zk_mode=private on a private workspace, on an encrypted volume (chapter 28). in a private cloud account: the same images run on cloud run or any container host, behind that platform's own access control. the service has no login of its own, by design: no home-grown authentication. configuration setting where what api_base_url control tower the planning service's address database_url planning service postgres for committed schedules; unset, in memory zk_mode planning service private opens private workspaces; otherwise public demo zk_solver planning service override the solver (default cbc) credentials go into the hosting platform's settings, never into files, commits or logs. what where images dockerfile (targets api and ui ) tests on every push .github/workflows/ci.yml image builds .github/workflows/images.yml control tower entry streamlit_app.py showcase and manual tools/build_site.py , tools/build_manual.py deployment decisions docs/zynta-koda-adr.md "},{"part":"Operating and trust","number":"28","slug":"security","title":"Security and data","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>A planning engine sees a company's whole supply chain, so what it does with that data is the first question to ask of it. This project runs only on fictional data in public; it is still built as if real data were at stake, because that is the part worth learning. The rules are few, enforced in code, and each one is proved by a test.<\/p>\n<div class=\"diagram\" data-diagram=\"boundary\"><\/div>\n<ul>\n<li><strong>Real data never enters git, CI or the public demo.<\/strong> It would live in a private workspace git ignores and builds exclude; the public demo refuses to open one.<\/li>\n<li><strong>It is deleted on an agreed date.<\/strong> Every private workspace carries a delete-by date, and the engine refuses to open it afterwards.<\/li>\n<li><strong>Nothing leaves the machine for an AI model without a recorded opt-in.<\/strong> The explainer is the only feature that calls an outside model; on a private workspace it stays off until the data owner's opt-in is recorded: who, when, for what.<\/li>\n<li><strong>The AI never writes.<\/strong> It answers questions. The only way into the tables is the master-data editor, and a test proves the editor never imports the explainer.<\/li>\n<\/ul>"},{"name":"How it works","html":"<h3>Real data, start to end<\/h3>\n<ol>\n<li><strong>Received<\/strong> as an ERP extract: tables, not system access, and no personal data needed.<\/li>\n<li><strong>Stored<\/strong> in one private workspace, on an encrypted volume, with a manifest saying whose data it is and its delete-by date.<\/li>\n<li><strong>Processed<\/strong> on that machine with the engine in private mode. Never on the public demo, never in CI.<\/li>\n<li><strong>Retained<\/strong> until the delete-by date. The outputs (the data-health report, the scenario reports) stay with the data's owner.<\/li>\n<li><strong>Deleted<\/strong> on that date, and the engine will not open the workspace after it.<\/li>\n<\/ol>\n<h3>Public by default, private on purpose<\/h3>\n<p>Unless private mode is set, the engine runs as a public demo: it lists, opens and plans only the demo companies, whatever it is asked. Opening a private workspace takes a deliberate setting on the machine that holds it.<\/p>\n<h3>No home-grown login<\/h3>\n<p>The planning service has no login of its own. An instance with real data runs only on the machine that holds the data, or behind the hosting platform's own access control, never as an open address. Writing authentication is how small systems get breached.<\/p>\n<h3>Licences and secrets<\/h3>\n<ul>\n<li><strong>Every dependency's licence is permissive.<\/strong> CI fails on a restricted licence (non-commercial or source-available terms), an unreviewed package with none, or model weights whose terms are denied.<\/li>\n<li><strong>No secrets in the repository.<\/strong> The full history was scanned once and none found; credentials go into the hosting platform's settings, never into files, commits or logs.<\/li>\n<\/ul>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The rules<\/td>\n<td><code>SECURITY.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>Data handling, end to end<\/td>\n<td><code>docs/security/data-handling.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>Public demo and private mode<\/td>\n<td><code>engine/workspace.py<\/code> (<code>ZK_MODE<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>The explainer and its consent<\/td>\n<td><code>engine/explain.py<\/code>, <code>workspace.json<\/code><\/td>\n<\/tr>\n<tr>\n<td>Licence check<\/td>\n<td><code>tools/licences.py<\/code>, <code>docs/licences.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>History scan<\/td>\n<td><code>docs/security/secret-scan.md<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Tests that guard it.<\/strong> The public demo refuses to list, open or plan on a private workspace; a workspace past its delete-by date will not open; the explainer stays off on a private workspace without a recorded opt-in; the master-data editor never imports the explainer; no AI-facing tool can reach a write path; the licence check fails on a planted restricted package.<\/p>"}],"search":" a planning engine sees a company's whole supply chain, so what it does with that data is the first question to ask of it. this project runs only on fictional
