0.167em\" /><msub><mi>q<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"2em\" /><msub><mo>&#x02211;<\/mo><mi>m<\/mi><\/msub><msub><mi>q<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x02264;<\/mo><msub><mi>P<\/mi><mi>&#x02113;<\/mi><\/msub><mspace width=\"0.167em\" /><msub><mi>k<\/mi><mrow><mi>&#x02113;<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"2em\" /><msub><mo>&#x02211;<\/mo><mi>m<\/mi><\/msub><msub><mi>&#x003BA;<\/mi><mi>m<\/mi><\/msub><mspace width=\"0.167em\" /><msub><mi>s<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x02264;<\/mo><msub><mi>W<\/mi><mi>&#x02113;<\/mi><\/msub><mspace width=\"0.167em\" /><msub><mi>k<\/mi><mrow><mi>&#x02113;<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/div>\n<p>with <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>n<\/mi><mi>m<\/mi><\/msub><\/mrow><\/math> units per pallet, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>P<\/mi><mi>&#x02113;<\/mi><\/msub><\/mrow><\/math> pallets per truck, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>&#x003BA;<\/mi><mi>m<\/mi><\/msub><\/mrow><\/math> kilograms per unit and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>W<\/mi><mi>&#x02113;<\/mi><\/msub><\/mrow><\/math> the maximum payload.<\/p>\n<p><strong>How sure: the gap.<\/strong> With <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><\/mrow><\/math> the cost of the plan found and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><munder><mrow><mi>z<\/mi><\/mrow><mo accent=\"true\">&#x02015;<\/mo><\/munder><\/mrow><\/math> the bound the solver proved,<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>gap<\/mtext><mo>&#x0003D;<\/mo><mfrac><mrow><mi>z<\/mi><mo>&#x02212;<\/mo><munder><mrow><mi>z<\/mi><\/mrow><mo accent=\"true\">&#x02015;<\/mo><\/munder><\/mrow><mrow><mi>z<\/mi><\/mrow><\/mfrac><\/mrow><\/math><\/div>\n<p>and the plan is proven when the gap is at or below the target: 5% for the tactical profile, 0.5% for the published plans.<\/p>\n<p><strong>Layers.<\/strong> The year layer solves the same model with each family <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><\/mrow><\/math> as one product. Its stock at the hand-over, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mover><mi>I<\/mi><mo stretchy=\"false\">&#x0007E;<\/mo><\/mover><mrow><mi>f<\/mi><mi>p<\/mi><\/mrow><\/msub><\/mrow><\/math>, is split between the family's products by their share of its demand, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>&#x003B1;<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><\/msub><\/mrow><\/math>, and becomes a target for the near weeks, priced like a shortage if missed:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>I<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><mo>&#x0002C;<\/mo><mi>T<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>e<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><\/msub><mo>&#x02265;<\/mo><msub><mi>&#x003B1;<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><\/msub><mspace width=\"0.167em\" /><msub><mover><mi>I<\/mi><mo stretchy=\"false\">&#x0007E;<\/mo><\/mover><mrow><mi>f<\/mi><mi>p<\/mi><\/mrow><\/msub><mo>&#x0002C;<\/mo><mspace width=\"2em\" /><mtext>cost&#x000A0;<\/mtext><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>g<\/mi><mi>m<\/mi><\/msub><mo>&#x0002B;<\/mo><msub><mi>&#x003C1;<\/mi><mi>m<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"0.167em\" /><msub><mi>e<\/mi><mrow><mi>m<\/mi><mi>p<\/mi><\/mrow><\/msub><\/mrow><\/math><\/div>\n<p>A target the near weeks cannot reach is a finding, not an infeasible model.<\/p>\n<p><strong>Also in the code:<\/strong> components exploded from recipes (bill of materials), shelf life (stock older than its customers accept is written off at standard cost), DDMRP buffer floors whose breach is priced, co-packer rules (they may only send back to their parent plant), dangerous goods only on licensed carriers, the empty run home where charged, a committed first bucket that is not reopened, and optionally a time fence beyond which changeovers, pallets and trucks are planned as averages.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Model and solve<\/td>\n<td><code>engine/optimizer.py<\/code> (<code>MILPOptimizer.solve<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Solver choice<\/td>\n<td><code>engine/solvers.py<\/code>: <code>ZK_SOLVER<\/code>, or the default; <code>prefer()<\/code> for plans in layers<\/td>\n<\/tr>\n<tr>\n<td>How the solve ended<\/td>\n<td><code>engine/solverreport.py<\/code> reads the solver's own log, both CBC builds<\/td>\n<\/tr>\n<tr>\n<td>Quick first plan<\/td>\n<td><code>engine/firstplan.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Tidy-up<\/td>\n<td><code>engine/tidy.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Planning in layers<\/td>\n<td><code>main.plan_layered<\/code>, <code>engine/families.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Profiles and buckets<\/td>\n<td><code>engine/profiles.py<\/code>, <code>engine/horizon.py<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Size.<\/strong> Lindewaard's full year in full detail is 19,707 decisions, 7,775 of them whole numbers, under 17,688 constraints.<\/p>\n<p><strong>Solvers.<\/strong> PuLP 3.3.2 with CBC 2.10.3 (bundled) and the development build from cbcbox 2.935 (used for plans in layers above 8 products). HiGHS and SCIP are wired in for benchmarks (<code>ZK_SOLVER=highs<\/code>, <code>ZK_SOLVER=scip<\/code>) and measured slower on the engine's real flow.<\/p>\n<p><strong>Tests that guard it.<\/strong> The toy above is regenerated and checked by <code>tools/manual_toy.py --check<\/code>. The suite checks, among others: a plan with a tighter formulation finds the same optimum; both CBC logs are read correctly; a plan in layers hands the family stock to the near weeks; the tidy-up never breaks a constraint; and an unproven plan is held.<\/p>"}],"search":" the optimiser turns a company's data into the cheapest plan that keeps every physical rule, and proves how good that plan is. five decisions, for every product, site and time bucket of the year: make, buy, move, store, or fall short. each has a price, and it adds them all up. lindewaard's plan of record costs €19.56m a year, mostly materials and production. falling short is priced too: the margin of the lost sale plus a penalty for the broken promise. service is weighed against cost, never hidden. then it proves how good the plan is. no plan can cost less than the bound; this one is within 0.40% of it, against a target of 0.5%. the result: 99.09% of demand served for €19.56m , in 2,496 truck trips. what it decides, and what it weighs every decision has a price, and the optimiser adds them all up: making costs the line's variable cost and maintenance per hour. each changeover (setup) costs time and money, so the plan prefers fewer, longer runs. buying costs the supplier's price, plus any surcharge in force in that week. moving is priced per truck , toll included, not per unit. a half-empty truck costs as much as a full one, which is why the plan consolidates. storing costs warehouse space and the capital tied up in the stock. carbon is priced on production and transport at the carbon price. falling short costs the margin of the lost sale plus a penalty for the broken promise. shortages are priced, not forbidden: when one more setup or truck would cost more than the shortage, the optimiser takes the shortage, and the plan says so. try it: a small company, solved for real one plant (its own line, 40 hours a week), a co-packer that may only send back to the plant, one distribution centre, two products, four weeks. move the sliders. every combination was solved by the real optimiser to proven optimality; the page only looks the answer up. things to notice: as demand rises past what the line can make, the co-packer fills in first (it costs more), then shortages appear. at low demand the plan still leaves a little short: one more changeover would cost more than those few units are worth. time: fine near, coarse far the tactical plan covers a year as 7 days, then 7 weeks, then 11 months of 28 days: detailed where decisions are about to be executed, coarse where they are only directions. the first bucket is committed: the next plan will not reopen it. profile used for solver target time limit answer expected within operational the next days, execution 10% 4 s 5 s tactical the year, the planning cycle 5% 600 s 180 s strategic network design 2% 1500 s 1800 s planning in layers, for large ranges above 8 finished products, a whole year in full detail is too large to solve in time. the engine then plans in two layers : the year per product family (products that share a liquid and a line), then the first 28 days per product , ending with the stock the year plan needs after them. how sure is the plan? a solver cannot try every plan, so it works from both sides. it keeps the best plan found so far (its cost is the objective ) and proves a bound : no plan can be cheaper than that. the real best plan lies between the two. the gap is how far apart they are; when it falls below the target, the plan is proven . a plan the solver did not prove in its time limit is labelled as such and held at the s&op gate, never presented as optimal. which solver plans are solved by cbc , the open-source coin-or solver, through pulp 3.3.2. full-detail plans use cbc 2.10.3. a plan in layers of more than 8 products uses cbc's development build, which measured 2.6 to 8 times faster on those (the showcase's \"which solver plans what\" has the table). every plan records which solver and version made it. when the clock runs out if the solver finds no plan at all in its time, the engine builds a quick first plan : it solves the model with every whole-number decision allowed to be fractional, rounds those decisions (2.3 trucks become 3), fixes them, and solves again for the rest. the result keeps every rule; the first solve's cost is a bound, so its distance from the best is proven too. it is labelled and held for review. a plan with a label beats no plan. after the solve: tidying up inside its proven gap a solver may book a pallet with nothing on it, or a truck with room to spare. too cheap to matter to the gap, but nonsense on a load plan. after the solve, every whole-number pallet, truck and empty-return count is lowered to the least that every constraint allows. nothing is re-solved: the plan only gets cheaper and still keeps every rule. the plan is a mixed-integer linear programme : a linear cost to minimise, linear rules, and some decisions that must be whole numbers. below is the core, simplified for reading (buying, for instance, is mostly of components, not finished goods); the code adds the details named at the end. indices. materials m , sites p , time buckets t , lanes ℓ (from one site to another), customers c . decisions. symbol meaning kind x m p t units made continuous, ≥ 0 y m p t a changeover (setup) happens binary b m p t units bought continuous, ≥ 0 s ℓ m t units shipped on a lane continuous, ≥ 0 q ℓ m t pallets on a lane integer k ℓ t trucks on a lane integer i m p t stock at the end of a bucket continuous, ≥ 0 u m p c t a customer's demand not served continuous, ≥ 0 objective. minimise total cost plus the price of shortfall: min ∑ m , p , t ( v m p x m p t + f m p y m p t + π m p t b m p t + h m p t i m p t ) + ∑ ℓ , t f ℓ t k ℓ t + ∑ m , p , c , t ( g m + ρ m ) w c u m p c t where v is the variable cost of making a unit (with its carbon), f the cost of a changeover, π the purchase price, f the cost of a truck (freight, toll and carbon), h the cost of holding a unit for the bucket (warehousing and capital), g the gross margin, ρ the shortage penalty and w c the customer's weight. stock balance. what a site holds at the end of a bucket is what it held before, plus what it made and received, minus what it sent and served: i m p t = i m p , t − 1 + x m p t + b m p t + ∑ ℓ ∈ in ( p ) s ℓ m , t − l ℓ − ∑ ℓ ∈ out ( p ) s ℓ m t − d m p t served with l ℓ the lane's lead time in buckets, and demand either served or short: d m p t served + ∑ c u m p c t = d m p t line hours. running and changeovers must fit in the hours the line really gives, after its efficiency (oee): ∑ m ( r m p x m p t + σ m p y m p t ) ≤ h p t · oee p lot sizes. nothing is made without a changeover, and a run is at least its minimum lot: q m p min y m p t ≤ x m p t ≤ q m p max y m p t pallets and trucks. a part pallet takes a whole slot; pallets ride on whole trucks; no truck leaves empty, and dense freight runs out of payload before slots: s ℓ m t ≤ n m q ℓ m t ∑ m q ℓ m t ≤ p ℓ k ℓ t ∑ m κ m s ℓ m t ≤ w ℓ k ℓ t with n m units per pallet, p ℓ pallets per truck, κ m kilograms per unit and w ℓ the maximum payload. how sure: the gap. with z the cost of the plan found and z ― the bound the solver proved, gap = z − z ― z and the plan is proven when the gap is at or below the target: 5% for the tactical profile, 0.5% for the published plans. layers. the year layer solves the same model with each family f as one product. its stock at the hand-over, i ~ f p , is split between the family's products by their share of its demand, α m p , and becomes a target for the near weeks, priced like a shortage if missed: i m p , t + e m p ≥ α m p i ~ f p , cost  ( g m + ρ m ) e m p a target the near weeks cannot reach is a finding, not an infeasible model. also in the code: components exploded from recipes (bill of materials), shelf life (stock older than its customers accept is written off at standard cost), ddmrp buffer floors whose breach is priced, co-packer rules (they may only send back to their parent plant), dangerous goods only on licensed carriers, the empty run home where charged, a committed first bucket that is not reopened, and optionally a time fence beyond which changeovers, pallets and trucks are planned as averages. what where model and solve engine/optimizer.py ( milpoptimizer.solve ) solver choice engine/solvers.py : zk_solver , or the default; prefer() for plans in layers how the solve ended engine/solverreport.py reads the solver's own log, both cbc builds quick first plan engine/firstplan.py tidy-up engine/tidy.py planning in layers main.plan_layered , engine/families.py profiles and buckets engine/profiles.py , engine/horizon.py size. lindewaard's full year in full detail is 19,707 decisions, 7,775 of them whole numbers, under 17,688 constraints. solvers. pulp 3.3.2 with cbc 2.10.3 (bundled) and the development build from cbcbox 2.935 (used for plans in layers above 8 products). highs and scip are wired in for benchmarks ( zk_solver=highs , zk_solver=scip ) and measured slower on the engine's real flow. tests that guard it. the toy above is regenerated and checked by tools/manual_toy.py --check . the suite checks, among others: a plan with a tighter formulation finds the same optimum; both cbc logs are read correctly; a plan in layers hands the family stock to the near weeks; the tidy-up never breaks a constraint; and an unproven plan is held. "},{"part":"Planning","number":"10","slug":"network-rules","title":"Network rules","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>The plan has to be one a warehouse could actually run. These are the physical and contractual rules the optimiser cannot break, priced or forbidden.<\/p>\n<div class=\"story\"><div class=\"stage\"><div class=\"diagram\" data-diagram=\"truck\" data-story=\"1\"><\/div><\/div><div class=\"steps\"><div class=\"step\" data-state=\"slots\"><p><strong>A truck has slots.<\/strong> A standard trailer takes 30 pallets, and a part pallet still takes a whole slot.<\/p><\/div><div class=\"step\" data-state=\"payload\"><p><strong>And a weight limit.<\/strong> Dense drinks fill the 24,000 kg legal payload long before the slots: the truck leaves \"full\" with empty floor.<\/p><\/div><div class=\"step\" data-state=\"zones\"><p><strong>Chilled, ambient and dangerous goods do not share.<\/strong> Each temperature zone, and each class of dangerous goods, rides its own vehicle.<\/p><\/div><div class=\"step\" data-state=\"copacker\"><p><strong>Co-packers send everything back.<\/strong> A batch made by a contract manufacturer returns to its parent plant for quality release before it can ship: 2 extra days, freight both ways.<\/p><\/div><\/div><\/div>"},{"name":"How it works","html":"<p><strong>Freight<\/strong><\/p>\n<ul>\n<li><strong>Full truckloads<\/strong> are paid whole: fill decides cost. A trailer is limited by 30 pallets or 24,000 kg, whichever comes first, and no truck leaves without a load.<\/li>\n<li><strong>Groupage<\/strong> (a few pallets on someone else's vehicle) is paid per pallet, about 2.5× the full-load rate, and stops being groupage past a few pallets.<\/li>\n<li><strong>Own fleet first:<\/strong> 50 trips a period across all own lanes; beyond that, contracted or spot hauliers at their own price and carbon.<\/li>\n<li><strong>The empty run home<\/strong> is charged where a lane says so: either the trailer carries something back, or someone pays for the kilometres it runs empty.<\/li>\n<li><strong>Road tolls:<\/strong> the Dutch truck toll, in force since 1 July 2026, is charged per kilometre on every departure, empty runs included, at the rates for the date the truck leaves.<\/li>\n<\/ul>\n<p><strong>Co-packing.<\/strong> A co-packer adds capacity at a price: a toll fee of 3× the product's conversion cost, 2× the freight, 2× the normal waste, and the return trip for quality release. It may never ship straight to a customer.<\/p>\n<p><strong>Shelf life.<\/strong> Each customer accepts stock only with a minimum remaining life (often two thirds). Stock older than the strictest customer of its pool accepts is written off at standard cost, and short-life stock is not allowed to shuttle between sites to hide its age.<\/p>\n<p><strong>Dangerous goods.<\/strong> A flammable flavour concentrate travels only with carriers licensed for it, on lanes certified for it; a site without a licence cannot store it.<\/p>"},{"name":"The maths","html":"<p>For a lane <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x02113;<\/mi><\/mrow><\/math>, temperature zone <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z<\/mi><\/mrow><\/math> and bucket <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math>, with <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>q<\/mi><\/mrow><\/math> pallets, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><\/mrow><\/math> units shipped and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math> trucks:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mo>&#x02211;<\/mo><mrow><mi>m<\/mi><mo>&#x02208;<\/mo><mi>z<\/mi><\/mrow><\/msub><msub><mi>q<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x02264;<\/mo><msub><mi>P<\/mi><mi>&#x02113;<\/mi><\/msub><mspace width=\"0.167em\" /><msub><mi>k<\/mi><mrow><mi>&#x02113;<\/mi><mi>z<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"2em\" /><msub><mo>&#x02211;<\/mo><mrow><mi>m<\/mi><mo>&#x02208;<\/mo><mi>z<\/mi><\/mrow><\/msub><msub><mi>&#x003BA;<\/mi><mi>m<\/mi><\/msub><mspace width=\"0.167em\" /><msub><mi>s<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x02264;<\/mo><msub><mi>W<\/mi><mi>&#x02113;<\/mi><\/msub><mspace width=\"0.167em\" /><msub><mi>k<\/mi><mrow><mi>&#x02113;<\/mi><mi>z<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"2em\" /><msub><mi>k<\/mi><mrow><mi>&#x02113;<\/mi><mi>z<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x02264;<\/mo><msub><mo>&#x02211;<\/mo><mrow><mi>m<\/mi><mo>&#x02208;<\/mo><mi>z<\/mi><\/mrow><\/msub><msub><mi>s<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/div>\n<p>the last one meaning no truck without at least one unit on it. A co-packer <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>c<\/mi><\/mrow><\/math> with parent plant <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><\/mrow><\/math> may ship on no lane except <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>c<\/mi><mo>&#x02192;<\/mo><mi>p<\/mi><\/mrow><\/math>:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>s<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0003D;<\/mo><mn>0<\/mn><mspace width=\"1em\" /><mtext>for&#x000A0;every&#x000A0;lane&#x000A0;<\/mtext><mi>&#x02113;<\/mi><mtext>&#x000A0;out&#x000A0;of&#x000A0;<\/mtext><mi>c<\/mi><mtext>&#x000A0;with&#x000A0;destination<\/mtext><mo>&#x02260;<\/mo><mi>p<\/mi><\/mrow><\/math><\/div>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>Rule<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Trucks, pallets, payload, groupage, fleet pool<\/td>\n<td><code>engine/optimizer.py<\/code> (<code>truckload_<\/code>, <code>payload_<\/code>, <code>groupage_cap_<\/code>, <code>fleet_pool_<\/code> constraints)<\/td>\n<\/tr>\n<tr>\n<td>Lane cost from distance and rate card<\/td>\n<td><code>engine/geography.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Tolls and emission factors, dated<\/td>\n<td><code>engine/roadcost.py<\/code>, <code>docs/road-cost.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>Co-packer rules<\/td>\n<td><code>engine/optimizer.py<\/code> (<code>boomerang_<\/code> constraints), <code>engine/costing.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Shelf life and write-off<\/td>\n<td><code>engine/optimizer.py<\/code> (<code>shelflife_<\/code>, <code>aged_<\/code> constraints)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}],"search":" the plan has to be one a warehouse could actually run. these are the physical and contractual rules the optimiser cannot break, priced or forbidden. a truck has slots. a standard trailer takes 30 pallets, and a part pallet still takes a whole slot. and a weight limit. dense drinks fill the 24,000 kg legal payload long before the slots: the truck leaves \"full\" with empty floor. chilled, ambient and dangerous goods do not share. each temperature zone, and each class of dangerous goods, rides its own vehicle. co-packers send everything back. a batch made by a contract manufacturer returns to its parent plant for quality release before it can ship: 2 extra days, freight both ways. freight full truckloads are paid whole: fill decides cost. a trailer is limited by 30 pallets or 24,000 kg, whichever comes first, and no truck leaves without a load. groupage (a few pallets on someone else's vehicle) is paid per pallet, about 2.5× the full-load rate, and stops being groupage past a few pallets. own fleet first: 50 trips a period across all own lanes; beyond that, contracted or spot hauliers at their own price and carbon. the empty run home is charged where a lane says so: either the trailer carries something back, or someone pays for the kilometres it runs empty. road tolls: the dutch truck toll, in force since 1 july 2026, is charged per kilometre on every departure, empty runs included, at the rates for the date the truck leaves. co-packing. a co-packer adds capacity at a price: a toll fee of 3× the product's conversion cost, 2× the freight, 2× the normal waste, and the return trip for quality release. it may never ship straight to a customer. shelf life. each customer accepts stock only with a minimum remaining life (often two thirds). stock older than the strictest customer of its pool accepts is written off at standard cost, and short-life stock is not allowed to shuttle between sites to hide its age. dangerous goods. a flammable flavour concentrate travels only with carriers licensed for it, on lanes certified for it; a site without a licence cannot store it. for a lane ℓ , temperature zone z and bucket t , with q pallets, s units shipped and k trucks: ∑ m ∈ z q ℓ m t ≤ p ℓ k ℓ z t ∑ m ∈ z κ m s ℓ m t ≤ w ℓ k ℓ z t k ℓ z t ≤ ∑ m ∈ z s ℓ m t the last one meaning no truck without at least one unit on it. a co-packer c with parent plant p may ship on no lane except c → p : s ℓ m t = 0 for every lane  ℓ  out of  c  with destination ≠ p rule where trucks, pallets, payload, groupage, fleet pool engine/optimizer.py ( truckload_ , payload_ , groupage_cap_ , fleet_pool_ constraints) lane cost from distance and rate card engine/geography.py tolls and emission factors, dated engine/roadcost.py , docs/road-cost.md co-packer rules engine/optimizer.py ( boomerang_ constraints), engine/costing.py shelf life and write-off engine/optimizer.py ( shelflife_ , aged_ constraints) "},{"part":"Planning","number":"11","slug":"network-optimisation","title":"Network optimisation","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Above the year's plan sit two slower questions: is the stock in the right place, and are the sites? Here is Lindewaard's network, asked both.<\/p>\n<div class=\"story\"><div class=\"stage\"><div class=\"diagram\" data-diagram=\"network\" data-story=\"1\"><\/div><\/div><div class=\"steps\"><div class=\"step\" data-state=\"today\"><p><strong>Lindewaard today.<\/strong> Three plants, two co-packers, two distribution centres and 4 customers' delivery points. The whole network costs €35.81M a year, everything included.<\/p><\/div><div class=\"step\" data-state=\"rebalance\"><p><strong>Is the stock in the right place?<\/strong> The plan already moves stock wherever a move pays. The rebalancing check reads the plan for stock it holds and never uses: on the published plan it finds 0 moves worth making.<\/p><\/div><div class=\"step\" data-state=\"candidates\"><p><strong>Could a new site pay?<\/strong> Two are on the table: DC Venlo (€1.20M a year to run, €8.00M to build) and Moerdijk Bottling (€3.20M, €26.00M). A greenfield design may open either.<\/p><\/div><div class=\"step\" data-state=\"customers\"><p><strong>Customers move with the network.<\/strong> Each may be served from any site in reach. Closing a distribution centre moves its customers; it does not lose them.<\/p><\/div><div class=\"step\" data-state=\"brownfield\"><p><strong>Could a site close?<\/strong> A brownfield design may also close any of Lindewaard's own sites, paying the closing cost (DC Tilburg's: €2.00M). Co-packers are never on the list.<\/p><\/div><div class=\"step\" data-state=\"verdict\"><p><strong>The answer: keep today's network.<\/strong> Proven: no change saves more than €358,105 a year. The best network found differs from today's by €8.<\/p><\/div><\/div><\/div>\n<p>\"Keep what you have\" is a real answer when it is proven, and a suspicious one when it is built in. Until 18 October it was partly built in: a closed DC lost its customers and a new one could take none. That is fixed; the answer stayed the same.<\/p>"},{"name":"How it works","html":"<h3>Rebalancing: move it, or keep paying to hold it<\/h3>\n<p>Stock costs warehousing and the capital tied up in it; moving it costs freight and carbon. The rebalancing check prices that trade for every block of stock the plan holds and never uses:<\/p>\n<ul>\n<li><strong>Spare<\/strong> is what a site holds in <em>every<\/em> later bucket, above the buffer it is held to and any stock the year's plan needs at the end. A build-up that ships out next week is not spare.<\/li>\n<li><strong>Wanted<\/strong> is a shortage elsewhere that the stock can still reach and sell: arriving before the bucket ends, and young enough for that site's customers.<\/li>\n<li><strong>One block, one move.<\/strong> The same idle units sit in every bucket; they are moved once.<\/li>\n<\/ul>\n<div class=\"diagram\" data-diagram=\"spare\"><\/div>\n<p>The first version of this check read the plant's stock less the plant's own demand, which is nothing, and called the whole build-up spare: 51,001 kg of Bitterbal Bites at Oss Foods in D04, \"worth moving\", although the plan ships it out by D07. Read properly, a plan solved to its gap has nothing to move: every move that paid is already in it. The check earns its place on a plan that was edited by hand, committed, or not proven.<\/p>\n<h3>Network design: greenfield and brownfield<\/h3>\n<p>A design solves the network twice. First as it is, then with the sites themselves as decisions, and compares:<\/p>\n<ul>\n<li><strong>Greenfield<\/strong> may open candidate sites. A candidate plant copies the lines of a named site; every candidate gets lanes to every site within reach, priced off the same rate card as the rest.<\/li>\n<li><strong>Brownfield<\/strong> may also close any own site. Co-packers stay: leaving a toll manufacturer is a contract decision, not a network one. A closed site's stock is written off at standard cost.<\/li>\n<li><strong>Capital and running costs on one scale.<\/strong> The plan's horizon is scaled to a year, capex is written down over ten years, a closing cost over the same.<\/li>\n<li><strong>The second solve starts from the first.<\/strong> Today's network, every site open and every candidate shut, is handed over as the starting plan. Without that, the brownfield design found no plan at all in five minutes.<\/li>\n<li><strong>A difference smaller than the solver's tolerance is no difference.<\/strong> Both solves may stop within 1% of the best; a saving below €358,105 a year is reported as none.<\/li>\n<\/ul>\n<p>Lindewaard's answers: greenfield €2 a year from today's network in 394 s, brownfield €8 in 384 s. Neither opens nor closes anything; 0 of the 4 customers move.<\/p>\n<h3>Customers move with the network<\/h3>\n<p>Demand is booked at the site that serves it today, so service levels and every report read as before. What a design decides is where the stock comes from:<\/p>\n<ul>\n<li><strong>One site per customer<\/strong>, an open one, within delivery reach; plants may deliver direct.<\/li>\n<li><strong>Priced on the difference.<\/strong> A delivery costs a full truck on the rate card per unit it holds; a move pays the difference from today's delivery, so today's network costs exactly what it did.<\/li>\n<li><strong>Contracts travel.<\/strong> A customer served from a new site takes its shelf-life terms with it.<\/li>\n<li><strong>A customer needs a place.<\/strong> Only customers with a delivery location can move; the rest stay with their DC. Lindewaard's locations are fictional, placed in the region each DC serves today.<\/li>\n<\/ul>\n<h3>One rate card prices every lane<\/h3>\n<p>Every lane, candidate lane and customer delivery is priced from the distance on the map, not typed in: the straight line times 1.27 for the road, then a fixed charge per trip and a rate per kilometre. <strong>Move the slider.<\/strong><\/p>\n<div class=\"diagram\" data-diagram=\"lane-cost\"><\/div>\n<h3>What it does not do yet<\/h3>\n<ul>\n<li><strong>Price one forced change on its own.<\/strong> Asking \"what would closing Tilburg cost?\" pins a network that today's plan cannot start from; on the demo it finds no plan in five minutes, and says so rather than guess.<\/li>\n<li><strong>Re-plan buffers at a new site.<\/strong> A moved customer's demand stays booked, and buffered, where it was.<\/li>\n<li><strong>See a seasonal year in a short horizon.<\/strong> Scaling a horizon to a year assumes it is representative.<\/li>\n<\/ul>\n<p>Where stock should sit in the chain, buffer by buffer, is chapter 12's question. What each product and customer costs to serve is read off the plan by the engine's cost-to-serve report, with its allocation rules stated beside the numbers.<\/p>"},{"name":"The maths","html":"<p><strong>Sites.<\/strong> Each site <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><\/mrow><\/math> that may change has a switch <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>o<\/mi><mi>s<\/mi><\/msub><mo>&#x02208;<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math>. With <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>F<\/mi><mi>s<\/mi><\/msub><\/mrow><\/math> its annual fixed cost, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>K<\/mi><mi>s<\/mi><\/msub><\/mrow><\/math> its opening capex, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>C<\/mi><mi>s<\/mi><\/msub><\/mrow><\/math> its closing cost and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>L<\/mi><\/mrow><\/math> the write-down period in years, a design adds to the plan's cost<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mo>&#x02211;<\/mo><mrow><mi>s<\/mi><mo>&#x02208;<\/mo><mtext>candidates<\/mtext><\/mrow><\/msub><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msub><mi>F<\/mi><mi>s<\/mi><\/msub><mo>&#x0002B;<\/mo><mfrac><mrow><msub><mi>K<\/mi><mi>s<\/mi><\/msub><\/mrow><mrow><mi>L<\/mi><\/mrow><\/mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><msub><mi>o<\/mi><mi>s<\/mi><\/msub><mspace width=\"0.278em\" /><mo>&#x0002B;<\/mo><mspace width=\"0.278em\" /><msub><mo>&#x02211;<\/mo><mrow><mi>s<\/mi><mo>&#x02208;<\/mo><mtext>closable<\/mtext><\/mrow><\/msub><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><msub><mi>F<\/mi><mi>s<\/mi><\/msub><mspace width=\"0.167em\" /><msub><mi>o<\/mi><mi>s<\/mi><\/msub><mo>&#x0002B;<\/mo><mfrac><mrow><msub><mi>C<\/mi><mi>s<\/mi><\/msub><\/mrow><mrow><mi>L<\/mi><\/mrow><\/mfrac><mspace width=\"0.167em\" /><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><msub><mi>o<\/mi><mi>s<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math><\/div>\n<p>and the plan's operating cost is scaled by <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>365<\/mn><mo>&#x0002F;<\/mo><mi>H<\/mi><\/mrow><\/math> for a horizon of <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>H<\/mi><\/mrow><\/math> days. A closed site makes, holds, ships and serves nothing:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>x<\/mi><mrow><mi>m<\/mi><mi>s<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0002C;<\/mo><mspace width=\"0.278em\" /><msub><mi>I<\/mi><mrow><mi>m<\/mi><mi>s<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0002C;<\/mo><mspace width=\"0.278em\" /><msub><mi>s<\/mi><mrow><mi>&#x02113;<\/mi><mi>m<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0002C;<\/mo><mspace width=\"0.278em\" /><msubsup><mi>d<\/mi><mrow><mi>m<\/mi><mi>s<\/mi><mi>t<\/mi><\/mrow><mrow><mtext>own<\/mtext><\/mrow><\/msubsup><mspace width=\"0.278em\" /><mo>&#x02264;<\/mo><mspace width=\"0.278em\" /><mi>M<\/mi><mspace width=\"0.167em\" /><msub><mi>o<\/mi><mi>s<\/mi><\/msub><mspace width=\"1em\" /><mtext>for&#x000A0;every&#x000A0;lane&#x000A0;<\/mtext><mi>&#x02113;<\/mi><mtext>&#x000A0;touching&#x000A0;<\/mtext><mi>s<\/mi><\/mrow><\/math><\/div>\n<p><strong>Customers.<\/strong> Customer <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>c<\/mi><\/mrow><\/math>, served today from <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>h<\/mi><mi>c<\/mi><\/msub><\/mrow><\/math>, may be served from any site <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><\/mrow><\/math> in reach, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>c<\/mi><\/msub><\/mrow><\/math>. With <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>a<\/mi><mrow><mi>c<\/mi><mi>s<\/mi><\/mrow><\/msub><mo>&#x02208;<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> the assignment and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>y<\/mi><mrow><mi>m<\/mi><mi>c<\/mi><mi>s<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math> the units delivered from <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><\/mrow><\/math>:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mo>&#x02211;<\/mo><mrow><mi>s<\/mi><mo>&#x02208;<\/mo><msub><mi>S<\/mi><mi>c<\/mi><\/msub><\/mrow><\/msub><msub><mi>a<\/mi><mrow><mi>c<\/mi><mi>s<\/mi><\/mrow><\/msub><mo>&#x0003D;<\/mo><mn>1<\/mn><mspace width=\"2em\" /><msub><mi>a<\/mi><mrow><mi>c<\/mi><mi>s<\/mi><\/mrow><\/msub><mo>&#x02264;<\/mo><msub><mi>o<\/mi><mi>s<\/mi><\/msub><mspace width=\"2em\" /><msub><mi>y<\/mi><mrow><mi>m<\/mi><mi>c<\/mi><mi>s<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x02264;<\/mo><msub><mi>D<\/mi><mrow><mi>m<\/mi><mi>c<\/mi><mi>t<\/mi><\/mrow><\/msub><mspace width=\"0.167em\" /><msub><mi>a<\/mi><mrow><mi>c<\/mi><mi>s<\/mi><\/mrow><\/msub><\/mrow><\/math><\/div>\n<p>The delivery leaves <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>s<\/mi><\/mrow><\/math>'s stock, its demand stays booked at <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>h<\/mi><mi>c<\/mi><\/msub><\/mrow><\/math>, and it costs the difference from today's delivery, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>&#x003B4;<\/mi><mrow><mi>c<\/mi><mi>s<\/mi><mi>m<\/mi><\/mrow><\/msub><\/mrow><\/math> per unit:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mo>&#x0002B;<\/mo><msub><mo>&#x02211;<\/mo><mrow><mi>m<\/mi><mo>&#x0002C;<\/mo><mi>c<\/mi><mo>&#x0002C;<\/mo><mi>s<\/mi><mo>&#x0002C;<\/mo><mi>t<\/mi><\/mrow><\/msub><msub><mi>&#x003B4;<\/mi><mrow><mi>c<\/mi><mi>s<\/mi><mi>m<\/mi><\/mrow><\/msub><mspace width=\"0.167em\" /><msub><mi>y<\/mi><mrow><mi>m<\/mi><mi>c<\/mi><mi>s<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math><\/div>\n<p>A moved customer's shelf-life limit holds where it is assigned, with its own cover <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>Q<\/mi><mrow><mi>c<\/mi><mi>s<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math> added to the site's:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>I<\/mi><mrow><mi>m<\/mi><mi>s<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x02264;<\/mo><msub><mi>Q<\/mi><mrow><mi>s<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><msub><mi>Q<\/mi><mrow><mi>c<\/mi><mi>s<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><mi>M<\/mi><mspace width=\"0.167em\" /><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><msub><mi>a<\/mi><mrow><mi>c<\/mi><mi>s<\/mi><\/mrow><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math><\/div>\n<p><strong>How sure.<\/strong> Both solves stop within a relative gap <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><\/mrow><\/math> of their best possible plans, so a saving is a finding only above <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><\/mrow><\/math> times today's cost: here 1% of €35.81M.<\/p>\n<p><strong>Rebalancing.<\/strong> With <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I<\/mi><mrow><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/math> the stock at site <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><\/mrow><\/math> after bucket <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>R<\/mi><mi>p<\/mi><\/msub><\/mrow><\/math> the floor it is held to, the spare stock and a move's value are<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mtext>spare<\/mtext><mrow><mi>p<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>&#x0003D;<\/mo><mo>max<\/mo><mo minsize=\"1.623em\" maxsize=\"1.623em\">(<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.278em\" /><msub><mo>min<\/mo><mrow><mi>u<\/mi><mo>&#x02265;<\/mo><mi>t<\/mi><\/mrow><\/msub><mo minsize=\"1.2em\" maxsize=\"1.2em\">(<\/mo><msub><mi>I<\/mi><mrow><mi>p<\/mi><mi>u<\/mi><\/mrow><\/msub><mo>&#x02212;<\/mo><msub><mi>R<\/mi><mi>p<\/mi><\/msub><mo minsize=\"1.2em\" maxsize=\"1.2em\">)<\/mo><mo minsize=\"1.623em\" maxsize=\"1.623em\">)<\/mo><\/mrow><\/math><\/div>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>net<\/mtext><mo>&#x0003D;<\/mo><mi>q<\/mi><mspace width=\"0.167em\" /><mo stretchy=\"false\">&#x00028;<\/mo><msub><mi>g<\/mi><mi>m<\/mi><\/msub><mo>&#x0002B;<\/mo><msub><mi>&#x003C1;<\/mi><mi>m<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mtext>carrying&#x000A0;released<\/mtext><mo>&#x02212;<\/mo><mtext>freight<\/mtext><mo>&#x02212;<\/mo><mtext>carbon<\/mtext><\/mrow><\/math><\/div>\n<p>for <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>q<\/mi><\/mrow><\/math> units moved against shortages they can still reach, with <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>g<\/mi><mi>m<\/mi><\/msub><\/mrow><\/math> the margin and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>&#x003C1;<\/mi><mi>m<\/mi><\/msub><\/mrow><\/math> the shortage penalty.<\/p>\n<p><strong>Geography.<\/strong> With <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><\/mrow><\/math> the great-circle distance, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003BA;<\/mi><\/mrow><\/math> the circuity, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F<\/mi><\/mrow><\/math> the fixed charge per trip and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v<\/mi><\/mrow><\/math> the rate per kilometre:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>road&#x000A0;km<\/mtext><mo>&#x0003D;<\/mo><mi>&#x003BA;<\/mi><mspace width=\"0.167em\" /><mi>d<\/mi><mspace width=\"2em\" /><mtext>cost<\/mtext><mo>&#x0003D;<\/mo><mi>F<\/mi><mo>&#x0002B;<\/mo><mi>v<\/mi><mi>&#x000B7;<\/mi><mtext>road&#x000A0;km<\/mtext><mspace width=\"2em\" /><mtext>days<\/mtext><mo>&#x0003D;<\/mo><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x02308;<\/mo><mfrac><mrow><mtext>road&#x000A0;km<\/mtext><\/mrow><mrow><mtext>speed<\/mtext><mi>&#x000B7;<\/mi><mtext>hours<\/mtext><\/mrow><\/mfrac><mo>&#x0002B;<\/mo><mtext>handling<\/mtext><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x02309;<\/mo><\/mrow><\/mrow><\/math><\/div>\n<p>Lindewaard's card: €227.53 a trip and €1.685 a kilometre ambient, €320.04 and €2.222 chilled; 65 km/h, 9 hours a day, 0.5 day handling; 0.85 kg CO₂e a kilometre on the owned fleet.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Design, both modes<\/td>\n<td><code>engine/design.py<\/code> (<code>NetworkDesigner.design<\/code>), <code>POST /api/v1/design<\/code><\/td>\n<\/tr>\n<tr>\n<td>Site switches, customer assignment<\/td>\n<td><code>engine/optimizer.py<\/code> (<code>SiteDesignInputs<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Who can be served from where<\/td>\n<td><code>engine/design.py<\/code> (<code>customer_reach<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>The starting plan<\/td>\n<td><code>engine/design.py<\/code> (<code>as_is_start<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Several futures at once<\/td>\n<td><code>engine/design.py<\/code> (<code>RobustNetworkDesigner<\/code>), <code>POST /api/v1/design/robust<\/code><\/td>\n<\/tr>\n<tr>\n<td>Rebalancing<\/td>\n<td><code>engine/redistribution.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Cost to serve<\/td>\n<td><code>engine/costtoserve.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Rate card and distances<\/td>\n<td><code>engine/geography.py<\/code> (<code>FreightRateCard<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Customer locations<\/td>\n<td><code>customer_locations.csv<\/code> (optional; no plan reads it)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>The answers on this page<\/strong> come from <code>tools/manual_design.py<\/code>, which runs the engine's own design endpoint on the demo workspace; the rebalancing figures from the published plans, kept current by <code>tools/refresh_redistribution.py<\/code>.<\/p>\n<p><strong>Tests that guard it.<\/strong> A closed DC's customers are served from another site, at 100% service (pinned to it, service fell to 56.6%); a customer without a location never moves; the design starts from today's network with every switch set; a rounded quick first plan is never reported as a design; stock the plan ships out later is not spare; a block of idle stock is moved once; the published plans carry today's rebalancing report.<\/p>"}],"search":" above the year's plan sit two slower questions: is the stock in the right place, and are the sites? here is lindewaard's network, asked both. lindewaard today. three plants, two co-packers, two distribution centres and 4 customers' delivery points. the whole network costs €35.81m a year, everything included. is the stock in the right place? the plan already moves stock wherever a move pays. the rebalancing check reads the plan for stock it holds and never uses: on the published plan it finds 0 moves worth making. could a new site pay? two are on the table: dc venlo (€1.20m a year to run, €8.00m to build) and moerdijk bottling (€3.20m, €26.00m). a greenfield design may open either. customers move with the network. each may be served from any site in reach. closing a distribution centre moves its customers; it does not lose them. could a site close? a brownfield design may also close any of lindewaard's own sites, paying the closing cost (dc tilburg's: €2.00m). co-packers are never on the list. the answer: keep today's network. proven: no change saves more than €358,105 a year. the best network found differs from today's by €8. \"keep what you have\" is a real answer when it is proven, and a suspicious one when it is built in. until 18 october it was partly built in: a closed dc lost its customers and a new one could take none. that is fixed; the answer stayed the same. rebalancing: move it, or keep paying to hold it stock costs warehousing and the capital tied up in it; moving it costs freight and carbon. the rebalancing check prices that trade for every block of stock the plan holds and never uses: spare is what a site holds in every later bucket, above the buffer it is held to and any stock the year's plan needs at the end. a build-up that ships out next week is not spare. wanted is a shortage elsewhere that the stock can still reach and sell: arriving before the bucket ends, and young enough for that site's customers. one block, one move. the same idle units sit in every bucket; they are moved once. the first version of this check read the plant's stock less the plant's own demand, which is nothing, and called the whole build-up spare: 51,001 kg of bitterbal bites at oss foods in d04, \"worth moving\", although the plan ships it out by d07. read properly, a plan solved to its gap has nothing to move: every move that paid is already in it. the check earns its place on a plan that was edited by hand, committed, or not proven. network design: greenfield and brownfield a design solves the network twice. first as it is, then with the sites themselves as decisions, and compares: greenfield may open candidate sites. a candidate plant copies the lines of a named site; every candidate gets lanes to every site within reach, priced off the same rate card as the rest. brownfield may also close any own site. co-packers stay: leaving a toll manufacturer is a contract decision, not a network one. a closed site's stock is written off at standard cost. capital and running costs on one scale. the plan's horizon is scaled to a year, capex is written down over ten years, a closing cost over the same. the second solve starts from the first. today's network, every site open and every candidate shut, is handed over as the starting plan. without that, the brownfield design found no plan at all in five minutes. a difference smaller than the solver's tolerance is no difference. both solves may stop within 1% of the best; a saving below €358,105 a year is reported as none. lindewaard's answers: greenfield €2 a year from today's network in 394 s, brownfield €8 in 384 s. neither opens nor closes anything; 0 of the 4 customers move. customers move with the network demand is booked at the site that serves it today, so service levels and every report read as before. what a design decides is where the stock comes from: one site per customer , an open one, within delivery reach; plants may deliver direct. priced on the difference. a delivery costs a full truck on the rate card per unit it holds; a move pays the difference from today's delivery, so today's network costs exactly what it did. contracts travel. a customer served from a new site takes its shelf-life terms with it. a customer needs a place. only customers with a delivery location can move; the rest stay with their dc. lindewaard's locations are fictional, placed in the region each dc serves today. one rate card prices every lane every lane, candidate lane and customer delivery is priced from the distance on the map, not typed in: the straight line times 1.27 for the road, then a fixed charge per trip and a rate per kilometre. move the slider. what it does not do yet price one forced change on its own. asking \"what would closing tilburg cost?\" pins a network that today's plan cannot start from; on the demo it finds no plan in five minutes, and says so rather than guess. re-plan buffers at a new site. a moved customer's demand stays booked, and buffered, where it was. see a seasonal year in a short horizon. scaling a horizon to a year assumes it is representative. where stock should sit in the chain, buffer by buffer, is chapter 12's question. what each product and customer costs to serve is read off the plan by the engine's cost-to-serve report, with its allocation rules stated beside the numbers. sites. each site s that may change has a switch o s ∈ { 0 , 1 } . with f s its annual fixed cost, k s its opening capex, c s its closing cost and l the write-down period in years, a design adds to the plan's cost ∑ s ∈ candidates ( f s + k s l ) o s + ∑ s ∈ closable ( f s o s + c s l ( 1 − o s ) ) and the plan's operating cost is scaled by 365 / h for a horizon of h days. a closed site makes, holds, ships and serves nothing: x m s t , i m s t , s ℓ m t , d m s t own ≤ m o s for every lane  ℓ  touching  s customers. customer c , served today from h c , may be served from any site s in reach, s c . with a c s ∈ { 0 , 1 } the assignment and y m c s t the units delivered from s : ∑ s ∈ s c a c s = 1 a c s ≤ o s y m c s t ≤ d m c t a c s the delivery leaves s 's stock, its demand stays booked at h c , and it costs the difference from today's delivery, δ c s m per unit: + ∑ m , c , s , t δ c s m y m c s t a moved customer's shelf-life limit holds where it is assigned, with its own cover q c s t added to the site's: i m s t ≤ q s t + q c s t + m ( 1 − a c s ) how sure. both solves stop within a relative gap g of their best possible plans, so a saving is a finding only above g times today's cost: here 1% of €35.81m. rebalancing. with i p t the stock at site p after bucket t and r p the floor it is held to, the spare stock and a move's value are spare p t = max ( 0 , min u ≥ t ( i p u − r p ) ) net = q ( g m + ρ m ) + carrying released − freight − carbon for q units moved against shortages they can still reach, with g m the margin and ρ m the shortage penalty. geography. with d the great-circle distance, κ the circuity, f the fixed charge per trip and v the rate per kilometre: road km = κ d cost = f + v · road km days = ⌈ road km speed · hours + handling ⌉ lindewaard's card: €227.53 a trip and €1.685 a kilometre ambient, €320.04 and €2.222 chilled; 65 km/h, 9 hours a day, 0.5 day handling; 0.85 kg co₂e a kilometre on the owned fleet. what where design, both modes engine/design.py ( networkdesigner.design ), post /api/v1/design site switches, customer assignment engine/optimizer.py ( sitedesigninputs ) who can be served from where engine/design.py ( customer_reach ) the starting plan engine/design.py ( as_is_start ) several futures at once engine/design.py ( robustnetworkdesigner ), post /api/v1/design/robust rebalancing engine/redistribution.py cost to serve engine/costtoserve.py rate card and distances engine/geography.py ( freightratecard ) customer locations customer_locations.csv (optional; no plan reads it) the answers on this page come from tools/manual_design.py , which runs the engine's own design endpoint on the demo workspace; the rebalancing figures from the published plans, kept current by tools/refresh_redistribution.py . tests that guard it. a closed dc's customers are served from another site, at 100% service (pinned to it, service fell to 56.6%); a customer without a location never moves; the design starts from today's network with every switch set; a rounded quick first plan is never reported as a design; stock the plan ships out later is not spare; a block of idle stock is moved once; the published plans carry today's rebalancing report. "},{"part":"Planning","number":"12","slug":"buffers","title":"Inventory and buffers (DDMRP)","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>A buffer is a stock target with three zones, placed where swings in demand and supply should stop. Here is a real one from Lindewaard's plan, and why the plan could not hold it.<\/p>\n<div class=\"story\"><div class=\"stage\"><div class=\"diagram\" data-diagram=\"buffer\" data-story=\"1\"><\/div><\/div><div class=\"steps\"><div class=\"step\" data-state=\"zones\"><p><strong>Three zones.<\/strong> Bitterbal Bites at DC Rotterdam: red is the safety layer, yellow the cover for the replenishment time, green the order size.<\/p><\/div><div class=\"step\" data-state=\"plan\"><p><strong>The plan is held to red.<\/strong> Falling below it is allowed but priced, at a multiple of the cost of carrying the stock.<\/p><\/div><div class=\"step\" data-state=\"shelf\"><p><strong>But shelf life caps it.<\/strong> The product keeps 21 days, and Horeca Partners Zuid accepts it only with 14 days left. Stock may be at most 6 days old, so the site cannot hold the full red zone.<\/p><\/div><div class=\"step\" data-state=\"verdict\"><p><strong>The plan says so.<\/strong> It reports the buckets below red, what that cost, and that the cap, not the planner, set the limit.<\/p><\/div><\/div><\/div>"},{"name":"How it works","html":"<p>Each buffered part gets three zones from its average daily use and its <strong>decoupled lead time<\/strong>, how long a refill really takes:<\/p>\n<ul>\n<li><strong>Red:<\/strong> daily use × lead time × a lead-time factor, plus a safety layer scaled by how uncertain the forecast is (its P90 against its P50).<\/li>\n<li><strong>Yellow:<\/strong> daily use × lead time.<\/li>\n<li><strong>Green:<\/strong> the largest of the usual order cycle, the minimum order quantity, or the red base.<\/li>\n<\/ul>\n<p>The lead time is <strong>derived from the network<\/strong>, not typed: the fastest of the ways a part can be replenished, waiting for the slowest ingredient of its recipe, and stopping at any other buffer. Derived this way, the hand-typed lead times turned out optimistic by 8 to 16 days on every buffer. An unreliable carrier stretches it further, and a co-packed part adds the 2-day return.<\/p>"},{"name":"The maths","html":"<p>With <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mi>u<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><\/mrow><\/math> the average daily use, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>L<\/mi><\/mrow><\/math> the decoupled lead time, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f<\/mi><mi>L<\/mi><\/msub><\/mrow><\/math> the lead-time factor and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f<\/mi><mi>V<\/mi><\/msub><\/mrow><\/math> the variability factor:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>red<\/mtext><mo>&#x0003D;<\/mo><mover><mi>u<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mspace width=\"0.167em\" /><mi>L<\/mi><mspace width=\"0.167em\" /><msub><mi>f<\/mi><mi>L<\/mi><\/msub><mspace width=\"0.167em\" /><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msub><mi>f<\/mi><mi>V<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><mspace width=\"2em\" /><mtext>yellow<\/mtext><mo>&#x0003D;<\/mo><mover><mi>u<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mspace width=\"0.167em\" /><mi>L<\/mi><mspace width=\"2em\" /><mtext>green<\/mtext><mo>&#x0003D;<\/mo><mo>max<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mover><mi>u<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mspace width=\"0.167em\" /><mi>c<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.278em\" /><mtext>MOQ<\/mtext><mo>&#x0002C;<\/mo><mspace width=\"0.278em\" /><mover><mi>u<\/mi><mo stretchy=\"true\">&#x000AF;<\/mo><\/mover><mspace width=\"0.167em\" /><mi>L<\/mi><mspace width=\"0.167em\" /><msub><mi>f<\/mi><mi>L<\/mi><\/msub><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math><\/div>\n<p>The decoupled lead time is a recursion over the network: for a part at a site, the minimum over its sources of the source's own time, where a buffered source contributes nothing and a recipe waits for its slowest component:<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>L<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>i<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msub><mo>min<\/mo><mrow><mtext>source&#x000A0;<\/mtext><mi>j<\/mi><\/mrow><\/msub><mo minsize=\"1.623em\" maxsize=\"1.623em\">(<\/mo><msub><mi>&#x02113;<\/mi><mrow><mi>i<\/mi><mi>j<\/mi><\/mrow><\/msub><mo>&#x0002B;<\/mo><mo minsize=\"1.2em\" maxsize=\"1.2em\">[<\/mo><mspace width=\"0.167em\" /><mi>j<\/mi><mtext>&#x000A0;not&#x000A0;buffered<\/mtext><mspace width=\"0.167em\" /><mo minsize=\"1.2em\" maxsize=\"1.2em\">]<\/mo><mspace width=\"0.167em\" /><msub><mo>max<\/mo><mrow><mtext>component&#x000A0;<\/mtext><mi>k<\/mi><mtext>&#x000A0;of&#x000A0;<\/mtext><mi>j<\/mi><\/mrow><\/msub><mi>L<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>k<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo minsize=\"1.623em\" maxsize=\"1.623em\">)<\/mo><\/mrow><\/math><\/div>\n<p>In the plan, stock below red is a shortfall variable <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math> with <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I<\/mi><mo>&#x0002B;<\/mo><mi>r<\/mi><mo>&#x02265;<\/mo><mtext>red<\/mtext><\/mrow><\/math>, priced at a multiple of the carrying cost.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Zones and adherence<\/td>\n<td><code>engine/ddmrp.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Decoupled lead times across the network<\/td>\n<td><code>engine/meio.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Red-zone floor in the plan<\/td>\n<td><code>engine/optimizer.py<\/code> (<code>buffer_red_<\/code> constraints)<\/td>\n<\/tr>\n<tr>\n<td>Buffer settings per part<\/td>\n<td>the workspace's <code>buffer_profiles.csv<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}],"search":" a buffer is a stock target with three zones, placed where swings in demand and supply should stop. here is a real one from lindewaard's plan, and why the plan could not hold it. three zones. bitterbal bites at dc rotterdam: red is the safety layer, yellow the cover for the replenishment time, green the order size. the plan is held to red. falling below it is allowed but priced, at a multiple of the cost of carrying the stock. but shelf life caps it. the product keeps 21 days, and horeca partners zuid accepts it only with 14 days left. stock may be at most 6 days old, so the site cannot hold the full red zone. the plan says so. it reports the buckets below red, what that cost, and that the cap, not the planner, set the limit. each buffered part gets three zones from its average daily use and its decoupled lead time , how long a refill really takes: red: daily use × lead time × a lead-time factor, plus a safety layer scaled by how uncertain the forecast is (its p90 against its p50). yellow: daily use × lead time. green: the largest of the usual order cycle, the minimum order quantity, or the red base. the lead time is derived from the network , not typed: the fastest of the ways a part can be replenished, waiting for the slowest ingredient of its recipe, and stopping at any other buffer. derived this way, the hand-typed lead times turned out optimistic by 8 to 16 days on every buffer. an unreliable carrier stretches it further, and a co-packed part adds the 2-day return. with u ¯ the average daily use, l the decoupled lead time, f l the lead-time factor and f v the variability factor: red = u ¯ l f l ( 1 + f v ) yellow = u ¯ l green = max ( u ¯ c , moq , u ¯ l f l ) the decoupled lead time is a recursion over the network: for a part at a site, the minimum over its sources of the source's own time, where a buffered source contributes nothing and a recipe waits for its slowest component: l ( i ) = min source  j ( ℓ i j + [ j  not buffered ] max component  k  of  j l ( k ) ) in the plan, stock below red is a shortfall variable r with i + r ≥ red , priced at a multiple of the carrying cost. what where zones and adherence engine/ddmrp.py decoupled lead times across the network engine/meio.py red-zone floor in the plan engine/optimizer.py ( buffer_red_ constraints) buffer settings per part the workspace's buffer_profiles.csv "},{"part":"Planning","number":"13","slug":"disruptions","title":"Disruptions, scenarios and impact","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Every disruption story is planned three ways, and the difference between them is what seeing it coming is worth.<\/p>\n<div class=\"diagram\" data-diagram=\"three-ways\"><\/div>\n<div class=\"diagram\" data-diagram=\"stories\"><\/div>"},{"name":"How it works","html":"<p><strong>Three plans per story.<\/strong><\/p>\n<ul>\n<li><strong>No early action:<\/strong> the baseline runs until the day the disruption hits; then an emergency re-plan, with the first week frozen.<\/li>\n<li><strong>A week's notice:<\/strong> the same, re-planned seven days earlier.<\/li>\n<li><strong>Acting ahead:<\/strong> the disruption is known when the year is planned.<\/li>\n<\/ul>\n<p>A difference smaller than the tolerance the plans are proven to is reported as <strong>no measurable difference<\/strong>, never as a win.<\/p>\n<p><strong>Scenario files<\/strong> describe what-ifs as data (switch on charging the empty run home, size buffers on the real network) and run each on a scratch copy of the tables, so the live data is never touched. The decision audit compares them side by side, in money, with the gate's verdict on each.<\/p>\n<p><strong>Impact tracing<\/strong> answers the question a control tower exists for: <em>which customer orders does this put at risk?<\/em> A supplier, site or lane is taken out for given weeks; production and purchasing inside the supply lead time are pinned, because orders already placed cannot be undone, and the plan is solved again.<\/p>\n<p><strong>The stress test<\/strong> re-plans against the forecast's P90 (demand exceeded only one week in ten) with near-term supply pinned, and reports service, margin at risk and the customers who would lose orders.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The stories, built and published<\/td>\n<td><code>tools/build_showcase.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Scenario files and decision audits<\/td>\n<td><code>engine/scenarios.py<\/code>, <code>engine/auditreport.py<\/code>, <code>tools/audit.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Impact of a supply event<\/td>\n<td><code>engine/impact.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>Stress test<\/td>\n<td><code>engine/stochastic.py<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}],"search":" every disruption story is planned three ways, and the difference between them is what seeing it coming is worth. three plans per story. no early action: the baseline runs until the day the disruption hits; then an emergency re-plan, with the first week frozen. a week's notice: the same, re-planned seven days earlier. acting ahead: the disruption is known when the year is planned. a difference smaller than the tolerance the plans are proven to is reported as no measurable difference , never as a win. scenario files describe what-ifs as data (switch on charging the empty run home, size buffers on the real network) and run each on a scratch copy of the tables, so the live data is never touched. the decision audit compares them side by side, in money, with the gate's verdict on each. impact tracing answers the question a control tower exists for: which customer orders does this put at risk? a supplier, site or lane is taken out for given weeks; production and purchasing inside the supply lead time are pinned, because orders already placed cannot be undone, and the plan is solved again. the stress test re-plans against the forecast's p90 (demand exceeded only one week in ten) with near-term supply pinned, and reports service, margin at risk and the customers who would lose orders. what where the stories, built and published tools/build_showcase.py scenario files and decision audits engine/scenarios.py , engine/auditreport.py , tools/audit.py impact of a supply event engine/impact.py stress test engine/stochastic.py "},{"part":"Planning","number":"14","slug":"sop-gate","title":"The S&OP release gate","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Before a plan reaches the factory it passes a set of checks. <strong>Move the sliders<\/strong>: they are the business's thresholds, set against Lindewaard's real plan of record.<\/p>\n<div class=\"diagram\" data-diagram=\"gate\"><\/div>"},{"name":"How it works","html":"<p>A plan is <strong>held for review<\/strong> when any check fails:<\/p>\n<ul>\n<li>service below 97%;<\/li>\n<li>margin at risk above 2% of the margin achievable;<\/li>\n<li>less than 18% of the achievable margin captured;<\/li>\n<li>more than 20% of volume on spot hauliers;<\/li>\n<li>an unresolved forecast dispute;<\/li>\n<li>the solver did not prove the plan within its tolerance.<\/li>\n<\/ul>\n<p>It is <strong>rejected<\/strong> outright below 5% of the achievable margin. The thresholds are policy, not physics: they are settings per run. Most weeks most plans pass and go on their own; only the real trade-offs reach the meeting, with the reason attached. That is management by exception.<\/p>\n<p><strong>Only a live branch can commit<\/strong> to a factory schedule, and only when live is switched on deliberately. Every story on the showcase is a sandbox branch.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Policy, checks and verdict<\/td>\n<td><code>engine/governance.py<\/code> (<code>IBPPolicy<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Commit to a schedule<\/td>\n<td><code>engine/schedulesink.py<\/code> (Postgres when configured, memory otherwise)<\/td>\n<\/tr>\n<tr>\n<td>The verdict in a plan<\/td>\n<td><code>ibp_verdict<\/code> in every plan the API returns<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}],"search":" before a plan reaches the factory it passes a set of checks. move the sliders : they are the business's thresholds, set against lindewaard's real plan of record. a plan is held for review when any check fails: service below 97%; margin at risk above 2% of the margin achievable; less than 18% of the achievable margin captured; more than 20% of volume on spot hauliers; an unresolved forecast dispute; the solver did not prove the plan within its tolerance. it is rejected outright below 5% of the achievable margin. the thresholds are policy, not physics: they are settings per run. most weeks most plans pass and go on their own; only the real trade-offs reach the meeting, with the reason attached. that is management by exception. only a live branch can commit to a factory schedule, and only when live is switched on deliberately. every story on the showcase is a sandbox branch. what where policy, checks and verdict engine/governance.py ( ibppolicy ) commit to a schedule engine/schedulesink.py (postgres when configured, memory otherwise) the verdict in a plan ibp_verdict in every plan the api returns "},{"part":"Planning","number":"15","slug":"atp","title":"Available to promise","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>A plan says what each site will have; customer service needs to know what it can still <strong>promise<\/strong>. The two differ by the orders already confirmed.<\/p>\n<div class=\"diagram\" data-diagram=\"atp\"><\/div>"},{"name":"How it works","html":"<ul>\n<li><strong>Supply by a bucket:<\/strong> the site's opening stock and everything the plan brings in (production, arrivals, open orders landing), less what it sends on to other sites and what it writes off.<\/li>\n<li><strong>Available to promise<\/strong> in a bucket is that supply less the confirmed orders due by then, and it is protected forward: a later confirmed order keeps its claim on stock that arrives earlier.<\/li>\n<li><strong>A promise date<\/strong> for a new order is the first bucket from which enough is available and stays available. Part of an order can ship on time and the rest follow, with a date.<\/li>\n<\/ul>"},{"name":"The maths","html":"<p>With <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> the cumulative supply and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>C<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math> the cumulative confirmed orders by bucket <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math>, the cumulative ATP and what can be promised in <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> are<\/p>\n<div class=\"math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>A<\/mi><mi>t<\/mi><\/msub><mo>&#x0003D;<\/mo><msub><mi>S<\/mi><mi>t<\/mi><\/msub><mo>&#x02212;<\/mo><msub><mi>C<\/mi><mi>t<\/mi><\/msub><mspace width=\"2em\" /><msub><mtext>ATP<\/mtext><mi>t<\/mi><\/msub><mo>&#x0003D;<\/mo><mo>max<\/mo><mo minsize=\"1.623em\" maxsize=\"1.623em\">(<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.278em\" /><msub><mo>min<\/mo><mrow><mi>u<\/mi><mo>&#x02265;<\/mo><mi>t<\/mi><\/mrow><\/msub><msub><mi>A<\/mi><mi>u<\/mi><\/msub><mo minsize=\"1.623em\" maxsize=\"1.623em\">)<\/mo><\/mrow><\/math><\/div>\n<p>so a new order of <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>q<\/mi><\/mrow><\/math> is promised in the first bucket <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> with <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mtext>ATP<\/mtext><mi>t<\/mi><\/msub><mo>&#x02265;<\/mo><mi>q<\/mi><\/mrow><\/math>.<\/p>"},{"name":"Under the hood","html":"<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ATP and promise dates<\/td>\n<td><code>engine/atp.py<\/code><\/td>\n<\/tr>\n<tr>\n<td>In a plan<\/td>\n<td><code>available_to_promise<\/code> in every plan the API returns<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}],"search":" a plan says what each site will have; customer service needs to know what it can still promise . the two differ by the orders already confirmed. supply by a bucket: the site's opening stock and everything the plan brings in (production, arrivals, open orders landing), less what it sends on to other sites and what it writes off. available to promise in a bucket is that supply less the confirmed orders due by then, and it is protected forward: a later confirmed order keeps its claim on stock that arrives earlier. a promise date for a new order is the first bucket from which enough is available and stays available. part of an order can ship on time and the rest follow, with a date. with s t the cumulative supply and c t the cumulative confirmed orders by bucket t , the cumulative atp and what can be promised in t are a t = s t − c t atp t = max ( 0 , min u ≥ t a u ) so a new order of q is promised in the first bucket t with atp t ≥ q . what where atp and promise dates engine/atp.py in a plan available_to_promise in every plan the api returns "},{"part":"Planning","number":"16","slug":"kpis","title":"KPIs","written":true,"lead":"","layers":[{"name":"Overview","html":"<p>Every headline number has one definition, written once and shown everywhere from the same source: the Control Tower, the showcase and this manual.<\/p>\n<div class=\"diagram\" data-diagram=\"kpi-tree\"><\/div>"},{"name":"How it works","html":"<table>\n<thead>\n<tr>\n<th>KPI<\/th>\n<th>How it is calculated<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Service level<\/strong><\/td>\n<td>Demand served, by value: every unit sold at its list price, over every unit ordered at its list price, across the whole horizon. By value so that litres and kilograms are never added together: by volume, the unit a product happens to be counted in would decide how much it weighs. The volume figure is kept beside it (service_level_volume_pct). It counts demand served within its planning bucket; it is not an on-time-in-full (OTIF) measure. The S&amp;OP gate holds a plan below 97%.<\/td>\n<\/tr>\n<tr>\n<td><strong>Customer fill rate<\/strong><\/td>\n<td>The same as service level, for one customer: what they were served at list price over what they ordered at list price. Beside it, the fill rate by volume within each unit (litres, kilograms), where a ratio does not depend on the unit.<\/td>\n<\/tr>\n<tr>\n<td><strong>Margin at risk<\/strong><\/td>\n<td>For every unit ordered and not served: its gross margin plus the shortage penalty per unit. The penalty is a planning weight, not money, so this is larger than the margin actually lost. The S&amp;OP gate holds a plan whose margin at risk exceeds 2% of the margin achievable.<\/td>\n<\/tr>\n<tr>\n<td><strong>Revenue<\/strong><\/td>\n<td>Units sold times list price.<\/td>\n<\/tr>\n<tr>\n<td><strong>Gross margin<\/strong><\/td>\n<td>Revenue minus the cost of goods sold, taken at standard cost on what was sold. As a percentage, over revenue.<\/td>\n<\/tr>\n<tr>\n<td><strong>Total (landed) cost<\/strong><\/td>\n<td>Everything the plan spends: production, purchases, freight (road tolls and spot haulage included), empty return trips where charged, holding stock (warehousing plus the cost of capital on its value), and carbon at the carbon price on production and transport. The shortage penalty is not in it.<\/td>\n<\/tr>\n<tr>\n<td><strong>Profit before overheads<\/strong><\/td>\n<td>Revenue minus total cost. Where two plans end the year on different stock, the difference in year-end stock value is added, because stock carried is value kept, not cost spent.<\/td>\n<\/tr>\n<tr>\n<td><strong>Share of the hit won back<\/strong><\/td>\n<td>For a disruption: the profit it costs with no early action, minus what it costs acting ahead, over the profit it costs with no early action. Each hit is the baseline plan's profit minus the disrupted plan's.<\/td>\n<\/tr>\n<tr>\n<td><strong>Stock value<\/strong><\/td>\n<td>Units held times standard cost, finished goods and components. The average is weighted by how long each planning bucket lasts; the closing value is the end of the last bucket.<\/td>\n<\/tr>\n<tr>\n<td><strong>Truck trips<\/strong><\/td>\n<td>Departures: every truck that leaves, full or part-full, counts once.<\/td>\n<\/tr>\n<tr>\n<td><strong>Transport CO2e<\/strong><\/td>\n<td>On the public page: the ISO 14083 report's total, tonne-kilometres of every trip times a published emission factor for the vehicle; a plan without that report uses the engine's own factor, trucks times each lane's CO2e per truck, and is labelled so. The engine's own figure is the one the carbon price is charged on.<\/td>\n<\/tr>\n<tr>\n<td><strong>Divergence alerts<\/strong><\/td>\n<td>Products where the supplied forecast and the statistical baseline disagree by more than the tolerance. A dispute is one no known promotion explains; a planner decides which signal to trust. In the demo the supplied forecast is synthetic.<\/td>\n<\/tr>\n<tr>\n<td><strong>Proven within<\/strong><\/td>\n<td>How far the plan could be from the best possible one: the plan's cost minus the solver's proven lower bound, over the plan's cost. A plan the solver did not prove within its target is labelled as such.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"name":"Under the hood","html":"<p>The definitions live in <code>engine/kpis.py<\/code>; <code>docs/help/reference/kpis.md<\/code> is generated from it for the Control Tower, and a test fails if the two drift apart. The numbers themselves are computed in <code>engine/optimizer.py<\/code> from the solved plan, never estimated.<\/p>"}],"search":" every headline number has one definition, written once and shown everywhere from the same source: the control tower, the showcase and this manual. kpi how it is calculated service level demand served, by value: every unit sold at its list price, over every unit ordered at its list price, across the whole horizon. by value so that litres and kilograms are never added together: by volume, the unit a product happens to be counted in would decide how much it weighs. the volume figure is kept beside it (service_level_volume_pct). it counts demand served within its planning bucket; it is not an on-time-in-full (otif) measure. the s&op gate holds a plan below 97%. customer fill rate the same as service level, for one customer: what they were served at list price over what they ordered at list price. beside it, the fill rate by volume within each unit (litres, kilograms), where a ratio does not depend on the unit. margin at risk for every unit ordered and not served: its gross margin plus the shortage penalty per unit. the penalty is a planning weight, not money, so this is larger than the margin actually lost. the s&op gate holds a plan whose margin at risk exceeds 2% of the margin achievable. revenue units sold times list price. gross margin revenue minus the cost of goods
